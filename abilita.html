<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ombre al Tavolo — Scheda Abilità</title>
  <style>
    :root {
      --bg: #0c0e14;
      --surface: #151924;
      --surface-2: #1d2230;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --gold: #e5b85c;
      --crimson: #e05260;
      --emerald: #3ec98c;
      --indigo: #7c8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px 48px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
    }
    h1 { margin: 4px 0 0; font-size: 24px; color: #fff; }
    .subtext { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.16);
      background: var(--surface-2);
      color: var(--text);
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-gold {
      background: var(--gold);
      color: #0c0e14;
      border-color: transparent;
    }
    .role-box {
      background: var(--bg);
      border: 1px solid rgba(229, 184, 92, 0.35);
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.16);
      color: var(--gold);
      background: rgba(229,184,92,0.12);
    }
  </style>
</head>
<body>
  <div id="ability-page-root" class="wrap"></div>

  <script>
    (function () {
      var ACCESS_KEY = 'ombre_accesso_tavolo_v1';
      var ROOM_PREFIX = 'ombre_stanza_sync_';

      var ROLE_INFO = {
        assassino: { name: 'Assassino', faction: 'Traditori', desc: 'Spende 1 punto missione confermato per colpire un bersaglio non protetto (o indicare 2 bersagli se c’è il Traditore Segreto). Richiede un giro di Tavolo Ovale per riattivarsi.' },
        sabotatore: { name: 'Sabotatore', faction: 'Traditori', desc: 'Spende 1 punto missione per sabotare silenziosamente un bersaglio: il bersaglio spende comunque il punto ma l’effetto viene annullato.' },
        traditore_segreto: { name: 'Traditore Segreto', faction: 'Traditori', desc: 'Conosce gli altri Traditori e, quando l’Assassino sceglie 2 persone, decide chi eliminare.' },
        investigatore: { name: 'Investigatore', faction: 'Fedeli', desc: 'Riceve missioni più accessibili e può spendere 1 punto missione per ottenere una missione degli Assassini a bassa difficoltà.' },
        guardia: { name: 'Guardia', faction: 'Fedeli', desc: 'Spende 1 punto missione per assegnare uno Scudo Protettivo valido per 1 notte.' },
        martire: { name: 'Martire', faction: 'Fedeli', desc: 'Non ha missioni standard; ottiene punti subendo missioni altrui e può rilevare un ruolo o assegnare uno Scudo persistente fino a colpo di Assassino o Sabotatore.' },
        mediatore: { name: 'Mediatore', faction: 'Fedeli', desc: 'Ha un voto extra (+1) al Tavolo Ovale.' },
        cacciatore: { name: 'Cacciatore', faction: 'Neutro', desc: 'Con 1 punto missione può chiedere "giocatore X è ruolo Y?" con risposta Sì/No; con 0 punti può indicare i ruoli di 3 giocatori (3 giusti = vince subito, errore = eliminato).' }
      };

      function readAccess() {
        try {
          var raw = localStorage.getItem(ACCESS_KEY);
          var p = raw ? JSON.parse(raw) : {};
          return {
            roomCode: String(p.roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1',
            playerName: String(p.playerName || 'Giocatore').trim() || 'Giocatore'
          };
        } catch (_e) {
          return { roomCode: 'TAVOLO1', playerName: 'Giocatore' };
        }
      }

      function readRoom(code) {
        try {
          var raw = localStorage.getItem(ROOM_PREFIX + code);
          return raw ? JSON.parse(raw) : {};
        } catch (_e) {
          return {};
        }
      }

      function render() {
        var host = document.getElementById('ability-page-root');
        if (!host) return;
        var acc = readAccess();
        var room = readRoom(acc.roomCode);
        var players = Array.isArray(room.players) ? room.players : [];
        var me = players.find(function (p) {
          return String(p && p.name || '').trim().toLowerCase() === acc.playerName.toLowerCase();
        });
        var roleKey = me && me.assignedRoleKey ? me.assignedRoleKey : null;
        var role = roleKey && ROLE_INFO[roleKey] ? ROLE_INFO[roleKey] : null;
        var ptsMap = room.playerPoints && typeof room.playerPoints === 'object' ? room.playerPoints : {};
        var pts = Number(ptsMap[acc.playerName.toLowerCase()] || 0);

        var bodyHtml = role
          ? '<div class="role-box">' +
              '<div class="top-bar">' +
                '<div><span class="eyebrow">Ruolo Attivo</span><h2 style="margin:4px 0 0;color:#fff;">' + role.name + '</h2></div>' +
                '<span class="badge">' + role.faction + ' · Punti: ' + pts + '</span>' +
              '</div>' +
              '<p class="subtext" style="color:#e5e7eb;margin-top:10px;">' + role.desc + '</p>' +
              '<p class="subtext" style="margin-top:10px;">Per attivare i pulsanti interattivi e spendere punti, usa la tua Scheda Giocatore.</p>' +
            '</div>'
          : '<div class="role-box"><p class="subtext" style="margin:0;">Nessun ruolo assegnato al momento nella stanza <strong>' + acc.roomCode + '</strong>. Attendi che il Master assegni i ruoli.</p></div>';

        host.innerHTML =
          '<header class="card top-bar">' +
            '<div>' +
              '<span class="eyebrow">Riepilogo Abilità · Stanza ' + acc.roomCode + '</span>' +
              '<h1>Scheda Abilità di ' + acc.playerName + '</h1>' +
            '</div>' +
            '<div class="btn-row">' +
              '<button type="button" class="btn btn-gold" onclick=\"window.location.href='giocatore.html'\">Torna alla Scheda Giocatore</button>' +
              '<button type="button" class="btn" onclick=\"window.location.href='ruoli.html'\">Tutti i Ruoli</button>' +
            '</div>' +
          '</header>' +
          '<section class="card">' +
            '<span class="eyebrow">Dettaglio Potere</span>' +
            bodyHtml +
          '</section>';
      }

      render();
    })();
  </script>
</body>
</html>
