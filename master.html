<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ombre al Tavolo — Master</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    // Configurazione tema scuro e colori della pagina Master
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Cinzel', 'serif'],
          },
          colors: {
            bgdark: '#0c0e14',
            surface: '#151924',
            surface2: '#1d2230',
            gold: '#e5b85c',
            crimson: '#e05260',
            emerald: '#3ec98c',
            indigo: '#7c8cff',
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #0c0e14;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-bgdark text-gray-100 antialiased">
  <div id="master-roles-app" class="max-w-6xl mx-auto px-4 py-8 space-y-6"></div>

  <script type="module">
    import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // Chiavi condivise per mantenere coerenti accesso, sincronizzazione stanza e pagina Master
    const ACCESS_STORAGE_KEY = 'ombre_accesso_tavolo_v1';
    const MASTER_ROLES_STORAGE_KEY = 'ombre_master_assegnazione_ruoli_v1';
    const ROOM_SYNC_PREFIX = 'ombre_stanza_sync_';
    const DEFAULT_APP_ID = 'ombre-al-tavolo-default';

    // Catalogo dei ruoli assegnabili dal Master
    const ROLE_CATALOG = {
      investigatore: {
        name: 'Investigatore',
        faction: 'Cittadini',
        badgeClass: 'bg-emerald/15 text-emerald border-emerald/40',
        desc: 'Indaga sul ruolo segreto di un giocatore vivo.'
      },
      guardia: {
        name: 'Guardia',
        faction: 'Cittadini',
        badgeClass: 'bg-emerald/15 text-emerald border-emerald/40',
        desc: 'Protegge un giocatore dagli attacchi nel turno.'
      },
      cacciatore: {
        name: 'Cacciatore',
        faction: 'Cittadini',
        badgeClass: 'bg-emerald/15 text-emerald border-emerald/40',
        desc: 'Colpisce un sospetto assumendosi il rischio.'
      },
      martire: {
        name: 'Martire',
        faction: 'Cittadini',
        badgeClass: 'bg-emerald/15 text-emerald border-emerald/40',
        desc: 'Lascia una testimonianza al tavolo se eliminato.'
      },
      assassino: {
        name: 'Assassino',
        faction: 'Traditori',
        badgeClass: 'bg-crimson/15 text-crimson border-crimson/40',
        desc: 'Elimina silenziosamente un bersaglio.'
      },
      sabotatore: {
        name: 'Sabotatore',
        faction: 'Traditori',
        badgeClass: 'bg-crimson/15 text-crimson border-crimson/40',
        desc: 'Ostacola o altera le azioni avversarie.'
      }
    };

    // Modelli di discorso per accompagnare l'assegnazione dei ruoli al tavolo
    const SPEECH_TEMPLATES = {
      suspense: [
        'Silenzio al tavolo di {{STANZA}}. Le luci metaforiche si abbassano e ognuno si prepara a ricevere il proprio destino.',
        'I ruoli stanno per essere estratti a sorte: nessuno rivela ciò che legge e ogni sguardo può nascondere un segreto.',
        'Quando i ruoli saranno assegnati, aprite la vostra scheda solo quando nessuno vi guarda. La notte sta per iniziare.'
      ],
      solenne: [
        'Giocatori di {{STANZA}}, il Master ha preparato il mazzo della sessione e sta per affidare a ciascuno un compito preciso.',
        'Onorate il vostro ruolo, che appartenga ai Cittadini o ai Traditori, e mantenete il riserbo assoluto sul vostro incarico.',
        'L’estrazione è compiuta: da questo istante ogni parola al tavolo pesa come una scelta.'
      ],
      rapido: [
        'Ci siamo: ruoli estratti per la stanza {{STANZA}}.',
        'Controllate in silenzio il ruolo che vi è toccato senza darlo a vedere.',
        'Tutto pronto al tavolo: si parte!'
      ]
    };

    let db = null;
    let auth = null;
    let appId = DEFAULT_APP_ID;
    let cloudReady = false;
    let roomUnsubscribe = null;

    // Legge codice stanza e nome Master salvati nella schermata di accesso
    function readAccessContext() {
      try {
        const raw = localStorage.getItem(ACCESS_STORAGE_KEY);
        if (!raw) return { roomCode: 'TAVOLO1', masterName: 'Master' };
        const parsed = JSON.parse(raw);
        const roomCode = String(parsed.roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1';
        const masterName = String(parsed.playerName || '').trim() || 'Master';
        return { roomCode, masterName };
      } catch (err) {
        console.error('Errore lettura contesto accesso:', err);
        return { roomCode: 'TAVOLO1', masterName: 'Master' };
      }
    }

    // Legge i giocatori entrati nella stanza sincronizzata
    function readRoomPlayers(roomCode) {
      const cleanRoom = String(roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1';
      try {
        const raw = localStorage.getItem(ROOM_SYNC_PREFIX + cleanRoom);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed.players) ? parsed.players : [];
      } catch (err) {
        console.error('Errore lettura giocatori stanza:', err);
        return [];
      }
    }

    // Crea lo stato iniziale della pagina Master
    function createInitialMasterRoleState() {
      const ctx = readAccessContext();
      const syncedPlayers = readRoomPlayers(ctx.roomCode).map(p => ({
        id: p.id || ('m_p_' + Math.random().toString(36).slice(2, 7)),
        name: String(p.name || '').trim(),
        assignedRoleKey: p.assignedRoleKey && ROLE_CATALOG[p.assignedRoleKey] ? p.assignedRoleKey : null
      })).filter(p => p.name);

      return {
        roomCode: ctx.roomCode,
        masterName: ctx.masterName,
        roleCounts: {
          investigatore: 1,
          guardia: 1,
          cacciatore: 1,
          martire: 0,
          assassino: 1,
          sabotatore: 1
        },
        players: syncedPlayers,
        speechTone: 'suspense',
        customSpeech: '',
        activeParagraphIndex: 0,
        assignmentCompleted: false,
        boardOpened: false,
        syncLabel: 'Locale',
        banner: null
      };
    }

    // Unisce i giocatori già presenti nella stanza sincronizzata con quelli della pagina Master
    function mergeSyncedPlayersIntoMaster(existingPlayers, syncedPlayers) {
      const result = Array.isArray(existingPlayers) ? existingPlayers.map(p => ({ ...p })) : [];
      const syncedList = Array.isArray(syncedPlayers) ? syncedPlayers : [];

      syncedList.forEach(sp => {
        const cleanName = String(sp.name || '').trim();
        if (!cleanName) return;
        const normalized = cleanName.toLowerCase();
        const foundIndex = result.findIndex(
          ep => String(ep.name || '').trim().toLowerCase() === normalized
        );
        if (foundIndex >= 0) {
          result[foundIndex] = {
            ...result[foundIndex],
            name: cleanName,
            assignedRoleKey: sp.assignedRoleKey || result[foundIndex].assignedRoleKey || null
          };
        } else {
          result.push({
            id: sp.id || ('sync_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)),
            name: cleanName,
            assignedRoleKey: sp.assignedRoleKey && ROLE_CATALOG[sp.assignedRoleKey] ? sp.assignedRoleKey : null
          });
        }
      });

      return result;
    }

    // Carica lo stato salvato in sicurezza tramite try/catch
    function loadMasterRoleState() {
      try {
        const ctx = readAccessContext();
        const base = createInitialMasterRoleState();
        const syncedPlayers = readRoomPlayers(ctx.roomCode);
        const raw = localStorage.getItem(MASTER_ROLES_STORAGE_KEY);

        if (!raw) {
          return {
            ...base,
            roomCode: ctx.roomCode,
            masterName: ctx.masterName,
            players: mergeSyncedPlayersIntoMaster([], syncedPlayers)
          };
        }

        const parsed = JSON.parse(raw);
        const sameRoom = String(parsed.roomCode || '').trim().toUpperCase() === ctx.roomCode;
        const mergedCounts = { ...base.roleCounts };
        if (parsed.roleCounts && typeof parsed.roleCounts === 'object') {
          Object.keys(mergedCounts).forEach(key => {
            mergedCounts[key] = Math.max(0, Math.min(12, Number(parsed.roleCounts[key] ?? mergedCounts[key])));
          });
        }

        const basePlayers = sameRoom && Array.isArray(parsed.players) ? parsed.players : [];
        const mergedPlayers = mergeSyncedPlayersIntoMaster(basePlayers, syncedPlayers);

        return {
          ...base,
          ...(sameRoom ? parsed : {}),
          roomCode: ctx.roomCode,
          masterName: ctx.masterName,
          roleCounts: mergedCounts,
          players: mergedPlayers,
          boardOpened: Boolean(sameRoom && parsed.boardOpened)
        };
      } catch (err) {
        console.error('Errore caricamento stato assegnazione ruoli Master:', err);
        return createInitialMasterRoleState();
      }
    }

    let masterState = loadMasterRoleState();

    // Salva lo stato della pagina Master e sincronizza giocatori e ruoli nella stanza
    async function saveMasterRoleState(syncRoom = true) {
      try {
        localStorage.setItem(MASTER_ROLES_STORAGE_KEY, JSON.stringify({
          roomCode: masterState.roomCode,
          masterName: masterState.masterName,
          roleCounts: masterState.roleCounts,
          players: masterState.players,
          speechTone: masterState.speechTone,
          customSpeech: masterState.customSpeech,
          activeParagraphIndex: masterState.activeParagraphIndex,
          assignmentCompleted: masterState.assignmentCompleted,
          boardOpened: masterState.boardOpened,
          banner: masterState.banner
        }));
      } catch (err) {
        console.error('Errore salvataggio stato assegnazione ruoli Master:', err);
      }

      if (!syncRoom) return;

      const cleanRoom = String(masterState.roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1';
      const payload = {
        roomCode: cleanRoom,
        players: masterState.players.map(p => ({
          id: p.id,
          name: p.name,
          assignedRoleKey: p.assignedRoleKey || null
        })),
        roleCounts: masterState.roleCounts,
        updatedAt: Date.now()
      };

      try {
        localStorage.setItem(ROOM_SYNC_PREFIX + cleanRoom, JSON.stringify(payload));
      } catch (err) {
        console.error('Errore salvataggio locale stanza Master:', err);
      }

      if (cloudReady && db) {
        try {
          const ref = doc(db, 'artifacts', appId, 'public', 'data', 'ombre_rooms', cleanRoom);
          await setDoc(ref, payload, { merge: true });
        } catch (err) {
          console.error('Errore scrittura Firestore stanza Master:', err);
        }
      }
    }

    // Applica una lista aggiornata di giocatori sincronizzati senza perdere ruoli già estratti
    function applyIncomingSyncedPlayers(incomingPlayers) {
      const cleanIncoming = Array.isArray(incomingPlayers) ? incomingPlayers : [];
      masterState.players = mergeSyncedPlayersIntoMaster(masterState.players, cleanIncoming);
      saveMasterRoleState(false);
      renderMasterRolePage();
    }

    // Avvia l'ascolto in tempo reale dei giocatori che entrano nella stanza
    function startMasterRoomListener() {
      const cleanRoom = String(masterState.roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1';
      if (typeof roomUnsubscribe === 'function') {
        roomUnsubscribe();
        roomUnsubscribe = null;
      }

      window.addEventListener('storage', evt => {
        if (evt.key === ROOM_SYNC_PREFIX + cleanRoom && evt.newValue) {
          try {
            const parsed = JSON.parse(evt.newValue);
            applyIncomingSyncedPlayers(parsed.players);
          } catch (err) {
            console.error('Errore lettura evento storage stanza:', err);
          }
        }
      });

      if (cloudReady && db) {
        try {
          const ref = doc(db, 'artifacts', appId, 'public', 'data', 'ombre_rooms', cleanRoom);
          roomUnsubscribe = onSnapshot(ref, snap => {
            if (!snap.exists()) return;
            const data = snap.data();
            const normalized = {
              roomCode: cleanRoom,
              players: Array.isArray(data.players) ? data.players : [],
              roleCounts: data.roleCounts || masterState.roleCounts,
              updatedAt: Number(data.updatedAt || Date.now())
            };
            try {
              localStorage.setItem(ROOM_SYNC_PREFIX + cleanRoom, JSON.stringify(normalized));
            } catch (err) {
              console.error('Errore cache stanza Master:', err);
            }
            applyIncomingSyncedPlayers(normalized.players);
          }, err => {
            console.error('Errore listener Firestore Master:', err);
          });
        } catch (err) {
          console.error('Errore avvio listener Firestore Master:', err);
        }
      }
    }

    // Inizializza la sincronizzazione cloud per la pagina Master
    async function initMasterCloud() {
      try {
        const cfgRaw = typeof window.__firebase_config !== 'undefined' ? window.__firebase_config : null;
        if (!cfgRaw) {
          masterState.syncLabel = 'Locale';
          await saveMasterRoleState(true);
          startMasterRoomListener();
          renderMasterRolePage();
          return;
        }

        const firebaseConfig = typeof cfgRaw === 'string' ? JSON.parse(cfgRaw) : cfgRaw;
        if (!firebaseConfig || !firebaseConfig.apiKey) {
          masterState.syncLabel = 'Locale';
          await saveMasterRoleState(true);
          startMasterRoomListener();
          renderMasterRolePage();
          return;
        }

        if (typeof window.__app_id === 'string' && window.__app_id.trim()) {
          appId = window.__app_id.trim();
        }

        const firebaseApp = getApps().length ? getApp() : initializeApp(firebaseConfig);
        auth = getAuth(firebaseApp);
        db = getFirestore(firebaseApp);

        if (typeof window.__initial_auth_token === 'string' && window.__initial_auth_token.trim()) {
          await signInWithCustomToken(auth, window.__initial_auth_token.trim());
        } else {
          await signInAnonymously(auth);
        }

        cloudReady = true;
        masterState.syncLabel = 'Cloud Attivo';
        await saveMasterRoleState(true);
        startMasterRoomListener();
        renderMasterRolePage();
      } catch (err) {
        console.error('Errore inizializzazione cloud Master:', err);
        masterState.syncLabel = 'Locale';
        await saveMasterRoleState(true);
        startMasterRoomListener();
        renderMasterRolePage();
      }
    }

    // Imposta un messaggio di feedback per il Master
    function setMasterBanner(text, type = 'info') {
      masterState.banner = { text, type };
      saveMasterRoleState(true);
      renderMasterRolePage();
    }

    // Passa dalla cerimonia/gestione ruoli alla plancia del Master
    function enterMasterBoard() {
      if (!masterState.assignmentCompleted) {
        setMasterBanner('Assegna prima i ruoli ai giocatori al tavolo per aprire la plancia del Master.', 'error');
        return;
      }
      masterState.boardOpened = true;
      masterState.banner = {
        text: 'Plancia del Master aperta. Puoi tornare in qualsiasi momento a Cerimonia e Ruoli dal pulsante in alto.',
        type: 'success'
      };
      saveMasterRoleState(true);
      renderMasterRolePage();
    }

    // Riporta alla sezione Cerimonia e Gestione Ruoli
    function openCeremonyAndRolesSection() {
      masterState.boardOpened = false;
      masterState.banner = null;
      saveMasterRoleState(true);
      renderMasterRolePage();
    }

    // Naviga verso index.html quando non in anteprima isolata
    function goToPage(fileName) {
      const target = fileName === 'giocatore.html' ? 'giocatore.html' : 'index.html';
      const isIsolatedPreview =
        window.location.protocol === 'blob:' ||
        window.location.href === 'about:srcdoc' ||
        window.location.href.startsWith('data:');

      if (!isIsolatedPreview) {
        try {
          window.location.href = target;
          return;
        } catch (err) {
          console.error('Errore navigazione verso', target, err);
        }
      }

      setMasterBanner(
        `Stato salvato. Nell'anteprima isolata il collegamento a ${target} non apre un altro file locale: usa i file nella stessa cartella oppure apri ${target} dall'elenco schede.`,
        'info'
      );
    }

    // Restituisce i paragrafi del discorso in base al tono o al testo personalizzato
    function getSpeechParagraphs() {
      const custom = String(masterState.customSpeech || '').trim();
      if (custom) {
        return custom
          .split(/\n\s*\n|\n/)
          .map(line => line.trim())
          .filter(Boolean)
          .map(line => line.replace(/\{\{STANZA\}\}/gi, masterState.roomCode));
      }
      const list = SPEECH_TEMPLATES[masterState.speechTone] || SPEECH_TEMPLATES.suspense;
      return list.map(line => line.replace(/\{\{STANZA\}\}/gi, masterState.roomCode));
    }

    // Cambia il tono preimpostato del discorso
    function setSpeechTone(tone) {
      if (!SPEECH_TEMPLATES[tone]) return;
      masterState.speechTone = tone;
      masterState.customSpeech = '';
      masterState.activeParagraphIndex = 0;
      masterState.banner = null;
      saveMasterRoleState(false);
      renderMasterRolePage();
    }

    // Aggiorna il testo personalizzato del discorso
    function handleCustomSpeechChange(value) {
      masterState.customSpeech = String(value || '');
      masterState.activeParagraphIndex = 0;
      masterState.banner = null;
      saveMasterRoleState(false);
      renderMasterRolePage();
    }

    // Sposta il puntatore sul paragrafo precedente o successivo del discorso
    function stepSpeechParagraph(delta) {
      const paragraphs = getSpeechParagraphs();
      if (paragraphs.length === 0) return;
      const next = (masterState.activeParagraphIndex + delta + paragraphs.length) % paragraphs.length;
      masterState.activeParagraphIndex = next;
      masterState.banner = null;
      saveMasterRoleState(false);
      renderMasterRolePage();
    }

    // Copia l'intero discorso negli appunti usando execCommand per compatibilità iframe
    function copyFullSpeech() {
      const fullText = getSpeechParagraphs().join('\n\n');
      try {
        const area = document.createElement('textarea');
        area.value = fullText;
        document.body.appendChild(area);
        area.select();
        const copied = document.execCommand('copy');
        document.body.removeChild(area);
        if (copied) {
          setMasterBanner('Discorso di assegnazione copiato negli appunti.', 'success');
        } else {
          setMasterBanner('Testo del discorso pronto per la lettura al tavolo.', 'info');
        }
      } catch (err) {
        console.error('Errore copia discorso:', err);
        setMasterBanner('Impossibile copiare automaticamente il discorso.', 'error');
      }
    }

    // Modifica il numero di copie di un ruolo nel mazzo
    function changeRoleCount(roleKey, delta) {
      if (!ROLE_CATALOG[roleKey]) return;
      const current = Number(masterState.roleCounts[roleKey] || 0);
      masterState.roleCounts[roleKey] = Math.max(0, Math.min(12, current + delta));
      masterState.assignmentCompleted = false;
      masterState.boardOpened = false;
      masterState.banner = null;
      saveMasterRoleState(true);
      renderMasterRolePage();
    }

    // Aggiunge manualmente un giocatore al tavolo del Master
    function addMasterPlayer(rawName) {
      const cleanName = String(rawName || '').trim();
      if (!cleanName) {
        setMasterBanner('Inserisci il nome del giocatore da aggiungere al tavolo.', 'error');
        return;
      }
      const exists = masterState.players.some(
        p => String(p.name || '').trim().toLowerCase() === cleanName.toLowerCase()
      );
      if (exists) {
        setMasterBanner('Questo giocatore è già presente al tavolo.', 'info');
        return;
      }
      masterState.players.push({
        id: 'm_p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        name: cleanName,
        assignedRoleKey: null
      });
      masterState.assignmentCompleted = false;
      masterState.boardOpened = false;
      masterState.banner = null;
      saveMasterRoleState(true);
      renderMasterRolePage();
    }

    // Rimuove un giocatore dal tavolo del Master
    function removeMasterPlayer(playerId) {
      masterState.players = masterState.players.filter(p => p.id !== playerId);
      masterState.assignmentCompleted = false;
      masterState.boardOpened = false;
      masterState.banner = null;
      saveMasterRoleState(true);
      renderMasterRolePage();
    }

    // Estrae casualmente i ruoli configurati e li assegna ai giocatori al tavolo
    function assignRolesRandomly() {
      if (masterState.players.length === 0) {
        setMasterBanner('Attendi che entri un giocatore nella stanza o aggiungilo al tavolo prima di assegnare i ruoli.', 'error');
        return;
      }

      const pool = [];
      Object.keys(ROLE_CATALOG).forEach(roleKey => {
        const qty = Number(masterState.roleCounts[roleKey] || 0);
        for (let i = 0; i < qty; i++) {
          pool.push(roleKey);
        }
      });

      if (pool.length < masterState.players.length) {
        setMasterBanner(
          `Hai configurato ${pool.length} ruoli per ${masterState.players.length} giocatori: aumenta la quantità di uno o più ruoli.`,
          'error'
        );
        return;
      }

      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = pool[i];
        pool[i] = pool[j];
        pool[j] = temp;
      }

      const extracted = pool.slice(0, masterState.players.length);
      masterState.players = masterState.players.map((player, idx) => ({
        ...player,
        assignedRoleKey: extracted[idx]
      }));
      masterState.assignmentCompleted = true;

      setMasterBanner(
        `Assegnati casualmente ${extracted.length} ruoli e sincronizzati con la stanza: ora puoi leggere il discorso o aprire la Plancia Master.`,
        'success'
      );
    }

    // Azzera i ruoli assegnati senza rimuovere i giocatori dal tavolo
    function resetRoleAssignments() {
      masterState.players = masterState.players.map(player => ({
        ...player,
        assignedRoleKey: null
      }));
      masterState.assignmentCompleted = false;
      masterState.boardOpened = false;
      setMasterBanner('Ruoli assegnati azzerati: i giocatori restano al tavolo.', 'info');
    }

    // Escape HTML per rendere sicuro l'inserimento di testo
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Renderizza la pagina Master (cerimonia/gestione ruoli oppure plancia Master)
    function renderMasterRolePage() {
      const container = document.getElementById('master-roles-app');
      if (!container) return;

      try {
        const totalRoles = Object.values(masterState.roleCounts).reduce((sum, v) => sum + Number(v || 0), 0);
        const paragraphs = getSpeechParagraphs();
        const safeIdx = paragraphs.length > 0
          ? Math.min(masterState.activeParagraphIndex, paragraphs.length - 1)
          : 0;
        const syncId = 'SYNC-' + masterState.roomCode;
        const banner = masterState.banner;

        const bannerHtml = banner
          ? `<div class="rounded-xl border px-4 py-3 text-sm font-medium ${
              banner.type === 'success'
                ? 'bg-emerald/15 border-emerald/40 text-emerald'
                : banner.type === 'error'
                ? 'bg-crimson/15 border-crimson/40 text-crimson'

            <header class="rounded-2xl bg-surface border border-white/10 p-5 sm:p-6 flex flex-wrap items-center justify-between gap-4">

                <h1 class="font-serif text-2xl sm:text-3xl font-bold text-white mt-1">Tavolo di ${escapeHtml(masterState.roomCode)}</h1>
                <p class="text-xs text-gray-400 mt-1">
                  Master: <strong class="text-gray-200">${escapeHtml(masterState.masterName)}</strong> ·
                  ID Sync: <strong class="font-mono text-emerald">${escapeHtml(syncId)}</strong> ·
                  <span class="text-gray-300">${escapeHtml(masterState.syncLabel)}</span>
                </p>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <button
                  type="button"
                  onclick="openCeremonyAndRolesSection()"
                  class="px-4 py-2.5 rounded-xl bg-gold text-bgdark text-xs font-bold hover:brightness-110 transition cursor-pointer"

                </button>
                <button
                  type="button"
                  onclick="goToPage('index.html')"

                  Torna ad Accesso
                </button>
              </div>

            <section class="rounded-2xl bg-surface border border-white/10 p-5 sm:p-6 space-y-4">
              <div class="flex items-center justify-between gap-2">
                <h2 class="font-serif text-xl font-bold text-white">Riepilogo Giocatori e Ruoli al Tavolo (${masterState.players.length})</h2>
                <span class="text-xs font-semibold text-emerald">Sessione Attiva</span>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${masterState.players.map(player => {
                  const roleInfo = player.assignedRoleKey ? ROLE_CATALOG[player.assignedRoleKey] : null;
                  return `
                    <div class="rounded-xl bg-bgdark border border-white/10 p-4 flex items-center justify-between gap-3">
                      <div>
                        <div class="font-semibold text-sm text-white">${escapeHtml(player.name)}</div>
                        <div class="text-xs text-gray-400 mt-0.5">Giocatore al tavolo</div>
                      </div>
                      <div>
                        ${roleInfo
                          ? `<span class="text-xs font-semibold px-2.5 py-1 rounded-full border ${roleInfo.badgeClass}">${escapeHtml(roleInfo.name)} · ${escapeHtml(roleInfo.faction)}</span>`
                          : `<span class="text-xs text-gray-400">Nessun ruolo</span>`
                        }
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </section>

          return;

                Stanza: <strong class="text-gray-200">${escapeHtml(masterState.roomCode)}</strong> ·

                <span class="text-gray-300">${escapeHtml(masterState.syncLabel)}</span>

              >

              </button>

                      : 'bg-bgdark text-gray-300 border-white/15 hover:border-white/30'

                  Suspense

                  onclick="setSpeechTone('solenne')"

                      ? 'bg-gold text-bgdark border-gold'
                      : 'bg-bgdark text-gray-300 border-white/15 hover:border-white/30'

                  Solenne

                <button
                  type="button"
                  onclick="setSpeechTone('rapido')"
                  class="px-3 py-1.5 rounded-lg text-xs font-semibold border transition cursor-pointer ${

                      ? 'bg-gold text-bgdark border-gold'
                      : 'bg-bgdark text-gray-300 border-white/15 hover:border-white/30'

                : paragraphs.map((line, index) => {
                    const isCurrent = index === safeIdx;
                    return `
                      <div class="rounded-xl p-3.5 border transition ${
                        isCurrent
                          ? 'bg-gold/10 border-gold/50 text-white'
                          : 'bg-surface/60 border-white/5 text-gray-400'
                      }">
                        <div class="flex items-center justify-between gap-2 mb-1">
                          <span class="text-[11px] font-bold uppercase tracking-wider ${
                            isCurrent ? 'text-gold' : 'text-gray-500'

                            Parte ${index + 1} di ${paragraphs.length}
                          </span>
                          ${isCurrent ? `<span class="text-[11px] font-semibold text-gold">In lettura</span>` : ''}

                        <p class="text-sm sm:text-base leading-relaxed">${escapeHtml(line)}</p>

                  }).join('')
              }

                  Parte Precedente
                </button>
                <span class="text-xs text-gray-400">
                  Passo ${paragraphs.length > 0 ? safeIdx + 1 : 0} / ${paragraphs.length}

                <button
                  type="button"
                  onclick="stepSpeechParagraph(1)"
                  class="px-3.5 py-2 rounded-lg bg-indigo text-white text-xs font-semibold hover:brightness-110 transition cursor-pointer"
                >
                  Parte Successiva
                </button>

                        <div class="flex items-center justify-between gap-2">
                          <span class="font-semibold text-sm text-white">${escapeHtml(roleDef.name)}</span>
                          <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full border ${roleDef.badgeClass}">
                            ${escapeHtml(roleDef.faction)}
                          </span>
                        </div>
                        <p class="text-xs text-gray-400 mt-1.5">${escapeHtml(roleDef.desc)}</p>
                      </div>
                      <div class="flex items-center justify-between pt-2 border-t border-white/10">
                        <span class="text-xs text-gray-400">Copie:</span>
                        <div class="flex items-center gap-2">
                          <button
                            type="button"
                            onclick="changeRoleCount('${roleKey}', -1)"
                            class="w-7 h-7 rounded-lg bg-surface2 hover:bg-white/10 text-xs font-bold text-gray-200 cursor-pointer"
                          >-</button>
                          <span class="w-6 text-center text-sm font-bold text-gold">${count}</span>
                          <button
                            type="button"
                            onclick="changeRoleCount('${roleKey}', 1)"
                            class="w-7 h-7 rounded-lg bg-surface2 hover:bg-white/10 text-xs font-bold text-gray-200 cursor-pointer"
                          >+</button>
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </section>

            <section class="rounded-2xl bg-surface border border-white/10 p-5 space-y-4">
              <div class="flex items-center justify-between gap-2">
                <h2 class="font-serif text-xl font-bold text-white">2. Giocatori al Tavolo (${masterState.players.length})</h2>
                <span class="text-[11px] font-semibold text-emerald">Aggiunta automatica stanza</span>
              </div>

              <form
                onsubmit="event.preventDefault(); const inp = document.getElementById('master-player-input'); addMasterPlayer(inp.value); inp.value = '';"
                class="flex gap-2"
              >
                <input
                  id="master-player-input"
                  type="text"
                  maxlength="24"
                  placeholder="Nome giocatore..."
                  class="flex-1 rounded-xl bg-bgdark border border-white/15 px-3.5 py-2 text-sm text-white focus:outline-none focus:border-indigo"
                />
                <button
                  type="submit"
                  class="px-4 py-2 rounded-xl bg-indigo text-white text-xs font-semibold hover:brightness-110 transition cursor-pointer"
                >
                  Aggiungi
                </button>
              </form>

              <div class="space-y-2.5">
                ${masterState.players.length === 0
                  ? `<div class="rounded-xl bg-bgdark border border-white/10 p-4 text-xs text-gray-400 text-center">
                       In attesa che i giocatori entrino con il codice stanza ${escapeHtml(masterState.roomCode)} (oppure aggiungine uno qui sopra).
                     </div>`
                  : masterState.players.map(player => {
                      const roleInfo = player.assignedRoleKey ? ROLE_CATALOG[player.assignedRoleKey] : null;
                      return `
                        <div class="rounded-xl bg-bgdark border border-white/10 p-3.5 flex items-center justify-between gap-3">
                          <div>
                            <div class="font-semibold text-sm text-white">${escapeHtml(player.name)}</div>
                            <div class="text-xs mt-1">
                              ${roleInfo
                                ? `<span class="font-semibold px-2 py-0.5 rounded-full border ${roleInfo.badgeClass}">${escapeHtml(roleInfo.name)} (${escapeHtml(roleInfo.faction)})</span>`
                                : `<span class="text-gray-400">In attesa di assegnazione</span>`
                              }
                            </div>
                          </div>
                          <button
                            type="button"
                            onclick="removeMasterPlayer('${player.id}')"
                            class="px-2.5 py-1.5 rounded-lg bg-surface2 hover:bg-crimson/20 text-xs text-gray-300 hover:text-crimson transition cursor-pointer"
                          >
                            Rimuovi
                          </button>
                        </div>
                      `;
                    }).join('')
                }
              </div>
            </section>
          </div>

          <div class="flex justify-end">
            <button
              type="button"
              onclick="enterMasterBoard()"
              class="px-5 py-3 rounded-xl bg-emerald text-bgdark text-sm font-bold hover:brightness-110 transition cursor-pointer"
            >
              Completa e Vai alla Plancia Master
            </button>
          </div>
        `;
      } catch (err) {
        console.error('Errore rendering pagina Master:', err);
        container.innerHTML = `
          <div class="rounded-2xl bg-surface border border-crimson/40 p-6 text-sm text-crimson">
            Errore durante il caricamento della pagina Master. Ricarica la pagina.
          </div>
        `;
      }
    }

    // Esposizione esplicita delle funzioni globali richiamate dai pulsanti
    window.setSpeechTone = setSpeechTone;
    window.handleCustomSpeechChange = handleCustomSpeechChange;
    window.stepSpeechParagraph = stepSpeechParagraph;
    window.copyFullSpeech = copyFullSpeech;
    window.changeRoleCount = changeRoleCount;
    window.addMasterPlayer = addMasterPlayer;
    window.removeMasterPlayer = removeMasterPlayer;
    window.assignRolesRandomly = assignRolesRandomly;
    window.resetRoleAssignments = resetRoleAssignments;
    window.enterMasterBoard = enterMasterBoard;
    window.openCeremonyAndRolesSection = openCeremonyAndRolesSection;
    window.goToPage = goToPage;

    renderMasterRolePage();
    initMasterCloud();
  </script>
