<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ombre al Tavolo — Scheda Giocatore</title>
  <style>
    :root {
      --bg: #0c0e14;
      --surface: #151924;
      --surface-2: #1d2230;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --gold: #e5b85c;
      --crimson: #e05260;
      --emerald: #3ec98c;
      --indigo: #7c8cff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    .app-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 64px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .card-eliminated {
      border-color: rgba(224, 82, 96, 0.55);
      background: linear-gradient(180deg, rgba(224, 82, 96, 0.08), var(--surface) 45%);
    }

    .header-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      display: block;
    }

    h1 { margin: 2px 0 0; font-size: 24px; font-weight: 800; color: #fff; }
    h2 { margin: 0; font-size: 18px; font-weight: 700; color: #fff; }
    .subtext { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    button, select, input[type="text"] {
      font-family: inherit;
      border-radius: 10px;
    }

    button { cursor: pointer; font-weight: 600; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    select, input[type="text"] {
      width: 100%;
      background: var(--bg);
      color: #fff;
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 13px;
    }

    .btn-gold { background: var(--gold); color: #0c0e14; border: none; padding: 9px 13px; font-size: 12px; font-weight: 700; }
    .btn-emerald { background: var(--emerald); color: #0c0e14; border: none; padding: 9px 13px; font-size: 12px; font-weight: 700; }
    .btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); padding: 9px 13px; font-size: 12px; }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .badge-Traditori { background: rgba(224, 82, 96, 0.15); color: var(--crimson); border-color: rgba(224, 82, 96, 0.4); }
    .badge-Fedeli { background: rgba(62, 201, 140, 0.15); color: var(--emerald); border-color: rgba(62, 201, 140, 0.4); }
    .badge-Neutro { background: rgba(229, 184, 92, 0.15); color: var(--gold); border-color: rgba(229, 184, 92, 0.4); }
    .badge-Indigo { background: rgba(124, 140, 255, 0.16); color: var(--indigo); border-color: rgba(124, 140, 255, 0.35); }
    .badge-Muted { background: var(--surface-2); color: var(--muted); border-color: var(--border); }

    .eliminated-lock {
      background: rgba(224, 82, 96, 0.14);
      border: 1px solid rgba(224, 82, 96, 0.45);
      border-radius: 14px;
      padding: 18px;
    }

    .eliminated-lock h2 { color: #ff8b96; }
    .eliminated-lock p { margin: 6px 0 0; font-size: 14px; color: #f3f4f6; }

    .mission-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .chat-box { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
    .msg-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
    .msg-head { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    .msg-body { margin: 0; font-size: 13px; color: #e5e7eb; }
    .chat-form { display: flex; gap: 8px; }

    .tv-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(8, 10, 16, 0.94);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .tv-modal {
      width: 100%;
      max-width: 720px;
      background: var(--surface);
      border: 1px solid rgba(229, 184, 92, 0.45);
      border-radius: 18px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    video { width: 100%; max-height: 360px; border-radius: 12px; background: #000; }
  </style>

  <script>
    window.OMBRE_FIREBASE_CONFIG = {
      apiKey: "AIzaSyDTTdNc3bTlrCWeYHWH_vYG7u9CpPPQ2Xk",
      authDomain: "ombre-al-tavolo.firebaseapp.com",
      projectId: "ombre-al-tavolo",
      storageBucket: "ombre-al-tavolo.firebasestorage.app",
      messagingSenderId: "97309042699",
      appId: "1:97309042699:web:a457efd353f770f2a0bf0e",
      measurementId: "G-BZ4K22W409"
    };
  </script>
</head>
<body>
  <div id="player-app" class="app-wrap"></div>

  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    var ACCESS_KEY = 'ombre_accesso_tavolo_v1';
    var ROOM_PREFIX = 'ombre_stanza_sync_';

    var ROLE_INFO = {
      assassino: { name: 'Assassino', faction: 'Traditori', desc: 'Colpisce di notte (o indica 2 bersagli se c’è il Traditore Segreto).' },
      sabotatore: { name: 'Sabotatore', faction: 'Traditori', desc: 'Blocca silenziosamente l’attivazione di un giocatore per il turno.' },
      traditore_segreto: { name: 'Traditore Segreto', faction: 'Traditori', desc: 'Conosce i Traditori e decide quale dei 2 bersagli dell’Assassino eliminare.' },
      investigatore: { name: 'Investigatore', faction: 'Fedeli', desc: 'Scopre una missione degli Assassini a bassa difficoltà.' },
      guardia: { name: 'Guardia', faction: 'Fedeli', desc: 'Assegna uno Scudo Protettivo valido per 1 notte.' },
      martire: { name: 'Martire', faction: 'Fedeli', desc: 'Rileva un ruolo o assegna uno Scudo persistente.' },
      mediatore: { name: 'Mediatore', faction: 'Fedeli', desc: 'Ha un voto extra (+1) al Tavolo Ovale.' },
      cacciatore: { name: 'Cacciatore', faction: 'Neutro', desc: 'Verifica se un giocatore ha un determinato ruolo o indica il ruolo di 3 giocatori.' }
    };

    var VIDEO_MAP = {
      intro: { file: 'ingresso.mp4', title: 'Ingresso al Tavolo' },
      kill: { file: 'eliminazione.mp4', title: 'Eliminazione Notturna' },
      exile: { file: 'esilio.mp4', title: 'Esilio al Tavolo Ovale' },
      win_fedeli: { file: 'vittoria_fedeli.mp4', title: 'Vittoria dei Fedeli' },
      win_traditori: { file: 'vittoria_traditori.mp4', title: 'Vittoria dei Traditori' },
      win_solitario: { file: 'vittoria_solitario.mp4', title: 'Vittoria del Cacciatore' }
    };

    function initFirestore() {
      try {
        if (!window.OMBRE_FIREBASE_CONFIG || !window.OMBRE_FIREBASE_CONFIG.projectId) return null;
        var app = getApps().length ? getApps()[0] : initializeApp(window.OMBRE_FIREBASE_CONFIG);
        return getFirestore(app);
      } catch (_e) { return null; }
    }

    var firestoreDb = initFirestore();

    function readAccess() {
      try {
        var raw = localStorage.getItem(ACCESS_KEY);
        var p = raw ? JSON.parse(raw) : {};
        return {
          roomCode: String(p.roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1',
          playerName: String(p.playerName || 'Giocatore').trim() || 'Giocatore'
        };
      } catch (_e) {
        return { roomCode: 'TAVOLO1', playerName: 'Giocatore' };
      }
    }

    var acc = readAccess();
    var state = {
      roomCode: acc.roomCode,
      playerName: acc.playerName,
      players: [],
      missionAssignments: {},
      playerPoints: {},
      eliminatedPlayers: [],
      ovalActive: false,
      tvMode: 'idle',
      tvKillTarget: '',
      tvExileTarget: '',
      tvVideoPaused: false,
      tvRevealTick: 0,
      dismissedTick: -1,
      masterChat: []
    };

    var chatDraft = '';

    function nameKey(n) { return String(n || '').trim().toLowerCase(); }
    function getRoomRef() { return firestoreDb ? doc(firestoreDb, 'stanze', state.roomCode) : null; }

    function isEliminated() {
      var k = nameKey(state.playerName);
      if (!k) return false;
      if ((state.eliminatedPlayers || []).some(function (x) { return nameKey(x) === k; })) return true;
      var p = (state.players || []).find(function (pl) { return nameKey(pl.name) === k; });
      return Boolean(p && (p.eliminated === true || p.alive === false || p.status === 'eliminated'));
    }

    function getMyPlayerObj() {
      return (state.players || []).find(function (p) { return nameKey(p.name) === nameKey(state.playerName); }) || null;
    }

    function applySnapshot(data) {
      if (!data || typeof data !== 'object') return;
      if (Array.isArray(data.players)) state.players = data.players;
      if (data.missionAssignments && typeof data.missionAssignments === 'object') state.missionAssignments = data.missionAssignments;
      if (data.playerPoints && typeof data.playerPoints === 'object') state.playerPoints = data.playerPoints;
      if (Array.isArray(data.eliminatedPlayers)) state.eliminatedPlayers = data.eliminatedPlayers;
      if (typeof data.ovalActive === 'boolean') state.ovalActive = data.ovalActive;
      if (typeof data.tvMode === 'string') state.tvMode = data.tvMode;
      if (typeof data.tvKillTarget === 'string') state.tvKillTarget = data.tvKillTarget;
      if (typeof data.tvExileTarget === 'string') state.tvExileTarget = data.tvExileTarget;
      if (typeof data.tvVideoPaused === 'boolean') state.tvVideoPaused = data.tvVideoPaused;
      if (typeof data.tvRevealTick === 'number') state.tvRevealTick = Number(data.tvRevealTick);
      if (Array.isArray(data.masterChat)) state.masterChat = data.masterChat;

      if (state.ovalActive && !isEliminated() && window.location.pathname.indexOf('tavola-ovale.html') === -1) {
        window.location.replace('tavola-ovale.html?room=' + encodeURIComponent(state.roomCode) + '&player=' + encodeURIComponent(state.playerName));
        return;
      }

      try {
        localStorage.setItem(ROOM_PREFIX + state.roomCode, JSON.stringify(Object.assign({}, data, { roomCode: state.roomCode })));
      } catch (_e) {}
    }

    async function syncState(extra) {
      var payload = Object.assign({
        roomCode: state.roomCode,
        players: state.players,
        missionAssignments: state.missionAssignments,
        playerPoints: state.playerPoints,
        eliminatedPlayers: state.eliminatedPlayers,
        masterChat: state.masterChat,
        updatedAt: Date.now()
      }, extra || {});
      try { localStorage.setItem(ROOM_PREFIX + state.roomCode, JSON.stringify(payload)); } catch (_e) {}
      var ref = getRoomRef();
      if (!ref) return;
      try { await setDoc(ref, payload, { merge: true }); } catch (_e) {}
    }

    window.claimMissionSlot = async function (slotIdx) {
      if (isEliminated()) return;
      var k = nameKey(state.playerName);
      var list = Array.isArray(state.missionAssignments[k]) ? state.missionAssignments[k].slice() : [];
      if (!list[slotIdx]) return;
      list[slotIdx].playerClaimedDone = !list[slotIdx].playerClaimedDone;
      list[slotIdx].done = Boolean(list[slotIdx].masterApproved || list[slotIdx].playerClaimedDone);
      state.missionAssignments[k] = list;
      await syncState();
      render();
    };

    window.setChatDraft = function (v) { chatDraft = String(v || ''); };

    window.sendPlayerMessage = async function () {
      if (isEliminated()) return;
      var inp = document.getElementById('player-chat-input');
      var txt = String((inp ? inp.value : chatDraft) || '').trim();
      if (!txt) return;
      state.masterChat = (state.masterChat || []).concat([{
        id: 'pm_' + Date.now(),
        fromMaster: false,
        senderName: state.playerName,
        playerName: 'Master',
        text: txt,
        createdAt: Date.now()
      }]).slice(-150);
      chatDraft = '';
      if (inp) inp.value = '';
      await syncState();
      render();
    };

    window.dismissTvModal = function () {
      state.dismissedTick = state.tvRevealTick;
      render();
    };

    window.goToAccess = function () { window.location.href = 'index.html'; };

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function renderTvModalIfNeeded() {
      if (!state.tvMode || state.tvMode === 'idle') return '';
      if (state.dismissedTick === state.tvRevealTick) return '';
      var cfg = VIDEO_MAP[state.tvMode];
      if (!cfg) return '';
      var protagonist = state.tvMode === 'kill' ? state.tvKillTarget : (state.tvMode === 'exile' ? state.tvExileTarget : '');
      return (
        '<div class="tv-overlay">' +
          '<div class="tv-modal">' +
            '<div class="header-row"><div><span class="eyebrow">Annuncio del Tavolo</span><h2>' + esc(cfg.title) + '</h2></div><button type="button" class="btn-ghost" onclick="dismissTvModal()">Chiudi</button></div>' +
            (protagonist ? '<div class="badge badge-Traditori" style="align-self:flex-start;">Protagonista: ' + esc(protagonist) + '</div>' : '') +
            '<video src="' + esc(cfg.file) + '" autoplay playsinline controls></video>' +
          '</div>' +
        '</div>'
      );
    }

    function render() {
      var root = document.getElementById('player-app');
      if (!root) return;
      var elim = isEliminated();
      var pObj = getMyPlayerObj();
      var roleKey = pObj && pObj.assignedRoleKey && ROLE_INFO[pObj.assignedRoleKey] ? pObj.assignedRoleKey : null;
      var roleInfo = roleKey ? ROLE_INFO[roleKey] : null;
      var k = nameKey(state.playerName);
      var pts = elim ? 0 : Number(state.playerPoints[k] || 0);
      var myMissions = elim ? [] : (Array.isArray(state.missionAssignments[k]) ? state.missionAssignments[k] : []);

      var myMsgs = (state.masterChat || []).filter(function (m) {
        var toMe = !m.playerName || nameKey(m.playerName) === k;
        var fromMe = nameKey(m.senderName) === k;
        return toMe || fromMe;
      });

      var missionsHtml = elim
        ? ''
        : (myMissions.length
            ? myMissions.map(function (m, idx) {
                return (
                  '<div class="mission-item">' +
                    '<div style="flex:1;min-width:220px;">' +
                      '<div style="font-weight:700;color:#fff;">' + (m.slot || (idx + 1)) + '. ' + esc(m.title) + '</div>' +
                      '<div class="subtext">' + esc(m.desc || '') + '</div>' +
                    '</div>' +
                    '<div class="btn-row">' +
                      (m.masterApproved ? '<span class="badge badge-Fedeli">Confermata ✓</span>' : (m.playerClaimedDone ? '<span class="badge badge-Neutro">In verifica</span>' : '<span class="badge badge-Muted">Aperta</span>')) +
                      '<button type="button" class="' + (m.playerClaimedDone ? 'btn-emerald' : 'btn-gold') + '" onclick="claimMissionSlot(' + idx + ')">' + (m.playerClaimedDone ? 'Segnalata ✓' : 'Segnala Svolta') + '</button>' +
                    '</div>' +
                  '</div>'
                );
              }).join('')
            : '<p class="subtext">Le missioni appariranno non appena il Master assegna o aggiorna la tua scheda.</p>');

      var msgsHtml = myMsgs.length
        ? myMsgs.slice().reverse().map(function (m) {
            return '<div class="msg-card"><div class="msg-head"><strong>' + esc(m.senderName || 'Master') + '</strong></div><p class="msg-body">' + esc(m.text) + '</p></div>';
          }).join('')
        : '<p class="subtext">Nessun messaggio.</p>';

      root.innerHTML =
        renderTvModalIfNeeded() +
        '<header class="card ' + (elim ? 'card-eliminated' : '') + '">' +
          '<div class="header-row">' +
            '<div>' +
              '<span class="eyebrow">Stanza ' + esc(state.roomCode) + ' · Scheda Giocatore</span>' +
              '<h1>' + esc(state.playerName) + '</h1>' +
              '<p class="subtext">' + (elim ? '<strong style="color:#ff8b96;">Sei fuori dal gioco (eliminato o esiliato). Non puoi più svolgere azioni o votare.</strong>' : ('Punti confermati: <strong>' + pts + '</strong>')) + '</p>' +
            '</div>' +
            '<div class="btn-row">' +
              (elim ? '<span class="badge badge-Traditori">Eliminato / Esiliato</span>' : (roleInfo ? '<span class="badge badge-' + roleInfo.faction + '">' + esc(roleInfo.name) + ' · ' + esc(roleInfo.faction) + '</span>' : '<span class="badge badge-Muted">In attesa del ruolo</span>')) +
              '<button type="button" class="btn-ghost" onclick="goToAccess()">Esci</button>' +
            '</div>' +
          '</div>' +
        '</header>' +
        (elim
          ? '<section class="card card-eliminated"><div class="eliminated-lock"><h2>Sei fuori dal gioco</h2><p>Sei stato eliminato o esiliato dal tavolo. I tuoi punti sono azzerati e le azioni di gioco, missioni e voto sono bloccate per il resto della partita.</p></div></section>'
          : (
              '<section class="card">' +
                '<span class="eyebrow">Identità Segreta</span>' +
                '<h2>' + (roleInfo ? esc(roleInfo.name) : 'Ruolo non ancora assegnato') + '</h2>' +
                '<p class="subtext">' + (roleInfo ? esc(roleInfo.desc) : 'Attendi che il Master assegni il tuo ruolo nella Cerimonia.') + '</p>' +
              '</section>' +
              '<section class="card">' +
                '<span class="eyebrow">Obiettivi</span>' +
                '<h2>Le Tue Missioni</h2>' +
                missionsHtml +
              '</section>' +
              '<section class="card">' +
                '<span class="eyebrow">Contatto con la Regia</span>' +
                '<h2>Messaggi al Master</h2>' +
                '<div class="chat-box">' + msgsHtml + '</div>' +
                '<div class="chat-form">' +
                  '<input id="player-chat-input" type="text" value="' + esc(chatDraft) + '" oninput="setChatDraft(this.value)" onkeydown="if(event.key===&#39;Enter&#39;){event.preventDefault();sendPlayerMessage();}" placeholder="Scrivi un messaggio al Master..." />' +
                  '<button type="button" class="btn-gold" onclick="sendPlayerMessage()">Invia</button>' +
                '</div>' +
              '</section>'
            )
        );
    }

    try {
      var rawLocal = localStorage.getItem(ROOM_PREFIX + state.roomCode);
      if (rawLocal) applySnapshot(JSON.parse(rawLocal));
    } catch (_e) {}
    render();

    var ref = getRoomRef();
    if (ref) {
      getDoc(ref).then(function (snap) {
        if (snap.exists()) { applySnapshot(snap.data() || {}); render(); }
      }).catch(function () {});
      onSnapshot(ref, function (snap) {
        if (!snap.exists()) return;
        applySnapshot(snap.data() || {});
        render();
      });
    }
  </script>
</body>
</html>
