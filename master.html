<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ombre al Tavolo — Console Master</title>
  <style>
    :root {
      --bg: #0c0e14;
      --surface: #151924;
      --surface-2: #1d2230;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --gold: #e5b85c;
      --crimson: #e05260;
      --emerald: #3ec98c;
      --indigo: #7c8cff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    .app-wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 16px 64px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .card-gold { border-color: rgba(229, 184, 92, 0.35); }
    .card-indigo { border-color: rgba(124, 140, 255, 0.4); }

    .header-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      display: block;
    }

    .eyebrow-indigo { color: var(--indigo); }

    h1 { margin: 2px 0 0; font-size: 25px; font-weight: 800; color: #ffffff; }
    h2 { margin: 0; font-size: 18px; font-weight: 700; color: #ffffff; }
    h3 { margin: 0; font-size: 15px; font-weight: 700; color: #ffffff; }
    .subtext { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; color: var(--emerald); }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    button, select, input[type="text"], textarea {
      font-family: inherit;
      border-radius: 10px;
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.15s ease, background-color 0.15s ease;
    }

    button:hover:not(:disabled) { opacity: 0.92; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    select, input[type="text"], textarea {
      width: 100%;
      background: var(--bg);
      color: #ffffff;
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 13px;
    }

    .btn-gold { background: var(--gold); color: #0c0e14; border: none; padding: 9px 13px; font-size: 12px; font-weight: 700; }
    .btn-emerald { background: var(--emerald); color: #0c0e14; border: none; padding: 9px 13px; font-size: 12px; font-weight: 700; }
    .btn-crimson { background: var(--crimson); color: #ffffff; border: none; padding: 9px 13px; font-size: 12px; font-weight: 700; }
    .btn-indigo { background: var(--indigo); color: #ffffff; border: none; padding: 9px 13px; font-size: 12px; }
    .btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); padding: 9px 13px; font-size: 12px; }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .badge-Traditori { background: rgba(224, 82, 96, 0.15); color: var(--crimson); border-color: rgba(224, 82, 96, 0.4); }
    .badge-Fedeli { background: rgba(62, 201, 140, 0.15); color: var(--emerald); border-color: rgba(62, 201, 140, 0.4); }
    .badge-Neutro { background: rgba(229, 184, 92, 0.15); color: var(--gold); border-color: rgba(229, 184, 92, 0.4); }
    .badge-Indigo { background: rgba(124, 140, 255, 0.16); color: var(--indigo); border-color: rgba(124, 140, 255, 0.35); }
    .badge-Muted { background: var(--surface-2); color: var(--muted); border-color: var(--border); }

    .banner {
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid transparent;
    }

    .banner-success { background: rgba(62, 201, 140, 0.14); border-color: rgba(62, 201, 140, 0.4); color: var(--emerald); }
    .banner-error { background: rgba(224, 82, 96, 0.14); border-color: rgba(224, 82, 96, 0.4); color: var(--crimson); }
    .banner-info { background: rgba(124, 140, 255, 0.14); border-color: rgba(124, 140, 255, 0.4); color: var(--indigo); }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }

    .player-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .player-row {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .player-row.eliminated { opacity: 0.62; border-color: rgba(224, 82, 96, 0.35); }

    .player-meta { display: flex; align-items: center; gap: 12px; }
    .avatar-sm {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: cover;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: var(--gold);
      flex-shrink: 0;
    }

    .mission-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mission-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .chat-box { max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
    .msg-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
    .msg-head { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    .msg-body { margin: 0; font-size: 13px; color: #e5e7eb; }
    .chat-form { display: flex; gap: 8px; }

    .ceremony-stage {
      background: var(--bg);
      border: 1px solid rgba(229, 184, 92, 0.35);
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .big-reveal {
      background: rgba(229, 184, 92, 0.1);
      border: 1px solid rgba(229, 184, 92, 0.45);
      border-radius: 12px;
      padding: 14px;
    }
  </style>

</head>
<body>
  <div id="master-console-app" class="app-wrap"></div>

  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    var ACCESS_KEY = 'ombre_accesso_tavolo_v1';
    var ROOM_PREFIX = 'ombre_stanza_sync_';
    var MISSION_CATALOG_URL = 'catalogo_missioni_ombre_al_tavolo.json';

    var GAME_PHASES = [
      { step: 1, title: 'Cerimonia dei Ruoli', tip: 'Assegna i ruoli e guida la cerimonia iniziale.' },
      { step: 2, title: 'Interludio Ludico', tip: 'I giocatori svolgono le missioni e si confrontano al tavolo.' },
      { step: 3, title: 'Notte (Primo Assassinio)', tip: 'Fase notturna del primo colpo: gestisci esiti e scudi.' },
      { step: 4, title: 'Risveglio', tip: 'Annuncia gli eventi della notte e aggiorna lo stato del tavolo.' },
      { step: 5, title: 'Interludio Ludico', tip: 'Nuova fase di gioco libero, missioni e osservazione.' },
      { step: 6, title: 'Tavolo Ovale', tip: 'Apri il Tavolo Ovale per discussione e votazione (il Master non vota).' },
      { step: 7, title: 'Notte (Assassino)', tip: 'Nuova fase notturna: il ciclo prosegue fino alla conclusione.' }
    ];

    var ROLE_DETAILS = {
      assassino: {
        name: 'Assassino',
        faction: 'Traditori',
        powerDesc: 'Può colpire chi vuole (tranne chi è protetto da Scudo). Se in partita c’è il Traditore Segreto, l’Assassino sceglie 2 persone e il Traditore Segreto decide chi eliminare. Costa 1 punto missione e richiede un giro di Tavolo Ovale prima di poter essere riutilizzata.'
      },
      sabotatore: {
        name: 'Sabotatore',
        faction: 'Traditori',
        powerDesc: 'Può bloccare silenziosamente l’attivazione di un altro giocatore per il turno (5 missioni, 3 ripetibili; contatto; no Traditori tranne Traditore Segreto).'
      },
      traditore_segreto: {
        name: 'Traditore Segreto',
        faction: 'Traditori',
        powerDesc: 'Conosci gli altri Traditori e, quando l’Assassino indica 2 bersagli, decidi tu quale dei due eliminare.'
      },
      investigatore: {
        name: 'Investigatore',
        faction: 'Fedeli',
        powerDesc: 'Puoi scoprire una missione degli Assassini a bassa difficoltà (5 missioni, 3 ripetibili; missioni prevalentemente verbali).'
      },
      guardia: {
        name: 'Guardia',
        faction: 'Fedeli',
        powerDesc: 'Puoi assegnare uno Scudo Protettivo valido per 1 notte a te stesso o a un altro giocatore.'
      },
      martire: {
        name: 'Martire',
        faction: 'Fedeli',
        powerDesc: 'Non hai missioni standard; puoi rilevare un ruolo o assegnare uno Scudo persistente fino a colpo di Assassino o Sabotatore.'
      },
      mediatore: {
        name: 'Mediatore',
        faction: 'Fedeli',
        powerDesc: 'Hai un voto extra (+1) alla Tavola Rotonda (5 missioni, 3 ripetibili; missioni prevalentemente verbali).'
      },
      cacciatore: {
        name: 'Cacciatore',
        faction: 'Neutro',
        powerDesc: 'Usa i punti missione per chiedere "giocatore X è ruolo Y?" con risposta automatica Sì/No; oppure (0 punti) indica il ruolo di 3 giocatori.'
      }
    };

    var FALLBACK_CATALOG = [
      { id: 'TRD-01', faction: 'Traditori', title: 'Sussurro Complice', type: 'Verbale', repeatable: true, points: 1, desc: 'Infila una parola chiave concordata nel discorso al tavolo senza destare sospetti.' },
      { id: 'TRD-02', faction: 'Traditori', title: 'Intesa Silenziosa', type: 'Contatto', repeatable: false, points: 1, desc: 'Scambia un cenno o tocca un oggetto con un altro giocatore durante il giro.' },
      { id: 'TRD-03', faction: 'Traditori', title: 'Sguardo Fuorviante', type: 'Reazione', repeatable: true, points: 1, desc: 'Induci un altro giocatore a sospettare di un Fedele dopo una domanda.' },
      { id: 'TRD-04', faction: 'Traditori', title: 'Passaggio d’Ombra', type: 'Contatto', repeatable: false, points: 1, desc: 'Consegna o sposta un piccolo oggetto in modo discreto.' },
      { id: 'TRD-05', faction: 'Traditori', title: 'Doppio Senso', type: 'Verbale', repeatable: true, points: 1, desc: 'Rispondi a una domanda con una frase ambigua che possa sembrare sincera.' },
      { id: 'FED-01', faction: 'Fedeli', title: 'Indagine Aperta', type: 'Verbale', repeatable: false, points: 1, desc: 'Poni una domanda diretta su un episodio avvenuto nel turno precedente.' },
      { id: 'FED-02', faction: 'Fedeli', title: 'Confronto Chiaro', type: 'Verbale', repeatable: true, points: 1, desc: 'Chiedi a un giocatore di ripetere la propria versione su un sospetto.' },
      { id: 'FED-03', faction: 'Fedeli', title: 'Patto di Fiducia', type: 'Verbale', repeatable: true, points: 1, desc: 'Sostieni apertamente un compagno di tavolo spiegando perché ti sembra affidabile.' },
      { id: 'FED-04', faction: 'Fedeli', title: 'Occhio Vigile', type: 'Reazione', repeatable: false, points: 1, desc: 'Nota e commenta un cambio di tono o esitazione durante la discussione.' },
      { id: 'FED-05', faction: 'Fedeli', title: 'Verità sul Tavolo', type: 'Verbale', repeatable: true, points: 1, desc: 'Riassumi gli indizi raccolti fino a questo momento in modo chiaro.' },
      { id: 'NEU-01', faction: 'Neutro', title: 'Osservatore Solitario', type: 'Reazione', repeatable: true, points: 1, desc: 'Osserva chi difende chi senza schierarti apertamente.' },
      { id: 'NEU-02', faction: 'Neutro', title: 'Domanda Scomoda', type: 'Verbale', repeatable: false, points: 1, desc: 'Fai una domanda che mette alla prova due giocatori diversi.' },
      { id: 'NEU-03', faction: 'Neutro', title: 'Caccia ai Dettagli', type: 'Reazione', repeatable: true, points: 1, desc: 'Individua una contraddizione tra due interventi al tavolo.' },
      { id: 'NEU-04', faction: 'Neutro', title: 'Scambio Mirato', type: 'Contatto', repeatable: false, points: 1, desc: 'Interagisci brevemente con un bersaglio per osservarne la reazione.' },
      { id: 'NEU-05', faction: 'Neutro', title: 'Equilibrio Precario', type: 'Verbale', repeatable: true, points: 1, desc: 'Mantieni una posizione neutra guidando la discussione verso un chiarimento.' }
    ];

    function initFirestore() {
      try {
        if (!window.OMBRE_FIREBASE_CONFIG || !window.OMBRE_FIREBASE_CONFIG.projectId) return null;
        var app = getApps().length ? getApps()[0] : initializeApp(window.OMBRE_FIREBASE_CONFIG);
        return getFirestore(app);
      } catch (_e) { return null; }
    }

    var firestoreDb = initFirestore();

    function readAccess() {
      try {
        var raw = localStorage.getItem(ACCESS_KEY);
        if (!raw) return { roomCode: 'TAVOLO1', playerName: 'Master' };
        var parsed = JSON.parse(raw);
        return {
          roomCode: String(parsed.roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1',
          playerName: String(parsed.playerName || 'Master').trim() || 'Master'
        };
      } catch (_e) {
        return { roomCode: 'TAVOLO1', playerName: 'Master' };
      }
    }

    function isValidAvatarSrc(val) {
      var s = String(val || '').trim();
      return /^data:image\/(png|jpeg|jpg|webp|gif);base64,/i.test(s) || /^https?:\/\//i.test(s);
    }

    var access = readAccess();
    var state = {
      roomCode: access.roomCode,
      masterName: access.playerName,
      syncStatus: firestoreDb ? 'Cloud Firestore attivo' : 'Locale',
      players: [],
      playerSelfies: {},
      missionAssignments: {},
      playerPoints: {},
      shieldedPlayers: [],
      martyrShieldedPlayers: [],
      sabotagedPlayers: [],
      eliminatedPlayers: [],
      phaseIndex: 0,
      cycleCount: 1,
      ovalActive: false,
      ovalRoundCount: 0,
      tvMode: 'idle',
      tvKillTarget: '',
      tvExileTarget: '',
      tvVideoPaused: false,
      tvRevealTick: 0,
      masterChat: [],
      catalog: FALLBACK_CATALOG.slice(),
      ceremonyStepIndex: 0,
      ceremonyRoleKey: 'assassino',
      newPlayerName: '',
      selectedPlayerForMissions: '',
      banner: null
    };

    var masterChatDraft = '';
    var directTargetName = '';

    function getRoomRef() {
      if (!firestoreDb) return null;
      return doc(firestoreDb, 'stanze', state.roomCode);
    }

    function nameKeyOf(n) {
      return String(n || '').trim().toLowerCase();
    }

    function isMasterAccountName(n) {
      var k = nameKeyOf(n);
      return !k || k === 'master' || k === nameKeyOf(state.masterName);
    }


    function getActivePlayers() {
      return (state.players || []).filter(function (p) {
        return p && p.name && !isMasterAccountName(p.name) && !isPlayerEliminated(p.name);
      });
    }

    function purgeEliminatedPlayerFromState(playerName) {
      var k = nameKeyOf(playerName);
      if (!k) return;
      state.shieldedPlayers = (state.shieldedPlayers || []).filter(function (n) { return nameKeyOf(n) !== k; });
      state.martyrShieldedPlayers = (state.martyrShieldedPlayers || []).filter(function (n) { return nameKeyOf(n) !== k; });
      state.sabotagedPlayers = (state.sabotagedPlayers || []).filter(function (n) { return nameKeyOf(n) !== k; });
      if (state.missionAssignments && state.missionAssignments[k]) {
        state.missionAssignments[k] = (state.missionAssignments[k] || []).map(function (m) {
          return Object.assign({}, m, { playerClaimedDone: false, masterApproved: false, done: false });
        });
      }
      if (state.playerPoints && state.playerPoints[k] !== undefined) {
        state.playerPoints[k] = 0;
      }
    }

    function isPlayerEliminated(name) {
      var k = nameKeyOf(name);
      if (!k) return false;
      if ((state.eliminatedPlayers || []).some(function (x) { return nameKeyOf(x) === k; })) return true;
      var p = (state.players || []).find(function (pl) { return nameKeyOf(pl.name) === k; });
      return Boolean(p && (p.eliminated === true || p.alive === false || p.status === 'eliminated'));
    }

    function buildFiveMissionsForFaction(faction, existingList) {
      var pool = state.catalog.filter(function (item) {
        return String(item.faction || '').toLowerCase() === String(faction || '').toLowerCase();
      });
      if (!pool.length) {
        pool = FALLBACK_CATALOG.filter(function (item) {
          return String(item.faction || '').toLowerCase() === String(faction || '').toLowerCase();
        });
      }
      var prev = Array.isArray(existingList) ? existingList : [];
      var out = [];
      for (var i = 0; i < 5; i++) {
        var catItem = pool[i % pool.length] || FALLBACK_CATALOG[i % FALLBACK_CATALOG.length];
        var oldItem = prev[i] || {};
        var approved = Boolean(oldItem.masterApproved);
        var claimed = Boolean(oldItem.playerClaimedDone !== undefined ? oldItem.playerClaimedDone : oldItem.done);
        out.push({
          slot: i + 1,
          id: catItem.id || ('M' + (i + 1)),
          title: oldItem.title && oldItem.customAssigned ? oldItem.title : (catItem.title || ('Missione ' + (i + 1))),
          type: oldItem.type && oldItem.customAssigned ? oldItem.type : (catItem.type || 'Verbale'),
          repeatable: oldItem.customAssigned ? Boolean(oldItem.repeatable) : Boolean(catItem.repeatable),
          points: Number(catItem.points || 1),
          desc: oldItem.desc && oldItem.customAssigned ? oldItem.desc : (catItem.desc || catItem.description || ''),
          customAssigned: Boolean(oldItem.customAssigned),
          playerClaimedDone: claimed,
          masterApproved: approved,
          done: approved || claimed
        });
      }
      return out;
    }

    function recomputePlayerPoints(key, list) {
      var approvedCount = (list || []).filter(function (m) { return Boolean(m.masterApproved); }).length;
      state.playerPoints[key] = approvedCount;
    }

    function applyRoomSnapshot(data) {
      if (!data || typeof data !== 'object') return;

      if (typeof data.phaseIndex === 'number') {
        state.phaseIndex = Math.max(0, Math.min(GAME_PHASES.length - 1, Number(data.phaseIndex)));
      }
      if (typeof data.cycleCount === 'number') {
        state.cycleCount = Math.max(1, Number(data.cycleCount));
      }

      if (data.playerSelfies && typeof data.playerSelfies === 'object') {
        state.playerSelfies = Object.assign({}, data.playerSelfies);
      }

      if (Array.isArray(data.players)) {
        state.players = data.players.filter(function (p) {
          return p && p.name && !isMasterAccountName(p.name) && p.isMaster !== true;
        });
      }

      (state.eliminatedPlayers || []).forEach(function (elimName) {
        purgeEliminatedPlayerFromState(elimName);
      });
      (state.players || []).forEach(function (p) {
        if (isPlayerEliminated(p.name)) {
          purgeEliminatedPlayerFromState(p.name);
        }
      });

      if (data.missionAssignments && typeof data.missionAssignments === 'object') {
        state.missionAssignments = Object.assign({}, data.missionAssignments);
      }
      if (data.playerPoints && typeof data.playerPoints === 'object') {
        state.playerPoints = Object.assign({}, data.playerPoints);
      }

      state.shieldedPlayers = Array.isArray(data.shieldedPlayers) ? data.shieldedPlayers.slice() : [];
      state.martyrShieldedPlayers = Array.isArray(data.martyrShieldedPlayers) ? data.martyrShieldedPlayers.slice() : [];
      state.sabotagedPlayers = Array.isArray(data.sabotagedPlayers) ? data.sabotagedPlayers.slice() : [];
      state.eliminatedPlayers = Array.isArray(data.eliminatedPlayers) ? data.eliminatedPlayers.slice() : [];

      if (typeof data.ovalActive === 'boolean') state.ovalActive = data.ovalActive;
      if (typeof data.ovalRoundCount === 'number') state.ovalRoundCount = Number(data.ovalRoundCount);

      if (typeof data.tvMode === 'string') state.tvMode = data.tvMode;
      if (typeof data.tvKillTarget === 'string') state.tvKillTarget = data.tvKillTarget;
      if (typeof data.tvExileTarget === 'string') state.tvExileTarget = data.tvExileTarget;
      if (typeof data.tvVideoPaused === 'boolean') state.tvVideoPaused = data.tvVideoPaused;
      if (typeof data.tvRevealTick === 'number') state.tvRevealTick = Number(data.tvRevealTick);

      if (Array.isArray(data.masterChat)) state.masterChat = data.masterChat.slice();

      if (!state.selectedPlayerForMissions && state.players.length > 0) {
        state.selectedPlayerForMissions = state.players[0].name;
      }
      if (!directTargetName && state.players.length > 0) {
        directTargetName = state.players[0].name;
      }

      saveLocal();
    }

    function saveLocal() {
      try {
        var raw = localStorage.getItem(ROOM_PREFIX + state.roomCode);
        var cur = raw ? JSON.parse(raw) : { roomCode: state.roomCode };
        cur.roomCode = state.roomCode;
        cur.players = state.players;
        cur.playerSelfies = state.playerSelfies;
        cur.missionAssignments = state.missionAssignments;
        cur.playerPoints = state.playerPoints;
        cur.shieldedPlayers = state.shieldedPlayers;
        cur.martyrShieldedPlayers = state.martyrShieldedPlayers;
        cur.sabotagedPlayers = state.sabotagedPlayers;
        cur.eliminatedPlayers = state.eliminatedPlayers;
        cur.phaseIndex = state.phaseIndex;
        cur.cycleCount = state.cycleCount;
        cur.ovalActive = state.ovalActive;
        cur.ovalRoundCount = state.ovalRoundCount;
        cur.tvMode = state.tvMode;
        cur.tvKillTarget = state.tvKillTarget;
        cur.tvExileTarget = state.tvExileTarget;
        cur.tvVideoPaused = state.tvVideoPaused;
        cur.tvRevealTick = state.tvRevealTick;
        cur.masterChat = state.masterChat;
        cur.updatedAt = Date.now();
        localStorage.setItem(ROOM_PREFIX + state.roomCode, JSON.stringify(cur));
      } catch (_e) {}
    }

    async function pushRoomUpdate(extra) {
      saveLocal();
      var ref = getRoomRef();
      if (!ref) return;
      try {
        await setDoc(ref, Object.assign({
          roomCode: state.roomCode,
          players: state.players,
          playerSelfies: state.playerSelfies,
          missionAssignments: state.missionAssignments,
          playerPoints: state.playerPoints,
          shieldedPlayers: state.shieldedPlayers,
          martyrShieldedPlayers: state.martyrShieldedPlayers,
          sabotagedPlayers: state.sabotagedPlayers,
          eliminatedPlayers: state.eliminatedPlayers,
          phaseIndex: state.phaseIndex,
          cycleCount: state.cycleCount,
          ovalActive: state.ovalActive,
          ovalRoundCount: state.ovalRoundCount,
          tvMode: state.tvMode,
          tvKillTarget: state.tvKillTarget,
          tvExileTarget: state.tvExileTarget,
          tvVideoPaused: state.tvVideoPaused,
          tvRevealTick: state.tvRevealTick,
          masterChat: state.masterChat,
          updatedAt: Date.now()
        }, extra || {}), { merge: true });
        state.syncStatus = 'Cloud Firestore attivo';
      } catch (_e) {
        state.syncStatus = 'Locale (controlla regole Firestore)';
      }
    }

    function getPlayerAvatar(name) {
      var k = nameKeyOf(name);
      if (k && state.playerSelfies && isValidAvatarSrc(state.playerSelfies[k])) return state.playerSelfies[k];
      var found = (state.players || []).find(function (p) { return nameKeyOf(p.name) === k; });
      if (found && isValidAvatarSrc(found.selfie || found.selfieDataUrl)) return found.selfie || found.selfieDataUrl;
      return '';
    }

    window.setNewPlayerName = function (val) { state.newPlayerName = String(val || ''); };

    window.addPlayerToRoom = async function () {
      var inp = document.getElementById('master-new-player-input');
      var clean = String((inp ? inp.value : state.newPlayerName) || '').trim();
      if (!clean) {
        state.banner = { text: 'Inserisci un nome giocatore valido.', type: 'error' };
        render();
        return;
      }
      var k = nameKeyOf(clean);
      var exists = state.players.some(function (p) { return nameKeyOf(p.name) === k; });
      if (exists) {
        state.banner = { text: 'Il giocatore "' + clean + '" è già presente nella stanza.', type: 'info' };
        render();
        return;
      }
      state.players.push({
        id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        name: clean,
        boardUnlocked: true,
        assignedRoleKey: null,
        eliminated: false,
        alive: true,
        joinedAt: Date.now()
      });
      if (!state.selectedPlayerForMissions) state.selectedPlayerForMissions = clean;
      if (!directTargetName) directTargetName = clean;
      state.newPlayerName = '';
      if (inp) inp.value = '';
      state.banner = { text: 'Giocatore "' + clean + '" aggiunto alla stanza ' + state.roomCode + '.', type: 'success' };
      await pushRoomUpdate();
      render();
    };

    window.removePlayerFromRoom = async function (playerName) {
      var k = nameKeyOf(playerName);
      state.players = state.players.filter(function (p) { return nameKeyOf(p.name) !== k; });
      state.eliminatedPlayers = state.eliminatedPlayers.filter(function (n) { return nameKeyOf(n) !== k; });
      state.shieldedPlayers = state.shieldedPlayers.filter(function (n) { return nameKeyOf(n) !== k; });
      state.martyrShieldedPlayers = state.martyrShieldedPlayers.filter(function (n) { return nameKeyOf(n) !== k; });
      state.sabotagedPlayers = state.sabotagedPlayers.filter(function (n) { return nameKeyOf(n) !== k; });
      if (nameKeyOf(state.selectedPlayerForMissions) === k) {
        state.selectedPlayerForMissions = state.players[0] ? state.players[0].name : '';
      }
      if (nameKeyOf(directTargetName) === k) {
        directTargetName = state.players[0] ? state.players[0].name : '';
      }
      state.banner = { text: 'Giocatore "' + playerName + '" rimosso dalla stanza.', type: 'info' };
      await pushRoomUpdate();
      render();
    };

    window.assignRoleToPlayer = async function (playerName, roleKey) {
      var k = nameKeyOf(playerName);
      var idx = state.players.findIndex(function (p) { return nameKeyOf(p.name) === k; });
      if (idx === -1) return;
      var normalizedRole = roleKey && ROLE_DETAILS[roleKey] ? roleKey : null;
      state.players[idx].assignedRoleKey = normalizedRole;

      if (normalizedRole) {
        var rInfo = ROLE_DETAILS[normalizedRole];
        var existingM = state.missionAssignments[k] || [];
        var built = buildFiveMissionsForFaction(rInfo.faction, existingM);
        state.missionAssignments[k] = built;
        recomputePlayerPoints(k, built);
      }

      state.banner = {
        text: normalizedRole
          ? ('Ruolo "' + ROLE_DETAILS[normalizedRole].name + '" assegnato a ' + state.players[idx].name + '.')
          : ('Ruolo rimosso a ' + state.players[idx].name + '.'),
        type: 'success'
      };
      await pushRoomUpdate();
      render();
    };

    window.toggleEliminatePlayer = async function (playerName) {
      var k = nameKeyOf(playerName);
      var idx = state.players.findIndex(function (p) { return nameKeyOf(p.name) === k; });
      if (idx === -1) return;
      var currentlyElim = isPlayerEliminated(playerName);
      var nextElim = !currentlyElim;
      state.players[idx].eliminated = nextElim;
      state.players[idx].alive = !nextElim;
      state.players[idx].status = nextElim ? 'eliminated' : 'alive';
      if (nextElim) {
        if (!state.eliminatedPlayers.some(function (n) { return nameKeyOf(n) === k; })) {
          state.eliminatedPlayers.push(state.players[idx].name);
        }
        purgeEliminatedPlayerFromState(state.players[idx].name);
      } else {
        state.eliminatedPlayers = state.eliminatedPlayers.filter(function (n) { return nameKeyOf(n) !== k; });
      }
      state.banner = {
        text: nextElim
          ? ('Giocatore "' + state.players[idx].name + '" segnato come eliminato.')
          : ('Giocatore "' + state.players[idx].name + '" riportato in gioco.'),
        type: 'info'
      };
      await pushRoomUpdate();
      render();
    };

    window.selectPlayerForMissions = function (playerName) {
      state.selectedPlayerForMissions = String(playerName || '');
      render();
    };

    window.assignCatalogMissionToSlot = async function (playerName, slotIdx, catalogId) {
      var k = nameKeyOf(playerName);
      var pObj = state.players.find(function (p) { return nameKeyOf(p.name) === k; });
      var rObj = pObj && pObj.assignedRoleKey ? ROLE_DETAILS[pObj.assignedRoleKey] : null;
      var faction = rObj ? rObj.faction : 'Fedeli';
      var list = buildFiveMissionsForFaction(faction, state.missionAssignments[k] || []);
      var cat = state.catalog.find(function (c) { return String(c.id) === String(catalogId); });
      if (cat && list[slotIdx]) {
        list[slotIdx] = Object.assign({}, list[slotIdx], {
          id: cat.id,
          title: cat.title,
          type: cat.type || 'Verbale',
          repeatable: Boolean(cat.repeatable),
          points: Number(cat.points || 1),
          desc: cat.desc || cat.description || '',
          customAssigned: true
        });
      }
      state.missionAssignments[k] = list;
      recomputePlayerPoints(k, list);
      state.banner = { text: 'Missione assegnata a ' + (pObj ? pObj.name : playerName) + ' (Slot ' + (slotIdx + 1) + ').', type: 'success' };
      await pushRoomUpdate();
      render();
    };

    window.toggleApproveMission = async function (playerName, slotIdx) {
      var k = nameKeyOf(playerName);
      var pObj = state.players.find(function (p) { return nameKeyOf(p.name) === k; });
      var rObj = pObj && pObj.assignedRoleKey ? ROLE_DETAILS[pObj.assignedRoleKey] : null;
      var faction = rObj ? rObj.faction : 'Fedeli';
      var list = buildFiveMissionsForFaction(faction, state.missionAssignments[k] || []);
      if (!list[slotIdx]) return;
      list[slotIdx].masterApproved = !list[slotIdx].masterApproved;
      list[slotIdx].done = list[slotIdx].masterApproved || list[slotIdx].playerClaimedDone;
      state.missionAssignments[k] = list;
      recomputePlayerPoints(k, list);
      state.banner = {
        text: list[slotIdx].masterApproved
          ? ('Missione "' + list[slotIdx].title + '" confermata per ' + (pObj ? pObj.name : playerName) + ' (+1 punto).')
          : ('Conferma rimossa per "' + list[slotIdx].title + '".'),
        type: 'success'
      };
      await pushRoomUpdate();
      render();
    };

    window.adjustPlayerPoints = async function (playerName, delta) {
      var k = nameKeyOf(playerName);
      if (!k) return;
      var cur = Number(state.playerPoints[k] || 0);
      state.playerPoints[k] = Math.max(0, cur + Number(delta || 0));
      state.banner = { text: 'Punti di ' + playerName + ' aggiornati a ' + state.playerPoints[k] + '.', type: 'info' };
      await pushRoomUpdate();
      render();
    };

    window.masterSetPhase = async function (idx) {
      var clamped = Math.max(0, Math.min(GAME_PHASES.length - 1, Number(idx || 0)));
      state.phaseIndex = clamped;
      state.banner = { text: 'Fase impostata su: ' + GAME_PHASES[clamped].step + '. ' + GAME_PHASES[clamped].title, type: 'info' };
      await pushRoomUpdate();
      render();
    };

    window.masterNextPhase = async function () {
      if (state.phaseIndex < GAME_PHASES.length - 1) {
        state.phaseIndex += 1;
      } else {
        state.phaseIndex = 0;
        state.cycleCount = Number(state.cycleCount || 1) + 1;
      }
      state.banner = { text: 'Fase avanzata: ' + GAME_PHASES[state.phaseIndex].step + '. ' + GAME_PHASES[state.phaseIndex].title + ' (Ciclo #' + state.cycleCount + ').', type: 'info' };
      await pushRoomUpdate();
      render();
    };

    window.masterToggleOvalSession = async function (open) {
      var isOpen = Boolean(open);
      state.ovalActive = isOpen;
      if (isOpen) {
        state.phaseIndex = 5;
        state.ovalRoundCount = Number(state.ovalRoundCount || 0) + 1;
      }
      state.banner = {
        text: isOpen
          ? 'Tavolo Ovale APERTO: i giocatori vengono reindirizzati a tavola-ovale.html (il Master non partecipa al voto).'
          : 'Tavolo Ovale CHIUSO: i giocatori tornano alle rispettive schede.',
        type: isOpen ? 'success' : 'info'
      };
      await pushRoomUpdate({
        ovalActive: state.ovalActive,
        ovalSessionActive: state.ovalActive,
        ovalTableOpen: state.ovalActive,
        ovalRedirectUrl: 'tavola-ovale.html',
        phaseIndex: state.phaseIndex,
        ovalRoundCount: state.ovalRoundCount
      });
      render();
    };

    window.setTvKillTarget = function (v) { state.tvKillTarget = String(v || ''); };
    window.setTvExileTarget = function (v) { state.tvExileTarget = String(v || ''); };

    window.masterTriggerTvScene = async function (mode) {
      var cleanMode = String(mode || 'idle');
      if (cleanMode === 'kill' && !state.tvKillTarget && state.players.length > 0) {
        state.tvKillTarget = state.players[0].name;
      }
      if (cleanMode === 'exile' && !state.tvExileTarget && state.players.length > 0) {
        state.tvExileTarget = state.players[0].name;
      }
      state.tvMode = cleanMode;
      state.tvVideoPaused = false;
      state.tvRevealTick = Number(state.tvRevealTick || 0) + 1;

      if (cleanMode === 'kill' && state.tvKillTarget) {
        var killKey = nameKeyOf(state.tvKillTarget);
        var killIdx = state.players.findIndex(function (p) { return nameKeyOf(p.name) === killKey; });
        if (killIdx !== -1) {
          state.players[killIdx].eliminated = true;
          state.players[killIdx].alive = false;
          state.players[killIdx].status = 'eliminated';
        }
        if (!state.eliminatedPlayers.some(function (n) { return nameKeyOf(n) === killKey; })) {
          state.eliminatedPlayers.push(state.tvKillTarget);
        }
        purgeEliminatedPlayerFromState(state.tvKillTarget);
      }

      if (cleanMode === 'exile' && state.tvExileTarget) {
        var exKey = nameKeyOf(state.tvExileTarget);
        var exIdx = state.players.findIndex(function (p) { return nameKeyOf(p.name) === exKey; });
        if (exIdx !== -1) {
          state.players[exIdx].eliminated = true;
          state.players[exIdx].alive = false;
          state.players[exIdx].status = 'eliminated';
        }
        if (!state.eliminatedPlayers.some(function (n) { return nameKeyOf(n) === exKey; })) {
          state.eliminatedPlayers.push(state.tvExileTarget);
        }
        purgeEliminatedPlayerFromState(state.tvExileTarget);
      }

      state.banner = {
        text: cleanMode === 'idle'
          ? 'Trasmissione TV riportata in standby.'
          : ('Scena TV "' + cleanMode + '" inviata a TV e schede giocatore (Tick #' + state.tvRevealTick + ').'),
        type: 'success'
      };
      await pushRoomUpdate({
        tvMode: state.tvMode,
        tvKillTarget: state.tvKillTarget,
        tvExileTarget: state.tvExileTarget,
        tvVideoPaused: state.tvVideoPaused,
        tvRevealTick: state.tvRevealTick,
        players: state.players,
        eliminatedPlayers: state.eliminatedPlayers
      });
      render();
    };

    window.masterToggleTvPause = async function () {
      state.tvVideoPaused = !state.tvVideoPaused;
      state.tvRevealTick = Number(state.tvRevealTick || 0) + 1;
      await pushRoomUpdate({
        tvVideoPaused: state.tvVideoPaused,
        tvRevealTick: state.tvRevealTick
      });
      render();
    };

    window.setCeremonyStep = function (idx) {

      render();

      state.ceremonyRoleKey = rk && ROLE_DETAILS[rk] ? rk : 'assassino';
      render();
    };

    window.setDirectTargetName = function (v) { directTargetName = String(v || ''); };

    window.sendMasterMessage = async function (onlyTraitorSecret) {
      var inp = document.getElementById('master-chat-input');
      var txt = String((inp ? inp.value : masterChatDraft) || '').trim();
      if (!txt) return;
      var target = onlyTraitorSecret ? '' : (directTargetName || '');
      var prefix = onlyTraitorSecret ? '[TRADITORE SEGRETO] ' : (target ? ('[A ' + target + '] ') : '[MASTER] ');
      state.masterChat = state.masterChat.concat([{
        id: 'mc_' + Date.now(),
        fromMaster: true,
        senderName: state.masterName || 'Master',
        playerName: target,
        text: prefix + txt,
        createdAt: Date.now()
      }]).slice(-150);
      masterChatDraft = '';
      if (inp) inp.value = '';
      await pushRoomUpdate();
      render();

    };

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeJsSingle(value) {
      return escapeHtml(value).replace(/\\/g, '\\\\').replace(/'/g, '&#39;');
    }

    function renderAvatarSm(name) {
      var src = getPlayerAvatar(name);
      if (isValidAvatarSrc(src)) {
        return '<img src="' + escapeHtml(src) + '" alt="' + escapeHtml(name) + '" class="avatar-sm" />';
      }
      return '<div class="avatar-sm">' + escapeHtml(String(name || 'G').slice(0, 1).toUpperCase()) + '</div>';
    }

    function renderCeremonySection() {
      var steps = [
        '1. Apertura e Silenzio',
        '2. Chiamata Ruolo & Risposta',
        '3. Conferma Schede Private',
        '4. Chiusura Cerimonia'
      ];
      var activeRole = ROLE_DETAILS[state.ceremonyRoleKey] || ROLE_DETAILS.assassino;

      }).join('');

          '<div class="header-row">' +
            '<div><span class="eyebrow">Guida del Master</span><h2>Cerimonia dei Ruoli</h2></div>' +

              '<div class="grid-2" style="margin-top:12px;">' +
                '<div><label class="subtext" style="display:block;margin-bottom:4px;">Ruolo da richiamare</label><select onchange="setCeremonyRole(this.value)">' + roleOpts + '</select></div>' +
                '<div><span class="subtext" style="display:block;margin-bottom:6px;">Giocatori assegnati (visibile solo al Master)</span><div class="btn-row">' + holderHtml + '</div></div>' +

            '</div>' +
          '</div>' +

            '<div class="btn-row" style="min-width:260px;">' +
              '<input id="master-new-player-input" type="text" value="' + escapeHtml(state.newPlayerName) + '" oninput="setNewPlayerName(this.value)" onkeydown="if(event.key===&#39;Enter&#39;){event.preventDefault();addPlayerToRoom();}" placeholder="Nome nuovo giocatore..." style="width:auto;flex:1;" />' +
              '<button type="button" class="btn-gold" onclick="addPlayerToRoom()">Aggiungi</button>' +
            '</div>' +
          '</div>' +
          '<div class="player-list">' + rowsHtml + '</div>' +
        '</section>'
      );
    }

    function renderMissionsManagerSection() {
      var activePlayersList = getActivePlayers();
      var selectedPlayer = activePlayersList.find(function (p) {
        return nameKeyOf(p.name) === nameKeyOf(state.selectedPlayerForMissions);
      }) || activePlayersList[0] || null;

      var playerOpts = activePlayersList.map(function (p) {
        var sel = selectedPlayer && nameKeyOf(p.name) === nameKeyOf(selectedPlayer.name) ? ' selected' : '';
        return '<option value="' + escapeHtml(p.name) + '"' + sel + '>' + escapeHtml(p.name) + '</option>';
      }).join('');

      var bodyHtml = '';
      if (!selectedPlayer) {
        bodyHtml = '<p class="subtext" style="margin-top:10px;">Nessun giocatore attivo disponibile (i giocatori eliminati o esiliati sono esclusi da missioni e conteggi).</p>';
      } else {
        var k = nameKeyOf(selectedPlayer.name);
        var rObj = selectedPlayer.assignedRoleKey ? ROLE_DETAILS[selectedPlayer.assignedRoleKey] : null;
        var faction = rObj ? rObj.faction : 'Fedeli';
        var missions = buildFiveMissionsForFaction(faction, state.missionAssignments[k] || []);
        var safePName = escapeJsSingle(selectedPlayer.name);

        var itemsHtml = missions.map(function (m, idx) {
          var catOpts = state.catalog.map(function (c) {
            var sel = String(c.id) === String(m.id) ? ' selected' : '';
            return '<option value="' + escapeHtml(c.id) + '"' + sel + '>[' + escapeHtml(c.faction) + '] ' + escapeHtml(c.title) + '</option>';
          }).join('');

          var claimedBadge = m.playerClaimedDone
            ? '<span class="badge badge-Neutro">Segnalata dal Giocatore</span>'
            : '<span class="badge badge-Muted">Non segnalata</span>';
          var approvedBadge = m.masterApproved
            ? '<span class="badge badge-Fedeli">Confermata ✓</span>'
            : '<span class="badge badge-Muted">Da confermare</span>';

          return (
            '<div class="mission-item">' +
              '<div style="flex:1;min-width:240px;">' +
                '<div style="font-size:14px;font-weight:700;color:#fff;">' + m.slot + '. ' + escapeHtml(m.title) + ' <span class="subtext">(' + escapeHtml(m.type) + ')</span></div>' +
                '<div class="subtext">' + escapeHtml(m.desc) + '</div>' +
                '<div class="btn-row" style="margin-top:6px;">' + claimedBadge + approvedBadge + '</div>' +
              '</div>' +
              '<div class="btn-row">' +
                '<select style="width:auto;max-width:250px;" onchange="assignCatalogMissionToSlot(&#39;' + safePName + '&#39;, ' + idx + ', this.value)">' + catOpts + '</select>' +
                '<button type="button" class="' + (m.masterApproved ? 'btn-emerald' : 'btn-gold') + '" onclick="toggleApproveMission(&#39;' + safePName + '&#39;, ' + idx + ')">' + (m.masterApproved ? 'Confermata ✓' : 'Conferma (+1 Pt)') + '</button>' +
              '</div>' +
            '</div>'
          );
        }).join('');

        bodyHtml =
          '<div class="mission-box">' +
            '<div class="header-row">' +
              '<div><strong>Missioni di ' + escapeHtml(selectedPlayer.name) + '</strong> <span class="subtext">(' + escapeHtml(faction) + ')</span></div>' +
              '<span class="badge badge-Indigo">Punti Confermati: ' + Number(state.playerPoints[k] || 0) + '</span>' +
            '</div>' +
            itemsHtml +
          '</div>';
      }

      return (
        '<section class="card">' +
          '<div class="header-row">' +
            '<div><span class="eyebrow">Catalogo & Verifica</span><h2>Assegnazione e Approvazione Missioni</h2></div>' +
            (state.players.length
              ? '<select style="width:auto;min-width:210px;" onchange="selectPlayerForMissions(this.value)">' + playerOpts + '</select>'
              : '') +
          '</div>' +
          bodyHtml +
        '</section>'
      );
    }

    function renderStageAndTvSection() {
      var curPhase = GAME_PHASES[state.phaseIndex] || GAME_PHASES[0];
      var phaseBtns = GAME_PHASES.map(function (ph, idx) {
        return '<button type="button" class="' + (state.phaseIndex === idx ? 'btn-indigo' : 'btn-ghost') + '" onclick="masterSetPhase(' + idx + ')">' + ph.step + '. ' + escapeHtml(ph.title) + '</button>';
      }).join('');

      var activeForTargets = getActivePlayers();
      var targetOpts = activeForTargets.map(function (p) {
        return '<option value="' + escapeHtml(p.name) + '">' + escapeHtml(p.name) + '</option>';
      }).join('');

      return (
        '<section class="card card-indigo">' +
          '<div class="header-row">' +
            '<div>' +
              '<span class="eyebrow eyebrow-indigo">Regia Fasi · Tavolo Ovale · TV</span>' +
              '<h2>Fase Corrente: ' + curPhase.step + '. ' + escapeHtml(curPhase.title) + ' (Ciclo #' + state.cycleCount + ')</h2>' +
              '<p class="subtext">Nota: al Tavolo Ovale il <strong>Master non vota</strong>; coordina discussione, esito e regia TV.</p>' +
            '</div>' +
            '<div class="btn-row">' +
              '<button type="button" class="btn-indigo" onclick="masterNextPhase()">Fase Successiva →</button>' +
              '<button type="button" class="btn-gold" onclick="openTvScreen()">Apri Schermo TV</button>' +
              '<button type="button" class="btn-ghost" onclick="openOvalMonitor()">Monitor Tavolo Ovale</button>' +
            '</div>' +
          '</div>' +

          '<div class="btn-row" style="margin-top:12px;">' + phaseBtns + '</div>' +

          '<div class="mission-box" style="margin-top:14px;">' +
            '<div class="header-row">' +
              '<div><strong>Controllo Tavolo Ovale (Senza Voto Master)</strong><div class="subtext">Stato attuale: <strong>' + (state.ovalActive ? 'APERTO' : 'CHIUSO') + '</strong> · Giri svolti: ' + state.ovalRoundCount + '</div></div>' +
              '<div class="btn-row">' +
                '<button type="button" class="btn-emerald" onclick="masterToggleOvalSession(true)">Apri Tavolo Ovale</button>' +
                '<button type="button" class="btn-crimson" onclick="masterToggleOvalSession(false)">Chiudi Tavolo Ovale</button>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<div class="mission-box" style="margin-top:12px;">' +
            '<strong>Regia Video & Scene TV (TV + Schede Giocatore)</strong>' +
            '<div class="grid-2">' +
              '<div><label class="subtext" style="display:block;margin-bottom:4px;">Protagonista Eliminazione Notte</label><select onchange="setTvKillTarget(this.value)">' + (targetOpts || '<option value="">-- Nessun giocatore --</option>') + '</select></div>' +
              '<div><label class="subtext" style="display:block;margin-bottom:4px;">Protagonista Esilio Tavolo Ovale</label><select onchange="setTvExileTarget(this.value)">' + (targetOpts || '<option value="">-- Nessun giocatore --</option>') + '</select></div>' +
            '</div>' +
            '<div class="btn-row">' +
              '<button type="button" class="btn-gold" onclick="masterTriggerTvScene(&#39;intro&#39;)">Video Ingresso</button>' +
              '<button type="button" class="btn-crimson" onclick="masterTriggerTvScene(&#39;kill&#39;)">Video Eliminazione</button>' +
              '<button type="button" class="btn-gold" onclick="masterTriggerTvScene(&#39;exile&#39;)">Video Esilio</button>' +
              '<button type="button" class="btn-emerald" onclick="masterTriggerTvScene(&#39;win_fedeli&#39;)">Vittoria Fedeli</button>' +
              '<button type="button" class="btn-crimson" onclick="masterTriggerTvScene(&#39;win_traditori&#39;)">Vittoria Traditori</button>' +
              '<button type="button" class="btn-indigo" onclick="masterTriggerTvScene(&#39;win_solitario&#39;)">Vittoria Cacciatore</button>' +
              '<button type="button" class="btn-ghost" onclick="masterToggleTvPause()">' + (state.tvVideoPaused ? 'Riprendi Video' : 'Pausa Video') + '</button>' +
              '<button type="button" class="btn-ghost" onclick="masterTriggerTvScene(&#39;idle&#39;)">Chiudi / Standby TV</button>' +
            '</div>' +
          '</div>' +
        '</section>'
      );
    }

    function renderChatSection() {
      var targetOpts = '<option value="">Tutti i giocatori attivi / Generale</option>' + getActivePlayers().map(function (p) {
        var sel = nameKeyOf(directTargetName) === nameKeyOf(p.name) ? ' selected' : '';
        return '<option value="' + escapeHtml(p.name) + '"' + sel + '>Diretto a ' + escapeHtml(p.name) + '</option>';
      }).join('');

      var msgsHtml = state.masterChat.length
        ? state.masterChat.slice().reverse().map(function (m) {
            return (
              '<div class="msg-card">' +
                '<div class="msg-head"><strong>' + escapeHtml(m.senderName || (m.fromMaster ? 'Master' : 'Giocatore')) + '</strong><span>' + escapeHtml(m.playerName ? ('-> ' + m.playerName) : 'Stanza') + '</span></div>' +
                '<p class="msg-body">' + escapeHtml(m.text) + '</p>' +
              '</div>'
            );
          }).join('')
        : '<p class="subtext">Nessun messaggio o segnalazione ancora ricevuta.</p>';

      return (
        '<section class="card">' +
          '<div class="header-row">' +
            '<div><span class="eyebrow">Comunicazioni Segrete</span><h2>Chat Diretta e Notifiche Giocatori</h2></div>' +
            '<select style="width:auto;min-width:210px;" onchange="setDirectTargetName(this.value)">' + targetOpts + '</select>' +
          '</div>' +
          '<div class="chat-box">' + msgsHtml + '</div>' +
          '<div class="chat-form">' +
            '<input id="master-chat-input" type="text" value="' + escapeHtml(masterChatDraft) + '" oninput="updateMasterChatDraft(this.value)" onkeydown="if(event.key===&#39;Enter&#39;){event.preventDefault();sendMasterMessage(false);}" placeholder="Scrivi un messaggio al giocatore o alla stanza..." />' +
            '<button type="button" class="btn-gold" onclick="sendMasterMessage(false)">Invia</button>' +
            '<button type="button" class="btn-crimson" onclick="sendMasterMessage(true)">Nota Traditore Segreto</button>' +
          '</div>' +
        '</section>'
      );
    }

    function render() {
      var root = document.getElementById('master-console-app');
      if (!root) return;

      var bannerHtml = state.banner
        ? '<div class="banner banner-' + state.banner.type + '">' + escapeHtml(state.banner.text) + '</div>'
        : '';

      root.innerHTML =
        '<header class="card">' +
          '<div class="header-row">' +
            '<div>' +
              '<span class="eyebrow">Console Regia Master · ' + escapeHtml(state.syncStatus) + '</span>' +
              '<h1>Ombre al Tavolo — ' + escapeHtml(state.masterName) + '</h1>' +
              '<p class="subtext">Stanza: <strong>' + escapeHtml(state.roomCode) + '</strong> · ID Sync: <strong class="mono">SYNC-' + escapeHtml(state.roomCode) + '</strong> · Giocatori attivi: <strong>' + state.players.filter(function (p) { return !isPlayerEliminated(p.name); }).length + '</strong> / ' + state.players.length + '</p>' +
            '</div>' +
            '<div class="btn-row">' +
              '<button type="button" class="btn-gold" onclick="goToRolesPage()">Compendio Ruoli</button>' +
              '<button type="button" class="btn-ghost" onclick="goToAccessPage()">Cambia Stanza</button>' +
            '</div>' +
          '</div>' +
        '</header>' +
        bannerHtml +
        renderStageAndTvSection() +
        renderCeremonySection() +
        renderPlayersAndRolesSection() +
        renderMissionsManagerSection() +
        renderChatSection();
    }

    async function loadMissionCatalog() {
      try {
        var res = await fetch(MISSION_CATALOG_URL, { cache: 'no-store' });
        if (!res.ok) return;
        var json = await res.json();
        var list = Array.isArray(json) ? json : (Array.isArray(json.missions) ? json.missions : []);
        if (list.length > 0) {
          state.catalog = list.map(function (item, idx) {
            return {
              id: item.id || ('CAT-' + (idx + 1)),
              faction: item.faction || 'Fedeli',
              title: item.title || item.name || ('Missione ' + (idx + 1)),
              type: item.type || 'Verbale',
              repeatable: Boolean(item.repeatable),
              points: Number(item.points || 1),
              desc: item.desc || item.description || ''
            };
          });
          render();
        }
      } catch (_e) {}
    }

    try {
      var initialRaw = localStorage.getItem(ROOM_PREFIX + state.roomCode);
      if (initialRaw) {
        applyRoomSnapshot(JSON.parse(initialRaw));
      }
    } catch (_e) {}

    render();
    loadMissionCatalog();

    var ref = getRoomRef();
    if (ref) {
      getDoc(ref).then(function (snap) {
        if (snap.exists()) {
          applyRoomSnapshot(snap.data() || {});
          render();
        }
      }).catch(function () {});

      onSnapshot(ref, function (snap) {
        state.syncStatus = 'Cloud Firestore attivo';
        if (!snap.exists()) return;
        applyRoomSnapshot(snap.data() || {});
        render();
      });
    }
  </script>
</body>
</html>
