<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ombre al Tavolo — Companion Giocatore e Master</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Cinzel', 'serif'],
          },
          colors: {
            bgdark: '#0c0e14',
            surface: '#151924',
            surface2: '#1d2230',
            gold: '#e5b85c',
            crimson: '#e05260',
            emerald: '#3ec98c',
            indigo: '#7c8cff',
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #0c0e14;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #121620;
    }
    ::-webkit-scrollbar-thumb {
      background: #2c344a;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen bg-bgdark text-gray-100 antialiased selection:bg-gold/30 selection:text-gold">
  <div id="app" class="min-h-screen flex flex-col"></div>

  <script>
    const STORAGE_KEY = 'ombre_al_tavolo_v4_clean';
    const TAB_SESSION_KEY = 'ombre_al_tavolo_tab_session_v1';
    const SYNC_CHANNEL_NAME = 'ombre_al_tavolo_sync_v1';
    const DEFAULT_ROOM_CODE = 'TAVOLO1';
    const SYNC_POLL_INTERVAL_MS = 2000;
    const SYNC_API_BASE = 'https://api.jsonbin.io/v3/b';
    const SYNC_PUBLIC_BUCKET_KEY = 'ombre_al_tavolo_cloud_bin_id_v1';

    // Definizione dei ruoli e relative regole
    const ROLE_DEFS = {
      investigatore: {
        name: 'Investigatore',
        faction: 'cittadini',
        factionLabel: 'Fazione Cittadini',
        badgeClass: 'bg-emerald/15 text-emerald border-emerald/40',
        powerName: 'Indagine Approfondita',
        powerDesc: 'Spendi 1 punto potere per scoprire il ruolo esatto di un giocatore vivo a tua scelta. Puoi usarlo più volte finché hai punti.',
        cost: 1,
        usesPerConfrontationLimit: null
      },
      guardia: {
        name: 'Guardia',
        faction: 'cittadini',
        factionLabel: 'Fazione Cittadini',
        badgeClass: 'bg-emerald/15 text-emerald border-emerald/40',
        powerName: 'Scudo Protettivo',
        powerDesc: 'Spendi 1 punto potere per proteggere un giocatore vivo (anche te stesso) dal prossimo attacco fino al prossimo turno. Puoi usarlo più volte finché hai punti.',
        cost: 1,
        usesPerConfrontationLimit: null
      },
      cacciatore: {
        name: 'Cacciatore',
        faction: 'cittadini',
        factionLabel: 'Fazione Cittadini',
        badgeClass: 'bg-emerald/15 text-emerald border-emerald/40',
        powerName: 'Colpo Mirato',
        powerDesc: 'Spendi 2 punti potere per eliminare un giocatore sospetto. Se colpisci un innocente, subisci contraccolpo.',
        cost: 2,
        usesPerConfrontationLimit: null
      },
      martire: {
        name: 'Martire',
        faction: 'cittadini',
        factionLabel: 'Fazione Cittadini',
        badgeClass: 'bg-emerald/15 text-emerald border-emerald/40',
        powerName: 'Ultima Testimonianza',
        powerDesc: 'Non hai missioni standard: quando vieni eliminato, puoi dichiarare pubblicamente un ruolo al tavolo prima di uscire.',
        cost: 0,
        usesPerConfrontationLimit: 1
      },
      assassino: {
        name: 'Assassino',
        faction: 'traditori',
        factionLabel: 'Fazione Traditori',
        badgeClass: 'bg-crimson/15 text-crimson border-crimson/40',
        powerName: 'Eliminazione Silenziosa',
        powerDesc: 'Spendi 2 punti potere per eliminare un giocatore vivo. Limite: massimo 1 uccisione prima di ogni confronto/votazione al tavolo.',
        cost: 2,
        usesPerConfrontationLimit: 1
      },
      sabotatore: {
        name: 'Sabotatore',
        faction: 'traditori',
        factionLabel: 'Fazione Traditori',
        badgeClass: 'bg-crimson/15 text-crimson border-crimson/40',
        powerName: 'Intralcio Notturno',
        powerDesc: 'Spendi 1 punto potere per bloccare l’azione/potere di un giocatore bersaglio nel turno corrente. Puoi usarlo più volte finché hai punti.',
        cost: 1,
        usesPerConfrontationLimit: null
      }
    };

    const PHASES = ['Esplorazione', 'Confronto al Tavolo', 'Votazione'];

    function buildMissionsForFaction(faction) {
      if (faction === 'traditori') {
        return [
          { id: 'm_rep_1', text: 'Semina un dubbio credibile su un Cittadino durante la discussione.', points: 1, repeatable: true, status: 'idle', approvedCount: 0 },
          { id: 'm_rep_2', text: 'Fai convergere almeno due voti su un bersaglio scelto dai Traditori.', points: 1, repeatable: true, status: 'idle', approvedCount: 0 },
          { id: 'm_rep_3', text: 'Ottieni fiducia o un’informazione riservata senza destare sospetti.', points: 1, repeatable: true, status: 'idle', approvedCount: 0 },
          { id: 'm_uni_1', text: 'Sopravvivi indenne fino al secondo Confronto al Tavolo.', points: 2, repeatable: false, status: 'idle', approvedCount: 0 },
          { id: 'm_uni_2', text: 'Induci un Cittadino a dichiarare un ruolo errato in pubblico.', points: 2, repeatable: false, status: 'idle', approvedCount: 0 }
        ];
      }

      return [
        { id: 'm_rep_1', text: 'Condividi un indizio utile o un’osservazione chiara con il tavolo.', points: 1, repeatable: true, status: 'idle', approvedCount: 0 },
        { id: 'm_rep_2', text: 'Confronta due versioni o testimonianze emerse durante il turno.', points: 1, repeatable: true, status: 'idle', approvedCount: 0 },
        { id: 'm_rep_3', text: 'Coordina una scelta difensiva o di voto con almeno un alleato.', points: 1, repeatable: true, status: 'idle', approvedCount: 0 },
        { id: 'm_uni_1', text: 'Individua un comportamento incoerente prima della Votazione.', points: 2, repeatable: false, status: 'idle', approvedCount: 0 },
        { id: 'm_uni_2', text: 'Proteggi un giocatore chiave durante una fase critica.', points: 2, repeatable: false, status: 'idle', approvedCount: 0 }
      ];
    }

    function createInitialState() {
      return {
        roomCode: DEFAULT_ROOM_CODE,
        lastUpdatedAt: 0,
        screen: 'entry',
        sessionRole: null,
        currentPlayerId: null,
        inspectingPlayerId: null,
        phase: 'Esplorazione',
        round: 1,
        players: [],
        logs: [],
        masterMessages: [],
        bannerMessage: null,
        winner: null
      };
    }

    let tabSession = loadTabSession();
    let state = null;
    let tempSelfieDataUrl = null;
    let cameraStream = null;
    let syncChannel = null;
    let syncPollTimer = null;
    let isRemoteApplying = false;

    function normalizeRoomCode(code) {
      const cleaned = String(code || '')
        .toUpperCase()
        .replace(/[^A-Z0-9_-]/g, '')
        .slice(0, 20);
      return cleaned || DEFAULT_ROOM_CODE;
    }

    function loadTabSession() {
      try {
        const raw = sessionStorage.getItem(TAB_SESSION_KEY);
        if (!raw) {
          return {
            roomCode: DEFAULT_ROOM_CODE,
            sessionRole: null,
            currentPlayerId: null,
            screen: 'entry'
          };
        }
        const parsed = JSON.parse(raw);
        return {
          roomCode: normalizeRoomCode(parsed.roomCode),
          sessionRole: parsed.sessionRole || null,
          currentPlayerId: parsed.currentPlayerId || null,
          screen: parsed.screen || 'entry'
        };
      } catch (err) {
        console.error('Errore lettura sessione scheda:', err);
        return {
          roomCode: DEFAULT_ROOM_CODE,
          sessionRole: null,
          currentPlayerId: null,
          screen: 'entry'
        };
      }
    }

    function saveTabSession() {
      try {
        sessionStorage.setItem(TAB_SESSION_KEY, JSON.stringify(tabSession));
      } catch (err) {
        console.error('Errore salvataggio sessione scheda:', err);
      }
    }

    function getRoomStorageKey(roomCode) {
      return `${STORAGE_KEY}_${normalizeRoomCode(roomCode)}`;
    }

    function getRoomCloudIdKey(roomCode) {
      return `${SYNC_PUBLIC_BUCKET_KEY}_${normalizeRoomCode(roomCode)}`;
    }

    function loadState() {
      const roomCode = normalizeRoomCode(tabSession.roomCode);
      try {
        const raw = localStorage.getItem(getRoomStorageKey(roomCode)) || localStorage.getItem(STORAGE_KEY);
        const base = createInitialState();
        base.roomCode = roomCode;
        let merged = base;
        if (raw) {
          const parsed = JSON.parse(raw);
          merged = { ...base, ...parsed, roomCode };
        }
        if (tabSession.sessionRole !== undefined) merged.sessionRole = tabSession.sessionRole;
        if (tabSession.currentPlayerId !== undefined) merged.currentPlayerId = tabSession.currentPlayerId;
        if (tabSession.screen) merged.screen = tabSession.screen;
        return merged;
      } catch (err) {
        console.error('Errore lettura stato:', err);
        const fallback = createInitialState();
        fallback.roomCode = roomCode;
        return fallback;
      }
    }

    function getSharedSnapshot() {
      return {
        roomCode: normalizeRoomCode(state.roomCode),
        lastUpdatedAt: Number(state.lastUpdatedAt || Date.now()),
        phase: state.phase,
        round: state.round,
        players: state.players,
        logs: state.logs,
        masterMessages: state.masterMessages,
        winner: state.winner
      };
    }

    function getCloudBinId(roomCode) {
      try {
        return localStorage.getItem(getRoomCloudIdKey(roomCode)) || null;
      } catch (err) {
        return null;
      }
    }

    function setCloudBinId(roomCode, binId) {
      if (!binId) return;
      try {
        localStorage.setItem(getRoomCloudIdKey(roomCode), String(binId));
      } catch (err) {
        // Ignora errori storage
      }
    }

    async function ensureCloudBinId(roomCode, snapshot) {
      const normalized = normalizeRoomCode(roomCode);
      const existing = getCloudBinId(normalized);
      if (existing) return existing;

      try {
        const res = await fetch(SYNC_API_BASE, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Bin-Name': `OmbreAlTavolo_${normalized}`
          },
          body: JSON.stringify({ roomCode: normalized, snapshot })
        });
        if (!res.ok) return null;
        const data = await res.json();
        const createdId = data && data.metadata && data.metadata.id ? data.metadata.id : null;
        if (createdId) {
          setCloudBinId(normalized, createdId);
          return createdId;
        }
      } catch (err) {
        // Silenzioso se offline o bloccato
      }
      return null;
    }

    async function pushRemoteSnapshot(snapshot) {
      const roomCode = normalizeRoomCode(snapshot.roomCode);
      try {
        const binId = await ensureCloudBinId(roomCode, snapshot);
        if (!binId) return;
        await fetch(`${SYNC_API_BASE}/${encodeURIComponent(binId)}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Bin-Versioning': 'false'
          },
          body: JSON.stringify({ roomCode, snapshot })
        });
      } catch (err) {
        // Silenzioso in caso di offline o blocco rete
      }
    }

    async function pullRemoteSnapshot() {
      if (isRemoteApplying || !state) return;
      const roomCode = normalizeRoomCode(state.roomCode);
      const binId = getCloudBinId(roomCode);
      if (!binId) return;

      try {
        const res = await fetch(`${SYNC_API_BASE}/${encodeURIComponent(binId)}/latest?_t=${Date.now()}`, {
          cache: 'no-store'
        });
        if (!res.ok) return;
        const data = await res.json();
        const remoteSnap = data && data.record && data.record.snapshot ? data.record.snapshot : null;
        if (!remoteSnap || typeof remoteSnap !== 'object') return;

        const remoteTs = Number(remoteSnap.lastUpdatedAt || 0);
        const localTs = Number(state.lastUpdatedAt || 0);
        if (remoteTs > localTs) {
          applySharedSnapshot(remoteSnap, { broadcast: false, pushRemote: false });
        }
      } catch (err) {
        // Ignora errori temporanei durante il polling
      }
    }

    function applySharedSnapshot(snapshot, options = { broadcast: false, pushRemote: false }) {
      if (!snapshot || typeof snapshot !== 'object' || !state) return;
      const snapRoom = normalizeRoomCode(snapshot.roomCode || state.roomCode);
      if (snapRoom !== normalizeRoomCode(state.roomCode)) return;

      const incomingTs = Number(snapshot.lastUpdatedAt || 0);
      const currentTs = Number(state.lastUpdatedAt || 0);
      if (incomingTs < currentTs && !options.force) return;

      isRemoteApplying = true;
      try {
        state = {
          ...state,
          roomCode: snapRoom,
          lastUpdatedAt: incomingTs || Date.now(),
          phase: snapshot.phase || state.phase,
          round: snapshot.round || state.round,
          players: Array.isArray(snapshot.players) ? snapshot.players : state.players,
          logs: Array.isArray(snapshot.logs) ? snapshot.logs : state.logs,
          masterMessages: Array.isArray(snapshot.masterMessages) ? snapshot.masterMessages : state.masterMessages,
          winner: snapshot.winner !== undefined ? snapshot.winner : state.winner
        };

        if (tabSession.sessionRole !== undefined) state.sessionRole = tabSession.sessionRole;
        if (tabSession.currentPlayerId !== undefined) state.currentPlayerId = tabSession.currentPlayerId;
        if (tabSession.screen) state.screen = tabSession.screen;

        localStorage.setItem(getRoomStorageKey(snapRoom), JSON.stringify(state));

        if (options.broadcast && syncChannel) {
          syncChannel.postMessage({
            type: 'snapshot',
            snapshot: getSharedSnapshot()
          });
        }
        if (options.pushRemote) {
          pushRemoteSnapshot(getSharedSnapshot());
        }

        render();
      } finally {
        isRemoteApplying = false;
      }
    }

    function saveState(options = { sync: true }) {
      if (!state) return;
      state.roomCode = normalizeRoomCode(state.roomCode);
      tabSession.roomCode = state.roomCode;
      tabSession.sessionRole = state.sessionRole;
      tabSession.currentPlayerId = state.currentPlayerId;
      tabSession.screen = state.screen;
      saveTabSession();

      if (options.sync !== false && !isRemoteApplying) {
        state.lastUpdatedAt = Date.now();
      }

      try {
        localStorage.setItem(getRoomStorageKey(state.roomCode), JSON.stringify(state));
        if (options.sync !== false && !isRemoteApplying) {
          const snapshot = getSharedSnapshot();
          if (syncChannel) {
            syncChannel.postMessage({ type: 'snapshot', snapshot });
          }
          pushRemoteSnapshot(snapshot);
        }
      } catch (err) {
        console.error('Errore salvataggio stato:', err);
      }
    }

    function exitSession() {
      stopCamera();
      tempSelfieDataUrl = null;
      const currentRoom = normalizeRoomCode(state ? state.roomCode : DEFAULT_ROOM_CODE);
      tabSession = {
        roomCode: currentRoom,
        sessionRole: null,
        currentPlayerId: null,
        screen: 'entry'
      };
      saveTabSession();

      state = loadState();
      state.roomCode = currentRoom;
      state.sessionRole = null;
      state.currentPlayerId = null;
      state.inspectingPlayerId = null;
      state.screen = 'entry';
      state.bannerMessage = {
        text: 'Sei uscito dalla sessione su questo dispositivo/scheda. Puoi cambiare stanza o rientrare.',
        type: 'info'
      };
      localStorage.setItem(getRoomStorageKey(currentRoom), JSON.stringify(state));
      pullRemoteSnapshot();
      render();
    }

    function changeRoomCode(rawCode, optionalCloudId = null) {
      const nextRoom = normalizeRoomCode(rawCode);
      if (optionalCloudId && optionalCloudId.trim()) {
        setCloudBinId(nextRoom, optionalCloudId.trim());
      }
      tabSession.roomCode = nextRoom;
      tabSession.sessionRole = null;
      tabSession.currentPlayerId = null;
      tabSession.screen = 'entry';
      saveTabSession();

      state = loadState();
      state.roomCode = nextRoom;
      state.sessionRole = null;
      state.currentPlayerId = null;
      state.screen = 'entry';
      saveState({ sync: false });
      pullRemoteSnapshot();
      render();
      setBanner(`Stanza impostata su "${nextRoom}". Condividi questo codice e l'eventuale ID Sync con gli altri dispositivi.`, 'info');
    }

    function initSyncTransport() {
      try {
        if ('BroadcastChannel' in window) {
          syncChannel = new BroadcastChannel(SYNC_CHANNEL_NAME);
          syncChannel.onmessage = (event) => {
            const payload = event.data;
            if (!payload || payload.type !== 'snapshot') return;
            applySharedSnapshot(payload.snapshot, { broadcast: false, pushRemote: false });
          };
        }
      } catch (err) {
        console.error('Errore BroadcastChannel:', err);
      }

      window.addEventListener('storage', (event) => {
        if (!event.key || !event.newValue || !state) return;
        const expectedKey = getRoomStorageKey(state.roomCode);
        if (event.key !== expectedKey && event.key !== STORAGE_KEY) return;
        try {
          const parsed = JSON.parse(event.newValue);
          if (parsed && normalizeRoomCode(parsed.roomCode) === normalizeRoomCode(state.roomCode)) {
            applySharedSnapshot(parsed, { broadcast: false, pushRemote: false });
          }
        } catch (err) {
          console.error('Errore sync storage:', err);
        }
      });

      pullRemoteSnapshot();
      if (syncPollTimer) clearInterval(syncPollTimer);
      syncPollTimer = setInterval(pullRemoteSnapshot, SYNC_POLL_INTERVAL_MS);
    }

    function setBanner(text, type = 'info') {
      state.bannerMessage = { text, type };
      saveState();
      render();
    }

    function clearBanner() {
      state.bannerMessage = null;
      saveState({ sync: false });
      render();
    }

    function addLog(text) {
      const time = new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
      state.logs.unshift({
        id: 'log_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        time,
        text
      });
      if (state.logs.length > 80) state.logs.length = 80;
    }

    function pickRoleForNewPlayer(index) {
      const pool = ['investigatore', 'assassino', 'guardia', 'sabotatore', 'cacciatore', 'martire'];
      return pool[index % pool.length];
    }

    function createPlayer(name, selfieDataUrl) {
      const cleanName = (name || '').trim() || ('Giocatore ' + (state.players.length + 1));
      const roleKey = pickRoleForNewPlayer(state.players.length);
      const roleDef = ROLE_DEFS[roleKey];
      const isMartyr = roleKey === 'martire';

      const player = {
        id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        name: cleanName,
        selfie: selfieDataUrl || null,
        role: roleKey,
        faction: roleDef.faction,
        alive: true,
        shielded: false,
        blockedThisTurn: false,
        powerPoints: 0,
        assassinKillsThisConfrontation: 0,
        martyrDeclaredRole: '',
        revealedInfo: [],
        missions: isMartyr ? [] : buildMissionsForFaction(roleDef.faction)
      };

      state.players.push(player);
      addLog(`${player.name} si è unito al tavolo.`);
      saveState();
      return player;
    }

    function chooseSessionRole(role) {
      state.sessionRole = role;
      if (role === 'master') {
        state.screen = 'board';
        addLog('Il Master ha aperto la plancia di controllo.');
      } else {
        state.screen = 'player_setup';
      }
      saveState();
      render();
    }

    function returnToGame() {
      stopCamera();
      if (state.sessionRole === 'player' && !state.currentPlayerId && state.players.length === 0) {
        state.screen = 'player_setup';
      } else {
        state.screen = 'board';
      }
      saveState();
      render();
    }

    async function startCamera() {
      const videoEl = document.getElementById('cameraVideo');
      if (!videoEl || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setBanner('Fotocamera non disponibile su questo dispositivo: puoi caricare un’immagine o proseguire senza foto.', 'warn');
        return;
      }
      try {
        stopCamera();
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        videoEl.srcObject = cameraStream;
        await videoEl.play();
      } catch (err) {
        setBanner('Permesso fotocamera negato o non disponibile: puoi caricare un file o continuare senza selfie.', 'warn');
      }
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
      }
    }

    function captureSelfie() {
      const videoEl = document.getElementById('cameraVideo');
      if (!videoEl || !videoEl.videoWidth) {
        setBanner('Avvia prima la fotocamera oppure seleziona un file immagine.', 'warn');
        return;
      }
      const canvas = document.createElement('canvas');
      canvas.width = 240;
      canvas.height = 240;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
      tempSelfieDataUrl = canvas.toDataURL('image/jpeg', 0.8);
      stopCamera();
      render();
    }

    function handlePhotoUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement('canvas');
          canvas.width = 240;
          canvas.height = 240;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          tempSelfieDataUrl = canvas.toDataURL('image/jpeg', 0.8);
          render();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function submitPlayerRegistration(event) {
      event.preventDefault();
      const inputEl = document.getElementById('playerNameInput');
      const name = inputEl ? inputEl.value : '';
      if (!name.trim()) {
        setBanner('Inserisci il tuo nome prima di entrare al tavolo.', 'warn');
        return;
      }
      stopCamera();
      const newP = createPlayer(name, tempSelfieDataUrl);
      tempSelfieDataUrl = null;
      state.currentPlayerId = newP.id;
      state.sessionRole = 'player';
      state.screen = 'board';
      saveState();
      render();
      setBanner(`Benvenuto ${newP.name}! Apri la tua "Scheda Segreta" per leggere ruolo e missioni.`, 'success');
    }

    function openInspect(playerId) {
      const target = state.players.find(p => p.id === playerId);
      if (!target) return;

      if (state.sessionRole !== 'master' && target.id !== state.currentPlayerId) {
        setBanner('Puoi aprire solo la tua Scheda Segreta personale.', 'warn');
        return;
      }

      state.inspectingPlayerId = target.id;
      state.screen = 'inspect';
      saveState();
      render();
    }

    function claimMission(playerId, missionIndex) {
      const player = state.players.find(p => p.id === playerId);
      if (!player || !player.alive) return;
      const mission = player.missions[missionIndex];
      if (!mission) return;

      if (!mission.repeatable && mission.status === 'approved') {
        setBanner('Questa missione non è ripetibile ed è già stata approvata.', 'warn');
        return;
      }
      if (mission.status === 'pending') {
        setBanner('Hai già inviato questa dichiarazione al Master: attendi la sua approvazione.', 'info');
        return;
      }

      mission.status = 'pending';
      state.masterMessages.unshift({
        id: 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        playerId: player.id,
        playerName: player.name,
        type: 'mission_approval',
        missionIndex,
        missionTitle: mission.text,
        points: mission.points,
        text: `${player.name} dichiara completata la missione: "${mission.text}" (+${mission.points} pt).`,
        time: new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }),
        resolved: false
      });

      addLog(`${player.name} ha inviato una missione al Master per approvazione.`);
      saveState();
      render();
      setBanner('Richiesta inviata al Master! I punti verranno assegnati solo dopo la sua approvazione.', 'info');
    }

    function resolveMissionRequest(msgId, approved) {
      if (state.sessionRole !== 'master') return;
      const msg = state.masterMessages.find(m => m.id === msgId);
      if (!msg || msg.resolved) return;

      const player = state.players.find(p => p.id === msg.playerId);
      msg.resolved = true;

      if (player && player.missions && player.missions[msg.missionIndex]) {
        const mission = player.missions[msg.missionIndex];
        if (approved) {
          mission.status = 'approved';
          mission.approvedCount = (mission.approvedCount || 0) + 1;
          player.powerPoints += mission.points;
          addLog(`Master: missione approvata a ${player.name} (+${mission.points} pt potere).`);
          setBanner(`Missione approvata a ${player.name}: +${mission.points} punto/i potere.`, 'success');
        } else {
          mission.status = mission.repeatable && mission.approvedCount > 0 ? 'approved' : 'idle';
          addLog(`Master: missione non approvata per ${player.name}.`);
          setBanner(`Missione non approvata per ${player.name}.`, 'warn');
        }
      }

      saveState();
      render();
    }

    function adjustPowerPoints(playerId, delta) {
      if (state.sessionRole !== 'master') return;
      const player = state.players.find(p => p.id === playerId);
      if (!player) return;
      player.powerPoints = Math.max(0, player.powerPoints + delta);
      addLog(`Master: punti potere di ${player.name} aggiornati a ${player.powerPoints}.`);
      saveState();
      render();
    }

    function sendSignalToMaster(event) {
      event.preventDefault();
      const inputEl = document.getElementById('signalInput');
      const text = (inputEl ? inputEl.value : '').trim();
      if (!text) {
        setBanner('Scrivi un messaggio o una segnalazione prima di inviare.', 'warn');
        return;
      }

      const sender = state.players.find(p => p.id === state.currentPlayerId);
      const senderName = sender ? sender.name : 'Giocatore';

      state.masterMessages.unshift({
        id: 'sig_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        playerId: sender ? sender.id : null,
        playerName: senderName,
        type: 'chat',
        text,
        time: new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }),
        resolved: false
      });

      addLog(`Segnalazione inviata al Master da ${senderName}.`);
      if (inputEl) inputEl.value = '';
      saveState();
      render();
      setBanner('Segnalazione inviata al Master.', 'success');
    }

    function markMessageHandled(msgId) {
      if (state.sessionRole !== 'master') return;
      const msg = state.masterMessages.find(m => m.id === msgId);
      if (!msg) return;
      msg.resolved = true;
      saveState();
      render();
    }

    function useRolePower(actorId) {
      const actor = state.players.find(p => p.id === actorId);
      if (!actor || !actor.alive) return;

      const def = ROLE_DEFS[actor.role];
      if (!def || def.cost <= 0) {
        setBanner('Questo ruolo non attiva poteri su richiesta con punti.', 'info');
        return;
      }

      if (actor.blockedThisTurn) {
        actor.blockedThisTurn = false;
        setBanner('La tua azione è stata bloccata per questo turno da un Sabotatore!', 'error');
        saveState();
        render();
        return;
      }

      if (actor.powerPoints < def.cost) {
        setBanner(`Ti servono almeno ${def.cost} punto/i potere per usare ${def.powerName}.`, 'warn');
        return;
      }

      if (actor.role === 'assassino' && (actor.assassinKillsThisConfrontation || 0) >= 1) {
        setBanner('L’Assassino può eliminare solo 1 giocatore prima di ogni confronto/votazione al tavolo!', 'error');
        return;
      }

      const targetSelect = document.getElementById('powerTargetSelect');
      const targetId = targetSelect ? targetSelect.value : null;
      const target = state.players.find(p => p.id === targetId && p.alive);

      if (!target) {
        setBanner('Seleziona un bersaglio vivo valido.', 'warn');
        return;
      }

      actor.powerPoints -= def.cost;

      if (actor.role === 'investigatore') {
        const targetRoleName = ROLE_DEFS[target.role].name;
        actor.revealedInfo.unshift({
          targetName: target.name,
          roleName: targetRoleName,
          time: new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })
        });
        addLog(`${actor.name} ha indagato su ${target.name}.`);
        saveState();
        render();
        setBanner(`Indagine completata: ${target.name} ha il ruolo di ${targetRoleName}.`, 'success');
        return;
      }

      if (actor.role === 'guardia') {
        target.shielded = true;
        addLog(`${actor.name} ha protetto ${target.name} con uno Scudo.`);
        saveState();
        render();
        setBanner(`${target.name} è protetto fino al prossimo turno.`, 'success');
        return;
      }

      if (actor.role === 'sabotatore') {
        target.blockedThisTurn = true;
        addLog(`${actor.name} ha intralciato ${target.name} per questo turno.`);
        saveState();
        render();
        setBanner(`${target.name} è stato bloccato per il turno corrente.`, 'success');
        return;
      }

      if (actor.role === 'assassino') {
        if (target.shielded) {
          target.shielded = false;
          addLog(`${target.name} ha parato un attacco grazie allo Scudo!`);
          saveState();
          render();
          setBanner(`L’attacco su ${target.name} è stato bloccato dallo Scudo!`, 'warn');
          return;
        }
        target.alive = false;
        actor.assassinKillsThisConfrontation = (actor.assassinKillsThisConfrontation || 0) + 1;
        addLog(`${target.name} è stato eliminato durante la notte/fase.`);
        checkVictoryCondition();
        saveState();
        render();
        setBanner(`${target.name} è stato eliminato. Prima del prossimo confronto al tavolo non potrai effettuare altre uccisioni.`, 'info');
        return;
      }

      if (actor.role === 'cacciatore') {
        if (target.shielded) {
          target.shielded = false;
          addLog(`Il colpo di ${actor.name} su ${target.name} è stato respinto dallo Scudo.`);
          saveState();
          render();
          setBanner(`Lo Scudo ha fermato il colpo su ${target.name}.`, 'warn');
          return;
        }
        target.alive = false;
        if (target.faction === 'cittadini') {
          actor.alive = false;
          addLog(`${actor.name} ha eliminato ${target.name} (Cittadino) ed è caduto per contraccolpo!`);
          setBanner(`Hai colpito ${target.name} che era un Cittadino: hai subito contraccolpo!`, 'error');
        } else {
          addLog(`${actor.name} ha colpito e eliminato ${target.name}!`);
          setBanner(`Bersaglio colpito: ${target.name} è stato eliminato!`, 'success');
        }
        checkVictoryCondition();
        saveState();
        render();
      }
    }

    function submitMartyrDeclaration(martyrId) {
      const martyr = state.players.find(p => p.id === martyrId);
      const selectEl = document.getElementById('martyrRoleSelect');
      if (!martyr || !selectEl) return;
      martyr.martyrDeclaredRole = selectEl.value;
      addLog(`Martire ${martyr.name} ha dichiarato pubblicamente: "${martyr.martyrDeclaredRole}".`);
      saveState();
      render();
      setBanner(`Hai dichiarato pubblicamente il ruolo: ${martyr.martyrDeclaredRole}.`, 'info');
    }

    function advancePhase() {
      if (state.sessionRole !== 'master') return;
      const idx = PHASES.indexOf(state.phase);
      const nextIdx = (idx + 1) % PHASES.length;
      state.phase = PHASES[nextIdx];

      if (nextIdx === 0) {
        state.round += 1;
        state.players.forEach(p => {
          p.blockedThisTurn = false;
        });
      }

      if (state.phase === 'Confronto al Tavolo' || state.phase === 'Votazione') {
        state.players.forEach(p => {
          p.assassinKillsThisConfrontation = 0;
        });
      }

      addLog(`Fase impostata su "${state.phase}" (Turno ${state.round}).`);
      checkVictoryCondition();
      saveState();
      render();
    }

    function togglePlayerAlive(playerId) {
      if (state.sessionRole !== 'master') return;
      const p = state.players.find(pl => pl.id === playerId);
      if (!p) return;
      p.alive = !p.alive;
      addLog(`Master: ${p.name} è ora ${p.alive ? 'in gioco' : 'eliminato'}.`);
      checkVictoryCondition();
      saveState();
      render();
    }

    function checkVictoryCondition() {
      const alivePlayers = state.players.filter(p => p.alive);
      if (alivePlayers.length < 2) return;
      const aliveTraitors = alivePlayers.filter(p => p.faction === 'traditori').length;
      const aliveCitizens = alivePlayers.filter(p => p.faction === 'cittadini').length;

      if (aliveTraitors === 0) {
        state.winner = 'Vittoria dei Cittadini';
      } else if (aliveTraitors >= aliveCitizens) {
        state.winner = 'Vittoria dei Traditori';
      }
    }

    function resetGame() {
      if (state.sessionRole !== 'master') return;
      stopCamera();
      const activeRoom = normalizeRoomCode(state.roomCode);
      localStorage.removeItem(getRoomStorageKey(activeRoom));
      tempSelfieDataUrl = null;
      state = createInitialState();
      state.roomCode = activeRoom;
      state.sessionRole = 'master';
      state.screen = 'board';
      state.lastUpdatedAt = Date.now();
      tabSession.roomCode = activeRoom;
      tabSession.sessionRole = 'master';
      tabSession.currentPlayerId = null;
      tabSession.screen = 'board';
      saveTabSession();
      saveState({ sync: true });
      render();
    }

              </button>

      root.innerHTML = bannerHtml + `<main class="flex-1 flex flex-col">${bodyHtml}</main>`;

                ? `<img src="${player.selfie}" alt="${escapeHtml(player.name)}" class="w-14 h-14 rounded-2xl object-cover border border-white/15 shrink-0" />`
                : `<div class="w-14 h-14 rounded-2xl bg-surface2 border border-white/15 flex items-center justify-center font-serif text-xl font-bold text-gold shrink-0">
                     ${escapeHtml(player.name.charAt(0).toUpperCase())}
                   </div>`
            }

            <div class="min-w-0 flex-1">
              <div class="flex items-center justify-between gap-2">
                <h3 class="font-bold text-white truncate">${escapeHtml(player.name)}</h3>
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold ${
                  player.alive
                    ? 'bg-emerald/15 text-emerald border border-emerald/30'
                    : 'bg-crimson/20 text-red-300 border border-crimson/40'
                }">
                  ${player.alive ? 'In gioco' : 'Eliminato'}
                </span>
              </div>

              <div class="mt-1.5 flex flex-wrap items-center gap-1.5 text-xs">
                <span class="px-2 py-0.5 rounded-lg bg-gold/10 text-gold border border-gold/25 font-semibold">
                  ${player.powerPoints} pt potere
                </span>
                ${
                  player.shielded
                    ? `<span class="px-2 py-0.5 rounded-lg bg-indigo/15 text-indigo-200 border border-indigo/30">Scudo</span>`
                    : ''
                }
                ${
                  player.martyrDeclaredRole
                    ? `<span class="px-2 py-0.5 rounded-lg bg-white/10 text-gray-200">Dichiarato: ${escapeHtml(player.martyrDeclaredRole)}</span>`
                    : ''
                }
              </div>

              ${
                isMaster && roleDef
                  ? `<div class="mt-2 text-xs text-gray-300">
                       Ruolo: <strong class="text-white">${roleDef.name}</strong> (${roleDef.factionLabel})
                     </div>`
                  : ''
              }
            </div>
          </div>

          <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-white/10">
            ${
              canOpenSheet
                ? `<button
                     type="button"
                     onclick="openInspect('${player.id}')"
                     class="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/15 text-xs font-semibold text-white transition"
                   >
                     ${isMaster ? 'Apri Scheda' : 'La Mia Scheda Segreta'}
                   </button>`
                : `<span class="text-xs text-gray-500">Scheda privata</span>`
            }

            ${
              isMaster
                ? `<div class="flex items-center gap-1.5">
                     <button
                       type="button"
                       onclick="adjustPowerPoints('${player.id}', -1)"
                       class="px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-bold"
                       title="Rimuovi 1 punto potere"
                     >
                       -1 pt
                     </button>
                     <button
                       type="button"
                       onclick="adjustPowerPoints('${player.id}', 1)"
                       class="px-2.5 py-1 rounded-lg bg-gold/20 hover:bg-gold/30 text-gold text-xs font-bold"
                       title="Aggiungi 1 punto potere"
                     >
                       +1 pt
                     </button>
                     <button
                       type="button"
                       onclick="togglePlayerAlive('${player.id}')"
                       class="px-2.5 py-1 rounded-lg ${
                         player.alive
                           ? 'bg-crimson/20 hover:bg-crimson/30 text-red-200'
                           : 'bg-emerald/20 hover:bg-emerald/30 text-emerald-200'
                       } text-xs font-semibold"
                     >
                       ${player.alive ? 'Elimina' : 'Ripristina'}
                     </button>
                   </div>`
                : ''
            }
          </div>
        </div>
      `;
    }

    function renderPlayerSignalBox() {
      return `
        <form onsubmit="sendSignalToMaster(event)" class="rounded-2xl bg-surface border border-white/10 p-5 space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="font-serif text-lg font-bold text-white">Segnala al Master</h3>
            <span class="text-xs text-gray-400">Canale privato</span>
          </div>
          <p class="text-xs text-gray-400">
            Usa questo spazio per chiedere chiarimenti, segnalare un dubbio o comunicare privatamente con il Master.
          </p>
          <textarea
            id="signalInput"
            rows="3"
            placeholder="Scrivi qui la tua segnalazione o domanda per il Master..."
            class="w-full px-3.5 py-2.5 rounded-xl bg-surface2 border border-white/15 focus:border-gold focus:outline-none text-sm text-white"
          ></textarea>
          <button
            type="submit"
            class="px-4 py-2.5 rounded-xl bg-gold hover:bg-amber-400 text-bgdark text-xs font-bold transition"
          >
            Invia Segnalazione al Master
          </button>
        </form>
      `;
    }

    function renderMasterInbox(pendingMessages) {
      return `
        <div class="rounded-2xl bg-surface border border-white/10 p-5 space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="font-serif text-lg font-bold text-white">Approvazioni e Segnalazioni</h3>
            <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-gold/20 text-gold">
              ${pendingMessages.length} in attesa
            </span>
          </div>

          ${
            pendingMessages.length === 0
              ? `<p class="text-xs text-gray-400 py-4">Nessuna missione o segnalazione in attesa.</p>`
              : `<div class="space-y-2.5 max-h-80 overflow-y-auto pr-1">
                   ${pendingMessages
                     .map(msg => `
                       <div class="rounded-xl bg-surface2 border border-white/10 p-3 space-y-2">
                         <div class="flex items-center justify-between text-[11px] text-gray-400">
                           <strong class="text-white">${escapeHtml(msg.playerName)}</strong>
                           <span>${escapeHtml(msg.time)}</span>
                         </div>
                         <p class="text-xs text-gray-200 leading-relaxed">${escapeHtml(msg.text)}</p>
                         <div class="flex items-center gap-2 pt-1">
                           ${
                             msg.type === 'mission_approval'
                               ? `
                                 <button
                                   type="button"
                                   onclick="resolveMissionRequest('${msg.id}', true)"
                                   class="px-3 py-1 rounded-lg bg-emerald/20 hover:bg-emerald/30 border border-emerald/40 text-emerald-200 text-xs font-bold"
                                 >
                                   Approva (+${msg.points || 1} pt)
                                 </button>
                                 <button
                                   type="button"
                                   onclick="resolveMissionRequest('${msg.id}', false)"
                                   class="px-3 py-1 rounded-lg bg-crimson/20 hover:bg-crimson/30 border border-crimson/40 text-red-200 text-xs font-semibold"
                                 >
                                   Rifiuta
                                 </button>
                               `
                               : `
                                 <button
                                   type="button"
                                   onclick="markMessageHandled('${msg.id}')"
                                   class="px-3 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-semibold text-white"
                                 >
                                   Segna come letta
                                 </button>
                               `
                           }
                         </div>
                       </div>
                     `)
                     .join('')}
                 </div>`
          }
        </div>
      `;
    }

    function renderLogsPanel() {
      return `
        <div class="rounded-2xl bg-surface border border-white/10 p-5 space-y-3">
          <h3 class="font-serif text-lg font-bold text-white">Cronaca del Tavolo</h3>
          ${
            state.logs.length === 0
              ? `<p class="text-xs text-gray-400 py-4">Nessun evento registrato finora.</p>`
              : `<div class="space-y-2 max-h-80 overflow-y-auto pr-1">
                   ${state.logs
                     .map(l => `
                       <div class="text-xs py-2 border-b border-white/5 last:border-b-0 flex items-start justify-between gap-2">
                         <span class="text-gray-200">${escapeHtml(l.text)}</span>
                         <span class="text-[11px] text-gray-500 shrink-0">${escapeHtml(l.time)}</span>
                       </div>
                     `)
                     .join('')}
                 </div>`
          }
        </div>
      `;
    }

    function renderInspectScreen() {
      const player = state.players.find(p => p.id === state.inspectingPlayerId);
      if (!player) {
        return `
          <div class="flex-1 flex items-center justify-center p-6">
            <div class="rounded-2xl bg-surface border border-white/10 p-6 text-center space-y-3">
              <p class="text-sm text-gray-300">Scheda non trovata.</p>
              <button type="button" onclick="returnToGame()" class="px-4 py-2 rounded-xl bg-gold text-bgdark text-xs font-bold">
                Torna al gioco
              </button>
            </div>
          </div>
        `;
      }

      const roleDef = ROLE_DEFS[player.role];
      const aliveTargets = state.players.filter(p => p.alive && p.id !== player.id);
      const targetOptions =
        player.role === 'guardia'
          ? state.players.filter(p => p.alive)
          : aliveTargets;

      const assassinBlockedByRule =
        player.role === 'assassino' && (player.assassinKillsThisConfrontation || 0) >= 1;

      return `
        <div class="max-w-4xl w-full mx-auto p-4 sm:p-6 space-y-6">
          <div class="flex items-center justify-between gap-3">
            <div>
              <span class="text-xs uppercase tracking-wider text-gold font-semibold">Scheda Riservata</span>
              <h1 class="font-serif text-2xl sm:text-3xl font-bold text-white">${escapeHtml(player.name)}</h1>
            </div>
            <div class="flex items-center gap-2">
              <button
                type="button"
                onclick="returnToGame()"
                class="px-4 py-2.5 rounded-xl bg-white/10 hover:bg-white/15 text-xs font-semibold text-white transition"
              >
                Torna alla Plancia
              </button>
              <button
                type="button"
                onclick="exitSession()"
                class="px-3.5 py-2.5 rounded-xl bg-crimson/20 hover:bg-crimson/30 border border-crimson/40 text-red-200 text-xs font-semibold transition"
              >
                Esci
              </button>
            </div>
          </div>

          <div class="rounded-3xl bg-surface border border-white/10 p-5 sm:p-6 space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold border ${roleDef.badgeClass}">
                  ${roleDef.factionLabel}
                </span>
                <h2 class="font-serif text-2xl font-bold text-white mt-2">${roleDef.name}</h2>
              </div>

              <div class="flex items-center gap-3 bg-surface2 border border-gold/30 rounded-2xl px-4 py-3">
                <div>
                  <div class="text-[11px] uppercase tracking-wider text-gray-400">Punti Potere</div>
                  <div class="text-xs text-gray-400">Costo: ${roleDef.cost > 0 ? roleDef.cost + ' pt' : 'Passivo'}</div>
                </div>
                <div class="w-12 h-12 rounded-xl bg-gold/20 border border-gold/40 flex items-center justify-center font-serif text-2xl font-bold text-gold">
                  ${player.powerPoints}
                </div>
              </div>
            </div>

            <div class="rounded-2xl bg-surface2 border border-white/10 p-4 space-y-3">
              <div class="font-semibold text-white">${roleDef.powerName}</div>
              <p class="text-xs sm:text-sm text-gray-300 leading-relaxed">${roleDef.powerDesc}</p>

              ${
                player.role === 'martire'
                  ? `
                    <div class="pt-2 flex flex-col sm:flex-row gap-2">
                      <select id="martyrRoleSelect" class="px-3 py-2 rounded-xl bg-bgdark border border-white/15 text-xs text-white">
                        ${Object.values(ROLE_DEFS)
                          .map(r => `<option value="${r.name}">${r.name}</option>`)
                          .join('')}
                      </select>
                      <button
                        type="button"
                        onclick="submitMartyrDeclaration('${player.id}')"
                        class="px-4 py-2 rounded-xl bg-gold hover:bg-amber-400 text-bgdark text-xs font-bold"
                      >
                        Dichiara Ruolo al Tavolo
                      </button>
                    </div>
                  `
                  : roleDef.cost > 0
                  ? `
                    <div class="pt-2 flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5">
                      <select
                        id="powerTargetSelect"
                        class="flex-1 px-3.5 py-2.5 rounded-xl bg-bgdark border border-white/15 text-xs sm:text-sm text-white"
                      >
                        ${
                          targetOptions.length === 0
                            ? `<option value="">Nessun bersaglio disponibile</option>`
                            : targetOptions
                                .map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`)
                                .join('')
                        }
                      </select>
                      <button
                        type="button"
                        onclick="useRolePower('${player.id}')"
                        ${!player.alive || assassinBlockedByRule ? 'disabled' : ''}
                        class="px-4 py-2.5 rounded-xl bg-gold hover:bg-amber-400 disabled:opacity-40 text-bgdark text-xs sm:text-sm font-bold transition"
                      >
                        ${
                          assassinBlockedByRule
                            ? 'Limite 1 uccisione raggiunto'
                            : `Usa Potere (${roleDef.cost} pt)`
                        }
                      </button>
                    </div>
                  `
                  : ''
              }
            </div>

            ${
              player.revealedInfo && player.revealedInfo.length > 0
                ? `
                  <div class="rounded-2xl bg-emerald/10 border border-emerald/30 p-4 space-y-2">
                    <div class="text-xs font-bold uppercase tracking-wider text-emerald-300">Indagini Raccolte</div>
                    ${player.revealedInfo
                      .map(info => `<div class="text-xs text-emerald-100">• <strong>${escapeHtml(info.targetName)}</strong> → <strong>${escapeHtml(info.roleName)}</strong> (${escapeHtml(info.time)})</div>`)
                      .join('')}
                  </div>
                `
                : ''
            }
          </div>

          <div class="rounded-3xl bg-surface border border-white/10 p-5 sm:p-6 space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <h3 class="font-serif text-xl font-bold text-white">Missioni Personali</h3>
                <p class="text-xs text-gray-400">
                  Dichiara il completamento: il Master dovrà approvare per assegnare i punti potere.
                </p>
              </div>
              <span class="text-xs font-semibold text-gold">5 Missioni (3 Ripetibili)</span>
            </div>

            ${
              !player.missions || player.missions.length === 0
                ? `<p class="text-xs text-gray-400">Il ruolo del Martire non prevede missioni standard.</p>`
                : `<div class="space-y-3">
                     ${player.missions
                       .map((m, idx) => {
                         const statusBadge =
                           m.status === 'pending'
                             ? `<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-gold/20 text-gold border border-gold/30">In attesa del Master</span>`
                             : m.status === 'approved'
                             ? `<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald/20 text-emerald border border-emerald/30">
                                  Approvata${m.approvedCount > 1 ? ` (${m.approvedCount}x)` : ''}
                                </span>`
                             : `<span class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-white/10 text-gray-300">Da completare</span>`;

                         const canClaim =
                           player.alive &&
                           m.status !== 'pending' &&
                           (m.repeatable || m.status !== 'approved');

                         return `
                           <div class="rounded-2xl bg-surface2 border border-white/10 p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                             <div class="space-y-1">
                               <div class="flex flex-wrap items-center gap-2">
                                 <span class="px-2 py-0.5 rounded-md text-[11px] font-bold ${
                                   m.repeatable
                                     ? 'bg-indigo/20 text-indigo-200 border border-indigo/30'
                                     : 'bg-white/10 text-gray-300'
                                 }">
                                   ${m.repeatable ? 'Ripetibile' : 'Unica'}
                                 </span>
                                 <span class="px-2 py-0.5 rounded-md text-[11px] font-bold bg-gold/15 text-gold">
                                   +${m.points} pt
                                 </span>
                                 ${statusBadge}
                               </div>
                               <p class="text-xs sm:text-sm text-gray-200 leading-relaxed">${escapeHtml(m.text)}</p>
                             </div>

                             <button
                               type="button"
                               onclick="claimMission('${player.id}', ${idx})"
                               ${!canClaim ? 'disabled' : ''}
                               class="px-4 py-2 rounded-xl bg-emerald hover:bg-emerald-400 disabled:opacity-40 text-bgdark text-xs font-bold transition shrink-0"
                             >
                               ${m.status === 'pending' ? 'In attesa...' : 'Dichiara Fatta'}
                             </button>
                           </div>
                         `;
                       })
                       .join('')}
                   </div>`
            }
          </div>
        </div>
      `;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    window.addEventListener('beforeunload', () => {
      stopCamera();
      if (syncPollTimer) {
        clearInterval(syncPollTimer);
      }
      if (syncChannel) {
        syncChannel.close();
      }
    });

    state = loadState();
    initSyncTransport();
    render();
  </script>
</body>
</html>
