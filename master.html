    :root {

      --indigo: #7c8cff;

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    }

    .app-wrap {
      max-width: 1160px;
      margin: 0 auto;
      padding: 24px 16px 64px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .card-gold { border-color: rgba(229, 184, 92, 0.38); }

    .header-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      display: block;
    }

    h1 { margin: 4px 0 0; font-size: 26px; font-weight: 800; color: #ffffff; }
    h2 { margin: 0; font-size: 19px; font-weight: 700; color: #ffffff; }
    h3 { margin: 0; font-size: 15px; font-weight: 700; color: #ffffff; }
    .subtext { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; color: var(--emerald); }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    button {
      font-family: inherit;
      cursor: pointer;
      border-radius: 10px;
      font-weight: 600;
      transition: opacity 0.15s ease;
    }

    button:hover:not(:disabled) { opacity: 0.92; }
    button:disabled { opacity: 0.42; cursor: not-allowed; }

    .btn-gold { background: var(--gold); color: #0c0e14; border: none; padding: 10px 14px; font-size: 12px; font-weight: 700; }
    .btn-emerald { background: var(--emerald); color: #0c0e14; border: none; padding: 10px 14px; font-size: 12px; font-weight: 700; }
    .btn-emerald-lg { background: var(--emerald); color: #0c0e14; border: none; padding: 12px 20px; font-size: 14px; font-weight: 700; }
    .btn-indigo { background: var(--indigo); color: #ffffff; border: none; padding: 10px 14px; font-size: 12px; }
    .btn-crimson { background: var(--crimson); color: #ffffff; border: none; padding: 8px 12px; font-size: 12px; }
    .btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); padding: 10px 14px; font-size: 12px; }
    .btn-small { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); padding: 6px 11px; font-size: 12px; }
    .btn-remove:hover { background: rgba(224, 82, 96, 0.18); color: var(--crimson); border-color: rgba(224, 82, 96, 0.45); }

    .banner { border-radius: 12px; padding: 12px 16px; font-size: 13px; font-weight: 600; border: 1px solid transparent; }
    .banner-success { background: rgba(62, 201, 140, 0.14); border-color: rgba(62, 201, 140, 0.4); color: var(--emerald); }
    .banner-error { background: rgba(224, 82, 96, 0.14); border-color: rgba(224, 82, 96, 0.4); color: var(--crimson); }
    .banner-info { background: rgba(124, 140, 255, 0.14); border-color: rgba(124, 140, 255, 0.4); color: var(--indigo); }

    .section-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .speech-list { display: flex; flex-direction: column; gap: 10px; }
    .speech-item { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; cursor: pointer; }
    .speech-item.active { border-color: var(--gold); background: #10141f; }

    .speech-meta {

      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;

      background: rgba(229, 184, 92, 0.15);
      color: var(--gold);
      border: 1px solid rgba(229, 184, 92, 0.35);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;

    .speech-controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }

    label { display: block; font-size: 12px; font-weight: 600; color: #d1d5db; margin-bottom: 6px; }
    textarea, input[type="text"], select {

      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;

    .roles-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(235px, 1fr)); gap: 12px; }

    .role-box {

      border-radius: 12px;
      padding: 14px;

      flex-direction: column;
      justify-content: space-between;

    .role-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .role-name { font-size: 14px; font-weight: 700; color: #ffffff; }
    .badge { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
    .badge-Traditori { background: rgba(224, 82, 96, 0.15); color: var(--crimson); border-color: rgba(224, 82, 96, 0.4); }
    .badge-Fedeli { background: rgba(62, 201, 140, 0.15); color: var(--emerald); border-color: rgba(62, 201, 140, 0.4); }

    .role-counter { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
    .counter-btns { display: flex; align-items: center; gap: 8px; }
    .btn-step { width: 28px; height: 28px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
    .count-val { min-width: 22px; text-align: center; font-size: 14px; font-weight: 700; color: var(--gold); }
    .add-form { display: flex; gap: 8px; margin-bottom: 14px; }
    .player-list { display: flex; flex-direction: column; gap: 10px; }
    .player-row { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .player-name { font-size: 14px; font-weight: 700; color: #ffffff; }
    .player-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .board-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
    .board-card { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .mission-chip { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font-size: 12px; }
    .chat-box { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin: 12px 0; padding-right: 4px; }
    .msg-card { border-radius: 10px; padding: 10px 12px; border: 1px solid var(--border); background: var(--bg); }
    .msg-card.from-master { background: var(--surface-2); border-color: rgba(229, 184, 92, 0.35); margin-left: 18px; }
    .msg-head { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .msg-sender { font-weight: 700; color: #ffffff; }
    .msg-body { margin: 0; font-size: 13px; color: #e5e7eb; }
    .chat-form { display: flex; gap: 8px; }
    .footer-action { display: flex; justify-content: flex-end; }
    .subpanel { padding: 14px; border-radius: 12px; background: var(--bg); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
    .pts-pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(62, 201, 140, 0.14); color: var(--emerald); border: 1px solid rgba(62, 201, 140, 0.35); }

    };

    var SPEECH_TEMPLATES = {

    function safeGetItem(key) {
      try { return window.localStorage.getItem(key); } catch (_e) { return null; }
    }

    function safeSetItem(key, val) {
      try { window.localStorage.setItem(key, val); } catch (_e) {}
    }

    function initFirestore() {
      try {
        if (!window.OMBRE_FIREBASE_CONFIG || !window.OMBRE_FIREBASE_CONFIG.projectId) return null;
        var app = getApps().length ? getApps()[0] : initializeApp(window.OMBRE_FIREBASE_CONFIG);
        return getFirestore(app);

    var firestoreDb = initFirestore();

    function getRoomDocRef(roomCode) {
      if (!firestoreDb) return null;
      var cleanRoom = String(roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1';
      return doc(firestoreDb, 'stanze', cleanRoom);
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function isValidPhoto(val) {
      var s = String(val || '').trim();
      return /^data:image\/(png|jpeg|jpg|webp|gif);base64,/i.test(s) || /^https?:\/\//i.test(s);
    }

    function readAccess() {
      try {
        var raw = safeGetItem(ACCESS_KEY);
        if (!raw) return { roomCode: 'TAVOLO1', masterName: 'Master', selfieDataUrl: '' };
        var parsed = JSON.parse(raw);
        return {
          roomCode: String(parsed && parsed.roomCode ? parsed.roomCode : 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1',
          masterName: String(parsed && parsed.playerName ? parsed.playerName : 'Master').trim() || 'Master',
          selfieDataUrl: parsed && isValidPhoto(parsed.selfieDataUrl) ? String(parsed.selfieDataUrl) : ''
        };
      } catch (_e) {
        return { roomCode: 'TAVOLO1', masterName: 'Master', selfieDataUrl: '' };
      }
    }

    function createDefaultCounts() {
      return {
        assassino: 1, sabotatore: 1, traditore_segreto: 1, investigatore: 1,
        guardia: 1, martire: 1, mediatore: 1, cacciatore: 1
      };
    }

    function normalizePlayerList(rawPlayers) {
      if (!Array.isArray(rawPlayers)) return [];
      var seen = {};
      var out = [];
      rawPlayers.forEach(function (p, idx) {
        var name = String(p && p.name ? p.name : '').trim();
        if (!name) return;
        var key = name.toLowerCase();
        var roleKey = p && p.assignedRoleKey && ROLE_CATALOG[p.assignedRoleKey] ? p.assignedRoleKey : null;
        if (seen[key]) {
          var existing = out[seen[key] - 1];
          if (p && p.boardUnlocked) existing.boardUnlocked = true;
          if (roleKey) existing.assignedRoleKey = roleKey;
          if (p && p.isDead) existing.isDead = true;
          return;
        }
        out.push({
          id: String(p && p.id ? p.id : ('p_' + idx + '_' + key)),
          name: name,
          boardUnlocked: Boolean(p && p.boardUnlocked),
          assignedRoleKey: roleKey,
          isDead: Boolean(p && p.isDead)
        });
        seen[key] = out.length;
      });
      return out;
    }

    function loadState() {
      var ctx = readAccess();
      var base = {
        roomCode: ctx.roomCode,
        masterName: ctx.masterName,
        masterSelfie: ctx.selfieDataUrl,
        syncStatus: firestoreDb ? 'Cloud Firestore attivo' : 'Locale',
        roleCounts: createDefaultCounts(),
        players: [],
        playerPoints: {},
        missionAssignments: {},
        catalog: FALLBACK_CATALOG.slice(),
        catalogSource: 'Catalogo integrato (31 missioni)',
        speechTone: 'suspense',
        customSpeechText: '',
        activeParagraphIndex: 0,
        assignmentCompleted: false,
        boardOpened: false,
        banner: null,
        chatTab: 'master',
        playerFilter: 'ALL',
        masterChat: [],
        traitorChat: [],
        ovalActive: false,
        ovalRunoffActive: false,
        ovalRunoffCandidates: [],
        ovalVotes: [],
        revealedVoteIndex: 0,
        tvMode: 'idle',
        tvKillTarget: '',
        tvExileTarget: '',
        tvVideoPaused: false,
        tvRevealTick: 0,
        playerSelfies: ctx.selfieDataUrl ? { [ctx.masterName.toLowerCase()]: ctx.selfieDataUrl } : {}
      };

      try {
        var raw = safeGetItem(MASTER_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') {
            if (parsed.roleCounts && typeof parsed.roleCounts === 'object') {
              Object.keys(base.roleCounts).forEach(function (k) {
                var n = Number(parsed.roleCounts[k]);
                if (!isNaN(n)) base.roleCounts[k] = Math.max(0, Math.min(12, n));
              });
            }
            if (Array.isArray(parsed.players) && String(parsed.roomCode || '').toUpperCase() === base.roomCode) {
              base.players = normalizePlayerList(parsed.players);
            }
            if (parsed.speechTone && SPEECH_TEMPLATES[parsed.speechTone]) base.speechTone = parsed.speechTone;
            if (typeof parsed.customSpeechText === 'string') base.customSpeechText = parsed.customSpeechText;
            if (typeof parsed.activeParagraphIndex === 'number') base.activeParagraphIndex = Math.max(0, parsed.activeParagraphIndex);
            if (String(parsed.roomCode || '').toUpperCase() === base.roomCode) {
              base.assignmentCompleted = Boolean(parsed.assignmentCompleted);
              base.boardOpened = Boolean(parsed.boardOpened);
            }
          }
        }
      } catch (_e) {}

      try {
        var roomRaw = safeGetItem(ROOM_PREFIX + base.roomCode);
        if (roomRaw) {
          var roomParsed = JSON.parse(roomRaw);
          if (roomParsed && typeof roomParsed === 'object') {
            if (Array.isArray(roomParsed.masterChat)) base.masterChat = roomParsed.masterChat;
            if (Array.isArray(roomParsed.traitorChat)) base.traitorChat = roomParsed.traitorChat;
            if (Array.isArray(roomParsed.players) && base.players.length === 0) {
              base.players = normalizePlayerList(roomParsed.players);
            }
            if (roomParsed.playerPoints && typeof roomParsed.playerPoints === 'object') {
              base.playerPoints = Object.assign({}, roomParsed.playerPoints);
            }
            if (roomParsed.missionAssignments && typeof roomParsed.missionAssignments === 'object') {
              base.missionAssignments = Object.assign({}, roomParsed.missionAssignments);
            }
            if (typeof roomParsed.ovalActive === 'boolean') base.ovalActive = roomParsed.ovalActive;
            if (typeof roomParsed.ovalRunoffActive === 'boolean') base.ovalRunoffActive = roomParsed.ovalRunoffActive;
            if (Array.isArray(roomParsed.ovalRunoffCandidates)) base.ovalRunoffCandidates = roomParsed.ovalRunoffCandidates;
            if (Array.isArray(roomParsed.ovalVotes)) base.ovalVotes = roomParsed.ovalVotes;
            if (typeof roomParsed.revealedVoteIndex === 'number') base.revealedVoteIndex = roomParsed.revealedVoteIndex;
            if (typeof roomParsed.tvMode === 'string') base.tvMode = roomParsed.tvMode;
            if (typeof roomParsed.tvKillTarget === 'string') base.tvKillTarget = roomParsed.tvKillTarget;
            if (typeof roomParsed.tvExileTarget === 'string') base.tvExileTarget = roomParsed.tvExileTarget;
            if (typeof roomParsed.tvVideoPaused === 'boolean') base.tvVideoPaused = roomParsed.tvVideoPaused;
            if (typeof roomParsed.tvRevealTick === 'number') base.tvRevealTick = roomParsed.tvRevealTick;
            if (roomParsed.masterSelfie && isValidPhoto(roomParsed.masterSelfie)) base.masterSelfie = roomParsed.masterSelfie;
            if (roomParsed.playerSelfies && typeof roomParsed.playerSelfies === 'object') {
              base.playerSelfies = Object.assign({}, base.playerSelfies, roomParsed.playerSelfies);
            }
          }
        }
      } catch (_e) {}

      return base;
    }

    var state = loadState();

    function persistLocal() {
      safeSetItem(MASTER_KEY, JSON.stringify({
        roomCode: state.roomCode,
        masterName: state.masterName,
        roleCounts: state.roleCounts,
        players: state.players,
        speechTone: state.speechTone,
        customSpeechText: state.customSpeechText,
        activeParagraphIndex: state.activeParagraphIndex,
        assignmentCompleted: state.assignmentCompleted,
        boardOpened: state.boardOpened
      }));

      var existingRoom = {};
      try {
        var raw = safeGetItem(ROOM_PREFIX + state.roomCode);
        if (raw) existingRoom = JSON.parse(raw) || {};
      } catch (_e) {}

      safeSetItem(ROOM_PREFIX + state.roomCode, JSON.stringify(Object.assign({}, existingRoom, {
        roomCode: state.roomCode,
        masterName: state.masterName,
        masterSelfie: state.masterSelfie,
        players: state.players,
        roleCounts: state.roleCounts,
        playerPoints: state.playerPoints,
        missionAssignments: state.missionAssignments,
        masterChat: state.masterChat,
        traitorChat: state.traitorChat,
        ovalActive: state.ovalActive,
        ovalRunoffActive: state.ovalRunoffActive,
        ovalRunoffCandidates: state.ovalRunoffCandidates,
        ovalVotes: state.ovalVotes,
        revealedVoteIndex: state.revealedVoteIndex,
        tvMode: state.tvMode,
        tvKillTarget: state.tvKillTarget,
        tvExileTarget: state.tvExileTarget,
        tvVideoPaused: state.tvVideoPaused,
        tvRevealTick: state.tvRevealTick,
        playerSelfies: state.playerSelfies,
        updatedAt: Date.now()
      })));
    }

    async function syncPatchToCloud(patch) {
      Object.assign(state, patch || {});
      persistLocal();
      var ref = getRoomDocRef(state.roomCode);
      if (!ref) return;
      try {
        await setDoc(ref, Object.assign({
          roomCode: state.roomCode,
          masterName: state.masterName || 'Master',
          updatedAt: Date.now()
        }, patch || {}), { merge: true });
        state.syncStatus = 'Cloud Firestore attivo';
      } catch (_e) {
        state.syncStatus = 'Locale';
      }
    }

    function applyCloudRoomData(data) {
      if (!data || typeof data !== 'object') return;
      if (data.masterName && (!state.masterName || state.masterName === 'Master')) {
        state.masterName = String(data.masterName);
      }
      if (data.masterSelfie && isValidPhoto(data.masterSelfie)) {
        state.masterSelfie = String(data.masterSelfie);
      }
      if (data.playerSelfies && typeof data.playerSelfies === 'object') {
        state.playerSelfies = Object.assign({}, state.playerSelfies, data.playerSelfies);
      }
      if (Array.isArray(data.players)) {
        var cloudPlayers = normalizePlayerList(data.players);
        var prevByName = {};
        state.players.forEach(function (p) { prevByName[p.name.toLowerCase()] = p; });
        state.players = cloudPlayers.map(function (cp) {
          var prev = prevByName[cp.name.toLowerCase()];
          return {
            id: cp.id,
            name: cp.name,
            boardUnlocked: Boolean(cp.boardUnlocked || (prev && prev.boardUnlocked)),
            assignedRoleKey: cp.assignedRoleKey || (prev ? prev.assignedRoleKey : null),
            isDead: Boolean(cp.isDead !== undefined ? cp.isDead : (prev && prev.isDead))
          };
        });
        if (state.players.some(function (p) { return Boolean(p.assignedRoleKey); })) {
          state.assignmentCompleted = true;
        }
      }
      if (data.playerPoints && typeof data.playerPoints === 'object') {
        state.playerPoints = Object.assign({}, data.playerPoints);
      }
      if (data.missionAssignments && typeof data.missionAssignments === 'object') {
        state.missionAssignments = Object.assign({}, data.missionAssignments);
      }
      if (Array.isArray(data.masterChat)) state.masterChat = data.masterChat;
      if (Array.isArray(data.traitorChat)) state.traitorChat = data.traitorChat;
      if (typeof data.ovalActive === 'boolean') state.ovalActive = data.ovalActive;
      if (typeof data.ovalRunoffActive === 'boolean') state.ovalRunoffActive = data.ovalRunoffActive;
      if (Array.isArray(data.ovalRunoffCandidates)) state.ovalRunoffCandidates = data.ovalRunoffCandidates;
      if (Array.isArray(data.ovalVotes)) state.ovalVotes = data.ovalVotes;
      if (typeof data.revealedVoteIndex === 'number') state.revealedVoteIndex = data.revealedVoteIndex;
      if (typeof data.tvMode === 'string') state.tvMode = data.tvMode;
      if (typeof data.tvKillTarget === 'string') state.tvKillTarget = data.tvKillTarget;
      if (typeof data.tvExileTarget === 'string') state.tvExileTarget = data.tvExileTarget;
      if (typeof data.tvVideoPaused === 'boolean') state.tvVideoPaused = data.tvVideoPaused;
      if (typeof data.tvRevealTick === 'number') state.tvRevealTick = data.tvRevealTick;
      persistLocal();
    }

    async function subscribeToRoomCloud() {
      if (typeof unsubscribeRoom === 'function') {
        unsubscribeRoom();
        unsubscribeRoom = null;
      }
      var ref = getRoomDocRef(state.roomCode);
      if (!ref) {
        state.syncStatus = 'Solo locale';
        return;
      }
      try {
        var snap = await getDoc(ref);
        if (snap.exists()) {
          applyCloudRoomData(snap.data() || {});
          render();
        } else {
          await syncPatchToCloud({
            players: state.players,
            roleCounts: state.roleCounts,
            playerPoints: state.playerPoints,
            missionAssignments: state.missionAssignments,
            masterChat: state.masterChat,
            traitorChat: state.traitorChat
          });
        }
      } catch (_e) {}

      unsubscribeRoom = onSnapshot(ref, function (snap) {
        state.syncStatus = 'Cloud Firestore attivo';
        if (snap.exists()) {
          applyCloudRoomData(snap.data() || {});
        }
        render();
      }, function () {
        state.syncStatus = 'Locale';
        render();
      });
    }

    async function loadCatalogJson() {
      try {
        var res = await fetch(CATALOG_URL, { cache: 'no-store' });
        if (!res.ok) return;
        var jsonData = await res.json();
        if (Array.isArray(jsonData) && jsonData.length) {
          state.catalog = jsonData.filter(function (m) { return m && m.active !== false; });
          state.catalogSource = CATALOG_URL + ' (' + state.catalog.length + ' missioni)';
          render();
        }
      } catch (_e) {}
    }

    function pickRandom(list, count, usedIds) {
      var pool = list.filter(function (item) {
        return item && item.id && !usedIds[item.id];
      });
      for (var i = pool.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
      }
      var chosen = pool.slice(0, count);
      chosen.forEach(function (c) { usedIds[c.id] = true; });
      return chosen;
    }

    function drawFiveMissionsForRole(roleKey) {
      var role = ROLE_CATALOG[roleKey] || { faction: 'Fedeli', mainType: 'Verbale' };
      var activeCat = state.catalog.filter(function (m) { return m && m.active !== false; });
      var byFaction = activeCat.filter(function (m) { return String(m.faction || '').toLowerCase() === String(role.faction || '').toLowerCase(); });
      var mainTypePool = byFaction.filter(function (m) { return String(m.type || '').toLowerCase() === String(role.mainType || '').toLowerCase(); });
      var otherPool = byFaction.filter(function (m) { return String(m.type || '').toLowerCase() !== String(role.mainType || '').toLowerCase(); });
      var fallbackPool = activeCat.filter(function (m) { return String(m.faction || '').toLowerCase() !== String(role.faction || '').toLowerCase(); });

      var used = {};
      var selected = [];
      selected = selected.concat(pickRandom(mainTypePool, 3, used));
      selected = selected.concat(pickRandom(otherPool, 2, used));
      if (selected.length < 5) {
        selected = selected.concat(pickRandom(byFaction, 5 - selected.length, used));
      }
      if (selected.length < 5) {
        selected = selected.concat(pickRandom(fallbackPool, 5 - selected.length, used));
      }

      return selected.slice(0, 5).map(function (m, idx) {
        return {
          slot: idx + 1,
          id: m.id,
          title: m.title,
          type: m.type || 'Missione',
          faction: m.faction || role.faction,
          difficulty: m.difficulty || 'Media',
          repeatable: Boolean(m.repeatable),
          points: Number(m.points || 1),
          desc: m.description || '',
          playerClaimedDone: false,
          masterApproved: false
        };
      });
    }

    window.masterDrawAllMissions = async function () {
      if (!state.players.length) {
        return setBanner('Aggiungi prima almeno un giocatore al tavolo.', 'error');
      }
      var nextAssignments = Object.assign({}, state.missionAssignments || {});
      state.players.forEach(function (p) {
        var pKey = String(p.name || '').trim().toLowerCase();
        if (!pKey) return;
        if (p.assignedRoleKey === 'martire') {
          nextAssignments[pKey] = [];
        } else {
          nextAssignments[pKey] = drawFiveMissionsForRole(p.assignedRoleKey || 'investigatore');
        }
      });
      state.missionAssignments = nextAssignments;
      state.banner = { text: 'Pesca 3+2 completata per i giocatori attivi.', type: 'success' };
      await syncPatchToCloud({ missionAssignments: state.missionAssignments });
      render();
    };

    window.masterApproveMission = async function (playerKey, slotIdx) {
      var k = String(playerKey || '').trim().toLowerCase();
      var list = Array.isArray(state.missionAssignments[k]) ? state.missionAssignments[k].slice() : [];
      var item = list[slotIdx];
      if (!item) return;
      var wasApproved = Boolean(item.masterApproved);
      var ptsDelta = Number(item.points || 1);
      item.masterApproved = !wasApproved;
      if (!wasApproved) item.playerClaimedDone = true;
      list[slotIdx] = item;
      state.missionAssignments = Object.assign({}, state.missionAssignments, { [k]: list });

      var curPts = Number(state.playerPoints[k] || 0);
      var nextPts = Math.max(0, curPts + (wasApproved ? -ptsDelta : ptsDelta));
      state.playerPoints = Object.assign({}, state.playerPoints, { [k]: nextPts });

      await syncPatchToCloud({
        missionAssignments: state.missionAssignments,
        playerPoints: state.playerPoints
      });
      render();
    };

    window.masterAdjustPoints = async function (playerName, delta) {
      var k = String(playerName || '').trim().toLowerCase();
      if (!k) return;
      var cur = Number(state.playerPoints[k] || 0);
      var next = Math.max(0, cur + Number(delta || 0));
      state.playerPoints = Object.assign({}, state.playerPoints, { [k]: next });
      await syncPatchToCloud({ playerPoints: state.playerPoints });
      render();
    };

    function setBanner(text, type) {
      state.banner = { text: text, type: type || 'info' };
      persistLocal();
      render();
    }

    function getParagraphs() {
      var room = state.roomCode || 'TAVOLO1';
      var custom = String(state.customSpeechText || '').trim();
      if (custom) {
        return custom.split(/\r?\n\s*\r?\n/).map(function (part) {
          return part.replace(/\{\{STANZA\}\}/gi, room).trim();
        }).filter(Boolean);
      }
      return (SPEECH_TEMPLATES[state.speechTone] || SPEECH_TEMPLATES.suspense).map(function (line) {
        return line.replace(/\{\{STANZA\}\}/gi, room);
      });
    }

    window.masterSetTone = function (tone) {
      if (!SPEECH_TEMPLATES[tone]) return;
      state.speechTone = tone;
      state.customSpeechText = '';
      state.activeParagraphIndex = 0;
      persistLocal();
      render();
    };

    window.masterSetCustomSpeech = function (val) {
      state.customSpeechText = String(val || '');
      state.activeParagraphIndex = 0;
      persistLocal();
      render();
    };

    window.masterSelectParagraph = function (idx) {
      var list = getParagraphs();
      if (!list.length) return;
      state.activeParagraphIndex = Math.max(0, Math.min(list.length - 1, Number(idx || 0)));
      persistLocal();
      render();
    };

    window.masterCopySpeech = function () {
      var text = getParagraphs().join('\n\n');
      if (!text) return setBanner('Nessun testo del discorso da copiare.', 'error');
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        setBanner('Discorso copiato negli appunti.', 'success');
      } catch (_e) {
        setBanner('Impossibile copiare il testo.', 'error');
      }
    };

    window.masterAdjustRole = async function (roleKey, delta) {
      if (!ROLE_CATALOG[roleKey]) return;
      state.roleCounts[roleKey] = Math.max(0, Math.min(12, Number(state.roleCounts[roleKey] || 0) + delta));
      state.banner = null;
      await syncPatchToCloud({ roleCounts: state.roleCounts });
      render();
    };

    window.masterAddPlayer = async function (name) {
      var clean = String(name || '').trim();
      if (!clean) return setBanner('Inserisci un nome valido.', 'error');
      if (state.players.some(function (p) { return p.name.toLowerCase() === clean.toLowerCase(); })) {
        return setBanner('Giocatore già presente al tavolo.', 'info');

    function compressMasterSelfie(file, maxSize, quality) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function (ev) {
          var img = new Image();
          img.onload = function () {
            var ratio = Math.min(1, maxSize / Math.max(img.width || 1, img.height || 1));
            var w = Math.max(1, Math.round((img.width || maxSize) * ratio));
            var h = Math.max(1, Math.round((img.height || maxSize) * ratio));
            var canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            var ctx = canvas.getContext('2d');
            if (!ctx) return resolve(String(ev.target.result || ''));
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = String(ev.target.result || '');
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    window.masterHandleSelfieChange = async function (inputEl) {
      var file = inputEl && inputEl.files && inputEl.files[0];
      if (!file) return;

      var mKey = (state.masterName || 'Master').trim().toLowerCase();
      var nextSelfies = Object.assign({}, state.playerSelfies || {});
      nextSelfies[mKey] = compressed;
      state.masterSelfie = compressed;
      state.playerSelfies = nextSelfies;
      try {
        var accRaw = safeGetItem(ACCESS_KEY);
        var accObj = accRaw ? JSON.parse(accRaw) : {};
        accObj.selfieDataUrl = compressed;
        safeSetItem(ACCESS_KEY, JSON.stringify(accObj));

      await syncPatchToCloud({ masterName: state.masterName || 'Master', masterSelfie: compressed, playerSelfies: nextSelfies });
      render();

    function computeTiedTopTwo(votes) {
      if (!Array.isArray(votes) || !votes.length) return [];
      var counts = {};
      votes.forEach(function (v) {
        var t = String((v && v.targetName) || '').trim();
        if (t) counts[t] = (counts[t] || 0) + 1;
      });
      var entries = Object.keys(counts).map(function (k) { return { name: k, count: counts[k] }; });
      entries.sort(function (a, b) { return b.count - a.count; });
      if (entries.length < 2) return [];
      var topVal = entries[0].count;
      var tied = entries.filter(function (e) { return e.count === topVal; });
      if (tied.length >= 2) return [tied[0].name, tied[1].name];
      var secondVal = entries[1].count;
      var seconds = entries.filter(function (e) { return e.count === secondVal; });
      if (seconds.length === 1) return [entries[0].name, seconds[0].name];
      return [];
    }

            '<button type="button" onclick="masterSetTvMode(\'win_traditori\')" style="padding:8px 11px;border-radius:9px;border:none;background:#e05260;color:#fff;font-weight:700;font-size:12px;cursor:pointer;">Vittoria Traditori</button>' +
            '<button type="button" onclick="masterSetTvMode(\'win_solitario\')" style="padding:8px 11px;border-radius:9px;border:none;background:#7c8cff;color:#fff;font-weight:700;font-size:12px;cursor:pointer;">Vittoria Solitaria</button>' +
            '<button type="button" onclick="masterToggleTvVideoPlay()" style="padding:8px 11px;border-radius:9px;border:1px solid rgba(229,184,92,0.45);background:' + (isPaused ? '#e5b85c' : '#1d2230') + ';color:' + (isPaused ? '#0c0e14' : '#e5b85c') + ';font-weight:700;font-size:12px;cursor:pointer;">' + (isPaused ? 'Riprendi Video TV' : 'Pausa Video TV') + '</button>' +
            '<button type="button" onclick="masterSetTvMode(\'idle\')" style="padding:8px 11px;border-radius:9px;border:1px solid rgba(255,255,255,0.16);background:#1d2230;color:#9ca3af;font-weight:700;font-size:12px;cursor:pointer;">Stand-by TV</button>' +
          '</div>' +
        '</section>'
      );
    }

    function renderMissionsAndPointsSection() {
      var cards = state.players.length
        ? state.players.map(function (p) {
            var pKey = String(p.name || '').trim().toLowerCase();
            var r = p.assignedRoleKey ? ROLE_CATALOG[p.assignedRoleKey] : null;
            var pts = Number((state.playerPoints && state.playerPoints[pKey]) || 0);
            var mList = Array.isArray(state.missionAssignments[pKey]) ? state.missionAssignments[pKey] : [];
            var safeKey = pKey.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            var safeName = String(p.name || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");

            var mHtml = p.assignedRoleKey === 'martire'
              ? '<div class="subtext">Il Martire non ha missioni standard: ottiene punti quando subisce missioni altrui.</div>'
              : (mList.length
                  ? '<div style="display:flex;flex-direction:column;gap:6px;">' + mList.map(function (m, sIdx) {
                      var flag = m.masterApproved
                        ? '<span style="color:#3ec98c;font-weight:700;">Approvata ✓</span>'
                        : (m.playerClaimedDone
                            ? '<span style="color:#e5b85c;font-weight:700;">Segnalata dal giocatore</span>'
                            : '<span style="color:#9ca3af;">In corso</span>');
                      return (
                        '<div class="mission-chip">' +
                          '<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;">' +
                            '<strong>' + escapeHtml(m.id || ('M' + (sIdx + 1))) + ' · ' + escapeHtml(m.title) + '</strong>' +
                            '<button type="button" class="btn-small" onclick="masterApproveMission(\'' + safeKey + '\', ' + sIdx + ')">' + (m.masterApproved ? 'Revoca' : 'Approva +1pt') + '</button>' +
                          '</div>' +
                          '<div style="font-size:11px;color:#9ca3af;margin-top:2px;">' + escapeHtml(m.type) + ' · ' + (m.repeatable ? 'Ripetibile' : 'Singola') + ' · ' + flag + '</div>' +
                        '</div>'
                      );
                    }).join('') + '</div>'
                  : '<div class="subtext">Nessuna missione pescata ancora.</div>');

            return (
              '<div class="board-card">' +
                '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">' +
                  '<div>' +
                    '<div class="player-name">' + escapeHtml(p.name) + (p.isDead ? ' <span style="color:var(--crimson);font-size:11px;">[MORTO]</span>' : '') + '</div>' +
                    '<div class="player-sub">' + (r ? '<span class="badge badge-' + r.faction + '">' + escapeHtml(r.name) + ' · ' + escapeHtml(r.faction) + '</span>' : 'Nessun ruolo') + '</div>' +
                  '</div>' +
                  '<div style="display:flex;align-items:center;gap:6px;">' +
                    '<button type="button" class="btn-step" onclick="masterAdjustPoints(\'' + safeName + '\', -1)">-</button>' +
                    '<span class="pts-pill">' + pts + ' pt</span>' +
                    '<button type="button" class="btn-step" onclick="masterAdjustPoints(\'' + safeName + '\', 1)">+</button>' +
                  '</div>' +
                '</div>' +
                mHtml +
              '</div>'
            );
          }).join('')
        : '<p class="subtext">Nessun giocatore al tavolo.</p>';

      return (
        '<section class="card">' +
          '<div class="section-head">' +
            '<div><span class="eyebrow">Catalogo JSON · ' + escapeHtml(state.catalogSource) + '</span><h2>Missioni 3+2 & Punti Giocatori</h2></div>' +
            '<button type="button" class="btn-gold" onclick="masterDrawAllMissions()">Pesca 5 Missioni (3+2)</button>' +
          '</div>' +
          '<div class="board-grid">' + cards + '</div>' +
        '</section>'
      );
    }

    function renderChatSection() {
      var isTraitor = state.chatTab === 'traitors';
      var list = isTraitor
        ? state.traitorChat
        : state.masterChat.filter(function (m) {
            if (state.playerFilter === 'ALL') return true;
            return String(m.playerName || '').toLowerCase() === String(state.playerFilter).toLowerCase();
          });

      var msgsHtml = list.length
        ? list.map(function (m) {
            var label = m.fromMaster
              ? (escapeHtml(m.senderName || 'Master') + (m.playerName ? ' -> ' + escapeHtml(m.playerName) : ' (Tutti)'))
              : escapeHtml(m.senderName || 'Giocatore');
            return (
              '<div class="msg-card ' + (m.fromMaster ? 'from-master' : '') + '">' +
                '<div class="msg-head"><span class="msg-sender">' + label + '</span><span>' + escapeHtml(formatClock(m.createdAt)) + '</span></div>' +
                '<p class="msg-body">' + escapeHtml(m.text) + '</p>' +
              '</div>'
            );
          }).join('')
        : '<p class="subtext">Nessun messaggio in questo canale.</p>';

      var optionsHtml = state.players.map(function (p) {
        var sel = String(state.playerFilter).toLowerCase() === String(p.name).toLowerCase() ? ' selected' : '';
        return '<option value="' + escapeHtml(p.name) + '"' + sel + '>' + escapeHtml(p.name) + '</option>';
      }).join('');

      return (
        '<section class="card">' +
          '<div class="section-head">' +
            '<div><span class="eyebrow">Comunicazioni Master</span><h2>' + (isTraitor ? 'Chat Traditori' : 'Chat Diretta Giocatori') + '</h2></div>' +
            '<div class="btn-row">' +
              '<button type="button" class="' + (!isTraitor ? 'btn-gold' : 'btn-ghost') + '" onclick="masterSetChatTab(\'master\')">Chat Diretta</button>' +
              '<button type="button" class="' + (isTraitor ? 'btn-crimson' : 'btn-ghost') + '" onclick="masterSetChatTab(\'traitors\')">Chat Traditori</button>' +
            '</div>' +
          '</div>' +
          (!isTraitor
            ? '<div style="max-width:340px;margin-bottom:10px;"><label for="master-filter-sel">Destinatario</label><select id="master-filter-sel" onchange="masterSetPlayerFilter(this.value)"><option value="ALL">Tutti i giocatori</option>' + optionsHtml + '</select></div>'
            : '') +
          '<div class="chat-box">' + msgsHtml + '</div>' +
          '<div class="chat-form">' +
            '<input id="master-chat-input" type="text" value="' + escapeHtml(chatDraft) + '" oninput="masterUpdateChatDraft(this.value)" onkeydown="if(event.key===\'Enter\'){event.preventDefault();masterSendChat();}" placeholder="Scrivi un messaggio..." />' +
            '<button type="button" class="btn-gold" onclick="masterSendChat()">Invia</button>' +
          '</div>' +
        '</section>'
      );
    }

    function render() {
      var root = document.getElementById('master-roles-app');
      if (!root) return;
      var totalRoles = Object.keys(ROLE_CATALOG).reduce(function (acc, k) { return acc + Number(state.roleCounts[k] || 0); }, 0);
      var paragraphs = getParagraphs();
      var activeIdx = paragraphs.length ? Math.min(state.activeParagraphIndex, paragraphs.length - 1) : 0;
      var syncId = 'SYNC-' + state.roomCode;
      var bannerHtml = state.banner ? '<div class="banner banner-' + state.banner.type + '">' + escapeHtml(state.banner.text) + '</div>' : '';

      if (state.boardOpened) {
        root.innerHTML =
          '<header class="card header-row">' +
            '<div><span class="eyebrow">Plancia Master · ' + escapeHtml(state.syncStatus) + '</span><h1>Tavolo di ' + escapeHtml(state.roomCode) + '</h1><p class="subtext">Master: <strong>' + escapeHtml(state.masterName) + '</strong> · ID Sync: <strong class="mono">' + escapeHtml(syncId) + '</strong></p></div>' +
            '<div class="btn-row">' +
              '<button type="button" class="btn-gold" onclick="masterOpenCeremony()">Cerimonia e Ruoli</button>' +
              '<button type="button" class="btn-ghost" onclick="masterGoTo(\'ruoli.html\')">Tutti i Ruoli</button>' +
              '<button type="button" class="btn-ghost" onclick="masterGoTo(\'index.html\')">Accesso</button>' +
            '</div>' +
          '</header>' +
          bannerHtml +
          renderTvOvalRegiaSection() +
          renderMissionsAndPointsSection() +
          renderChatSection();
        return;
      }

      var speechItemsHtml = paragraphs.map(function (line, idx) {
        var active = idx === activeIdx;
        return (
          '<div class="speech-item ' + (active ? 'active' : '') + '" onclick="masterSelectParagraph(' + idx + ')">' +
            '<div class="speech-meta"><span style="color:' + (active ? 'var(--gold)' : 'var(--muted)') + ';">Parte ' + (idx + 1) + ' di ' + paragraphs.length + '</span>' + (active ? '<span class="pill-gold">In lettura</span>' : '') + '</div>' +
            '<p class="speech-text">' + escapeHtml(line) + '</p>' +
          '</div>'
        );
      }).join('');

      var roleCardsHtml = Object.keys(ROLE_CATALOG).map(function (k) {
        var role = ROLE_CATALOG[k];
        var cnt = Number(state.roleCounts[k] || 0);
        return (
          '<div class="role-box">' +
            '<div><div class="role-top"><span class="role-name">' + escapeHtml(role.name) + '</span><span class="badge badge-' + role.faction + '">' + escapeHtml(role.faction) + '</span></div><p class="role-summary">' + escapeHtml(role.summary) + '</p></div>' +
            '<div class="role-counter"><span>Copie:</span><div class="counter-btns"><button type="button" class="btn-step" onclick="masterAdjustRole(\'' + k + '\', -1)">-</button><span class="count-val">' + cnt + '</span><button type="button" class="btn-step" onclick="masterAdjustRole(\'' + k + '\', 1)">+</button></div></div>' +
          '</div>'
        );
      }).join('');

      var playersHtml = state.players.length
        ? state.players.map(function (p) {
            var role = p.assignedRoleKey ? ROLE_CATALOG[p.assignedRoleKey] : null;
            var safeId = String(p.id || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            return (
              '<div class="player-row">' +
                '<div><div class="player-name">' + escapeHtml(p.name) + (p.isDead ? ' <span style="color:var(--crimson);font-size:11px;">[MORTO]</span>' : '') + '</div><div class="player-sub">' + (role ? '<span class="badge badge-' + role.faction + '">' + escapeHtml(role.name) + ' (' + escapeHtml(role.faction) + ')</span>' : 'In attesa di ruolo') + '</div></div>' +
                '<button type="button" class="btn-small btn-remove" onclick="masterRemovePlayer(\'' + safeId + '\')">Rimuovi</button>' +
              '</div>'
            );
          }).join('')
        : '<p class="subtext">Nessun giocatore ancora al tavolo.</p>';

      root.innerHTML =
        '<header class="card header-row">' +
          '<div><span class="eyebrow">Pagina Master · ' + escapeHtml(state.syncStatus) + '</span><h1>Cerimonia di Assegnazione Ruoli</h1><p class="subtext">Master: <strong>' + escapeHtml(state.masterName) + '</strong> · Stanza: <strong>' + escapeHtml(state.roomCode) + '</strong> · ID Sync: <strong class="mono">' + escapeHtml(syncId) + '</strong></p></div>' +
          '<div class="btn-row">' +
            '<button type="button" class="btn-emerald" onclick="masterOpenBoard()">Plancia Master</button>' +
            '<button type="button" class="btn-ghost" onclick="masterGoTo(\'ruoli.html\')">Tutti i Ruoli</button>' +
            '<button type="button" class="btn-ghost" onclick="masterGoTo(\'index.html\')">Accesso</button>' +
            '<button type="button" class="btn-gold" onclick="masterAssignRoles()">Assegna Ruoli</button>' +
            '<button type="button" class="btn-ghost" onclick="masterResetRoles()">Azzera Ruoli</button>' +
          '</div>' +
        '</header>' +
        bannerHtml +
        '<section class="card card-gold">' +
          '<div class="section-head"><div><span class="eyebrow">Prompter del Master</span><h2>Discorso di Assegnazione Ruoli</h2></div><div class="btn-row"><button type="button" class="' + (!state.customSpeechText && state.speechTone === 'suspense' ? 'btn-gold' : 'btn-ghost') + '" onclick="masterSetTone(\'suspense\')">Suspense</button><button type="button" class="' + (!state.customSpeechText && state.speechTone === 'solenne' ? 'btn-gold' : 'btn-ghost') + '" onclick="masterSetTone(\'solenne\')">Solenne</button><button type="button" class="' + (!state.customSpeechText && state.speechTone === 'rapido' ? 'btn-gold' : 'btn-ghost') + '" onclick="masterSetTone(\'rapido\')">Rapido</button><button type="button" class="btn-ghost" onclick="masterCopySpeech()">Copia</button></div></div>' +
          '<div class="speech-list">' + speechItemsHtml + '</div>' +
          '<div class="speech-controls"><div class="btn-row"><button type="button" class="btn-ghost" onclick="masterSelectParagraph(' + (activeIdx - 1) + ')"' + (activeIdx <= 0 ? ' disabled' : '') + '>Precedente</button><button type="button" class="btn-indigo" onclick="masterSelectParagraph(' + (activeIdx + 1) + ')"' + (activeIdx >= paragraphs.length - 1 ? ' disabled' : '') + '>Successiva</button></div><span class="subtext">Usa <code>{{STANZA}}</code> per il codice stanza.</span></div>' +
          '<div class="custom-speech-box"><label for="master-custom-speech">Discorso personalizzato</label><textarea id="master-custom-speech" rows="2" oninput="masterSetCustomSpeech(this.value)">' + escapeHtml(state.customSpeechText) + '</textarea></div>' +
        '</section>' +
        '<div class="two-col">' +
          '<section class="card"><div class="section-head"><h2>1. Ruoli</h2><span class="subtext">Totale: <strong style="color:var(--gold);">' + totalRoles + '</strong></span></div><div class="roles-grid">' + roleCardsHtml + '</div></section>' +
          '<section class="card"><div class="section-head"><h2>2. Giocatori (' + state.players.length + ')</h2></div><form class="add-form" onsubmit="event.preventDefault(); var inp = document.getElementById(\'master-player-input\'); masterAddPlayer(inp.value); inp.value = \'\';"><input id="master-player-input" type="text" maxlength="24" placeholder="Nome giocatore..." /><button type="submit" class="btn-indigo">Aggiungi</button></form><div class="player-list">' + playersHtml + '</div></section>' +
        '</div>' +
        renderTvOvalRegiaSection() +
        '<div class="footer-action"><button type="button" class="btn-emerald-lg" onclick="masterOpenBoard()">Completa e Vai alla Plancia Master</button></div>';
    }

    render();
    loadCatalogJson();
    subscribeToRoomCloud();
  </script>
</body>
</html>
