<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ombre al Tavolo — Master: Assegnazione Ruoli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    // Configurazione tema scuro e palette cromatica per la console del Master
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Cinzel', 'serif'],
          },
          colors: {
            bgdark: '#0c0e14',
            surface: '#151924',
            surface2: '#1d2230',
            gold: '#e5b85c',
            crimson: '#e05260',
            emerald: '#3ec98c',
            indigo: '#7c8cff',
          }
        }
      }
    };
  </script>
  <style>
    /* Stile base per la lettura del discorso del Master e l'uso al tavolo */
    body {
      background-color: #0c0e14;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-bgdark text-gray-100 antialiased">
  <div id="master-roles-app" class="max-w-5xl mx-auto px-4 py-6 sm:py-8 space-y-6"></div>

  <script>
    const ACCESS_STORAGE_KEY = 'ombre_accesso_tavolo_v1';
    const MASTER_ROLES_STORAGE_KEY = 'ombre_master_assegnazione_ruoli_v1';

    // Catalogo ruoli disponibili con descrizione e fazione
    const ROLE_CATALOG = {
      investigatore: {
        name: 'Investigatore',
        faction: 'Cittadini',
        badgeClass: 'bg-emerald/15 text-emerald border-emerald/40',
        summary: 'Indaga di notte o durante la fase dedicata per scoprire la fazione di un sospetto.'
      },
      guardia: {
        name: 'Guardia',
        faction: 'Cittadini',
        badgeClass: 'bg-emerald/15 text-emerald border-emerald/40',
        summary: 'Protegge un giocatore al tavolo riducendo il rischio di eliminazione nel turno.'
      },
      cacciatore: {
        name: 'Cacciatore',
        faction: 'Cittadini',
        badgeClass: 'bg-emerald/15 text-emerald border-emerald/40',
        summary: 'Può compiere un colpo mirato contro un bersaglio valutando il contraccolpo.'
      },
      martire: {
        name: 'Martire',
        faction: 'Cittadini',
        badgeClass: 'bg-emerald/15 text-emerald border-emerald/40',
        summary: 'Lascia un indizio o una testimonianza sul tavolo se viene eliminato.'
      },
      assassino: {
        name: 'Assassino',
        faction: 'Traditori',
        badgeClass: 'bg-crimson/15 text-crimson border-crimson/40',
        summary: 'Agisce nell’ombra per colpire un bersaglio senza farsi scoprire.'
      },
      sabotatore: {
        name: 'Sabotatore',
        faction: 'Traditori',
        badgeClass: 'bg-crimson/15 text-crimson border-crimson/40',
        summary: 'Semina dubbi, altera le informazioni o ostacola le mosse avversarie.'
      }
    };

    // Modelli di discorso narrativo per il Master durante l'assegnazione dei ruoli
    const SPEECH_TEMPLATES = {
      suspense: [
        'Signore e signori, prendete posto intorno al tavolo e abbassate la voce: la notte sta calando su {{STANZA}}.',
        'Ciascuno di voi sta per ricevere un destino segreto. Non mostrate alcuna emozione quando leggerete il vostro ruolo: da questo momento, ogni sguardo può essere una trappola.',
        'I Cittadini cercano ordine e verità; i Traditori si nascondono tra le ombre, pronti a colpire quando meno ve lo aspettate.',
        'Controllate la vostra scheda personale, memorizzate il vostro ruolo e tenetelo ben nascosto. Quando il Master batterà le mani, la partita avrà inizio.'
      ],
      solenne: [
        'Benvenuti a {{STANZA}}. Il consiglio è riunito e le carte del destino sono state mescolate.',
        'Ogni giocatore riceve ora un incarico riservato. Il vostro ruolo definisce chi potete fidare e chi dovrete smascherare.',
        'Ricordate: le parole al tavolo pesano quanto le azioni. Chi difende la luce e chi trama nel buio sarà chiaro solo col tempo.',
        'Chiudete gli occhi o distogliete lo sguardo dagli altri schermi, leggete la vostra scheda e preparatevi al primo turno.'
      ],
      rapido: [
        'Tavolo di {{STANZA}}, attenzione! I ruoli sono stati estratti e assegnati.',
        'Aprite la vostra scheda, controllate il vostro ruolo e non fatelo vedere a nessuno.',
        'Ricordatevi la vostra fazione e il vostro potere. Appena tutti sono pronti, partiamo subito con il primo turno!'
      ]
    };

    // Legge i dati di accesso condivisi se presenti in localStorage
    function readAccessContext() {
      try {
        const raw = localStorage.getItem(ACCESS_STORAGE_KEY);
        if (!raw) {
          return { roomCode: 'TAVOLO1', masterName: 'Master' };
        }
        const parsed = JSON.parse(raw);
        const roomCode = String(parsed.roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1';
        const masterName = String(parsed.playerName || '').trim() || 'Master';
        return { roomCode, masterName };
      } catch (err) {
        console.error('Errore lettura contesto accesso:', err);
        return { roomCode: 'TAVOLO1', masterName: 'Master' };
      }
    }

    // Crea lo stato iniziale della pagina Master di assegnazione ruoli
    function createInitialMasterRoleState() {
      const ctx = readAccessContext();
      return {
        roomCode: ctx.roomCode,
        masterName: ctx.masterName,
        roleCounts: {
          investigatore: 1,
          guardia: 1,
          cacciatore: 1,
          martire: 0,
          assassino: 1,
          sabotatore: 1
        },
        players: [
          { id: 'pl_1', name: 'Elena', assignedRoleKey: null },
          { id: 'pl_2', name: 'Marco', assignedRoleKey: null },
          { id: 'pl_3', name: 'Sofia', assignedRoleKey: null },
          { id: 'pl_4', name: 'Luca', assignedRoleKey: null }
        ],
        speechTone: 'suspense', // 'suspense' | 'solenne' | 'rapido'
        customSpeech: '',
        useCustomSpeech: false,
        activeParagraphIndex: 0,
        assignmentCompleted: false,
        banner: null
      };
    }

    // Carica lo stato salvato in sicurezza tramite try/catch
    function loadMasterRoleState() {
      try {
        const ctx = readAccessContext();
        const base = createInitialMasterRoleState();
        const raw = localStorage.getItem(MASTER_ROLES_STORAGE_KEY);
        if (!raw) {
          return { ...base, roomCode: ctx.roomCode, masterName: ctx.masterName };
        }
        const parsed = JSON.parse(raw);
        const mergedCounts = { ...base.roleCounts };
        if (parsed.roleCounts && typeof parsed.roleCounts === 'object') {
          Object.keys(mergedCounts).forEach(key => {
            mergedCounts[key] = Math.max(0, Math.min(12, Number(parsed.roleCounts[key] ?? mergedCounts[key])));
          });
        }
        return {
          ...base,
          ...parsed,
          roomCode: ctx.roomCode,
          masterName: ctx.masterName,
          roleCounts: mergedCounts,
          players: Array.isArray(parsed.players) ? parsed.players : base.players
        };
      } catch (err) {
        console.error('Errore caricamento stato assegnazione ruoli Master:', err);
        return createInitialMasterRoleState();
      }
    }

    let masterState = loadMasterRoleState();

    // Salva lo stato della pagina Master
    function saveMasterRoleState() {
      try {
        localStorage.setItem(MASTER_ROLES_STORAGE_KEY, JSON.stringify(masterState));
      } catch (err) {
        console.error('Errore salvataggio stato assegnazione ruoli Master:', err);
      }
    }

    // Imposta un messaggio di feedback per il Master
    function setMasterBanner(text, type = 'info') {
      masterState.banner = { text, type };
      saveMasterRoleState();
      renderMasterRolePage();
    }

    // Restituisce i paragrafi del discorso attivo del Master
    function getSpeechParagraphs() {
      const roomLabel = masterState.roomCode || 'TAVOLO1';
      if (masterState.useCustomSpeech && String(masterState.customSpeech || '').trim()) {
        return String(masterState.customSpeech)
          .split(/\n\s*\n|\n/)
          .map(line => line.trim())
          .filter(Boolean)
          .map(line => line.replace(/\{\{STANZA\}\}/gi, roomLabel));
      }
      const list = SPEECH_TEMPLATES[masterState.speechTone] || SPEECH_TEMPLATES.suspense;
      return list.map(line => line.replace(/\{\{STANZA\}\}/gi, roomLabel));
    }

    // Cambia il tono preimpostato del discorso del Master
    function selectSpeechTone(tone) {
      if (!SPEECH_TEMPLATES[tone]) return;
      masterState.speechTone = tone;
      masterState.useCustomSpeech = false;
      masterState.activeParagraphIndex = 0;
      masterState.banner = null;
      saveMasterRoleState();
      renderMasterRolePage();
    }

    // Aggiorna il testo libero del discorso del Master
    function updateCustomSpeech(text) {
      masterState.customSpeech = String(text || '');
      masterState.useCustomSpeech = masterState.customSpeech.trim().length > 0;
      masterState.activeParagraphIndex = 0;
      saveMasterRoleState();
    }

    // Ripristina il discorso preimpostato cancellando la bozza libera
    function resetToPresetSpeech() {
      masterState.customSpeech = '';
      masterState.useCustomSpeech = false;
      masterState.activeParagraphIndex = 0;
      setMasterBanner('Ripristinato il discorso preimpostato del Master.', 'info');
    }

    // Sposta l'evidenziazione sul paragrafo precedente o successivo durante la lettura al tavolo
    function stepSpeechParagraph(delta) {
      const paragraphs = getSpeechParagraphs();
      if (paragraphs.length === 0) return;
      const nextIdx = (masterState.activeParagraphIndex + delta + paragraphs.length) % paragraphs.length;
      masterState.activeParagraphIndex = nextIdx;
      saveMasterRoleState();
      renderMasterRolePage();
    }

    // Copia l'intero discorso del Master negli appunti
    function copyFullSpeech() {
      const paragraphs = getSpeechParagraphs();
      const fullText = paragraphs.join('\n\n');
      if (!fullText) {
        setMasterBanner('Nessun testo del discorso da copiare.', 'error');
        return;
      }
      try {
        const tempArea = document.createElement('textarea');
        tempArea.value = fullText;
        document.body.appendChild(tempArea);
        tempArea.select();
        tempArea.setSelectionRange(0, tempArea.value.length);
        const copied = document.execCommand('copy');
        document.body.removeChild(tempArea);

        if (copied) {
          setMasterBanner('Discorso di assegnazione ruoli copiato negli appunti.', 'success');
        } else {
          setMasterBanner('Discorso pronto per la lettura al tavolo.', 'info');
        }
      } catch (err) {
        console.error('Errore copia discorso:', err);
        setMasterBanner('Non è stato possibile copiare automaticamente il discorso.', 'error');
      }
    }

    // Modifica il numero di copie di un ruolo nel mazzo
    function changeRoleQuantity(roleKey, delta) {
      if (!ROLE_CATALOG[roleKey]) return;
      const current = Number(masterState.roleCounts[roleKey] || 0);
      masterState.roleCounts[roleKey] = Math.max(0, Math.min(12, current + delta));
      masterState.banner = null;
      saveMasterRoleState();
      renderMasterRolePage();
    }

    // Aggiunge un giocatore al tavolo per l'assegnazione ruoli
    function addPlayerToTable(rawName) {
      const cleanName = String(rawName || '').trim();
      if (!cleanName) {
        setMasterBanner('Inserisci il nome del giocatore prima di aggiungerlo al tavolo.', 'error');
        return;
      }
      masterState.players.push({
        id: 'pl_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        name: cleanName.slice(0, 24),
        assignedRoleKey: null
      });
      masterState.assignmentCompleted = false;
      masterState.banner = null;
      saveMasterRoleState();
      renderMasterRolePage();
    }

    // Rimuove un giocatore dal tavolo
    function removePlayerFromTable(playerId) {
      masterState.players = masterState.players.filter(p => p.id !== playerId);
      masterState.assignmentCompleted = false;
      masterState.banner = null;
      saveMasterRoleState();
      renderMasterRolePage();
    }

    // Estrae casualmente i ruoli configurati e li assegna ai giocatori al tavolo
    function assignRolesRandomly() {
      if (masterState.players.length === 0) {
        setMasterBanner('Aggiungi almeno un giocatore al tavolo prima di assegnare i ruoli.', 'error');
        return;
      }

      const pool = [];
      Object.keys(ROLE_CATALOG).forEach(roleKey => {
        const qty = Number(masterState.roleCounts[roleKey] || 0);
        for (let i = 0; i < qty; i++) {
          pool.push(roleKey);
        }
      });

      if (pool.length < masterState.players.length) {
        setMasterBanner(
          `Hai configurato ${pool.length} ruoli ma ci sono ${masterState.players.length} giocatori al tavolo: aumenta uno o più ruoli.`,
          'error'
        );
        return;
      }

      // Mescolamento casuale Fisher-Yates
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = pool[i];
        pool[i] = pool[j];
        pool[j] = temp;
      }

      const extracted = pool.slice(0, masterState.players.length);
      masterState.players = masterState.players.map((player, idx) => ({
        ...player,
        assignedRoleKey: extracted[idx]
      }));
      masterState.assignmentCompleted = true;
      masterState.activeParagraphIndex = 0;

      setMasterBanner(
        `Assegnati casualmente ${extracted.length} ruoli: ora puoi leggere il discorso al tavolo.`,
        'success'
      );
    }

    // Azzera i ruoli assegnati senza rimuovere i giocatori dal tavolo
    function resetRoleAssignments() {
      masterState.players = masterState.players.map(player => ({
        ...player,
        assignedRoleKey: null
      }));
      masterState.assignmentCompleted = false;
      setMasterBanner('Ruoli assegnati azzerati: i giocatori restano al tavolo.', 'info');
    }

    // Escape HTML per rendere sicuro l'inserimento di testo
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Renderizza la pagina Master per l'assegnazione ruoli e il discorso
    function renderMasterRolePage() {
      const container = document.getElementById('master-roles-app');
      if (!container) return;

      try {
        const totalRoles = Object.values(masterState.roleCounts).reduce((sum, v) => sum + Number(v || 0), 0);
        const paragraphs = getSpeechParagraphs();
        const safeIdx = paragraphs.length > 0
          ? Math.min(masterState.activeParagraphIndex, paragraphs.length - 1)
          : 0;
        const syncId = 'SYNC-' + masterState.roomCode;
        const banner = masterState.banner;

        const bannerHtml = banner
          ? `<div class="rounded-xl border px-4 py-3 text-sm font-medium ${
              banner.type === 'success'
                ? 'bg-emerald/15 border-emerald/40 text-emerald'
                : banner.type === 'error'
                ? 'bg-crimson/15 border-crimson/40 text-crimson'
                : 'bg-indigo/15 border-indigo/40 text-indigo'
            }">${escapeHtml(banner.text)}</div>`
          : '';

        container.innerHTML = `
          <header class="rounded-2xl bg-surface border border-white/10 p-5 sm:p-6 flex flex-wrap items-center justify-between gap-4">
            <div>
              <span class="text-xs font-bold uppercase tracking-widest text-gold">Pagina Master · Assegnazione Ruoli e Discorso</span>
              <h1 class="font-serif text-2xl sm:text-3xl font-bold text-white mt-1">Cerimonia di Assegnazione Ruoli</h1>
              <p class="text-xs text-gray-400 mt-1">
                Master: <strong class="text-gray-200">${escapeHtml(masterState.masterName)}</strong> ·
                Stanza: <strong class="text-gray-200">${escapeHtml(masterState.roomCode)}</strong> ·
                ID Sync: <strong class="font-mono text-emerald">${escapeHtml(syncId)}</strong>
              </p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button
                type="button"
                onclick="assignRolesRandomly()"
                class="px-4 py-2.5 rounded-xl bg-gold text-bgdark text-xs font-bold hover:brightness-110 transition cursor-pointer"
              >
                Assegna Ruoli Casualmente
              </button>
              <button
                type="button"
                onclick="resetRoleAssignments()"
                class="px-3.5 py-2.5 rounded-xl bg-surface2 hover:bg-white/10 border border-white/15 text-xs font-semibold text-gray-200 transition cursor-pointer"
              >
                Azzera Ruoli
              </button>
            </div>
          </header>

          ${bannerHtml}

          <section class="rounded-2xl bg-surface border border-gold/30 p-5 sm:p-6 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <span class="text-xs font-bold uppercase tracking-wider text-gold">Prompter del Master</span>
                <h2 class="font-serif text-xl sm:text-2xl font-bold text-white mt-0.5">Discorso di Assegnazione Ruoli</h2>
              </div>

              <div class="flex flex-wrap items-center gap-2">
                <button
                  type="button"
                  onclick="selectSpeechTone('suspense')"
                  class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition cursor-pointer ${
                    !masterState.useCustomSpeech && masterState.speechTone === 'suspense'
                      ? 'bg-gold/20 border-gold text-gold'
                      : 'bg-bgdark border-white/15 text-gray-300 hover:border-white/30'
                  }"
                >
                  Suspense
                </button>
                <button
                  type="button"
                  onclick="selectSpeechTone('solenne')"
                  class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition cursor-pointer ${
                    !masterState.useCustomSpeech && masterState.speechTone === 'solenne'
                      ? 'bg-gold/20 border-gold text-gold'
                      : 'bg-bgdark border-white/15 text-gray-300 hover:border-white/30'
                  }"
                >
                  Solenne
                </button>
                <button
                  type="button"
                  onclick="selectSpeechTone('rapido')"
                  class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition cursor-pointer ${
                    !masterState.useCustomSpeech && masterState.speechTone === 'rapido'
                      ? 'bg-gold/20 border-gold text-gold'
                      : 'bg-bgdark border-white/15 text-gray-300 hover:border-white/30'
                  }"
                >
                  Rapido
                </button>
                <button
                  type="button"
                  onclick="copyFullSpeech()"
                  class="px-3 py-1.5 rounded-xl bg-surface2 hover:bg-white/10 border border-white/15 text-xs font-semibold text-gray-200 transition cursor-pointer"
                >
                  Copia Testo
                </button>
              </div>
            </div>

            <div class="space-y-2.5">
              ${paragraphs.length === 0
                ? `<div class="rounded-xl bg-bgdark border border-white/10 p-4 text-sm text-gray-400">
                     Scrivi qui sotto il discorso che vuoi leggere al tavolo.
                   </div>`
                : paragraphs.map((line, idx) => {
                    const isCurrent = idx === safeIdx;
                    return `
                      <div
                        onclick="masterState.activeParagraphIndex = ${idx}; saveMasterRoleState(); renderMasterRolePage();"
                        class="rounded-xl border p-4 transition cursor-pointer ${
                          isCurrent
                            ? 'bg-gold/10 border-gold/50 text-white'
                            : 'bg-bgdark border-white/10 text-gray-300 hover:border-white/25'
                        }"
                      >
                        <div class="flex items-center justify-between gap-2 mb-1">
                          <span class="text-[11px] font-bold uppercase tracking-wider ${
                            isCurrent ? 'text-gold' : 'text-gray-500'
                          }">
                            Parte ${idx + 1} di ${paragraphs.length}${isCurrent ? ' · In lettura' : ''}
                          </span>
                        </div>
                        <p class="text-sm sm:text-base leading-relaxed">${escapeHtml(line)}</p>
                      </div>
                    `;
                  }).join('')
              }
            </div>

            <div class="flex flex-wrap items-center justify-between gap-3 pt-1">
              <div class="flex items-center gap-2">
                <button
                  type="button"
                  onclick="stepSpeechParagraph(-1)"
                  class="px-3.5 py-2 rounded-xl bg-surface2 hover:bg-white/10 border border-white/15 text-xs font-semibold text-gray-200 transition cursor-pointer"
                >
                  Parte Precedente
                </button>
                <button
                  type="button"
                  onclick="stepSpeechParagraph(1)"
                  class="px-3.5 py-2 rounded-xl bg-indigo text-white text-xs font-bold hover:brightness-110 transition cursor-pointer"
                >
                  Prossima Parte
                </button>
              </div>

              <span class="text-xs text-gray-400">
                Suggerimento: usa <strong class="text-gray-200">{{STANZA}}</strong> nel testo personalizzato per inserire automaticamente il codice stanza.
              </span>
            </div>

            <div class="pt-3 border-t border-white/10 space-y-2">
              <div class="flex items-center justify-between gap-2">
                <label for="custom-master-speech" class="text-xs font-bold uppercase tracking-wider text-gray-300">
                  Personalizza il Discorso del Master
                </label>
                <button
                  type="button"
                  onclick="resetToPresetSpeech()"
                  class="text-xs font-semibold text-gold hover:underline cursor-pointer"
                >
                  Usa Testo Preimpostato
                </button>
              </div>
              <textarea
                id="custom-master-speech"
                rows="3"
                oninput="updateCustomSpeech(this.value)"
                placeholder="Scrivi qui un discorso su misura per la tua serata (es. 'Benvenuti a {{STANZA}}...'). Ogni riga o paragrafo diventa una tappa di lettura."
                class="w-full rounded-xl bg-bgdark border border-white/15 px-4 py-3 text-sm text-white focus:outline-none focus:border-gold"
              >${escapeHtml(masterState.customSpeech)}</textarea>
            </div>
          </section>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <section class="rounded-2xl bg-surface border border-white/10 p-5 space-y-4">
              <div class="flex items-center justify-between gap-2">
                <h2 class="font-serif text-xl font-bold text-white">1. Mazzo dei Ruoli</h2>
                <span class="text-xs px-3 py-1 rounded-full bg-bgdark border border-white/10 text-gray-300">
                  Totale ruoli: <strong class="text-gold">${totalRoles}</strong>
                </span>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${Object.entries(ROLE_CATALOG).map(([key, role]) => {
                  const count = Number(masterState.roleCounts[key] || 0);
                  return `
                    <div class="rounded-xl bg-bgdark border border-white/10 p-3.5 flex flex-col justify-between gap-3">
                      <div>
                        <div class="flex items-center justify-between gap-2">
                          <span class="font-semibold text-sm text-white">${escapeHtml(role.name)}</span>
                          <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full border ${role.badgeClass}">
                            ${escapeHtml(role.faction)}
                          </span>
                        </div>
                        <p class="text-xs text-gray-400 mt-1.5">${escapeHtml(role.summary)}</p>
                      </div>
                      <div class="flex items-center justify-between pt-2 border-t border-white/10">
                        <span class="text-xs text-gray-400">Copie:</span>
                        <div class="flex items-center gap-2">
                          <button
                            type="button"
                            onclick="changeRoleQuantity('${key}', -1)"
                            class="w-7 h-7 rounded-lg bg-surface2 hover:bg-white/10 text-xs font-bold text-gray-200 cursor-pointer"
                          >-</button>
                          <span class="w-6 text-center text-sm font-bold text-gold">${count}</span>
                          <button
                            type="button"
                            onclick="changeRoleQuantity('${key}', 1)"
                            class="w-7 h-7 rounded-lg bg-surface2 hover:bg-white/10 text-xs font-bold text-gray-200 cursor-pointer"
                          >+</button>
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </section>

            <section class="rounded-2xl bg-surface border border-white/10 p-5 space-y-4">
              <div class="flex items-center justify-between gap-2">
                <h2 class="font-serif text-xl font-bold text-white">2. Giocatori e Ruoli Estratti (${masterState.players.length})</h2>
                <span class="text-xs font-semibold ${
                  masterState.assignmentCompleted ? 'text-emerald' : 'text-gray-400'
                }">
                  ${masterState.assignmentCompleted ? 'Ruoli assegnati' : 'In attesa'}
                </span>
              </div>

              <form
                onsubmit="event.preventDefault(); const inp = document.getElementById('master-add-player'); addPlayerToTable(inp.value); inp.value = '';"
                class="flex gap-2"
              >
                <input
                  id="master-add-player"
                  type="text"
                  maxlength="24"
                  placeholder="Aggiungi giocatore al tavolo..."
                  class="flex-1 rounded-xl bg-bgdark border border-white/15 px-3.5 py-2 text-sm text-white focus:outline-none focus:border-indigo"
                />
                <button
                  type="submit"
                  class="px-4 py-2 rounded-xl bg-indigo text-white text-xs font-semibold hover:brightness-110 transition cursor-pointer"
                >
                  Aggiungi
                </button>
              </form>

              <div class="space-y-2.5">
                ${masterState.players.length === 0
                  ? `<div class="rounded-xl bg-bgdark border border-white/10 p-4 text-xs text-gray-400 text-center">
                       Nessun giocatore al tavolo. Aggiungi almeno un giocatore per estrarre i ruoli.
                     </div>`
                  : masterState.players.map(player => {
                      const roleInfo = player.assignedRoleKey ? ROLE_CATALOG[player.assignedRoleKey] : null;
                      return `
                        <div class="rounded-xl bg-bgdark border border-white/10 p-3.5 flex items-center justify-between gap-3">
                          <div>
                            <div class="font-semibold text-sm text-white">${escapeHtml(player.name)}</div>
                            <div class="text-xs mt-1">
                              ${roleInfo
                                ? `<span class="font-semibold px-2 py-0.5 rounded-full border ${roleInfo.badgeClass}">${escapeHtml(roleInfo.name)} · ${escapeHtml(roleInfo.faction)}</span>`
                                : `<span class="text-gray-400">Ruolo non ancora assegnato</span>`
                              }
                            </div>
                          </div>
                          <button
                            type="button"
                            onclick="removePlayerFromTable('${player.id}')"
                            class="px-2.5 py-1.5 rounded-lg bg-surface2 hover:bg-crimson/20 text-xs text-gray-300 hover:text-crimson transition cursor-pointer"
                          >
                            Rimuovi
                          </button>
                        </div>
                      `;
                    }).join('')
                }
              </div>
            </section>
          </div>
        `;
      } catch (err) {
        console.error('Errore rendering pagina Master assegnazione ruoli:', err);
        container.innerHTML = `
          <div class="rounded-2xl bg-surface border border-crimson/40 p-6 text-sm text-crimson">
            Errore durante il caricamento della pagina Master. Ricarica la pagina.
          </div>
        `;
      }
    }

    // Esposizione esplicita delle funzioni usate nei controlli HTML
    window.selectSpeechTone = selectSpeechTone;
    window.updateCustomSpeech = updateCustomSpeech;
    window.resetToPresetSpeech = resetToPresetSpeech;
    window.stepSpeechParagraph = stepSpeechParagraph;
    window.copyFullSpeech = copyFullSpeech;
    window.changeRoleQuantity = changeRoleQuantity;
    window.addPlayerToTable = addPlayerToTable;
    window.removePlayerFromTable = removePlayerFromTable;
    window.assignRolesRandomly = assignRolesRandomly;
    window.resetRoleAssignments = resetRoleAssignments;

    renderMasterRolePage();
  </script>
</body>
</html>
