<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ombre al Tavolo — Accesso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    // Configurazione tema scuro e colori per la pagina di accesso
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Cinzel', 'serif'],
          },
          colors: {
            bgdark: '#0c0e14',
            surface: '#151924',
            surface2: '#1d2230',
            gold: '#e5b85c',
            crimson: '#e05260',
            emerald: '#3ec98c',
            indigo: '#7c8cff',
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #0c0e14;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-bgdark text-gray-100 antialiased flex items-center justify-center px-4 py-10">
  <main id="access-app" class="w-full max-w-xl space-y-6"></main>

  <script type="module">
    import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // Chiave condivisa tra accesso, pagina giocatore e pagina master
    const ACCESS_STORAGE_KEY = 'ombre_accesso_tavolo_v1';
    const ROOM_SYNC_PREFIX = 'ombre_stanza_sync_';
    const DEFAULT_APP_ID = 'ombre-al-tavolo-default';

    let db = null;
    let auth = null;
    let appId = DEFAULT_APP_ID;
    let cloudReady = false;
    let roomUnsubscribe = null;

    // Crea lo stato iniziale della schermata di accesso
    function createInitialAccessState() {
      return {
        roomCode: 'TAVOLO1',
        playerName: '',
        role: 'player', // 'player' | 'master'
        syncStatus: 'Locale',
        banner: null
      };
    }

    // Carica lo stato salvato in sicurezza tramite try/catch
    function loadAccessState() {
      try {
        const raw = localStorage.getItem(ACCESS_STORAGE_KEY);
        if (!raw) return createInitialAccessState();
        const parsed = JSON.parse(raw);
        return {
          roomCode: String(parsed.roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1',
          playerName: String(parsed.playerName || '').trim(),
          role: parsed.role === 'master' ? 'master' : 'player',
          syncStatus: String(parsed.syncStatus || 'Locale'),
          banner: parsed.banner || null
        };
      } catch (err) {
        console.error('Errore lettura stato accesso:', err);
        return createInitialAccessState();
      }
    }

    let accessState = loadAccessState();

    // Salva lo stato di accesso in localStorage
    function saveAccessState() {
      try {
        localStorage.setItem(ACCESS_STORAGE_KEY, JSON.stringify({
          roomCode: accessState.roomCode,
          playerName: accessState.playerName,
          role: accessState.role,
          syncStatus: accessState.syncStatus,
          banner: accessState.banner
        }));
      } catch (err) {
        console.error('Errore salvataggio stato accesso:', err);
      }
    }

    // Restituisce il riferimento al documento Firestore della stanza condivisa
    function getRoomDocRef(roomCode) {
      if (!db) return null;
      const cleanRoom = String(roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1';
      return doc(db, 'artifacts', appId, 'public', 'data', 'ombre_rooms', cleanRoom);
    }

    // Legge i dati stanza salvati in locale
    function readLocalRoomRecord(roomCode) {
      const cleanRoom = String(roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1';
      try {
        const raw = localStorage.getItem(ROOM_SYNC_PREFIX + cleanRoom);
        if (!raw) {
          return {
            roomCode: cleanRoom,
            players: [],
            roleCounts: {
              investigatore: 1,
              guardia: 1,
              cacciatore: 1,
              martire: 0,
              assassino: 1,
              sabotatore: 1
            },
            updatedAt: Date.now()
          };
        }
        const parsed = JSON.parse(raw);
        return {
          roomCode: cleanRoom,
          players: Array.isArray(parsed.players) ? parsed.players : [],
          roleCounts: parsed.roleCounts && typeof parsed.roleCounts === 'object'
            ? parsed.roleCounts
            : {
                investigatore: 1,
                guardia: 1,
                cacciatore: 1,
                martire: 0,
                assassino: 1,
                sabotatore: 1
              },
          updatedAt: Number(parsed.updatedAt || Date.now())
        };
      } catch (err) {
        console.error('Errore lettura stanza locale:', err);
        return {
          roomCode: cleanRoom,
          players: [],
          roleCounts: {
            investigatore: 1,
            guardia: 1,
            cacciatore: 1,
            martire: 0,
            assassino: 1,
            sabotatore: 1
          },
          updatedAt: Date.now()
        };
      }
    }

    // Salva i dati stanza in locale e su Firestore se disponibile
    async function persistRoomRecord(record) {
      const cleanRoom = String(record.roomCode || accessState.roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1';
      const normalizedRecord = {
        roomCode: cleanRoom,
        players: Array.isArray(record.players) ? record.players : [],
        roleCounts: record.roleCounts && typeof record.roleCounts === 'object' ? record.roleCounts : {},
        updatedAt: Date.now()
      };

      try {
        localStorage.setItem(ROOM_SYNC_PREFIX + cleanRoom, JSON.stringify(normalizedRecord));
      } catch (err) {
        console.error('Errore salvataggio locale stanza:', err);
      }

      if (cloudReady && db) {
        try {
          await setDoc(getRoomDocRef(cleanRoom), normalizedRecord, { merge: true });
        } catch (err) {
          console.error('Errore scrittura Firestore stanza:', err);
        }
      }
    }

    // Avvia l'ascolto in tempo reale della stanza su Firestore e storage
    function subscribeToRoomSync(roomCode) {
      const cleanRoom = String(roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1';
      if (typeof roomUnsubscribe === 'function') {
        roomUnsubscribe();
        roomUnsubscribe = null;
      }

      if (cloudReady && db) {
        try {
          roomUnsubscribe = onSnapshot(getRoomDocRef(cleanRoom), snap => {
            if (snap.exists()) {
              const data = snap.data();
              try {
                localStorage.setItem(ROOM_SYNC_PREFIX + cleanRoom, JSON.stringify({
                  roomCode: cleanRoom,
                  players: Array.isArray(data.players) ? data.players : [],
                  roleCounts: data.roleCounts || {},
                  updatedAt: Number(data.updatedAt || Date.now())
                }));
              } catch (err) {
                console.error('Errore aggiornamento cache stanza:', err);
              }
            }
          }, err => {
            console.error('Errore listener Firestore stanza:', err);
          });
        } catch (err) {
          console.error('Errore sottoscrizione Firestore:', err);
        }
      }
    }

    // Inizializza Firebase/Firestore se configurato nell'ambiente
    async function initCloudSync() {
      try {
        const cfgRaw = typeof window.__firebase_config !== 'undefined' ? window.__firebase_config : null;
        if (!cfgRaw) {
          accessState.syncStatus = 'Locale (Stesso dispositivo)';
          saveAccessState();
          renderAccessPage();
          return;
        }

        const firebaseConfig = typeof cfgRaw === 'string' ? JSON.parse(cfgRaw) : cfgRaw;
        if (!firebaseConfig || !firebaseConfig.apiKey) {
          accessState.syncStatus = 'Locale (Stesso dispositivo)';
          saveAccessState();
          renderAccessPage();
          return;
        }

        if (typeof window.__app_id === 'string' && window.__app_id.trim()) {
          appId = window.__app_id.trim();
        }

        const firebaseApp = getApps().length ? getApp() : initializeApp(firebaseConfig);
        auth = getAuth(firebaseApp);
        db = getFirestore(firebaseApp);

        if (typeof window.__initial_auth_token === 'string' && window.__initial_auth_token.trim()) {
          await signInWithCustomToken(auth, window.__initial_auth_token.trim());
        } else {
          await signInAnonymously(auth);
        }

        cloudReady = true;
        accessState.syncStatus = 'Cloud Attivo (Multi-dispositivo)';
        saveAccessState();
        subscribeToRoomSync(accessState.roomCode);
        renderAccessPage();
      } catch (err) {
        console.error('Errore inizializzazione sincronizzazione cloud:', err);
        cloudReady = false;
        accessState.syncStatus = 'Locale (Fallback)';
        saveAccessState();
        renderAccessPage();
      }
    }

    // Registra l'ingresso di un giocatore nella stanza condivisa così il Master lo vede in automatico
    async function registerPlayerInRoom(roomCode, playerName) {
      const cleanRoom = String(roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1';
      const cleanName = String(playerName || '').trim();
      if (!cleanName) return;

      let currentRecord = readLocalRoomRecord(cleanRoom);
      if (cloudReady && db) {
        try {
          const snap = await getDoc(getRoomDocRef(cleanRoom));
          if (snap.exists()) {
            const d = snap.data();
            currentRecord = {
              roomCode: cleanRoom,
              players: Array.isArray(d.players) ? d.players : currentRecord.players,
              roleCounts: d.roleCounts || currentRecord.roleCounts,
              updatedAt: Number(d.updatedAt || Date.now())
            };
          }
        } catch (err) {
          console.error('Errore lettura remota stanza prima della registrazione:', err);
        }
      }

      const normalizedName = cleanName.toLowerCase();
      const existingIndex = currentRecord.players.findIndex(
        p => String(p.name || '').trim().toLowerCase() === normalizedName
      );

      if (existingIndex === -1) {
        currentRecord.players.push({
          id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          name: cleanName,
          assignedRoleKey: null,
          joinedAt: Date.now()
        });
      } else {
        currentRecord.players[existingIndex] = {
          ...currentRecord.players[existingIndex],
          name: cleanName,
          joinedAt: Date.now()
        };
      }

      await persistRoomRecord(currentRecord);
    }

    // Imposta un messaggio di feedback nella pagina di accesso
    function setAccessBanner(text, type = 'info') {
      accessState.banner = { text, type };
      saveAccessState();
      renderAccessPage();
    }

    // Aggiorna il codice stanza in tempo reale
    function handleRoomChange(value) {
      accessState.roomCode = String(value || '').toUpperCase().replace(/[^A-Z0-9_-]/g, '');
      accessState.banner = null;
      saveAccessState();
      subscribeToRoomSync(accessState.roomCode || 'TAVOLO1');
      renderAccessPage();
    }

    // Aggiorna il nome inserito
    function handleNameChange(value) {
      accessState.playerName = String(value || '');
      accessState.banner = null;
      saveAccessState();
    }

    // Seleziona se l'utente entra come Giocatore o come Master
    function selectAccessRole(selectedRole) {
      accessState.role = selectedRole === 'master' ? 'master' : 'player';
      accessState.banner = null;
      saveAccessState();
      renderAccessPage();
    }

    // Copia l'ID di sincronizzazione stanza usando execCommand per compatibilità iframe
    function copySyncId() {
      const cleanRoom = String(accessState.roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1';
      const syncId = 'SYNC-' + cleanRoom;
      try {
        const tempInput = document.createElement('input');
        tempInput.value = syncId;
        document.body.appendChild(tempInput);
        tempInput.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(tempInput);
        if (ok) {
          setAccessBanner(`ID Sync "${syncId}" copiato: inserisci lo stesso codice stanza sugli altri telefoni.`, 'success');
        } else {
          setAccessBanner(`Codice sincronizzazione stanza: ${syncId}`, 'info');
        }
      } catch (err) {
        console.error('Errore copia ID Sync:', err);
        setAccessBanner(`Codice sincronizzazione stanza: ${syncId}`, 'info');
      }
    }

    // Valida i dati, sincronizza la stanza e apre direttamente giocatore.html o master.html
    async function proceedToSelectedPage() {
      const cleanRoom = String(accessState.roomCode || '').trim().toUpperCase();
      const cleanName = String(accessState.playerName || '').trim();

      if (!cleanRoom) {
        setAccessBanner('Inserisci un Codice Stanza per sincronizzare i dispositivi.', 'error');
        return;
      }

      if (!cleanName) {
        setAccessBanner('Inserisci il tuo nome prima di proseguire.', 'error');
        return;
      }

      accessState.roomCode = cleanRoom;
      accessState.playerName = cleanName;
      accessState.banner = null;
      saveAccessState();

      if (accessState.role === 'player') {
        await registerPlayerInRoom(cleanRoom, cleanName);
      } else {
        const existingRoom = readLocalRoomRecord(cleanRoom);
        await persistRoomRecord(existingRoom);
      }

      const targetFile = accessState.role === 'master' ? 'master.html' : 'giocatore.html';
      const isIsolatedPreview =
        window.location.protocol === 'blob:' ||
        window.location.href === 'about:srcdoc' ||
        window.location.href.startsWith('data:');

      if (!isIsolatedPreview) {
        try {
          window.location.href = targetFile;
          return;
        } catch (err) {
          console.error('Errore reindirizzamento verso', targetFile, err);
        }
      }

      const roleLabel = accessState.role === 'master' ? 'Master' : 'Giocatore';
      setAccessBanner(
        `Accesso salvato come ${roleLabel} ("${cleanName}") nella stanza ${cleanRoom}. Nell'anteprima isolata apri la scheda "${targetFile}" oppure carica i file insieme.`,
        'success'
      );
    }

    // Escape HTML per rendere sicuro l'inserimento di testo
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Renderizza l'intera schermata iniziale di accesso
    function renderAccessPage() {
      const container = document.getElementById('access-app');
      if (!container) return;

      try {
        const displayRoom = String(accessState.roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1';
        const syncId = 'SYNC-' + displayRoom;
        const banner = accessState.banner;

        const bannerHtml = banner
          ? `<div class="rounded-xl border px-4 py-3 text-sm font-medium ${
              banner.type === 'success'
                ? 'bg-emerald/15 border-emerald/40 text-emerald'
                : banner.type === 'error'
                ? 'bg-crimson/15 border-crimson/40 text-crimson'
                : 'bg-indigo/15 border-indigo/40 text-indigo'
            }">${escapeHtml(banner.text)}</div>`
          : '';

        container.innerHTML = `
          <header class="rounded-2xl bg-surface border border-white/10 p-6 text-center space-y-2">
            <span class="text-xs font-bold uppercase tracking-widest text-gold">Ingresso al Tavolo</span>
            <h1 class="font-serif text-3xl sm:text-4xl font-bold text-white">Ombre al Tavolo</h1>
            <p class="text-sm text-gray-400">
              Inserisci il codice stanza per sincronizzare i telefoni, il tuo nome e scegli se entrare come Giocatore o Master.
            </p>
          </header>

          ${bannerHtml}

          <section class="rounded-2xl bg-surface border border-white/10 p-6 space-y-5">
            <div class="space-y-2">
              <div class="flex items-center justify-between gap-2">
                <label for="room-code-input" class="text-xs font-bold uppercase tracking-wider text-gray-300">
                  Codice Stanza (Sincronizzazione Telefoni)
                </label>
                <button
                  type="button"
                  onclick="copySyncId()"
                  class="px-2.5 py-1 rounded-lg bg-surface2 hover:bg-white/10 border border-white/15 text-[11px] font-semibold text-emerald transition cursor-pointer"
                >
                  Copia ${escapeHtml(syncId)}
                </button>
              </div>
              <input
                id="room-code-input"
                type="text"
                maxlength="16"
                value="${escapeHtml(accessState.roomCode)}"
                oninput="handleRoomChange(this.value)"
                placeholder="Es. TAVOLO1"
                class="w-full rounded-xl bg-bgdark border border-white/15 px-4 py-3 text-sm font-mono uppercase tracking-wider text-white focus:outline-none focus:border-gold"
              />
              <div class="flex flex-wrap items-center justify-between gap-2 text-[11px] text-gray-400">
                <span>ID Sincronizzazione: <strong class="font-mono text-emerald">${escapeHtml(syncId)}</strong></span>
                <span>Stato: <strong class="text-gray-200">${escapeHtml(accessState.syncStatus)}</strong></span>
              </div>
            </div>

            <div class="space-y-2">
              <label for="player-name-input" class="block text-xs font-bold uppercase tracking-wider text-gray-300">
                Il Tuo Nome
              </label>
              <input
                id="player-name-input"
                type="text"
                maxlength="24"
                value="${escapeHtml(accessState.playerName)}"
                oninput="handleNameChange(this.value)"
                placeholder="Scrivi il tuo nome..."
                class="w-full rounded-xl bg-bgdark border border-white/15 px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo"
              />
            </div>

            <div class="space-y-2">
              <span class="block text-xs font-bold uppercase tracking-wider text-gray-300">
                Scegli il Tuo Ruolo di Accesso
              </span>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button
                  type="button"
                  onclick="selectAccessRole('player')"
                  class="rounded-xl p-4 text-left border transition cursor-pointer ${
                    accessState.role === 'player'
                      ? 'bg-emerald/15 border-emerald text-white'
                      : 'bg-bgdark border-white/10 text-gray-300 hover:border-white/25'
                  }"
                >
                  <div class="font-bold text-sm">Giocatore</div>
                  <div class="text-xs text-gray-400 mt-1">
                    Scatta il selfie iniziale e accedi alla plancia con scheda privata.
                  </div>
                </button>

                <button
                  type="button"
                  onclick="selectAccessRole('master')"
                  class="rounded-xl p-4 text-left border transition cursor-pointer ${
                    accessState.role === 'master'
                      ? 'bg-gold/15 border-gold text-white'
                      : 'bg-bgdark border-white/10 text-gray-300 hover:border-white/25'
                  }"
                >
                  <div class="font-bold text-sm">Master</div>
                  <div class="text-xs text-gray-400 mt-1">
                    Gestisci cerimonia, estrazione ruoli e plancia di controllo.
                  </div>
                </button>
              </div>
            </div>

            <button
              type="button"
              onclick="proceedToSelectedPage()"
              class="w-full py-3.5 rounded-xl bg-gold text-bgdark font-bold text-sm hover:brightness-110 transition cursor-pointer"
            >
              Prosegui
            </button>
          </section>
        `;
      } catch (err) {
        console.error('Errore rendering pagina di accesso:', err);
        container.innerHTML = `
          <div class="rounded-2xl bg-surface border border-crimson/40 p-6 text-sm text-crimson">
            Si è verificato un errore durante il caricamento della pagina di accesso.
          </div>
        `;
      }
    }

    // Esposizione esplicita delle funzioni globali richiamate dai controlli
    window.handleRoomChange = handleRoomChange;
    window.handleNameChange = handleNameChange;
    window.selectAccessRole = selectAccessRole;
    window.copySyncId = copySyncId;
    window.proceedToSelectedPage = proceedToSelectedPage;

    renderAccessPage();
    initCloudSync();
  </script>
</body>
</html>
