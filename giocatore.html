<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ombre al Tavolo — Scheda Giocatore</title>
  <style>
    :root {
      --bg: #0c0e14;
      --surface: #151924;
      --surface-2: #1d2230;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --gold: #e5b85c;
      --crimson: #e05260;
      --emerald: #3ec98c;
      --indigo: #7c8cff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    .app-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 56px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .card-gold {
      border-color: rgba(229, 184, 92, 0.35);
    }

    .header-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .profile-head {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      object-fit: cover;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      color: var(--gold);
      flex-shrink: 0;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      display: block;
    }

    h1 {
      margin: 2px 0 0;
      font-size: 25px;
      font-weight: 800;
      color: #ffffff;
    }

    h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
    }

    .subtext {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--emerald);
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button, select, input[type="text"] {
      font-family: inherit;
      border-radius: 10px;
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.15s ease, background-color 0.15s ease;
    }

    button:hover:not(:disabled) { opacity: 0.92; }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    select, input[type="text"] {
      width: 100%;
      background: var(--bg);
      color: #ffffff;
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 13px;
    }

    .btn-gold {
      background: var(--gold);
      color: #0c0e14;
      border: none;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
    }

    .btn-emerald {
      background: var(--emerald);
      color: #0c0e14;
      border: none;
      padding: 9px 13px;
      font-size: 12px;
      font-weight: 700;
    }

    .btn-indigo {
      background: var(--indigo);
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      font-size: 12px;
    }

    .btn-ghost {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 14px;
      font-size: 12px;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .badge-Traditori {
      background: rgba(224, 82, 96, 0.15);
      color: var(--crimson);
      border-color: rgba(224, 82, 96, 0.4);
    }

    .badge-Fedeli {
      background: rgba(62, 201, 140, 0.15);
      color: var(--emerald);
      border-color: rgba(62, 201, 140, 0.4);
    }

    .badge-Neutro {
      background: rgba(229, 184, 92, 0.15);
      color: var(--gold);
      border-color: rgba(229, 184, 92, 0.4);
    }

    .banner {
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid transparent;
    }

    .banner-success {
      background: rgba(62, 201, 140, 0.14);
      border-color: rgba(62, 201, 140, 0.4);
      color: var(--emerald);
    }

    .banner-error {
      background: rgba(224, 82, 96, 0.14);
      border-color: rgba(224, 82, 96, 0.4);
      color: var(--crimson);
    }

    .banner-info {
      background: rgba(124, 140, 255, 0.14);
      border-color: rgba(124, 140, 255, 0.4);
      color: var(--indigo);
    }

    .mission-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .mission-row {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .mission-row.done {
      border-color: rgba(62, 201, 140, 0.45);
      background: rgba(62, 201, 140, 0.06);
    }

    .mission-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }

    .mission-desc {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .ability-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ability-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
    }

    .answer-box {
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 700;
      font-size: 14px;
    }

    .answer-yes {
      background: rgba(62, 201, 140, 0.16);
      border: 1px solid rgba(62, 201, 140, 0.45);
      color: var(--emerald);
    }

    .answer-no {
      background: rgba(224, 82, 96, 0.16);
      border: 1px solid rgba(224, 82, 96, 0.45);
      color: var(--crimson);
    }

    .chat-box {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 12px 0;
    }

    .msg-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
    }

    .msg-head {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .msg-body {
      margin: 0;
      font-size: 13px;
      color: #e5e7eb;
    }

    .chat-form {
      display: flex;
      gap: 8px;
    }
  </style>

  <script>
    window.OMBRE_FIREBASE_CONFIG = {
      apiKey: "AIzaSyDTTdNc3bTlrCWeYHWH_vYG7u9CpPPQ2Xk",
      authDomain: "ombre-al-tavolo.firebaseapp.com",
      projectId: "ombre-al-tavolo",

    };
  </script>
</head>
<body>
  <div id="player-board-app" class="app-wrap"></div>

  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    var ACCESS_KEY = 'ombre_accesso_tavolo_v1';
    var ROOM_PREFIX = 'ombre_stanza_sync_';

    var ROLE_DETAILS = {
      assassino: {
        name: 'Assassino',
        faction: 'Traditori',
        powerDesc: 'Può colpire chi vuole (tranne chi è protetto da Scudo). Se in partita c’è il Traditore Segreto, l’Assassino sceglie 2 persone e il Traditore Segreto decide chi eliminare. Costa 1 punto missione e richiede un giro di Tavolo Ovale prima di poter essere riutilizzata.'
      },
      sabotatore: {
        name: 'Sabotatore',
        faction: 'Traditori',
        powerDesc: 'Può bloccare l’attivazione di un altro giocatore per il turno (5 missioni, 3 ripetibili; contatto; no Traditori tranne Traditore Segreto).'
      },
      traditore_segreto: {
        name: 'Traditore Segreto',
        faction: 'Traditori',
        powerDesc: 'Conosci gli altri Traditori e, quando l’Assassino indica 2 bersagli, decidi tu quale dei due eliminare.'
      },
      investigatore: {
        name: 'Investigatore',
        faction: 'Fedeli',
        powerDesc: 'Puoi scoprire una delle missioni dei Traditori (5 missioni, 3 ripetibili; missioni prevalentemente verbali).'
      },
      guardia: {
        name: 'Guardia',
        faction: 'Fedeli',
        powerDesc: 'Puoi assegnare uno Scudo Protettivo a te stesso o a un altro giocatore (5 missioni, 3 ripetibili; missioni prevalentemente verbali).'
      },
      martire: {
        name: 'Martire',
        faction: 'Fedeli',
        powerDesc: 'Non hai missioni; se subisci una missione altrui puoi dichiarare un ruolo in gioco e sbloccare la Voce dell’Aldilà per proteggere con uno Scudo.'
      },
      mediatore: {
        name: 'Mediatore',
        faction: 'Fedeli',
        powerDesc: 'Hai un voto extra (+1) alla Tavola Rotonda (5 missioni, 3 ripetibili; missioni prevalentemente verbali).'
      },
      cacciatore: {
        name: 'Cacciatore',
        faction: 'Neutro',
        powerDesc: 'Usa i punti missione per chiedere "giocatore X è ruolo Y?" con risposta automatica Sì/No; oppure (0 punti) indica il ruolo di 3 giocatori.'
      }
    };

    var DEFAULT_MISSIONS_BY_FACTION = {
      Traditori: [
        { slot: 1, title: 'Missione 1 · Contatto Cauto', desc: 'Avvia un contatto discreto con un giocatore non Traditore durante il turno.', done: false },
        { slot: 2, title: 'Missione 2 · Sussurro al Tavolo', desc: 'Fai passare una frase ambigua senza destare sospetti immediati.', done: false },
        { slot: 3, title: 'Missione 3 · Devianza del Voto', desc: 'Orienta il sospetto verso un giocatore Fedele durante il confronto.', done: false },
        { slot: 4, title: 'Missione 4 · Scambio Silenzioso', desc: 'Completa un piccolo scambio o gesto concordato senza farti notare.', done: false },
        { slot: 5, title: 'Missione 5 · Colpo nell’Ombra', desc: 'Porta a termine l’obiettivo del turno mantenendo coperta la tua fazione.', done: false }
      ],
      Fedeli: [
        { slot: 1, title: 'Missione 1 · Raccolta Indizi', desc: 'Ascolta con attenzione e riporta un dettaglio utile emerso al tavolo.', done: false },
        { slot: 2, title: 'Missione 2 · Domanda Mirata', desc: 'Poni una domanda incisiva per verificare la coerenza di un giocatore.', done: false },
        { slot: 3, title: 'Missione 3 · Alleanza Verbale', desc: 'Costruisci un confronto costruttivo con un altro giocatore al tavolo.', done: false },
        { slot: 4, title: 'Missione 4 · Difesa del Giusto', desc: 'Sostieni con argomenti chiari un giocatore che ritieni affidabile.', done: false },
        { slot: 5, title: 'Missione 5 · Verità alla Luce', desc: 'Aiuta il tavolo a individuare un comportamento incoerente prima del voto.', done: false }
      ],
      Neutro: [
        { slot: 1, title: 'Missione 1 · Osservazione Diretta', desc: 'Osserva le interazioni tra due giocatori per ricavare un indizio.', done: false },
        { slot: 2, title: 'Missione 2 · Analisi dei Ruoli', desc: 'Confronta le dichiarazioni al tavolo con i ruoli possibili in gioco.', done: false },
        { slot: 3, title: 'Missione 3 · Caccia Silenziosa', desc: 'Individua un bersaglio su cui concentrare la tua prossima domanda.', done: false },
        { slot: 4, title: 'Missione 4 · Verifica Incrociata', desc: 'Controlla la reazione di un giocatore quando viene nominato un altro ruolo.', done: false },
        { slot: 5, title: 'Missione 5 · Mira Finale', desc: 'Prepara la tua verifica conclusiva o la chiamata da 3 giocatori.', done: false }
      ]
    };

    function initFirestore() {
      try {
        if (!window.OMBRE_FIREBASE_CONFIG || !window.OMBRE_FIREBASE_CONFIG.projectId) return null;
        var app = getApps().length ? getApps()[0] : initializeApp(window.OMBRE_FIREBASE_CONFIG);
        return getFirestore(app);
      } catch (err) {
        console.error('Errore Firestore su giocatore.html:', err);
        return null;
      }
    }

    var firestoreDb = initFirestore();

    function readAccess() {
      try {
        var raw = localStorage.getItem(ACCESS_KEY);
        if (!raw) return { roomCode: 'TAVOLO1', playerName: 'Giocatore' };
        var parsed = JSON.parse(raw);
        return {
          roomCode: String(parsed.roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1',
          playerName: String(parsed.playerName || 'Giocatore').trim() || 'Giocatore'
        };
      } catch (_e) {
        return { roomCode: 'TAVOLO1', playerName: 'Giocatore' };
      }
    }

    var access = readAccess();
    var state = {
      roomCode: access.roomCode,
      playerName: access.playerName,
      syncStatus: firestoreDb ? 'Cloud Firestore attivo' : 'Locale',
      players: [],
      assignedRoleKey: null,
      privateCardOpen: false,
      missions: [],
      missionPoints: 0,
      hunterTargetName: '',
      hunterTargetRole: 'assassino',
      hunterLastAnswer: null,
      tripleNames: ['', '', ''],
      tripleRoles: ['assassino', 'guardia', 'investigatore'],
      assassinTarget1: '',
      assassinTarget2: '',
      assassinUsedSinceOval: false,
      ovalRoundCount: 0,
      shieldedPlayers: [],
      martyrShieldedPlayers: [],
      sabotagedPlayers: [],
      pendingAssassinPair: null,
      confirmPrompt: null,
      actionResultText: null,
      masterChat: [],
      banner: null
    };

    var chatDraft = '';

    function getRoomRef() {
      if (!firestoreDb) return null;
      return doc(firestoreDb, 'stanze', state.roomCode);
    }

    function ensureFiveMissions(existingList, faction, cloudList) {
      var source = Array.isArray(cloudList) && cloudList.length
        ? cloudList
        : (Array.isArray(existingList) && existingList.length
            ? existingList
            : (DEFAULT_MISSIONS_BY_FACTION[faction] || DEFAULT_MISSIONS_BY_FACTION.Fedeli));

      var out = [];
      for (var i = 0; i < 5; i++) {
        var base = source[i] || (DEFAULT_MISSIONS_BY_FACTION[faction] || DEFAULT_MISSIONS_BY_FACTION.Fedeli)[i];
        out.push({
          slot: i + 1,
          title: base.title || ('Missione ' + (i + 1)),
          desc: base.desc || '',
          done: Boolean(base.done)
        });
      }
      return out;
    }

    function applyRoomSnapshot(data) {
      if (!data || typeof data !== 'object') return;
      if (Array.isArray(data.players)) {
        state.players = data.players;
        var me = data.players.find(function (p) {
          return String(p.name || '').trim().toLowerCase() === state.playerName.toLowerCase();
        });
        var newRole = me && me.assignedRoleKey && ROLE_DETAILS[me.assignedRoleKey] ? me.assignedRoleKey : null;
        if (newRole && !state.assignedRoleKey) {
          state.privateCardOpen = true;
          state.banner = { text: 'Il Master ti ha assegnato un ruolo: Scheda Privata sbloccata!', type: 'success' };
        } else if (!newRole) {
          state.privateCardOpen = false;
        }
        state.assignedRoleKey = newRole;
      }

      var roleObj = state.assignedRoleKey ? ROLE_DETAILS[state.assignedRoleKey] : null;
      var faction = roleObj ? roleObj.faction : 'Fedeli';
      var cloudMissions = data.missionAssignments && typeof data.missionAssignments === 'object'
        ? data.missionAssignments[state.playerName.toLowerCase()]
        : null;

      state.missions = ensureFiveMissions(state.missions, faction, cloudMissions);
      var completedCount = state.missions.filter(function (m) { return Boolean(m.done); }).length;
      state.missionPoints = completedCount;

      if (Array.isArray(data.masterChat)) {
        state.masterChat = data.masterChat;
      }
      state.shieldedPlayers = Array.isArray(data.shieldedPlayers) ? data.shieldedPlayers : [];
      state.martyrShieldedPlayers = Array.isArray(data.martyrShieldedPlayers) ? data.martyrShieldedPlayers : [];
      state.sabotagedPlayers = Array.isArray(data.sabotagedPlayers) ? data.sabotagedPlayers : [];
      state.ovalRoundCount = Number(data.ovalRoundCount || 0);
      state.pendingAssassinPair = data.pendingAssassinPair || null;
      if (typeof data.assassinUsedSinceOval === 'boolean') {
        state.assassinUsedSinceOval = data.assassinUsedSinceOval;
      }

      if (!state.hunterTargetName) {
        var other = state.players.find(function (p) {
          return String(p.name || '').trim().toLowerCase() !== state.playerName.toLowerCase();
        });
        if (other) state.hunterTargetName = other.name;
      }

      saveLocal();
    }

    function saveLocal() {
      try {
        var raw = localStorage.getItem(ROOM_PREFIX + state.roomCode);
        var cur = raw ? JSON.parse(raw) : { roomCode: state.roomCode };
        cur.players = state.players;
        cur.missionAssignments = cur.missionAssignments && typeof cur.missionAssignments === 'object'
          ? cur.missionAssignments
          : {};
        cur.missionAssignments[state.playerName.toLowerCase()] = state.missions;
        cur.masterChat = state.masterChat;
        cur.updatedAt = Date.now();
        localStorage.setItem(ROOM_PREFIX + state.roomCode, JSON.stringify(cur));
      } catch (_e) {}
    }

    async function pushRoomUpdate(extra) {
      saveLocal();
      var ref = getRoomRef();
      if (!ref) return;
      try {
        var snap = await getDoc(ref);
        var cur = snap.exists() ? (snap.data() || {}) : {};
        var nextAssignments = Object.assign({}, cur.missionAssignments || {});
        nextAssignments[state.playerName.toLowerCase()] = state.missions;

        await setDoc(ref, Object.assign({
          roomCode: state.roomCode,
          players: state.players,
          missionAssignments: nextAssignments,
          masterChat: state.masterChat,
          shieldedPlayers: state.shieldedPlayers,
          martyrShieldedPlayers: state.martyrShieldedPlayers,
          sabotagedPlayers: state.sabotagedPlayers,
          ovalRoundCount: state.ovalRoundCount,
          pendingAssassinPair: state.pendingAssassinPair,
          assassinUsedSinceOval: state.assassinUsedSinceOval,
          updatedAt: Date.now()
        }, extra || {}), { merge: true });
        state.syncStatus = 'Cloud Firestore attivo';
      } catch (err) {
        console.error('Errore sync giocatore su Firestore:', err);
        state.syncStatus = 'Locale (controlla regole Firestore)';
      }
    }

    window.togglePrivateCard = function () {
      if (!state.assignedRoleKey) {
        state.banner = { text: 'Scheda privata bloccata: attendi che il Master ti assegni un ruolo.', type: 'info' };
        render();
        return;
      }
      state.privateCardOpen = !state.privateCardOpen;
      render();
    };

    window.toggleMissionDone = async function (slotIndex) {
      if (!state.assignedRoleKey) {
        state.banner = { text: 'Attendi che il Master ti assegni un ruolo prima di completare missioni.', type: 'error' };
        render();
        return;
      }
      var target = state.missions[slotIndex];
      if (!target) return;
      target.done = !target.done;
      state.missionPoints = state.missions.filter(function (m) { return Boolean(m.done); }).length;

      var statusLabel = target.done ? 'COMPLETATA' : 'NON COMPLETATA';
      var notif = {
        id: 'notif_' + Date.now(),
        fromMaster: false,
        senderName: state.playerName,
        playerName: state.playerName,
        text: '[MISSIONE ' + statusLabel + '] ' + state.playerName + ' -> "' + target.title + '" (Stanza ' + state.roomCode + ')',
        createdAt: Date.now()
      };
      state.masterChat = state.masterChat.concat([notif]).slice(-150);

      state.banner = {
        text: 'Missione "' + target.title + '" segnata come ' + (target.done ? 'FATTA' : 'NON FATTA') + ' e comunicata al Master.',
        type: target.done ? 'success' : 'info'
      };

      await pushRoomUpdate();
      render();
    };

    window.setHunterTarget = function (name) {
      state.hunterTargetName = name;
    };

    window.setHunterRole = function (roleKey) {
      state.hunterTargetRole = roleKey;
    };

    window.hunterAskQuestion = async function () {
      if (state.missionPoints <= 0) {
        state.banner = { text: 'Non hai punti missione disponibili per fare una domanda automatica (completa una missione con "Fatto").', type: 'error' };
        render();
        return;
      }
      var targetPlayer = state.players.find(function (p) {
        return String(p.name || '').trim().toLowerCase() === String(state.hunterTargetName || '').trim().toLowerCase();
      });
      if (!targetPlayer) {
        state.banner = { text: 'Seleziona un giocatore valido a cui rivolgerti.', type: 'error' };
        render();
        return;
      }

      var actualRole = targetPlayer.assignedRoleKey || '';
      var isMatch = actualRole === state.hunterTargetRole;
      var roleLabel = (ROLE_DETAILS[state.hunterTargetRole] && ROLE_DETAILS[state.hunterTargetRole].name) || state.hunterTargetRole;

      // Consuma 1 missione completata come punto missione
      var doneIdx = state.missions.findIndex(function (m) { return Boolean(m.done); });
      if (doneIdx !== -1) {
        state.missions[doneIdx].done = false;
      }
      state.missionPoints = state.missions.filter(function (m) { return Boolean(m.done); }).length;

      state.hunterLastAnswer = {
        yes: isMatch,
        text: (isMatch ? 'SÌ' : 'NO') + ' — "' + targetPlayer.name + '" è "' + roleLabel + '"? Risposta automatica: ' + (isMatch ? 'SÌ' : 'NO') + '.'
      };

      var notif = {
        id: 'hunt_' + Date.now(),
        fromMaster: false,
        senderName: state.playerName,
        playerName: state.playerName,
        text: '[CACCIATORE · DOMANDA] ' + state.playerName + ' chiede se ' + targetPlayer.name + ' è ' + roleLabel + ' -> Esito automatico: ' + (isMatch ? 'SÌ' : 'NO'),
        createdAt: Date.now()
      };
      state.masterChat = state.masterChat.concat([notif]).slice(-150);

      await pushRoomUpdate();
      render();
    };

      var kind = prompt.actionKind;

      if (kind === 'guardia_scudo') {
        if (isPlayerSabotaged(state.playerName)) {
          // Malus silenzioso del Sabotatore: il punto è speso ma lo scudo non viene assegnato e il giocatore non sa del malus

          state.masterChat = state.masterChat.concat([{
            id: 'grd_' + Date.now(),
            fromMaster: false,
            senderName: state.playerName,
            playerName: state.playerName,

            createdAt: Date.now()
          }]).slice(-150);
          state.banner = { text: 'Azione completata (1 punto missione speso).', type: 'info' };
        } else {
          if (!state.shieldedPlayers.some(function (x) { return String(x).toLowerCase() === target.toLowerCase(); })) {
            state.shieldedPlayers.push(target);
          }

          state.masterChat = state.masterChat.concat([{
            id: 'grd_' + Date.now(),
            fromMaster: false,
            senderName: state.playerName,
            playerName: state.playerName,
            text: '[GUARDIA] ' + state.playerName + ' assegna Scudo (1 notte) a ' + target + ' (-1 pt missione).',
            createdAt: Date.now()
          }]).slice(-150);
          state.banner = { text: state.actionResultText, type: 'success' };

      } else if (kind === 'investigatore_missione') {

          createdAt: Date.now()
        }]).slice(-150);
        state.banner = { text: 'Nuova missione Assassini a bassa difficoltà sbloccata (-1 punto missione).', type: 'success' };
      } else if (kind === 'martire_rileva') {
        var pObj = state.players.find(function (p) { return String(p.name || '').toLowerCase() === target.toLowerCase(); });
        var rName = (pObj && pObj.assignedRoleKey && ROLE_DETAILS[pObj.assignedRoleKey])
          ? ROLE_DETAILS[pObj.assignedRoleKey].name
          : 'Ruolo non ancora assegnato';
        state.actionResultText = 'Rilevazione del Martire: il ruolo di ' + target + ' è ' + rName + ' (-1 punto missione).';

          text: '[MARTIRE · RILEVA RUOLO] ' + state.playerName + ' verifica ' + target + ' -> ' + rName + ' (-1 pt missione).',
          createdAt: Date.now()
        }]).slice(-150);

          createdAt: Date.now()
        }]).slice(-150);

    window.assassinExecuteStrike = async function () {
      if (state.assignedRoleKey !== 'assassino') return;
      if (state.missionPoints <= 0) {
        state.banner = { text: 'Ti serve almeno 1 punto missione per usare l’abilità dell’Assassino.', type: 'error' };
        render();
        return;
      }
      if (state.assassinUsedSinceOval) {
        state.banner = { text: 'Hai già usato l’abilità dell’Assassino in questo ciclo: attendi o avvia un giro di Tavolo Ovale per sbloccarla di nuovo.', type: 'error' };
        render();
        return;
      }

      var candidates = state.players.filter(function (p) {
        return String(p.name || '').trim().toLowerCase() !== state.playerName.toLowerCase();
      });
      var t1 = state.assassinTarget1 || (candidates[0] && candidates[0].name) || '';
      var hasST = hasSecretTraitorInRoom();
      var t2 = state.assassinTarget2 || (candidates[1] && candidates[1].name) || '';

      if (!t1) {
        state.banner = { text: 'Seleziona un bersaglio da eliminare.', type: 'error' };
        render();
        return;
      }
      if (hasST && (!t2 || t1.toLowerCase() === t2.toLowerCase())) {
        state.banner = { text: 'È presente il Traditore Segreto: devi scegliere 2 persone distinte tra cui deciderà lui.', type: 'error' };
        render();
        return;
      }

      // Consuma 1 punto missione e blocca il riutilizzo fino al prossimo Tavolo Ovale
      var doneIdx = state.missions.findIndex(function (m) { return Boolean(m.done); });
      if (doneIdx !== -1) state.missions[doneIdx].done = false;
      state.missionPoints = state.missions.filter(function (m) { return Boolean(m.done); }).length;
      state.assassinUsedSinceOval = true;

      if (hasST) {
        state.pendingAssassinPair = {
          assassinName: state.playerName,
          targetA: t1,
          targetB: t2,
          createdAt: Date.now()
        };
        state.actionResultText = 'Hai indicato 2 bersagli (' + t1 + ' e ' + t2 + ') e speso 1 punto missione. Il Traditore Segreto deciderà chi eliminare (abilità bloccata fino al prossimo Tavolo Ovale).';
        state.masterChat = state.masterChat.concat([{
          id: 'ass_pair_' + Date.now(),
          fromMaster: false,
          senderName: state.playerName,
          playerName: state.playerName,
          text: '[ASSASSINO · SCELTA DOPPIA] ' + state.playerName + ' indica ' + t1 + ' e ' + t2 + ' (1 pt missione speso; in attesa della scelta del Traditore Segreto).',
          createdAt: Date.now()
        }]).slice(-150);
        state.banner = { text: 'Scelta inviata al Traditore Segreto. Riutilizzo bloccato fino al prossimo Tavolo Ovale.', type: 'info' };
      } else {
        var shielded = isPlayerShielded(t1);
        state.actionResultText = shielded
          ? ('Colpo su ' + t1 + ' PARATO dallo Scudo Protettivo! (1 pt missione speso; abilità bloccata fino al prossimo Tavolo Ovale).')
          : ('Colpo eseguito su ' + t1 + '! Giocatore eliminato (1 pt missione speso; abilità bloccata fino al prossimo Tavolo Ovale).');
        state.masterChat = state.masterChat.concat([{
          id: 'ass_hit_' + Date.now(),
          fromMaster: false,
          senderName: state.playerName,
          playerName: state.playerName,
          text: '[ASSASSINO] ' + state.playerName + ' -> ' + t1 + ': ' + (shielded ? 'PARATO DA SCUDO' : 'ELIMINATO') + ' (1 pt missione speso).',
          createdAt: Date.now()
        }]).slice(-150);
        state.banner = { text: state.actionResultText, type: shielded ? 'info' : 'success' };
      }

      await pushRoomUpdate();
      render();
    };

        var gButtons = state.players.map(function (p) {
          var safeN = escapeHtml(p.name).replace(/'/g, "\'");
          return '<button type="button" class="btn-emerald" ' + (state.missionPoints <= 0 ? 'disabled' : '') + ' onclick="requestAbilityConfirm('guardia_scudo','' + safeN + '')">Scudo (1 notte): ' + escapeHtml(p.name) + '</button>';
        }).join('');
        return (
          '<div class="ability-box">' +
            '<div class="header-row"><strong>Abilità Guardia (Scudo di 1 Notte)</strong><span class="badge badge-Fedeli">Punti missione: ' + state.missionPoints + '</span></div>' +
            '<p class="subtext">Premi il nome del giocatore a cui assegnare lo Scudo Protettivo (dura solo una notte, costa 1 punto missione).</p>' +
            confirmBox +
            '<div class="btn-row">' + (gButtons || '<span class="subtext">Nessun giocatore disponibile.</span>') + '</div>' +
          '</div>'
        );
      }

      if (roleKey === 'investigatore') {
        return (
          '<div class="ability-box">' +
            '<div class="header-row"><strong>Abilità Investigatore</strong><span class="badge badge-Fedeli">Punti missione: ' + state.missionPoints + '</span></div>' +
            '<p class="subtext">Spendi 1 punto missione per ottenere una missione degli Assassini abbastanza semplice da svolgere.</p>' +
            confirmBox +
            '<div class="btn-row"><button type="button" class="btn-indigo" ' + (state.missionPoints <= 0 ? 'disabled' : '') + ' onclick="requestAbilityConfirm('investigatore_missione','')">Ottieni Missione Assassini (Bassa Difficoltà)</button></div>' +
          '</div>'
        );
      }

      if (roleKey === 'martire') {
        var mRevealBtns = state.players.filter(function (p) {
          return String(p.name || '').toLowerCase() !== state.playerName.toLowerCase();
        }).map(function (p) {
          var safeN = escapeHtml(p.name).replace(/'/g, "\'");
          return '<button type="button" class="btn-indigo" ' + (state.missionPoints <= 0 ? 'disabled' : '') + ' onclick="requestAbilityConfirm('martire_rileva','' + safeN + '')">Rileva ruolo: ' + escapeHtml(p.name) + '</button>';
        }).join('');
        var mShieldBtns = state.players.map(function (p) {
          var safeN = escapeHtml(p.name).replace(/'/g, "\'");
          return '<button type="button" class="btn-emerald" ' + (state.missionPoints <= 0 ? 'disabled' : '') + ' onclick="requestAbilityConfirm('martire_scudo','' + safeN + '')">Scudo persistente: ' + escapeHtml(p.name) + '</button>';
        }).join('');
        return (
          '<div class="ability-box">' +
            '<div class="header-row"><strong>Abilità Martire</strong><span class="badge badge-Fedeli">Punti missione: ' + state.missionPoints + '</span></div>' +
            '<p class="subtext">Ottieni punti subendo missioni. Con 1 punto puoi rilevare il ruolo di un giocatore o dargli uno Scudo attivo finché non viene colpito dall’Assassino o dal Sabotatore.</p>' +
            confirmBox +
            '<div class="btn-row">' + mRevealBtns + '</div>' +
            '<div class="btn-row">' + mShieldBtns + '</div>' +
          '</div>'
        );
      }

      if (roleKey === 'sabotatore') {
        var sButtons = state.players.filter(function (p) {
          return String(p.name || '').toLowerCase() !== state.playerName.toLowerCase();
        }).map(function (p) {
          var safeN = escapeHtml(p.name).replace(/'/g, "\'");
          return '<button type="button" class="btn-gold" ' + (state.missionPoints <= 0 ? 'disabled' : '') + ' onclick="requestAbilityConfirm('sabotatore_annulla','' + safeN + '')">Sabota silenziosamente: ' + escapeHtml(p.name) + '</button>';
        }).join('');
        return (
          '<div class="ability-box">' +
            '<div class="header-row"><strong>Abilità Sabotatore</strong><span class="badge badge-Traditori">Punti missione: ' + state.missionPoints + '</span></div>' +
            '<p class="subtext">Spendi 1 punto missione per annullare l’abilità del bersaglio: spenderà comunque il punto ma l’effetto non avverrà, senza che il malus venga mai svelato.</p>' +
            confirmBox +
            '<div class="btn-row">' + sButtons + '</div>' +
          '</div>'
        );
      }

      var extraBtn = '';
      if (roleKey === 'mediatore') {
        extraBtn = '<span class="badge badge-Fedeli">Voto Extra +1 Attivo alla Tavola Rotonda</span>';
      }

      return (
        '<div class="ability-box">' +
          '<strong>Potere del Ruolo (' + escapeHtml(role.name) + ')</strong>' +
          '<p class="subtext">' + escapeHtml(role.powerDesc) + '</p>' +
          confirmBox +
          (extraBtn ? '<div class="btn-row">' + extraBtn + '</div>' : '') +
        '</div>'
      );
    }

    function render() {
      var root = document.getElementById('player-board-app');
      if (!root) return;

      var roleObj = state.assignedRoleKey && ROLE_DETAILS[state.assignedRoleKey] ? ROLE_DETAILS[state.assignedRoleKey] : null;
      var faction = roleObj ? roleObj.faction : 'Fedeli';
      var missions = ensureFiveMissions(state.missions, faction, null);
      state.missions = missions;

      var bannerHtml = state.banner
        ? '<div class="banner banner-' + state.banner.type + '">' + escapeHtml(state.banner.text) + '</div>'
        : '';

      var actionBannerHtml = state.actionResultText
        ? '<div class="banner banner-info">' + escapeHtml(state.actionResultText) + '</div>'
        : '';

      var privateCardHtml = roleObj
        ? (state.privateCardOpen
            ? '<div style="margin-top:12px;background:var(--bg);border:1px solid rgba(62,201,140,0.4);border-radius:12px;padding:14px;">' +
                '<div class="header-row">' +
                  '<div>' +
                    '<span class="eyebrow">Ruolo Assegnato</span>' +
                    '<h2 style="font-size:21px;">' + escapeHtml(roleObj.name) + '</h2>' +
                  '</div>' +
                  '<span class="badge badge-' + roleObj.faction + '">' + escapeHtml(roleObj.faction) + '</span>' +
                '</div>' +
                '<p class="subtext" style="color:#e5e7eb;margin-top:8px;">' + escapeHtml(roleObj.powerDesc) + '</p>' +
              '</div>'
            : '<p class="subtext">Ruolo assegnato dal Master. Clicca <strong>Mostra / Nascondi Scheda</strong> per consultarlo in segreto.</p>')
        : '<p class="subtext">Bloccata finché il Master non ti assegna un ruolo sulla stanza <strong>' + escapeHtml(state.roomCode) + '</strong>.</p>';

      var missionsHtml = missions.map(function (m, idx) {
        return (
          '<div class="mission-row ' + (m.done ? 'done' : '') + '">' +
            '<div>' +
              '<div class="mission-title">' + m.slot + '. ' + escapeHtml(m.title) + ' ' + (m.done ? '<span class="badge badge-Fedeli">Fatta</span>' : '') + '</div>' +
              '<div class="mission-desc">' + escapeHtml(m.desc) + '</div>' +
            '</div>' +
            '<button type="button" class="' + (m.done ? 'btn-emerald' : 'btn-gold') + '" onclick="toggleMissionDone(' + idx + ')">' +
              (m.done ? 'Fatto ✓' : 'Fatto') +
            '</button>' +
          '</div>'
        );
      }).join('');

      var myMsgs = state.masterChat.filter(function (msg) {
        return !msg.playerName || String(msg.playerName).toLowerCase() === state.playerName.toLowerCase() || msg.fromMaster;
      });

      var msgsHtml = myMsgs.length
        ? myMsgs.map(function (msg) {
            return (
              '<div class="msg-card">' +
                '<div class="msg-head"><strong>' + escapeHtml(msg.senderName || (msg.fromMaster ? 'Master' : state.playerName)) + '</strong><span></span></div>' +
                '<p class="msg-body">' + escapeHtml(msg.text) + '</p>' +
              '</div>'
            );
          }).join('')
        : '<p class="subtext">Nessun messaggio ancora in chat.</p>';

      root.innerHTML =
        '<header class="card header-row">' +
          '<div class="profile-head">' +
            '<div class="avatar">' + escapeHtml(state.playerName.slice(0, 1).toUpperCase() || 'G') + '</div>' +
            '<div>' +
              '<span class="eyebrow">Plancia Giocatore · ' + escapeHtml(state.syncStatus) + '</span>' +
              '<h1>' + escapeHtml(state.playerName) + '</h1>' +
              '<p class="subtext">Stanza: <strong>' + escapeHtml(state.roomCode) + '</strong> · ID Sync: <strong class="mono">SYNC-' + escapeHtml(state.roomCode) + '</strong></p>' +
            '</div>' +
          '</div>' +
          '<div class="btn-row">' +
            '<button type="button" class="btn-indigo" onclick="window.location.href='abilita.html'">Scheda Abilità</button>' +
            '<button type="button" class="btn-gold" onclick="goToRoles()">Tutti i Ruoli</button>' +
            '' +
            '<button type="button" class="btn-ghost" onclick="goToAccess()">Cambia Stanza</button>' +
          '</div>' +
        '</header>' +
        bannerHtml +
        actionBannerHtml +
        '<section class="card card-gold">' +
          '<div class="header-row">' +
            '<div>' +
              '<span class="eyebrow">Identità Segreta</span>' +
              '<h2>Scheda Privata e Abilità</h2>' +
            '</div>' +
            '<button type="button" class="btn-indigo" onclick="togglePrivateCard()">' +
              (roleObj ? (state.privateCardOpen ? 'Nascondi Scheda' : 'Mostra Scheda') : 'In attesa del ruolo') +
            '</button>' +
          '</div>' +
          privateCardHtml +
          renderRoleAbilitySection(state.assignedRoleKey) +
        '</section>' +
        '<section class="card">' +
          '<div class="header-row">' +
            '<div>' +
              '<span class="eyebrow">Obiettivi della Partita</span>' +
              '<h2>Le Tue 5 Missioni</h2>' +
            '</div>' +
            '<span class="badge badge-' + faction + '">Completate: ' + missions.filter(function (x) { return x.done; }).length + ' / 5</span>' +
          '</div>' +
          '<p class="subtext">Premi <strong>Fatto</strong> accanto a una missione per notificare subito al Master se hai completato quella missione.</p>' +
          '<div class="mission-list">' + missionsHtml + '</div>' +
        '</section>' +
        '<section class="card">' +
          '<span class="eyebrow">Tavolo e Master</span>' +
          '<h2>Notifiche e Chat con il Master</h2>' +
          '<div class="chat-box">' + msgsHtml + '</div>' +
          '<div class="chat-form">' +
            '<input id="player-chat-input" type="text" value="' + escapeHtml(chatDraft) + '" oninput="updateChatDraft(this.value)" onkeydown="if(event.key===\'Enter\'){event.preventDefault();sendPlayerChat();}" placeholder="Scrivi al Master..." />' +
            '<button type="button" class="btn-gold" onclick="sendPlayerChat()">Invia</button>' +
          '</div>' +
        '</section>';
    }

    render();

    var ref = getRoomRef();
    if (ref) {
      getDoc(ref).then(function (snap) {
        if (snap.exists()) {
          applyRoomSnapshot(snap.data() || {});
          render();
        }
      }).catch(function () {});

      onSnapshot(ref, function (snap) {
        state.syncStatus = 'Cloud Firestore attivo';
        if (!snap.exists()) return;
        applyRoomSnapshot(snap.data() || {});
        render();
      });
    }
  </script>

<script>
(function () {
  var ROOM_PREFIX = 'ombre_stanza_sync_';
  var ACCESS_KEY = 'ombre_accesso_tavolo_v1';
  var missionsVisible = false;

  function getAccessInfo() {
    try {
      var raw = localStorage.getItem(ACCESS_KEY);
      if (raw) {
        var p = JSON.parse(raw);
        return {
          roomCode: String(p.roomCode || 'TAVOLO1').trim().toUpperCase(),
          playerName: String(p.playerName || '').trim()
        };
      }
    } catch (_e) {}
    return { roomCode: 'TAVOLO1', playerName: '' };
  }

  function loadRoom() {
    var info = getAccessInfo();
    try {
      var raw = localStorage.getItem(ROOM_PREFIX + info.roomCode);
      return raw ? JSON.parse(raw) : { players: [], missionAssignments: {}, playerPoints: {} };
    } catch (_e) {
      return { players: [], missionAssignments: {}, playerPoints: {} };
    }
  }

  function saveRoom(data) {
    var info = getAccessInfo();
    data.updatedAt = Date.now();
    try {
      localStorage.setItem(ROOM_PREFIX + info.roomCode, JSON.stringify(data));
    } catch (_e) {}
  }

  window.togglePlayerMissionsVisibility = function () {
    missionsVisible = !missionsVisible;
    renderPlayerMissionsBox();
  };

  window.playerClaimMissionDone = function (slotIdx) {
    var info = getAccessInfo();
    var pKey = info.playerName.toLowerCase();
    if (!pKey) return;
    var data = loadRoom();
    data.missionAssignments = data.missionAssignments || {};
    var list = Array.isArray(data.missionAssignments[pKey]) ? data.missionAssignments[pKey] : [];
    if (list[slotIdx]) {
      list[slotIdx].playerClaimedDone = !list[slotIdx].playerClaimedDone;
      data.missionAssignments[pKey] = list;
      saveRoom(data);
      renderPlayerMissionsBox();
    }
  };

  function renderPlayerMissionsBox() {
    var host = document.getElementById('player-secret-missions-panel');
    if (!host) return;
    var info = getAccessInfo();
    var pKey = info.playerName.toLowerCase();
    var data = loadRoom();
    data.missionAssignments = data.missionAssignments || {};
    data.playerPoints = data.playerPoints || {};
    var missions = pKey && Array.isArray(data.missionAssignments[pKey]) ? data.missionAssignments[pKey] : [];
    var pts = pKey ? Number(data.playerPoints[pKey] || 0) : 0;

    var bodyHtml = '';
    if (!missionsVisible) {
      bodyHtml = '<div style="padding:12px;border-radius:10px;background:#0c0e14;border:1px dashed rgba(229,184,92,0.35);color:#9ca3af;font-size:13px;">Missioni nascoste per evitare sbirciate. Premi <strong>Mostra Missioni</strong> per aprirle.</div>';
    } else if (!missions.length) {
      bodyHtml = '<div style="padding:12px;border-radius:10px;background:#0c0e14;color:#9ca3af;font-size:13px;">Il Master non ha ancora assegnato le tue 5 missioni.</div>';
    } else {
      bodyHtml = '<div style="display:flex;flex-direction:column;gap:8px;">' + missions.map(function (m, idx) {
        var statusTxt = m.masterApproved
          ? '<span style="color:#3ec98c;font-weight:700;">Confermata dal Master ✓</span>'
          : (m.playerClaimedDone
              ? '<span style="color:#e5b85c;font-weight:700;">Segnalata al Master (in attesa)</span>'
              : '<span style="color:#9ca3af;">Da completare</span>');
        return '<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:#0c0e14;border:1px solid rgba(255,255,255,0.12);">' +
          '<div style="max-width:72%;">' +
            '<div style="font-size:13px;font-weight:700;color:#fff;">' + m.slot + '. ' + m.title + ' <span style="font-size:11px;color:#9ca3af;">(' + (m.repeatable ? 'Ripetibile' : 'Singola') + ' · ' + m.type + ')</span></div>' +
            '<div style="font-size:12px;color:#d1d5db;margin-top:2px;">' + m.desc + '</div>' +
            '<div style="font-size:11px;margin-top:4px;">' + statusTxt + '</div>' +
          '</div>' +
          '<button type="button" onclick="playerClaimMissionDone(' + idx + ')" style="padding:7px 11px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:12px;background:' + (m.playerClaimedDone ? '#3ec98c' : '#e5b85c') + ';color:#0c0e14;">' + (m.playerClaimedDone ? 'Segnalata ✓' : 'Segnala Fatta') + '</button>' +
        '</div>';
      }).join('') + '</div>';
    }

    host.innerHTML =
      '<div style="max-width:960px;margin:18px auto 36px;padding:0 16px;">' +
        '<div style="border:1px solid rgba(229,184,92,0.35);border-radius:16px;padding:18px;background:#151924;">' +
          '<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;">' +
            '<div>' +
              '<div style="font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#e5b85c;">Le Tue Missioni Segrete</div>' +
              '<h3 style="margin:2px 0 0;font-size:17px;color:#fff;">Punti Attuali: <span style="color:#3ec98c;">' + pts + '</span></h3>' +
            '</div>' +
            '<button type="button" onclick="togglePlayerMissionsVisibility()" style="padding:8px 14px;border-radius:10px;border:1px solid rgba(229,184,92,0.45);background:#1d2230;color:#e5b85c;font-weight:700;font-size:12px;cursor:pointer;">' + (missionsVisible ? 'Nascondi Missioni' : 'Mostra Missioni') + '</button>' +
          '</div>' +
          bodyHtml +
        '</div>' +
      '</div>';
  }

  document.addEventListener('DOMContentLoaded', function () {
    var wrap = document.createElement('div');
    wrap.id = 'player-secret-missions-panel';
    document.body.appendChild(wrap);
    renderPlayerMissionsBox();
    setInterval(renderPlayerMissionsBox, 2000);
  });
})();
</script>


<script>
(function () {
  var ROOM_PREFIX = 'ombre_stanza_sync_';
  var ACCESS_KEY = 'ombre_accesso_tavolo_v1';

  var GAME_PHASES = [
    { step: 1, title: 'Cerimonia dei Ruoli', tip: 'Ricevi e consulta la tua scheda privata in segreto.' },
    { step: 2, title: 'Interludio Ludico', tip: 'Gioca al tavolo, osserva i comportamenti e porta avanti le tue missioni.' },
    { step: 3, title: 'Notte (Primo Assassinio)', tip: 'Silenzio al tavolo: fase del primo colpo notturno.' },
    { step: 4, title: 'Risveglio', tip: 'Scopri cosa è accaduto durante la notte.' },
    { step: 5, title: 'Interludio Ludico', tip: 'Nuovo momento di gioco al tavolo, missioni e confronti.' },
    { step: 6, title: 'Tavolo Ovale', tip: 'Confronto collettivo: preparati alla discussione e alle decisioni del tavolo.' },
    { step: 7, title: 'Notte (Assassino)', tip: 'Nuova fase notturna: il ciclo prosegue fino alla conclusione.' }
  ];

  function getAccessInfo() {
    try {
      var raw = localStorage.getItem(ACCESS_KEY);
      if (raw) {
        var p = JSON.parse(raw);
        return {
          roomCode: String(p.roomCode || 'TAVOLO1').trim().toUpperCase(),
          playerName: String(p.playerName || '').trim()
        };
      }
    } catch (_e) {}
    return { roomCode: 'TAVOLO1', playerName: '' };
  }

  function loadRoom() {
    var info = getAccessInfo();
    try {
      var raw = localStorage.getItem(ROOM_PREFIX + info.roomCode);
      return raw ? JSON.parse(raw) : { phaseIndex: 0, cycleCount: 1 };
    } catch (_e) {
      return { phaseIndex: 0, cycleCount: 1 };
    }
  }

  function renderPlayerPhaseBanner() {
    var host = document.getElementById('player-current-phase-banner');
    if (!host) return;
    var data = loadRoom();
    var idx = Number(data.phaseIndex || 0);
    if (idx < 0 || idx >= GAME_PHASES.length) idx = 0;
    var ph = GAME_PHASES[idx];
    var cycle = Number(data.cycleCount || 1);

    host.innerHTML =
      '<div style="max-width:960px;margin:16px auto 0;padding:0 16px;">' +
        '<div style="border:1px solid rgba(124,140,255,0.4);border-radius:14px;padding:14px 18px;background:#151924;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;">' +
          '<div>' +
            '<div style="font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#7c8cff;">Fase Attuale · Ciclo #' + cycle + '</div>' +
            '<div style="font-size:17px;font-weight:800;color:#fff;margin-top:2px;">' + ph.step + '. ' + ph.title + '</div>' +
            '<div style="font-size:12px;color:#9ca3af;margin-top:2px;">' + ph.tip + '</div>' +
          '</div>' +
          '<span style="font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(124,140,255,0.16);color:#7c8cff;border:1px solid rgba(124,140,255,0.35);">Fase ' + ph.step + ' / 7</span>' +
        '</div>' +
      '</div>';
  }

  document.addEventListener('DOMContentLoaded', function () {
    var wrap = document.createElement('div');
    wrap.id = 'player-current-phase-banner';
    document.body.insertBefore(wrap, document.body.firstChild);
    renderPlayerPhaseBanner();
    setInterval(renderPlayerPhaseBanner, 2000);
  });
})();
</script>

</body>
