<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ombre al Tavolo — Master: Cerimonia e Ruoli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    // Configurazione tema scuro e font del gioco
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Cinzel', 'serif'],
          },
          colors: {
            bgdark: '#0c0e14',
            surface: '#151924',
            surface2: '#1d2230',
            gold: '#e5b85c',
            crimson: '#e05260',
            emerald: '#3ec98c',
            indigo: '#7c8cff',
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #0c0e14;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-bgdark text-gray-100 antialiased">
  <div id="master-roles-app" class="max-w-6xl mx-auto px-4 py-8 space-y-6"></div>

  <script>
    // Catalogo ruoli disponibili per la configurazione e l'estrazione
    const ROLE_CATALOG = {
      investigatore: {
        name: 'Investigatore',
        faction: 'Cittadini',
        badgeClass: 'bg-emerald/15 text-emerald border-emerald/40',
        summary: 'Indaga sul ruolo segreto di un giocatore vivo.'
      },
      guardia: {
        name: 'Guardia',
        faction: 'Cittadini',
        badgeClass: 'bg-emerald/15 text-emerald border-emerald/40',
        summary: 'Protegge un giocatore dagli attacchi nel turno.'
      },
      cacciatore: {
        name: 'Cacciatore',
        faction: 'Cittadini',
        badgeClass: 'bg-emerald/15 text-emerald border-emerald/40',
        summary: 'Può colpire un bersaglio sospetto rischiando il contraccolpo.'
      },
      martire: {
        name: 'Martire',
        faction: 'Cittadini',
        badgeClass: 'bg-emerald/15 text-emerald border-emerald/40',
        summary: 'Lascia una testimonianza pubblica sul ruolo di un giocatore.'
      },
      assassino: {
        name: 'Assassino',
        faction: 'Traditori',
        badgeClass: 'bg-crimson/15 text-crimson border-crimson/40',
        summary: 'Elimina silenziosamente un bersaglio.'
      },
      sabotatore: {
        name: 'Sabotatore',
        faction: 'Traditori',
        badgeClass: 'bg-crimson/15 text-crimson border-crimson/40',
        summary: 'Ostacola o blocca l’azione di un avversario.'
      }
    };

    // Discorsi preimpostati per l'assegnazione dei ruoli al tavolo
    const SPEECH_TEMPLATES = {
      suspense: [
        'Le luci si abbassano intorno al tavolo della stanza {{STANZA}}. Ognuno ha davanti a sé un destino ancora non svelato.',
        'Nel silenzio della notte, le ombre iniziano a muoversi: alcuni giureranno fedeltà alla luce, altri nasconderanno un secondo fine.',
        'Ora riceverete il vostro ruolo segreto. Guardate la vostra scheda soltanto quando siete certi che nessuno sbircia, poi alzate lo sguardo sul tavolo.'
      ],
      solenne: [
        'Benvenuti nella cerimonia d’apertura del tavolo {{STANZA}}. Da questo istante il patto del gioco è sigillato.',
        'Ogni ruolo porta con sé un dovere, un limite e una scelta che peserà sull’intera serata.',
        'Prendete coscienza della vostra identità segreta con calma e preparatevi a sostenere la vostra parte.'
      ],
      rapido: [
        'Tavolo {{STANZA}}, ci siamo: i ruoli stanno per essere distribuiti.',
        'Controlla in segreto la tua scheda non appena viene assegnata, non mostrare nulla e resta pronto a giocare.'
      ]
    };

    const ACCESS_STORAGE_KEY = 'ombre_accesso_tavolo_v1';
    const MASTER_ROLES_STORAGE_KEY = 'ombre_master_assegnazione_ruoli_v1';
    const ROOM_SYNC_PREFIX = 'ombre_stanza_sync_';

    // Legge il contesto salvato dalla pagina di accesso in sicurezza
    function readAccessContext() {
      try {
        const raw = localStorage.getItem(ACCESS_STORAGE_KEY);
        if (!raw) {
          return { roomCode: 'TAVOLO1', masterName: 'Master' };
        }
        const parsed = JSON.parse(raw);
        return {
          roomCode: String(parsed.roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1',
          masterName: String(parsed.playerName || 'Master').trim() || 'Master'
        };
      } catch (err) {
        console.error('Errore lettura contesto accesso:', err);
        return { roomCode: 'TAVOLO1', masterName: 'Master' };
      }
    }

    // Crea lo stato iniziale della pagina Master
    function createInitialMasterRoleState() {
      const ctx = readAccessContext();
      return {
        roomCode: ctx.roomCode,
        masterName: ctx.masterName,
        roleCounts: {
          investigatore: 1,
          guardia: 1,
          cacciatore: 1,
          martire: 0,
          assassino: 1,
          sabotatore: 1
        },
        players: [
          { id: 'm_p1', name: 'Elena', assignedRoleKey: null },
          { id: 'm_p2', name: 'Marco', assignedRoleKey: null },
          { id: 'm_p3', name: 'Sofia', assignedRoleKey: null },
          { id: 'm_p4', name: 'Luca', assignedRoleKey: null }
        ],
        speechTone: 'suspense',
        customSpeechText: '',
        activeParagraphIndex: 0,
        assignmentCompleted: false,
        boardOpened: false,
        banner: null
      };
    }

    // Carica lo stato salvato della pagina Master in sicurezza
    function loadMasterRoleState() {
      try {
        const ctx = readAccessContext();
        const base = createInitialMasterRoleState();
        const raw = localStorage.getItem(MASTER_ROLES_STORAGE_KEY);
        if (!raw) {
          return { ...base, roomCode: ctx.roomCode, masterName: ctx.masterName };
        }
        const parsed = JSON.parse(raw);
        const mergedCounts = { ...base.roleCounts };
        if (parsed.roleCounts && typeof parsed.roleCounts === 'object') {
          Object.keys(mergedCounts).forEach(key => {
            mergedCounts[key] = Math.max(0, Math.min(12, Number(parsed.roleCounts[key] ?? mergedCounts[key])));
          });
        }
        return {
          ...base,
          ...parsed,
          roomCode: ctx.roomCode,
          masterName: ctx.masterName,
          roleCounts: mergedCounts,
          players: Array.isArray(parsed.players) ? parsed.players : base.players,
          boardOpened: Boolean(parsed.boardOpened)
        };
      } catch (err) {
        console.error('Errore caricamento stato Master:', err);
        return createInitialMasterRoleState();
      }
    }

    let masterState = loadMasterRoleState();

    // Sincronizza giocatori e ruoli assegnati nella stanza condivisa
    function syncMasterRoomRecord() {
      const cleanRoom = String(masterState.roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1';
      try {
        localStorage.setItem(ROOM_SYNC_PREFIX + cleanRoom, JSON.stringify({
          roomCode: cleanRoom,
          players: masterState.players.map(p => ({
            id: p.id,
            name: p.name,
            assignedRoleKey: p.assignedRoleKey || null
          })),
          roleCounts: { ...masterState.roleCounts },
          updatedAt: Date.now()
        }));
      } catch (err) {
        console.error('Errore sincronizzazione stanza da Master:', err);
      }
    }

    // Salva lo stato della pagina Master
    function saveMasterRoleState() {
      try {
        localStorage.setItem(MASTER_ROLES_STORAGE_KEY, JSON.stringify(masterState));
      } catch (err) {
        console.error('Errore salvataggio stato Master:', err);
      }
      syncMasterRoomRecord();
    }

    // Imposta un messaggio di feedback per il Master
    function setMasterBanner(text, type = 'info') {
      masterState.banner = { text, type };
      saveMasterRoleState();
      renderMasterRolePage();
    }

    // Restituisce i paragrafi del discorso di assegnazione ruoli
    function getSpeechParagraphs() {
      const cleanRoom = String(masterState.roomCode || 'TAVOLO1').toUpperCase();
      const customRaw = String(masterState.customSpeechText || '').trim();
      if (customRaw) {
        return customRaw
          .split(/\n\s*\n/)
          .map(part => part.replace(/\{\{STANZA\}\}/gi, cleanRoom).trim())
          .filter(Boolean);
      }
      const list = SPEECH_TEMPLATES[masterState.speechTone] || SPEECH_TEMPLATES.suspense;
      return list.map(line => line.replace(/\{\{STANZA\}\}/gi, cleanRoom));
    }

    // Cambia tono del discorso preimpostato
    function setSpeechTone(tone) {
      if (!SPEECH_TEMPLATES[tone]) return;
      masterState.speechTone = tone;
      masterState.customSpeechText = '';
      masterState.activeParagraphIndex = 0;
      saveMasterRoleState();
      renderMasterRolePage();
    }

    // Aggiorna il testo personalizzato del discorso
    function updateCustomSpeechText(value) {
      masterState.customSpeechText = String(value || '');
      masterState.activeParagraphIndex = 0;
      saveMasterRoleState();
      renderMasterRolePage();
    }

    // Seleziona un paragrafo specifico del discorso
    function selectSpeechParagraph(index) {
      const paragraphs = getSpeechParagraphs();
      if (paragraphs.length === 0) return;
      masterState.activeParagraphIndex = Math.max(0, Math.min(paragraphs.length - 1, Number(index || 0)));
      saveMasterRoleState();
      renderMasterRolePage();
    }

    // Copia il discorso completo negli appunti con fallback sicuro
    function copyFullSpeech() {
      const fullText = getSpeechParagraphs().join('\n\n');
      if (!fullText) {
        setMasterBanner('Nessun testo del discorso da copiare.', 'error');
        return;
      }
      try {
        const ta = document.createElement('textarea');
        ta.value = fullText;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        setMasterBanner('Discorso di assegnazione ruoli copiato negli appunti.', 'success');
      } catch (err) {
        console.error('Errore copia discorso:', err);
        setMasterBanner('Impossibile copiare automaticamente il testo in questo browser.', 'error');
      }
    }

    // Modifica il numero di copie di un ruolo
    function adjustMasterRoleCount(roleKey, delta) {
      if (!ROLE_CATALOG[roleKey]) return;
      const cur = Number(masterState.roleCounts[roleKey] || 0);
      masterState.roleCounts[roleKey] = Math.max(0, Math.min(12, cur + delta));
      masterState.banner = null;
      saveMasterRoleState();
      renderMasterRolePage();
    }

    // Aggiunge un giocatore al tavolo del Master
    function addMasterPlayer(rawName) {
      const cleanName = String(rawName || '').trim();
      if (!cleanName) {
        setMasterBanner('Inserisci un nome valido per aggiungere un giocatore.', 'error');
        return;
      }
      masterState.players.push({
        id: 'm_p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        name: cleanName,
        assignedRoleKey: null
      });
      masterState.assignmentCompleted = false;
      masterState.banner = null;
      saveMasterRoleState();
      renderMasterRolePage();
    }

    // Rimuove un giocatore dal tavolo del Master
    function removeMasterPlayer(playerId) {
      masterState.players = masterState.players.filter(p => p.id !== playerId);
      masterState.banner = null;
      saveMasterRoleState();
      renderMasterRolePage();
    }

    // Estrae e assegna casualmente i ruoli configurati ai giocatori
    function assignRolesRandomly() {
      if (masterState.players.length === 0) {
        setMasterBanner('Aggiungi almeno un giocatore al tavolo prima di assegnare i ruoli.', 'error');
        return;
      }

      const pool = [];
      Object.keys(ROLE_CATALOG).forEach(roleKey => {
        const count = Number(masterState.roleCounts[roleKey] || 0);
        for (let i = 0; i < count; i++) {
          pool.push(roleKey);
        }
      });

      if (pool.length < masterState.players.length) {
        setMasterBanner(
          `Hai configurato ${pool.length} ruoli per ${masterState.players.length} giocatori: aumenta la quantità di uno o più ruoli.`,
          'error'
        );
        return;
      }

      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = pool[i];
        pool[i] = pool[j];
        pool[j] = tmp;
      }

      const extracted = pool.slice(0, masterState.players.length);
      masterState.players = masterState.players.map((player, idx) => ({
        ...player,
        assignedRoleKey: extracted[idx]
      }));
      masterState.assignmentCompleted = true;

      setMasterBanner(
        `Assegnati casualmente ${extracted.length} ruoli: ora puoi leggere il discorso o aprire la Plancia Master.`,
        'success'
      );
    }

    // Azzera i ruoli assegnati mantenendo i giocatori al tavolo
    function resetRoleAssignments() {
      masterState.players = masterState.players.map(player => ({
        ...player,
        assignedRoleKey: null
      }));
      masterState.assignmentCompleted = false;
      masterState.boardOpened = false;
      setMasterBanner('Ruoli assegnati azzerati: i giocatori restano al tavolo.', 'info');
    }

    // Apre la plancia del Master dopo l'assegnazione dei ruoli
    function enterMasterBoard() {
      if (!masterState.assignmentCompleted) {
        setMasterBanner('Assegna prima i ruoli ai giocatori al tavolo per aprire la Plancia Master.', 'error');
        return;
      }
      masterState.boardOpened = true;
      masterState.banner = {
        text: 'Plancia Master aperta. Puoi tornare in qualsiasi momento a Cerimonia e Ruoli dal pulsante in alto.',
        type: 'success'
      };
      saveMasterRoleState();
      renderMasterRolePage();
    }

    // Riporta alla sezione Cerimonia e Gestione Ruoli
    function openCeremonyAndRolesSection() {
      masterState.boardOpened = false;
      masterState.banner = null;
      saveMasterRoleState();
      renderMasterRolePage();
    }

    // Naviga verso una pagina collegata se disponibile
    function goToPage(targetPage) {
      try {
        window.location.href = targetPage;
      } catch (err) {
        console.error('Errore navigazione verso ' + targetPage + ':', err);
      }
    }

    // Escape HTML per rendere sicuro l'inserimento di testo
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Renderizza l'intera pagina Master
    function renderMasterRolePage() {
      const container = document.getElementById('master-roles-app');
      if (!container) return;

      try {
        const totalRoles = Object.values(masterState.roleCounts).reduce((sum, v) => sum + Number(v || 0), 0);
        const paragraphs = getSpeechParagraphs();
        const safeIdx = paragraphs.length > 0
          ? Math.min(masterState.activeParagraphIndex, paragraphs.length - 1)
          : 0;
        const syncId = 'SYNC-' + masterState.roomCode;
        const banner = masterState.banner;

        const bannerHtml = banner
          ? `<div class="rounded-xl border px-4 py-3 text-sm font-medium ${
              banner.type === 'success'
                ? 'bg-emerald/15 border-emerald/40 text-emerald'
                : banner.type === 'error'
                ? 'bg-crimson/15 border-crimson/40 text-crimson'
                : 'bg-indigo/15 border-indigo/40 text-indigo'
            }">${escapeHtml(banner.text)}</div>`
          : '';

        if (masterState.boardOpened) {
          container.innerHTML = `
            <header class="rounded-2xl bg-surface border border-white/10 p-5 sm:p-6 flex flex-wrap items-center justify-between gap-4">
              <div>
                <span class="text-xs font-bold uppercase tracking-widest text-gold">Plancia Master</span>
                <h1 class="font-serif text-2xl sm:text-3xl font-bold text-white mt-1">Tavolo di ${escapeHtml(masterState.roomCode)}</h1>
                <p class="text-xs text-gray-400 mt-1">
                  Master: <strong class="text-gray-200">${escapeHtml(masterState.masterName)}</strong> ·
                  ID Sync: <strong class="font-mono text-emerald">${escapeHtml(syncId)}</strong>
                </p>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <button
                  type="button"
                  onclick="openCeremonyAndRolesSection()"
                  class="px-4 py-2.5 rounded-xl bg-gold text-bgdark text-xs font-bold hover:brightness-110 transition cursor-pointer"
                >
                  Cerimonia e Ruoli
                </button>
                <button
                  type="button"
                  onclick="goToPage('index.html')"
                  class="px-3.5 py-2.5 rounded-xl bg-surface2 hover:bg-white/10 border border-white/15 text-xs font-semibold text-gray-200 transition cursor-pointer"
                >
                  Torna ad Accesso
                </button>
              </div>
            </header>

            ${bannerHtml}

            <section class="rounded-2xl bg-surface border border-white/10 p-5 sm:p-6 space-y-4">
              <div class="flex items-center justify-between gap-2">
                <h2 class="font-serif text-xl font-bold text-white">Riepilogo Giocatori e Ruoli al Tavolo (${masterState.players.length})</h2>
                <span class="text-xs font-semibold text-emerald">Sessione Attiva</span>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${masterState.players.map(player => {
                  const roleInfo = player.assignedRoleKey ? ROLE_CATALOG[player.assignedRoleKey] : null;
                  return `
                    <div class="rounded-xl bg-bgdark border border-white/10 p-4 flex items-center justify-between gap-3">
                      <div>
                        <div class="font-semibold text-sm text-white">${escapeHtml(player.name)}</div>
                        <div class="text-xs text-gray-400 mt-0.5">Giocatore al tavolo</div>
                      </div>
                      <div>
                        ${roleInfo
                          ? `<span class="text-xs font-semibold px-2.5 py-1 rounded-full border ${roleInfo.badgeClass}">${escapeHtml(roleInfo.name)} · ${escapeHtml(roleInfo.faction)}</span>`
                          : `<span class="text-xs text-gray-400">Nessun ruolo</span>`
                        }
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </section>
          `;
          return;
        }

        container.innerHTML = `
          <header class="rounded-2xl bg-surface border border-white/10 p-5 sm:p-6 flex flex-wrap items-center justify-between gap-4">
            <div>
              <span class="text-xs font-bold uppercase tracking-widest text-gold">Pagina Master · Cerimonia e Gestione Ruoli</span>
              <h1 class="font-serif text-2xl sm:text-3xl font-bold text-white mt-1">Cerimonia di Assegnazione Ruoli</h1>
              <p class="text-xs text-gray-400 mt-1">
                Master: <strong class="text-gray-200">${escapeHtml(masterState.masterName)}</strong> ·
                Stanza: <strong class="text-gray-200">${escapeHtml(masterState.roomCode)}</strong> ·
                ID Sync: <strong class="font-mono text-emerald">${escapeHtml(syncId)}</strong>
              </p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button
                type="button"
                onclick="enterMasterBoard()"
                class="px-4 py-2.5 rounded-xl bg-emerald text-bgdark text-xs font-bold hover:brightness-110 transition cursor-pointer"
              >
                Vai alla Plancia Master
              </button>
              <button
                type="button"
                onclick="goToPage('index.html')"
                class="px-3.5 py-2.5 rounded-xl bg-surface2 hover:bg-white/10 border border-white/15 text-xs font-semibold text-gray-200 transition cursor-pointer"
              >
                Torna ad Accesso
              </button>
              <button
                type="button"
                onclick="assignRolesRandomly()"
                class="px-4 py-2.5 rounded-xl bg-gold text-bgdark text-xs font-bold hover:brightness-110 transition cursor-pointer"
              >
                Assegna Ruoli Casualmente
              </button>
              <button
                type="button"
                onclick="resetRoleAssignments()"
                class="px-3.5 py-2.5 rounded-xl bg-surface2 hover:bg-white/10 border border-white/15 text-xs font-semibold text-gray-200 transition cursor-pointer"
              >
                Azzera Ruoli
              </button>
            </div>
          </header>

          ${bannerHtml}

          <section class="rounded-2xl bg-surface border border-gold/30 p-5 sm:p-6 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <span class="text-[11px] font-bold uppercase tracking-widest text-gold">Prompter del Master</span>
                <h2 class="font-serif text-xl sm:text-2xl font-bold text-white mt-0.5">Discorso di Assegnazione Ruoli</h2>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <button
                  type="button"
                  onclick="setSpeechTone('suspense')"
                  class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition cursor-pointer ${
                    !masterState.customSpeechText && masterState.speechTone === 'suspense'
                      ? 'bg-gold text-bgdark border-gold'
                      : 'bg-bgdark text-gray-300 border-white/15 hover:bg-white/5'
                  }"
                >
                  Suspense
                </button>
                <button
                  type="button"
                  onclick="setSpeechTone('solenne')"
                  class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition cursor-pointer ${
                    !masterState.customSpeechText && masterState.speechTone === 'solenne'
                      ? 'bg-gold text-bgdark border-gold'
                      : 'bg-bgdark text-gray-300 border-white/15 hover:bg-white/5'
                  }"
                >
                  Solenne
                </button>
                <button
                  type="button"
                  onclick="setSpeechTone('rapido')"
                  class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition cursor-pointer ${
                    !masterState.customSpeechText && masterState.speechTone === 'rapido'
                      ? 'bg-gold text-bgdark border-gold'
                      : 'bg-bgdark text-gray-300 border-white/15 hover:bg-white/5'
                  }"
                >
                  Rapido
                </button>
                <button
                  type="button"
                  onclick="copyFullSpeech()"
                  class="px-3 py-1.5 rounded-xl bg-surface2 hover:bg-white/10 border border-white/15 text-xs font-semibold text-gray-200 transition cursor-pointer"
                >
                  Copia Discorso
                </button>
              </div>
            </div>

            <div class="space-y-2.5">
              ${paragraphs.length === 0
                ? `<div class="rounded-xl bg-bgdark border border-white/10 p-4 text-xs text-gray-400">
                     Nessun paragrafo disponibile. Scrivi un testo qui sotto oppure seleziona un tono preimpostato.
                   </div>`
                : paragraphs.map((text, idx) => {
                    const isActive = idx === safeIdx;
                    return `
                      <div
                        role="button"
                        tabindex="0"
                        onclick="selectSpeechParagraph(${idx})"
                        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectSpeechParagraph(${idx});}"
                        class="rounded-xl border p-4 transition cursor-pointer ${
                          isActive
                            ? 'bg-bgdark border-gold shadow-lg shadow-gold/5'
                            : 'bg-bgdark/60 border-white/10 hover:border-white/25'
                        }"
                      >
                        <div class="flex items-center justify-between gap-2 mb-1.5">
                          <span class="text-[11px] font-bold uppercase tracking-wider ${isActive ? 'text-gold' : 'text-gray-400'}">
                            Parte ${idx + 1} di ${paragraphs.length}
                          </span>
                          ${isActive
                            ? `<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-gold/15 text-gold border border-gold/30">In lettura</span>`
                            : ''
                          }
                        </div>
                        <p class="text-sm sm:text-base leading-relaxed ${isActive ? 'text-white font-medium' : 'text-gray-300'}">
                          ${escapeHtml(text)}
                        </p>
                      </div>
                    `;
                  }).join('')
              }
            </div>

            <div class="flex flex-wrap items-center justify-between gap-3 pt-1">
              <div class="flex items-center gap-2">
                <button
                  type="button"
                  onclick="selectSpeechParagraph(${safeIdx - 1})"
                  ${safeIdx <= 0 ? 'disabled' : ''}
                  class="px-3.5 py-2 rounded-xl bg-surface2 hover:bg-white/10 disabled:opacity-40 text-xs font-semibold text-gray-200 transition cursor-pointer"
                >
                  Parte Precedente
                </button>
                <button
                  type="button"
                  onclick="selectSpeechParagraph(${safeIdx + 1})"
                  ${safeIdx >= paragraphs.length - 1 ? 'disabled' : ''}
                  class="px-3.5 py-2 rounded-xl bg-indigo text-white disabled:opacity-40 text-xs font-semibold hover:brightness-110 transition cursor-pointer"
                >
                  Parte Successiva
                </button>
              </div>
              <span class="text-xs text-gray-400">
                Suggerimento: usa <code class="text-gold">{{STANZA}}</code> nel testo libero per inserire il codice stanza.
              </span>
            </div>

            <div class="pt-2 border-t border-white/10">
              <label for="custom-speech-input" class="block text-xs font-semibold text-gray-300 mb-1.5">
                Discorso personalizzato del Master (separa i paragrafi con una riga vuota)
              </label>
              <textarea
                id="custom-speech-input"
                rows="3"
                placeholder="Scrivi qui il tuo discorso di assegnazione ruoli per la stanza {{STANZA}}..."
                oninput="updateCustomSpeechText(this.value)"
                class="w-full rounded-xl bg-bgdark border border-white/15 px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-gold"
              >${escapeHtml(masterState.customSpeechText)}</textarea>
            </div>
          </section>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <section class="rounded-2xl bg-surface border border-white/10 p-5 sm:p-6 space-y-4">
              <div class="flex items-center justify-between gap-2">
                <h2 class="font-serif text-xl font-bold text-white">1. Configurazione Ruoli</h2>
                <span class="text-xs px-3 py-1 rounded-full bg-bgdark border border-white/10 text-gray-300">
                  Totale ruoli: <strong class="text-gold">${totalRoles}</strong>
                </span>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${Object.entries(ROLE_CATALOG).map(([roleKey, role]) => {
                  const count = Number(masterState.roleCounts[roleKey] || 0);
                  return `
                    <div class="rounded-xl bg-bgdark border border-white/10 p-3.5 flex flex-col justify-between gap-3">
                      <div>
                        <div class="flex items-center justify-between gap-2">
                          <span class="font-semibold text-sm text-white">${escapeHtml(role.name)}</span>
                          <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full border ${role.badgeClass}">
                            ${escapeHtml(role.faction)}
                          </span>
                        </div>
                        <p class="text-xs text-gray-400 mt-1.5">${escapeHtml(role.summary)}</p>
                      </div>
                      <div class="flex items-center justify-between pt-2 border-t border-white/10">
                        <span class="text-xs text-gray-400">Copie:</span>
                        <div class="flex items-center gap-2">
                          <button
                            type="button"
                            onclick="adjustMasterRoleCount('${roleKey}', -1)"
                            class="w-7 h-7 rounded-lg bg-surface2 hover:bg-white/10 text-xs font-bold text-gray-200 cursor-pointer"
                          >-</button>
                          <span class="w-6 text-center text-sm font-bold text-gold">${count}</span>
                          <button
                            type="button"
                            onclick="adjustMasterRoleCount('${roleKey}', 1)"
                            class="w-7 h-7 rounded-lg bg-surface2 hover:bg-white/10 text-xs font-bold text-gray-200 cursor-pointer"
                          >+</button>
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </section>

            <section class="rounded-2xl bg-surface border border-white/10 p-5 sm:p-6 space-y-4">
              <div class="flex items-center justify-between gap-2">
                <h2 class="font-serif text-xl font-bold text-white">2. Giocatori e Ruoli Assegnati (${masterState.players.length})</h2>
              </div>

              <form
                onsubmit="event.preventDefault(); const inp = document.getElementById('master-new-player'); addMasterPlayer(inp.value); inp.value = '';"
                class="flex gap-2"
              >
                <input
                  id="master-new-player"
                  type="text"
                  maxlength="24"
                  placeholder="Nome giocatore al tavolo..."
                  class="flex-1 rounded-xl bg-bgdark border border-white/15 px-3.5 py-2 text-sm text-white focus:outline-none focus:border-indigo"
                />
                <button
                  type="submit"
                  class="px-4 py-2 rounded-xl bg-indigo text-white text-xs font-semibold hover:brightness-110 transition cursor-pointer"
                >
                  Aggiungi
                </button>
              </form>

              <div class="space-y-2.5">
                ${masterState.players.map(player => {
                  const assignedRole = player.assignedRoleKey ? ROLE_CATALOG[player.assignedRoleKey] : null;
                  return `
                    <div class="rounded-xl bg-bgdark border border-white/10 p-3.5 flex items-center justify-between gap-3">
                      <div>
                        <div class="font-semibold text-sm text-white">${escapeHtml(player.name)}</div>
                        <div class="text-xs mt-1">
                          ${assignedRole
                            ? `<span class="font-semibold px-2 py-0.5 rounded-full border ${assignedRole.badgeClass}">${escapeHtml(assignedRole.name)} (${escapeHtml(assignedRole.faction)})</span>`
                            : `<span class="text-gray-400">In attesa di assegnazione ruolo</span>`
                          }
                        </div>
                      </div>
                      <button
                        type="button"
                        onclick="removeMasterPlayer('${player.id}')"
                        class="px-2.5 py-1.5 rounded-lg bg-surface2 hover:bg-crimson/20 text-xs text-gray-300 hover:text-crimson transition cursor-pointer"
                      >
                        Rimuovi
                      </button>
                    </div>
                  `;
                }).join('')}
              </div>
            </section>
          </div>

          <div class="flex justify-end">
            <button
              type="button"
              onclick="enterMasterBoard()"
              class="px-5 py-3 rounded-xl bg-emerald text-bgdark text-sm font-bold hover:brightness-110 transition cursor-pointer"
            >
              Completa e Vai alla Plancia Master
            </button>
          </div>
        `;
      } catch (err) {
        console.error('Errore rendering pagina Master:', err);
        container.innerHTML = `
          <div class="rounded-2xl bg-surface border border-crimson/40 p-6 text-sm text-crimson">
            Errore durante il caricamento della pagina Master. Ricarica l'anteprima.
          </div>
        `;
      }
    }

    // Esposizione esplicita delle funzioni globali richiamate dai pulsanti
    window.setSpeechTone = setSpeechTone;
    window.updateCustomSpeechText = updateCustomSpeechText;
    window.selectSpeechParagraph = selectSpeechParagraph;
    window.copyFullSpeech = copyFullSpeech;
    window.adjustMasterRoleCount = adjustMasterRoleCount;
    window.addMasterPlayer = addMasterPlayer;
    window.removeMasterPlayer = removeMasterPlayer;
    window.assignRolesRandomly = assignRolesRandomly;
    window.resetRoleAssignments = resetRoleAssignments;
    window.enterMasterBoard = enterMasterBoard;
    window.openCeremonyAndRolesSection = openCeremonyAndRolesSection;
    window.goToPage = goToPage;

    renderMasterRolePage();
  </script>
</body>
</html>
