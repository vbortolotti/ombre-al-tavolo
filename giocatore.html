<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ombre al Tavolo — Giocatore: Selfie e Plancia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Cinzel', 'serif'],
          },
          colors: {
            bgdark: '#0c0e14',
            surface: '#151924',
            surface2: '#1d2230',
            gold: '#e5b85c',
            crimson: '#e05260',
            emerald: '#3ec98c',
            indigo: '#7c8cff',
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #0c0e14;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-bgdark text-gray-100 antialiased">
  <div id="player-app" class="max-w-2xl mx-auto px-4 py-8 space-y-6"></div>

  <script>
    const ROLE_DETAILS = {
      investigatore: {
        name: 'Investigatore',
        faction: 'Cittadini',
        badge: 'bg-emerald/15 text-emerald border-emerald/40',
        power: 'Puoi indagare su un giocatore vivo per scoprire la sua fazione o il suo ruolo.'
      },
      guardia: {
        name: 'Guardia',
        faction: 'Cittadini',
        badge: 'bg-emerald/15 text-emerald border-emerald/40',
        power: 'Proteggi un giocatore al tavolo durante il turno corrente.'
      },
      cacciatore: {
        name: 'Cacciatore',
        faction: 'Cittadini',
        badge: 'bg-emerald/15 text-emerald border-emerald/40',
        power: 'Puoi tentare di eliminare un bersaglio sospetto.'
      },
      martire: {
        name: 'Martire',
        faction: 'Cittadini',
        badge: 'bg-emerald/15 text-emerald border-emerald/40',
        power: 'Lasci una testimonianza sul ruolo di un giocatore.'
      },
      assassino: {
        name: 'Assassino',
        faction: 'Traditori',
        badge: 'bg-crimson/15 text-crimson border-crimson/40',
        power: 'Colpisci in segreto un bersaglio durante la fase notturna.'
      },
      sabotatore: {
        name: 'Sabotatore',
        faction: 'Traditori',
        badge: 'bg-crimson/15 text-crimson border-crimson/40',
        power: 'Ostacola o blocca l’azione di un avversario.'
      }
    };

    const ACCESS_STORAGE_KEY = 'ombre_accesso_tavolo_v1';
    const PLAYER_STORAGE_KEY = 'ombre_giocatore_sessione_v1';
    const ROOM_SYNC_PREFIX = 'ombre_stanza_sync_';

    let activeCameraStream = null;

    // Legge codice stanza e nome giocatore salvati nella pagina di accesso
    function readPlayerAccessContext() {
      try {
        const raw = localStorage.getItem(ACCESS_STORAGE_KEY);
        if (!raw) {
          return { roomCode: 'TAVOLO1', playerName: 'Giocatore' };
        }
        const parsed = JSON.parse(raw);
        return {
          roomCode: String(parsed.roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1',
          playerName: String(parsed.playerName || 'Giocatore').trim() || 'Giocatore'
        };
      } catch (err) {
        console.error('Errore lettura contesto giocatore:', err);
        return { roomCode: 'TAVOLO1', playerName: 'Giocatore' };
      }
    }

    // Legge il ruolo eventualmente assegnato dal Master per questo giocatore nella stanza
    function readAssignedRoleFromRoom(roomCode, playerName) {
      const cleanRoom = String(roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1';
      const cleanName = String(playerName || '').trim().toLowerCase();
      try {
        const raw = localStorage.getItem(ROOM_SYNC_PREFIX + cleanRoom);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        const players = Array.isArray(parsed.players) ? parsed.players : [];
        const match = players.find(p => String(p.name || '').trim().toLowerCase() === cleanName);
        if (match && match.assignedRoleKey && ROLE_DETAILS[match.assignedRoleKey]) {
          return match.assignedRoleKey;
        }
      } catch (err) {
        console.error('Errore lettura ruolo assegnato:', err);
      }
      return null;
    }

    // Crea lo stato iniziale della pagina Giocatore
    function createInitialPlayerState() {
      const ctx = readPlayerAccessContext();
      return {
        roomCode: ctx.roomCode,
        playerName: ctx.playerName,
        selfieDataUrl: null,
        cameraActive: false,
        boardUnlocked: false,
        privateCardOpen: false,
        assignedRoleKey: readAssignedRoleFromRoom(ctx.roomCode, ctx.playerName),
        banner: null
      };
    }

    // Carica lo stato della sessione giocatore in sicurezza
    function loadPlayerState() {
      try {
        const ctx = readPlayerAccessContext();
        const base = createInitialPlayerState();
        const raw = localStorage.getItem(PLAYER_STORAGE_KEY);
        if (!raw) return base;
        const parsed = JSON.parse(raw);
        const samePlayer =
          String(parsed.roomCode || '').toUpperCase() === ctx.roomCode &&
          String(parsed.playerName || '').trim().toLowerCase() === ctx.playerName.toLowerCase();
        const syncedRole = readAssignedRoleFromRoom(ctx.roomCode, ctx.playerName);
        const roleKey = syncedRole || (samePlayer && parsed.assignedRoleKey && ROLE_DETAILS[parsed.assignedRoleKey] ? parsed.assignedRoleKey : null);

        return {
          ...base,
          roomCode: ctx.roomCode,
          playerName: ctx.playerName,
          selfieDataUrl: samePlayer ? (parsed.selfieDataUrl || null) : null,
          cameraActive: false,
          boardUnlocked: samePlayer ? Boolean(parsed.boardUnlocked && parsed.selfieDataUrl) : false,
          privateCardOpen: roleKey ? Boolean(samePlayer && parsed.privateCardOpen) : false,
          assignedRoleKey: roleKey,
          banner: samePlayer ? (parsed.banner || null) : null
        };
      } catch (err) {
        console.error('Errore caricamento sessione giocatore:', err);
        return createInitialPlayerState();
      }
    }

    let playerState = loadPlayerState();

    // Salva la sessione del giocatore
    function savePlayerState() {
      try {
        localStorage.setItem(PLAYER_STORAGE_KEY, JSON.stringify({
          roomCode: playerState.roomCode,
          playerName: playerState.playerName,
          selfieDataUrl: playerState.selfieDataUrl,
          boardUnlocked: playerState.boardUnlocked,
          privateCardOpen: playerState.privateCardOpen,
          assignedRoleKey: playerState.assignedRoleKey,
          banner: playerState.banner
        }));
      } catch (err) {
        console.error('Errore salvataggio sessione giocatore:', err);
      }
    }

    // Imposta un messaggio di feedback per il giocatore
    function setPlayerBanner(text, type = 'info') {
      playerState.banner = { text, type };
      savePlayerState();
      renderPlayerPage();
    }

    // Ferma eventuali stream attivi della fotocamera
    function stopCameraStream() {
      try {
        if (activeCameraStream && typeof activeCameraStream.getTracks === 'function') {
          activeCameraStream.getTracks().forEach(track => track.stop());
        }
      } catch (err) {
        console.error('Errore chiusura fotocamera:', err);
      }
      activeCameraStream = null;
      playerState.cameraActive = false;
    }

    // Avvia la fotocamera frontale se supportata dal browser
    async function startPlayerCamera() {
      if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
        setPlayerBanner('Fotocamera diretta non disponibile qui: usa "Carica Foto" dalla galleria.', 'error');
        return;
      }
      try {
        stopCameraStream();
        activeCameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });
        playerState.cameraActive = true;
        playerState.banner = null;
        savePlayerState();
        renderPlayerPage();

        const videoEl = document.getElementById('player-camera-video');
        if (videoEl) {
          videoEl.srcObject = activeCameraStream;
        }
      } catch (err) {
        console.error('Errore accesso fotocamera:', err);
        playerState.cameraActive = false;
        setPlayerBanner('Permesso fotocamera negato o non disponibile: puoi usare "Carica Foto" dalla galleria.', 'error');
      }
    }

    // Scatta il selfie dal video attivo
    function captureSelfiePhoto() {
      const videoEl = document.getElementById('player-camera-video');
      if (!videoEl || !videoEl.videoWidth || !videoEl.videoHeight) {
        setPlayerBanner('Inquadratura non ancora pronta: riprova tra un istante o carica una foto.', 'error');
        return;
      }
      try {
        const canvas = document.createElement('canvas');
        canvas.width = videoEl.videoWidth;
        canvas.height = videoEl.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
        playerState.selfieDataUrl = canvas.toDataURL('image/jpeg', 0.85);
        stopCameraStream();
        playerState.banner = { text: 'Selfie acquisito! Ora puoi proseguire alla tua plancia.', type: 'success' };
        savePlayerState();
        renderPlayerPage();
      } catch (err) {
        console.error('Errore acquisizione selfie:', err);
        setPlayerBanner('Impossibile scattare il selfie in questo momento.', 'error');
      }
    }

    // Carica una foto direttamente dalla galleria/archivio del dispositivo
    function handleGalleryFileSelect(file) {
      if (!file) return;
      if (!file.type || !file.type.startsWith('image/')) {
        setPlayerBanner('Seleziona un file immagine valido.', 'error');
        return;
      }
      const reader = new FileReader();
      reader.onload = function (ev) {
        playerState.selfieDataUrl = String(ev.target && ev.target.result ? ev.target.result : '');
        stopCameraStream();
        playerState.banner = { text: 'Foto caricata dalla galleria! Ora puoi proseguire alla tua plancia.', type: 'success' };
        savePlayerState();
        renderPlayerPage();
      };
      reader.onerror = function () {
        setPlayerBanner('Errore durante il caricamento della foto.', 'error');
      };
      reader.readAsDataURL(file);
    }

    // Reindirizza dalla prima sessione selfie alla plancia del giocatore
    function goToPlayerBoard() {
      if (!playerState.selfieDataUrl) {
        setPlayerBanner('Scatta o carica prima il tuo selfie per accedere alla plancia.', 'error');
        return;
      }
      stopCameraStream();
      playerState.boardUnlocked = true;
      playerState.banner = null;
      savePlayerState();
      renderPlayerPage();
    }

    // Torna alla schermata selfie per cambiare foto
    function reopenSelfieStep() {
      playerState.boardUnlocked = false;
      playerState.privateCardOpen = false;
      playerState.banner = null;
      savePlayerState();
      renderPlayerPage();
    }

    // Controlla se il Master ha assegnato un ruolo a questo giocatore
    function refreshAssignedRoleFromMaster() {
      const roleKey = readAssignedRoleFromRoom(playerState.roomCode, playerState.playerName);
      playerState.assignedRoleKey = roleKey;
      if (roleKey) {
        setPlayerBanner('Il Master ti ha assegnato un ruolo: ora puoi aprire la tua scheda privata.', 'success');
      } else {
        playerState.privateCardOpen = false;
        setPlayerBanner('Nessun ruolo ancora assegnato dal Master: la scheda privata resta bloccata.', 'info');
      }
    }

    // Apre o chiude la scheda privata solo se il Master ha assegnato un ruolo
    function togglePrivateCard() {
      const latestRole = readAssignedRoleFromRoom(playerState.roomCode, playerState.playerName) || playerState.assignedRoleKey;
      playerState.assignedRoleKey = latestRole;

      if (!latestRole) {
        playerState.privateCardOpen = false;
        setPlayerBanner('Scheda privata bloccata: attendi che il Master ti assegni un ruolo.', 'error');
        return;
      }

      playerState.privateCardOpen = !playerState.privateCardOpen;
      playerState.banner = null;
      savePlayerState();
      renderPlayerPage();
    }

    // Escaping HTML sicuro
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Renderizza la pagina Giocatore (prima sessione selfie oppure plancia con scheda privata)
    function renderPlayerPage() {
      const container = document.getElementById('player-app');
      if (!container) return;

      try {
        const banner = playerState.banner;
        const bannerHtml = banner
          ? `<div class="rounded-xl border px-4 py-3 text-sm font-medium ${
              banner.type === 'success'
                ? 'bg-emerald/15 border-emerald/40 text-emerald'
                : banner.type === 'error'
                ? 'bg-crimson/15 border-crimson/40 text-crimson'
                : 'bg-indigo/15 border-indigo/40 text-indigo'
            }">${escapeHtml(banner.text)}</div>`
          : '';

        if (!playerState.boardUnlocked) {
          container.innerHTML = `
            <div class="rounded-2xl bg-surface border border-white/10 p-6 space-y-6 shadow-xl">
              <header class="space-y-1 border-b border-white/10 pb-4">
                <span class="text-xs font-bold uppercase tracking-widest text-indigo">Prima Sessione · Giocatore</span>
                <h1 class="font-serif text-2xl sm:text-3xl font-bold text-white">Il Tuo Selfie al Tavolo</h1>
                <p class="text-xs text-gray-400">
                  Giocatore: <strong class="text-gray-200">${escapeHtml(playerState.playerName)}</strong> ·
                  Stanza: <strong class="text-gray-200">${escapeHtml(playerState.roomCode)}</strong>
                </p>
              </header>

              ${bannerHtml}

              <div class="rounded-2xl bg-bgdark border border-white/10 p-5 flex flex-col items-center justify-center min-h-[240px] space-y-4">
                ${
                  playerState.cameraActive
                    ? `<video id="player-camera-video" autoplay playsinline muted class="w-full max-w-xs aspect-square object-cover rounded-2xl border border-indigo/40"></video>`
                    : playerState.selfieDataUrl
                    ? `<img src="${playerState.selfieDataUrl}" alt="Selfie giocatore" onerror="this.src='https://placehold.co/320x320/151924/e5b85c?text=Selfie'" class="w-48 h-48 object-cover rounded-2xl border-2 border-emerald/50 shadow-lg" />`
                    : `<div class="w-48 h-48 rounded-2xl bg-surface border border-dashed border-white/20 flex flex-col items-center justify-center text-center p-4">
                         <span class="text-xs font-semibold text-gray-300">Nessun selfie ancora</span>
                         <span class="text-[11px] text-gray-500 mt-1">Scatta una foto o caricala dalla galleria</span>
                       </div>`
                }
              </div>

              <div class="flex flex-wrap items-center justify-center gap-3">
                ${
                  playerState.cameraActive
                    ? `<button
                         type="button"
                         onclick="captureSelfiePhoto()"
                         class="px-4 py-2.5 rounded-xl bg-emerald text-bgdark text-xs font-bold hover:brightness-110 transition cursor-pointer"
                       >
                         Scatta Selfie
                       </button>
                       <button
                         type="button"
                         onclick="stopCameraStream(); renderPlayerPage();"
                         class="px-4 py-2.5 rounded-xl bg-surface2 hover:bg-white/10 text-xs font-semibold text-gray-200 transition cursor-pointer"
                       >
                         Chiudi Fotocamera
                       </button>`
                    : `<button
                         type="button"
                         onclick="startPlayerCamera()"
                         class="px-4 py-2.5 rounded-xl bg-indigo text-white text-xs font-semibold hover:brightness-110 transition cursor-pointer"
                       >
                         Apri Fotocamera
                       </button>`
                }

                <label class="px-4 py-2.5 rounded-xl bg-surface2 hover:bg-white/10 border border-white/15 text-xs font-semibold text-gray-200 transition cursor-pointer">
                  Carica Foto
                  <input
                    type="file"
                    accept="image/*"
                    onchange="if(this.files && this.files[0]) handleGalleryFileSelect(this.files[0]); this.value='';"
                    class="hidden"
                  />
                </label>
              </div>

              <button
                type="button"
                onclick="goToPlayerBoard()"
                class="w-full py-3.5 rounded-xl font-bold text-sm transition cursor-pointer ${
                  playerState.selfieDataUrl
                    ? 'bg-gold text-bgdark hover:brightness-110'
                    : 'bg-surface2 text-gray-500 border border-white/10'
                }"
              >
                Conferma Selfie e Vai alla Plancia
              </button>
            </div>
          `;
          return;
        }

        const hasRole = Boolean(playerState.assignedRoleKey && ROLE_DETAILS[playerState.assignedRoleKey]);
        const roleObj = hasRole ? ROLE_DETAILS[playerState.assignedRoleKey] : null;

        container.innerHTML = `
          <div class="rounded-2xl bg-surface border border-white/10 p-6 space-y-6 shadow-xl">
            <header class="flex flex-wrap items-center justify-between gap-4 border-b border-white/10 pb-4">
              <div class="flex items-center gap-3.5">
                <img
                  src="${playerState.selfieDataUrl}"
                  alt="Selfie di ${escapeHtml(playerState.playerName)}"
                  onerror="this.src='https://placehold.co/96x96/151924/e5b85c?text=Foto'"
                  class="w-16 h-16 rounded-2xl object-cover border border-white/15"
                />
                <div>
                  <span class="text-xs font-bold uppercase tracking-widest text-gold">Plancia Giocatore</span>
                  <h1 class="font-serif text-2xl font-bold text-white">${escapeHtml(playerState.playerName)}</h1>
                  <p class="text-xs text-gray-400">Stanza: <strong class="text-gray-200">${escapeHtml(playerState.roomCode)}</strong></p>
                </div>
              </div>
              <button
                type="button"
                onclick="reopenSelfieStep()"
                class="px-3.5 py-2 rounded-xl bg-surface2 hover:bg-white/10 border border-white/15 text-xs font-semibold text-gray-200 transition cursor-pointer"
              >
                Cambia Selfie
              </button>
            </header>

            ${bannerHtml}

            <section class="rounded-2xl bg-bgdark border border-white/10 p-5 space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h2 class="font-serif text-xl font-bold text-white">Scheda Privata</h2>
                  <p class="text-xs text-gray-400 mt-0.5">
                    ${hasRole
                      ? 'Il Master ti ha assegnato un ruolo: puoi aprire o chiudere la tua scheda segreta.'
                      : 'Bloccata finché il Master non ti assegna un ruolo.'}
                  </p>
                </div>
                <button
                  type="button"
                  onclick="refreshAssignedRoleFromMaster()"
                  class="px-3 py-1.5 rounded-xl bg-surface2 hover:bg-white/10 border border-white/15 text-xs font-semibold text-gray-200 transition cursor-pointer"
                >
                  Aggiorna Stato Ruolo
                </button>
              </div>

              <button
                type="button"
                onclick="togglePrivateCard()"
                class="w-full py-3 px-4 rounded-xl text-sm font-bold transition cursor-pointer ${
                  hasRole
                    ? 'bg-gold text-bgdark hover:brightness-110'
                    : 'bg-surface2 text-gray-400 border border-white/10'
                }"
              >
                ${
                  !hasRole
                    ? 'Scheda Privata Bloccata (In attesa del ruolo dal Master)'
                    : playerState.privateCardOpen
                    ? 'Nascondi Scheda Privata'
                    : 'Apri Scheda Privata'
                }
              </button>

              ${
                hasRole && playerState.privateCardOpen
                  ? `<div class="rounded-xl bg-surface border border-white/15 p-5 space-y-2.5">
                       <div class="flex items-center justify-between gap-2">
                         <span class="font-serif text-xl font-bold text-white">${escapeHtml(roleObj.name)}</span>
                         <span class="text-xs font-semibold px-2.5 py-1 rounded-full border ${roleObj.badge}">
                           ${escapeHtml(roleObj.faction)}
                         </span>
                       </div>
                       <p class="text-sm text-gray-300 leading-relaxed">${escapeHtml(roleObj.power)}</p>
                     </div>`
                  : ''
              }
            </section>
          </div>
        `;
      } catch (err) {
        console.error('Errore rendering pagina giocatore:', err);
        container.innerHTML = `
          <div class="rounded-2xl bg-surface border border-crimson/40 p-6 text-sm text-crimson">
            Errore durante il caricamento della pagina giocatore.
          </div>
        `;
      }
    }

    window.startPlayerCamera = startPlayerCamera;
    window.stopCameraStream = stopCameraStream;
    window.captureSelfiePhoto = captureSelfiePhoto;
    window.handleGalleryFileSelect = handleGalleryFileSelect;
    window.goToPlayerBoard = goToPlayerBoard;
    window.reopenSelfieStep = reopenSelfieStep;
    window.refreshAssignedRoleFromMaster = refreshAssignedRoleFromMaster;
    window.togglePrivateCard = togglePrivateCard;

    renderPlayerPage();
  </script>
</body>
</html>
