<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ombre al Tavolo — Scheda Abilità</title>
  <style>
    body {
      margin: 0;

      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .top-bar {
      max-width: 960px;
      margin: 18px auto 0;

    .back-btn {

      border: 1px solid rgba(255,255,255,0.16);

      color: #f3f4f6;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <span style="font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#e5b85c;">Scheda Abilità Dedicata</span>
    <button type="button" class="back-btn" onclick="window.location.href='giocatore.html'">Torna alla Scheda Giocatore</button>
  </div>
  <iframe src="giocatore.html" title="Scheda Abilità Giocatore" style="width:100%;min-height:92vh;border:0;display:block;"></iframe>
