<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ombre al Tavolo — Tutti i Ruoli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Cinzel', 'serif'],
          },
          colors: {
            bgdark: '#0c0e14',
            surface: '#151924',
            surface2: '#1d2230',
            gold: '#e5b85c',
            crimson: '#e05260',
            emerald: '#3ec98c',
            indigo: '#7c8cff',
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #0c0e14;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-bgdark text-gray-100 antialiased">
  <div id="roles-catalog-app" class="max-w-5xl mx-auto px-4 py-8 space-y-6"></div>

  <script>
    const CUSTOM_ROLES_STORAGE_KEY = 'ombre_catalogo_tutti_ruoli_v2';

    // Elenco ufficiale degli 8 ruoli di Ombre al Tavolo
    const DEFAULT_ROLES = [
      {
        id: 'assassino',
        name: 'Assassino',
        faction: 'Traditori',
        description: 'Ogni missione completata sblocca un colpo con cui può eliminare un giocatore. (5 missioni, 3 ripetibili, prevalentemente di contatto; non può fare missioni con altri Traditori tranne il Traditore Segreto).'
      },
      {
        id: 'sabotatore',
        name: 'Sabotatore',
        faction: 'Traditori',
        description: 'Può bloccare l’attivazione di un altro giocatore per il turno. (5 missioni, 3 ripetibili, prevalentemente di contatto; non può fare missioni con altri Traditori tranne il Traditore Segreto).'
      },
      {
        id: 'traditore_segreto',
        name: 'Traditore Segreto',
        faction: 'Traditori',
        description: 'Conosce gli altri Traditori e può scegliere a chi rivolgere le abilità dei Traditori. (5 missioni, 3 ripetibili, prevalentemente di contatto; può fare missioni anche con gli altri Traditori).'
      },
      {
        id: 'investigatore',
        name: 'Investigatore',
        faction: 'Fedeli',
        description: 'Può scoprire una delle missioni dei Traditori. (5 missioni, 3 ripetibili, prevalentemente verbali).'
      },
      {
        id: 'guardia',
        name: 'Guardia',
        faction: 'Fedeli',
        description: 'Può assegnare uno Scudo Protettivo a se stesso o a un altro giocatore. (5 missioni, 3 ripetibili, prevalentemente verbali).'
      },
      {
        id: 'martire',
        name: 'Martire',
        faction: 'Fedeli',
        description: 'Non ha missioni; se subisce una missione altrui può dichiarare un ruolo presente in partita e, se è in gioco, sblocca la Voce dell’Aldilà per proteggere un giocatore con uno Scudo.'
      },
      {
        id: 'mediatore',
        name: 'Mediatore',
        faction: 'Fedeli',
        description: 'Ha un voto extra (+1) alla Tavola Rotonda. (5 missioni, 3 ripetibili, prevalentemente verbali).'
      },
      {
        id: 'cacciatore',
        name: 'Cacciatore',
        faction: 'Neutro',
        description: 'Usa i punti missione per fare la domanda "giocatore X è ruolo Y?" e può sempre (0 punti) indicare il ruolo di 3 giocatori: se li indovina tutti vince subito, se sbaglia viene eliminato. (5 missioni, 3 ripetibili, prevalentemente di confronto).'
      }
    ];

    function normalizeFaction(rawFaction) {
      if (rawFaction === 'Traditori') return 'Traditori';
      if (rawFaction === 'Neutro') return 'Neutro';
      return 'Fedeli';
    }

    function loadAllRoles() {
      try {
        const raw = localStorage.getItem(CUSTOM_ROLES_STORAGE_KEY);
        if (!raw) return DEFAULT_ROLES.slice();
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed) || parsed.length === 0) return DEFAULT_ROLES.slice();
        return parsed.map(item => ({
          id: String(item.id || ('role_' + Math.random().toString(36).slice(2, 7))),
          name: String(item.name || '').trim() || 'Ruolo',
          faction: normalizeFaction(item.faction),
          description: String(item.description || '').trim()
        }));
      } catch (err) {
        console.error('Errore lettura catalogo ruoli:', err);
        return DEFAULT_ROLES.slice();
      }
    }

    let rolesState = {
      filter: 'tutti',
      roles: loadAllRoles(),
      banner: null
    };

    function saveAllRoles() {
      try {
        localStorage.setItem(CUSTOM_ROLES_STORAGE_KEY, JSON.stringify(rolesState.roles));
      } catch (err) {
        console.error('Errore salvataggio catalogo ruoli:', err);
