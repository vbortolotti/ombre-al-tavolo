<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ombre al Tavolo — Companion Giocatore e Master</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Cinzel', 'serif'],
          },
          colors: {
            bgdark: '#0c0e14',
            surface: '#151924',
            surface2: '#1d2230',
            gold: '#e5b85c',
            crimson: '#e05260',
            emerald: '#3ec98c',
            indigo: '#7c8cff',
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #0c0e14;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #121620;
    }
    ::-webkit-scrollbar-thumb {
      background: #2c344a;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen bg-bgdark text-gray-100 antialiased selection:bg-gold/30 selection:text-gold">
  <div id="app" class="min-h-screen flex flex-col"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const STORAGE_KEY = 'ombre_al_tavolo_v4_clean';
    const TAB_SESSION_KEY = 'ombre_al_tavolo_tab_session_v1';
    const SYNC_CHANNEL_NAME = 'ombre_al_tavolo_sync_v1';
    const DEFAULT_ROOM_CODE = 'TAVOLO1';
    const SYNC_POLL_INTERVAL_MS = 2000;
    const SYNC_PUBLIC_BUCKET_KEY = 'ombre_al_tavolo_cloud_bin_id_v1';

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'ombre-al-tavolo-app';
    let db = null;
    let auth = null;
    let currentUser = null;
    let roomUnsubscribe = null;
    let cloudReady = false;

    const ROLE_DEFS = {
      investigatore: {
        name: 'Investigatore',
        faction: 'cittadini',
        factionLabel: 'Fazione Cittadini',
        badgeClass: 'bg-emerald/15 text-emerald border-emerald/40',
        powerName: 'Indagine Approfondita',
        powerDesc: 'Spendi 1 punto potere per scoprire il ruolo esatto di un giocatore vivo a tua scelta. Puoi usarlo più volte finché hai punti.',
        cost: 1,
        usesPerConfrontationLimit: null
      },
      guardia: {
        name: 'Guardia',
        faction: 'cittadini',
        factionLabel: 'Fazione Cittadini',
        badgeClass: 'bg-emerald/15 text-emerald border-emerald/40',
        powerName: 'Scudo Protettivo',
        powerDesc: 'Spendi 1 punto potere per proteggere un giocatore vivo (anche te stesso) dal prossimo attacco fino al prossimo turno. Puoi usarlo più volte finché hai punti.',
        cost: 1,
        usesPerConfrontationLimit: null
      },
      cacciatore: {
        name: 'Cacciatore',
        faction: 'cittadini',
        factionLabel: 'Fazione Cittadini',
        badgeClass: 'bg-emerald/15 text-emerald border-emerald/40',
        powerName: 'Colpo Mirato',
        powerDesc: 'Spendi 2 punti potere per eliminare un giocatore sospetto. Se colpisci un innocente, subisci contraccolpo.',
        cost: 2,
        usesPerConfrontationLimit: null
      },
      martire: {
        name: 'Martire',
        faction: 'cittadini',
        factionLabel: 'Fazione Cittadini',
        badgeClass: 'bg-emerald/15 text-emerald border-emerald/40',
        powerName: 'Ultima Testimonianza',
        powerDesc: 'Non hai missioni standard: quando vieni eliminato, puoi dichiarare pubblicamente un ruolo al tavolo prima di uscire.',
        cost: 0,
        usesPerConfrontationLimit: 1
      },
      assassino: {
        name: 'Assassino',
        faction: 'traditori',
        factionLabel: 'Fazione Traditori',
        badgeClass: 'bg-crimson/15 text-crimson border-crimson/40',
        powerName: 'Eliminazione Silenziosa',
        powerDesc: 'Spendi 2 punti potere per eliminare un giocatore vivo. Limite: massimo 1 uccisione prima di ogni confronto/votazione al tavolo.',
        cost: 2,
        usesPerConfrontationLimit: 1
      },
      sabotatore: {
        name: 'Sabotatore',
        faction: 'traditori',
        factionLabel: 'Fazione Traditori',
        badgeClass: 'bg-crimson/15 text-crimson border-crimson/40',
        powerName: 'Intralcio Notturno',
        powerDesc: 'Spendi 1 punto potere per bloccare l’azione/potere di un giocatore bersaglio nel turno corrente. Puoi usarlo più volte finché hai punti.',
        cost: 1,
        usesPerConfrontationLimit: null
      }
    };

    const PHASES = ['Esplorazione', 'Confronto al Tavolo', 'Votazione'];

    function buildMissionsForFaction(faction) {
      if (faction === 'traditori') {
        return [
          { id: 'm_rep_1', text: 'Semina un dubbio credibile su un Cittadino durante la discussione.', points: 1, repeatable: true, status: 'idle', approvedCount: 0 },
          { id: 'm_rep_2', text: 'Fai convergere almeno due voti su un bersaglio scelto dai Traditori.', points: 1, repeatable: true, status: 'idle', approvedCount: 0 },
          { id: 'm_rep_3', text: 'Ottieni fiducia o un’informazione riservata senza destare sospetti.', points: 1, repeatable: true, status: 'idle', approvedCount: 0 },
          { id: 'm_uni_1', text: 'Sopravvivi indenne fino al secondo Confronto al Tavolo.', points: 2, repeatable: false, status: 'idle', approvedCount: 0 },
          { id: 'm_uni_2', text: 'Induci un Cittadino a dichiarare un ruolo errato in pubblico.', points: 2, repeatable: false, status: 'idle', approvedCount: 0 }
        ];
      }

      return [
        { id: 'm_rep_1', text: 'Condividi un indizio utile o un’osservazione chiara con il tavolo.', points: 1, repeatable: true, status: 'idle', approvedCount: 0 },
        { id: 'm_rep_2', text: 'Confronta due versioni o testimonianze emerse durante il turno.', points: 1, repeatable: true, status: 'idle', approvedCount: 0 },
        { id: 'm_rep_3', text: 'Coordina una scelta difensiva o di voto con almeno un alleato.', points: 1, repeatable: true, status: 'idle', approvedCount: 0 },
        { id: 'm_uni_1', text: 'Individua un comportamento incoerente prima della Votazione.', points: 2, repeatable: false, status: 'idle', approvedCount: 0 },
        { id: 'm_uni_2', text: 'Proteggi un giocatore chiave durante una fase critica.', points: 2, repeatable: false, status: 'idle', approvedCount: 0 }
      ];
    }

    function createInitialState() {
      return {
        roomCode: DEFAULT_ROOM_CODE,
        lastUpdatedAt: 0,
        screen: 'entry',
        sessionRole: null,
        currentPlayerId: null,
        inspectingPlayerId: null,
        phase: 'Esplorazione',
        round: 1,
        players: [],
        logs: [],
        masterMessages: [],
        bannerMessage: null,
        winner: null
      };
    }

    let tabSession = loadTabSession();
    let state = null;
    let tempSelfieDataUrl = null;
    let cameraStream = null;
    let syncChannel = null;
    let syncPollTimer = null;
    let isRemoteApplying = false;

    function normalizeRoomCode(code) {
      const cleaned = String(code || '')
        .toUpperCase()
        .replace(/[^A-Z0-9_-]/g, '')
        .slice(0, 20);
      return cleaned || DEFAULT_ROOM_CODE;
    }

    function loadTabSession() {
      try {
        const raw = sessionStorage.getItem(TAB_SESSION_KEY);
        if (!raw) {
          return {
            roomCode: DEFAULT_ROOM_CODE,
            sessionRole: null,
            currentPlayerId: null,
            screen: 'entry'
          };
        }
        const parsed = JSON.parse(raw);
        return {
          roomCode: normalizeRoomCode(parsed.roomCode),
          sessionRole: parsed.sessionRole || null,
          currentPlayerId: parsed.currentPlayerId || null,
          screen: parsed.screen || 'entry'
        };
      } catch (err) {
        console.error('Errore lettura sessione scheda:', err);
        return {
          roomCode: DEFAULT_ROOM_CODE,
          sessionRole: null,
          currentPlayerId: null,
          screen: 'entry'
        };
      }
    }

    function saveTabSession() {
      try {
        sessionStorage.setItem(TAB_SESSION_KEY, JSON.stringify(tabSession));
      } catch (err) {
        console.error('Errore salvataggio sessione scheda:', err);
      }
    }

    function getRoomStorageKey(roomCode) {
      return `${STORAGE_KEY}_${normalizeRoomCode(roomCode)}`;
    }

    function getRoomCloudIdKey(roomCode) {
      return `${SYNC_PUBLIC_BUCKET_KEY}_${normalizeRoomCode(roomCode)}`;
    }

    function loadState() {
      const roomCode = normalizeRoomCode(tabSession.roomCode);
      try {
        const raw = localStorage.getItem(getRoomStorageKey(roomCode)) || localStorage.getItem(STORAGE_KEY);
        const base = createInitialState();
        base.roomCode = roomCode;
        let merged = base;
        if (raw) {
          const parsed = JSON.parse(raw);
          merged = { ...base, ...parsed, roomCode };
        }
        if (tabSession.sessionRole !== undefined) merged.sessionRole = tabSession.sessionRole;
        if (tabSession.currentPlayerId !== undefined) merged.currentPlayerId = tabSession.currentPlayerId;
        if (tabSession.screen) merged.screen = tabSession.screen;
        return merged;
      } catch (err) {
        console.error('Errore lettura stato:', err);
        const fallback = createInitialState();
        fallback.roomCode = roomCode;
        return fallback;
      }
    }

    function getSharedSnapshot() {
      return {
        roomCode: normalizeRoomCode(state.roomCode),
        lastUpdatedAt: Number(state.lastUpdatedAt || Date.now()),
        phase: state.phase,
        round: state.round,
        players: state.players,
        logs: state.logs,
        masterMessages: state.masterMessages,
        winner: state.winner
      };
    }

    function getCloudBinId(roomCode) {
      try {
        return localStorage.getItem(getRoomCloudIdKey(roomCode)) || null;
      } catch (err) {
        return null;
      }
    }

    function setCloudBinId(roomCode, binId) {
      if (!binId) return;
      try {
        localStorage.setItem(getRoomCloudIdKey(roomCode), String(binId));
      } catch (err) {
        // Ignora errori storage
      }
    }

    function getOrCreateDisplaySyncId(roomCode) {
      const normalized = normalizeRoomCode(roomCode);
      const existing = getCloudBinId(normalized);
      if (existing) return existing;
      const generated = `ROOM_${normalized}`;
      setCloudBinId(normalized, generated);
      return generated;
    }

    function getRoomDocRef(roomCode) {
      if (!db || !currentUser) return null;
      const normalized = normalizeRoomCode(roomCode);
      return doc(db, 'artifacts', appId, 'public', 'data', 'ombre_rooms', normalized);
    }

    async function initCloudSync() {
      try {
        if (typeof __firebase_config === 'undefined' || !__firebase_config) {
          cloudReady = false;
          return;
        }
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        currentUser = auth.currentUser;
        if (!currentUser) {
          cloudReady = false;
          return;
        }

        cloudReady = true;
        subscribeToCloudRoom(state.roomCode);
        await pullRemoteSnapshot();
      } catch (err) {
        console.error('Errore inizializzazione sincronizzazione remota:', err);
        cloudReady = false;
      }
    }

    function subscribeToCloudRoom(roomCode) {
      if (roomUnsubscribe) {
        try {
          roomUnsubscribe();
        } catch (err) {
          // Ignora errore chiusura listener precedente
        }
        roomUnsubscribe = null;
      }

      const ref = getRoomDocRef(roomCode);
      if (!ref) return;

      roomUnsubscribe = onSnapshot(
        ref,
        (snap) => {
          if (!snap.exists()) return;
          const data = snap.data();
          if (!data) return;

          let parsedSnapshot = data;
          if (typeof data.payloadJson === 'string') {
            try {
              parsedSnapshot = JSON.parse(data.payloadJson);
            } catch (err) {
              console.error('Errore parsing payload stanza:', err);
              return;
            }
          }
          applySharedSnapshot(parsedSnapshot, 'cloud_listener');
        },
        (err) => {
          console.error('Errore ascolto stanza remota:', err);
        }
      );
    }

    async function pushCloudSnapshot(snapshot) {
      if (!cloudReady || !currentUser || isRemoteApplying) return;
      const ref = getRoomDocRef(snapshot.roomCode);
      if (!ref) return;

      try {
        await setDoc(ref, {
          roomCode: normalizeRoomCode(snapshot.roomCode),
          lastUpdatedAt: Number(snapshot.lastUpdatedAt || Date.now()),
          updatedBy: currentUser.uid,
          payloadJson: JSON.stringify(snapshot)
        });
      } catch (err) {
        console.error('Errore invio stato su stanza remota:', err);
      }
    }

    function applySharedSnapshot(snapshot, sourceLabel = 'sync') {
      if (!snapshot || typeof snapshot !== 'object') return false;
      const roomCode = normalizeRoomCode(state.roomCode);
      const snapRoom = normalizeRoomCode(snapshot.roomCode || roomCode);
      if (snapRoom !== roomCode) return false;

      const incomingTs = Number(snapshot.lastUpdatedAt || 0);
      const currentTs = Number(state.lastUpdatedAt || 0);
      if (incomingTs && incomingTs <= currentTs && sourceLabel !== 'force') {
        return false;
      }

      isRemoteApplying = true;
      try {
        state.lastUpdatedAt = incomingTs || Date.now();
        if (snapshot.phase) state.phase = snapshot.phase;
        if (typeof snapshot.round === 'number') state.round = snapshot.round;
        if (Array.isArray(snapshot.players)) state.players = snapshot.players;
        if (Array.isArray(snapshot.logs)) state.logs = snapshot.logs;
        if (Array.isArray(snapshot.masterMessages)) state.masterMessages = snapshot.masterMessages;
        if ('winner' in snapshot) state.winner = snapshot.winner;

        const roomKey = getRoomStorageKey(roomCode);
        const persistable = {
          roomCode,
          lastUpdatedAt: state.lastUpdatedAt,
          phase: state.phase,
          round: state.round,
          players: state.players,
          logs: state.logs,
          masterMessages: state.masterMessages,
          winner: state.winner
        };
        localStorage.setItem(roomKey, JSON.stringify(persistable));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(persistable));
        render();
        return true;
      } catch (err) {
        console.error('Errore applicazione snapshot:', err);
        return false;
      } finally {
        isRemoteApplying = false;
      }
    }

    function broadcastSnapshot(snapshot) {
      if (!snapshot || isRemoteApplying) return;
      try {
        if (syncChannel) {
          syncChannel.postMessage({
            type: 'STATE_UPDATE',
            roomCode: normalizeRoomCode(snapshot.roomCode),
            snapshot
          });
        }
      } catch (err) {
        // Ignora errori BroadcastChannel
      }
    }

    async function pullRemoteSnapshot() {
      if (isRemoteApplying) return;
      const roomCode = normalizeRoomCode(state.roomCode);

      if (cloudReady && currentUser) {
        try {
          const ref = getRoomDocRef(roomCode);
          if (ref) {
            const snap = await getDoc(ref);
            if (snap.exists()) {
              const data = snap.data();
              let parsedSnapshot = data;
              if (data && typeof data.payloadJson === 'string') {
                parsedSnapshot = JSON.parse(data.payloadJson);
              }
              applySharedSnapshot(parsedSnapshot, sourceLabel === 'manual' ? 'force' : 'cloud_pull');
              return;
            }
          }
        } catch (err) {
          console.error('Errore lettura remota stanza:', err);
        }
      }

      try {
        const raw = localStorage.getItem(getRoomStorageKey(roomCode));
        if (raw) {
          const parsed = JSON.parse(raw);
          applySharedSnapshot(parsed, sourceLabel === 'manual' ? 'force' : 'poll');
        }
      } catch (err) {
        // Ignora errori temporanei
      }
    }

    function initSyncTransport() {
      const roomCode = normalizeRoomCode(state.roomCode);
      getOrCreateDisplaySyncId(roomCode);

      if (cloudReady) {
        subscribeToCloudRoom(roomCode);
      }

      if (syncChannel) {
        try {
          syncChannel.close();
        } catch (err) {
          // Ignora
        }
        syncChannel = null;
      }

      if ('BroadcastChannel' in window) {
        try {
          syncChannel = new BroadcastChannel(SYNC_CHANNEL_NAME);
          syncChannel.onmessage = (event) => {
            const msg = event && event.data;
            if (!msg || msg.type !== 'STATE_UPDATE') return;
            if (normalizeRoomCode(msg.roomCode) !== roomCode) return;
            applySharedSnapshot(msg.snapshot, 'broadcast');
          };
        } catch (err) {
          // Ignora errori BroadcastChannel
        }
      }

      window.removeEventListener('storage', handleStorageSync);
      window.addEventListener('storage', handleStorageSync);

      if (syncPollTimer) {
        clearInterval(syncPollTimer);
      }
      syncPollTimer = setInterval(() => {
        pullRemoteSnapshot();
      }, SYNC_POLL_INTERVAL_MS);
    }

    function handleStorageSync(e) {
      if (!e || !e.key || !e.newValue) return;
      const roomCode = normalizeRoomCode(state.roomCode);
      if (e.key === getRoomStorageKey(roomCode) || e.key === STORAGE_KEY) {
        try {
          const parsed = JSON.parse(e.newValue);
          applySharedSnapshot(parsed, 'storage');
        } catch (err) {
          // Ignora JSON non valido
        }
      }
    }

    function saveState(options = {}) {
      const skipBump = Boolean(options.skipBump);
      if (!skipBump && !isRemoteApplying) {
        state.lastUpdatedAt = Date.now();
      }
      const roomCode = normalizeRoomCode(state.roomCode);
      state.roomCode = roomCode;

      tabSession = {
        roomCode,
        sessionRole: state.sessionRole || null,
        currentPlayerId: state.currentPlayerId || null,
        screen: state.screen || 'entry'
      };
      saveTabSession();

      try {
        const persistable = {
          roomCode,
          lastUpdatedAt: state.lastUpdatedAt,
          phase: state.phase,
          round: state.round,
          players: state.players,
          logs: state.logs,
          masterMessages: state.masterMessages,
          winner: state.winner
        };
        localStorage.setItem(getRoomStorageKey(roomCode), JSON.stringify(persistable));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(persistable));
      } catch (err) {
        console.error('Errore salvataggio stato:', err);
        setBanner('Attenzione: spazio di salvataggio del browser pieno.', 'error');
      }

      if (!isRemoteApplying && !skipBump) {
        const snap = getSharedSnapshot();
        broadcastSnapshot(snap);
        pushCloudSnapshot(snap);
      }
    }

    function setBanner(text, type = 'info') {
      state.bannerMessage = { text, type };
      render();
    }

    function clearBanner() {
      state.bannerMessage = null;
      render();
    }

    function addLog(text) {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
      state.logs.unshift({
        id: 'log_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        time: timeStr,
        text
      });
      if (state.logs.length > 60) {
        state.logs = state.logs.slice(0, 60);
      }
    }

    function nowTimeStr() {
      return new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    }

    function getCurrentPlayer() {
      return state.players.find(p => p.id === state.currentPlayerId) || null;
    }

    function getPlayerById(id) {
      return state.players.find(p => p.id === id) || null;
    }

    function setRoomCodeAndReload(newCode, customBinId = '') {
      const normalized = normalizeRoomCode(newCode);
      if (customBinId && String(customBinId).trim()) {
        setCloudBinId(normalized, String(customBinId).trim());
      } else {
        getOrCreateDisplaySyncId(normalized);
      }
      tabSession = {
        roomCode: normalized,
        sessionRole: null,
        currentPlayerId: null,
        screen: 'entry'
      };
      saveTabSession();
      stopCamera();
      tempSelfieDataUrl = null;
      state = loadState();
      state.screen = 'entry';
      state.sessionRole = null;
      state.currentPlayerId = null;
      state.inspectingPlayerId = null;
      initSyncTransport();
      saveState({ skipBump: true });
      pullRemoteSnapshot();
      setBanner(`Stanza impostata su ${normalized}.`, 'success');
    }

    function exitToEntry() {
      stopCamera();
      tempSelfieDataUrl = null;
      const roomCode = normalizeRoomCode(state.roomCode);
      tabSession = {
        roomCode,
        sessionRole: null,
        currentPlayerId: null,
        screen: 'entry'
      };
      saveTabSession();
      state.sessionRole = null;
      state.currentPlayerId = null;
      state.inspectingPlayerId = null;
      state.screen = 'entry';
      state.bannerMessage = null;
      render();
    }

    function assignBalancedRole(existingPlayers) {
      const allRoleKeys = Object.keys(ROLE_DEFS);
      const usedRoles = existingPlayers.map(p => p.roleKey);
      const unused = allRoleKeys.filter(rk => !usedRoles.includes(rk));
      if (unused.length > 0) {
        return unused[Math.floor(Math.random() * unused.length)];
      }
      const traitorsCount = existingPlayers.filter(p => ROLE_DEFS[p.roleKey]?.faction === 'traditori').length;
      const citizensCount = existingPlayers.filter(p => ROLE_DEFS[p.roleKey]?.faction === 'cittadini').length;
      const desiredFaction = traitorsCount * 2 < citizensCount ? 'traditori' : 'cittadini';
      const candidates = allRoleKeys.filter(rk => ROLE_DEFS[rk].faction === desiredFaction);
      return candidates[Math.floor(Math.random() * candidates.length)];
    }

    function createPlayer(name, selfieDataUrl) {
      const cleanName = String(name || '').trim();
      if (!cleanName) {
        setBanner('Inserisci il tuo nome prima di entrare al tavolo.', 'error');
        return null;
      }

      const duplicate = state.players.find(
        p => p.name.toLowerCase() === cleanName.toLowerCase() && p.alive
      );
      if (duplicate) {
        setBanner(`Esiste già un giocatore attivo chiamato "${duplicate.name}" in questa stanza.`, 'error');
        return null;
      }

      const roleKey = assignBalancedRole(state.players);
      const roleDef = ROLE_DEFS[roleKey];
      const isMartyr = roleKey === 'martire';

      const newPlayer = {
        id: 'pl_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        name: cleanName,
        selfie: selfieDataUrl || null,
        roleKey,
        alive: true,
        powerPoints: 1,
        protectedUntilNextTurn: false,
        blockedThisRound: false,
        limitedUsesThisRound: 0,
        lastInvestigation: null,
        martyrDeclaration: null,
        missions: isMartyr ? [] : buildMissionsForFaction(roleDef.faction),
        pendingSubmissions: [],
        reports: []
      };

      state.players.push(newPlayer);
      addLog(`${newPlayer.name} è entrato al tavolo nella stanza ${state.roomCode}.`);
      saveState();
      return newPlayer;
    }

    function startCamera() {
      const videoEl = document.getElementById('camera-preview');
      if (!videoEl) return;

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setBanner('Fotocamera non supportata in questo browser: puoi caricare una foto o entrare senza selfie.', 'error');
        return;
      }

      stopCamera();
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
        .then(stream => {
          cameraStream = stream;
          const v = document.getElementById('camera-preview');
          if (v) {
            v.srcObject = stream;
            v.classList.remove('hidden');
            v.play().catch(() => {});
          }
          const snapBtn = document.getElementById('btn-snap-selfie');
          if (snapBtn) snapBtn.classList.remove('hidden');
        })
        .catch(() => {
          setBanner('Permesso fotocamera negato o non disponibile: puoi caricare un’immagine o proseguire senza selfie.', 'error');
        });
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
      }
    }

    function snapSelfie() {
      const videoEl = document.getElementById('camera-preview');
      if (!videoEl || !videoEl.videoWidth) {
        setBanner('Attendi che la fotocamera mostri l’anteprima prima di scattare.', 'error');
        return;
      }
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 320;
        canvas.height = 320;
        const ctx = canvas.getContext('2d');
        const size = Math.min(videoEl.videoWidth, videoEl.videoHeight);
        const sx = (videoEl.videoWidth - size) / 2;
        const sy = (videoEl.videoHeight - size) / 2;
        ctx.drawImage(videoEl, sx, sy, size, size, 0, 0, 320, 320);
        tempSelfieDataUrl = canvas.toDataURL('image/jpeg', 0.82);
        stopCamera();
        render();
      } catch (err) {
        console.error('Errore scatto selfie:', err);
        setBanner('Impossibile acquisire il selfie.', 'error');
      }
    }

    function handleSelfieFileUpload(file) {
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        setBanner('Seleziona un file immagine valido.', 'error');
        return;
      }
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 320;
          canvas.height = 320;
          const ctx = canvas.getContext('2d');
          const size = Math.min(img.width, img.height);
          const sx = (img.width - size) / 2;
          const sy = (img.height - size) / 2;
          ctx.drawImage(img, sx, sy, size, size, 0, 0, 320, 320);
          tempSelfieDataUrl = canvas.toDataURL('image/jpeg', 0.82);
          stopCamera();
          render();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function submitMission(playerId, missionId, note) {
      const player = getPlayerById(playerId);
      if (!player || !player.alive) return;
      const mission = player.missions.find(m => m.id === missionId);
      if (!mission) return;

      if (!mission.repeatable && mission.approvedCount > 0) {
        setBanner('Questa missione è unica ed è già stata completata.', 'error');
        return;
      }
      if (mission.status === 'pending') {
        setBanner('Hai già inviato questa missione: attendi la verifica del Master.', 'error');
        return;
      }

      mission.status = 'pending';
      player.pendingSubmissions.push({
        id: 'sub_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
        missionId: mission.id,
        missionText: mission.text,
        points: mission.points,
        repeatable: mission.repeatable,
        note: String(note || '').trim(),
        submittedAt: nowTimeStr()
      });

      addLog(`${player.name} ha inviato una missione per l’approvazione del Master.`);
      saveState();
      setBanner('Missione inviata al Master per la verifica.', 'success');
    }

    function approveSubmission(playerId, submissionId) {
      const player = getPlayerById(playerId);
      if (!player) return;
      const idx = player.pendingSubmissions.findIndex(s => s.id === submissionId);
      if (idx === -1) return;
      const sub = player.pendingSubmissions[idx];
      player.pendingSubmissions.splice(idx, 1);

      const mission = player.missions.find(m => m.id === sub.missionId);
      if (mission) {
        mission.approvedCount = (mission.approvedCount || 0) + 1;
        mission.status = mission.repeatable ? 'idle' : 'approved';
      }

      player.powerPoints += sub.points;
      addLog(`Master ha approvato la missione di ${player.name} (+${sub.points} punto potere).`);
      saveState();
      setBanner(`Approvata: ${player.name} ottiene +${sub.points} punto potere.`, 'success');
    }

    function rejectSubmission(playerId, submissionId) {
      const player = getPlayerById(playerId);
      if (!player) return;
      const idx = player.pendingSubmissions.findIndex(s => s.id === submissionId);
      if (idx === -1) return;
      const sub = player.pendingSubmissions[idx];
      player.pendingSubmissions.splice(idx, 1);

      const mission = player.missions.find(m => m.id === sub.missionId);
      if (mission && mission.status === 'pending') {
        mission.status = mission.repeatable ? 'idle' : 'idle';
      }

      addLog(`Master ha respinto la richiesta di missione di ${player.name}.`);
      saveState();
      setBanner(`Richiesta di ${player.name} respinta.`, 'info');
    }

    function submitReport(playerId, targetId, reason) {
      const reporter = getPlayerById(playerId);
      const target = getPlayerById(targetId);
      if (!reporter || !reporter.alive) return;
      if (!target || !target.alive) {
        setBanner('Seleziona un giocatore vivo da segnalare.', 'error');
        return;
      }
      if (target.id === reporter.id) {
        setBanner('Non puoi segnalare te stesso.', 'error');
        return;
      }
      const cleanReason = String(reason || '').trim();
      if (!cleanReason) {
        setBanner('Scrivi il motivo o l’osservazione della segnalazione.', 'error');
        return;
      }

      reporter.reports.push({
        id: 'rep_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
        reporterId: reporter.id,
        reporterName: reporter.name,
        targetId: target.id,
        targetName: target.name,
        reason: cleanReason,
        status: 'pending',
        createdAt: nowTimeStr()
      });

      addLog(`${reporter.name} ha inviato una segnalazione su ${target.name} al Master.`);
      saveState();
      setBanner(`Segnalazione su ${target.name} inviata al Master.`, 'success');
    }

    function resolveReport(reporterId, reportId, outcome) {
      const reporter = getPlayerById(reporterId);
      if (!reporter) return;
      const rep = reporter.reports.find(r => r.id === reportId);
      if (!rep) return;

      rep.status = outcome === 'valid' ? 'valid' : 'dismissed';
      if (outcome === 'valid') {
        reporter.powerPoints += 1;
        addLog(`Master ha convalidato la segnalazione di ${reporter.name} su ${rep.targetName} (+1 punto potere).`);
        setBanner(`Segnalazione convalidata: +1 punto potere a ${reporter.name}.`, 'success');
      } else {
        addLog(`Master ha archiviato la segnalazione di ${reporter.name} su ${rep.targetName}.`);
        setBanner('Segnalazione archiviata.', 'info');
      }
      saveState();
    }

    function sendMasterMessage(targetPlayerId, text) {
      const cleanText = String(text || '').trim();
      if (!cleanText) {
        setBanner('Scrivi un messaggio prima di inviarlo.', 'error');
        return;
      }

      const targetPlayer = targetPlayerId === 'ALL' ? null : getPlayerById(targetPlayerId);
      state.masterMessages.unshift({
        id: 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
        targetId: targetPlayerId === 'ALL' ? 'ALL' : targetPlayerId,
        targetName: targetPlayer ? targetPlayer.name : 'Tutti i Giocatori',
        text: cleanText,
        time: nowTimeStr()
      });
      if (state.masterMessages.length > 40) {
        state.masterMessages = state.masterMessages.slice(0, 40);
      }

      addLog(`Master ha inviato un messaggio a ${targetPlayer ? targetPlayer.name : 'tutti i giocatori'}.`);
      saveState();
      setBanner(`Messaggio inviato a ${targetPlayer ? targetPlayer.name : 'tutti i giocatori'}.`, 'success');
    }

    function useRolePower(actorId, targetId, martyrRoleDeclaration = '') {
      const actor = getPlayerById(actorId);
      if (!actor || !actor.alive) return;
      const roleDef = ROLE_DEFS[actor.roleKey];
      if (!roleDef) return;

      if (actor.blockedThisRound) {
        setBanner('Il tuo potere è bloccato per questo turno (effetto Sabotatore).', 'error');
        return;
      }

      if (roleDef.usesPerConfrontationLimit && actor.limitedUsesThisRound >= roleDef.usesPerConfrontationLimit) {
        setBanner('Hai già usato questo potere limitato prima del prossimo confronto/votazione.', 'error');
        return;
      }

      if (actor.powerPoints < roleDef.cost) {
        setBanner(`Punti potere insufficienti (servono ${roleDef.cost}, hai ${actor.powerPoints}).`, 'error');
        return;
      }

      const target = getPlayerById(targetId);
      if (!target || !target.alive) {
        setBanner('Seleziona un bersaglio vivo valido.', 'error');
        return;
      }

      if (actor.roleKey === 'investigatore') {
        if (target.id === actor.id) {
          setBanner('Scegli un altro giocatore da indagare.', 'error');
          return;
        }
        actor.powerPoints -= roleDef.cost;
        const targetRole = ROLE_DEFS[target.roleKey];
        actor.lastInvestigation = {
          targetName: target.name,
          roleName: targetRole.name,
          factionLabel: targetRole.factionLabel,
          round: state.round
        };
        addLog(`${actor.name} ha speso ${roleDef.cost} punto potere per indagare un giocatore.`);
        saveState();
        setBanner(`Indagine completata: ${target.name} è ${targetRole.name} (${targetRole.factionLabel}).`, 'success');
        return;
      }

      if (actor.roleKey === 'guardia') {
        actor.powerPoints -= roleDef.cost;
        target.protectedUntilNextTurn = true;
        addLog(`${actor.name} ha attivato Scudo Protettivo su ${target.name}.`);
        saveState();
        setBanner(`Scudo Protettivo attivo su ${target.name} fino al prossimo turno.`, 'success');
        return;
      }

      if (actor.roleKey === 'sabotatore') {
        if (target.id === actor.id) {
          setBanner('Seleziona un avversario o un altro giocatore da intralciare.', 'error');
          return;
        }
        actor.powerPoints -= roleDef.cost;
        target.blockedThisRound = true;
        addLog(`${actor.name} ha usato Intralcio Notturno su ${target.name}.`);
        saveState();
        setBanner(`Intralcio Notturno applicato a ${target.name} per il turno corrente.`, 'success');
        return;
      }

      if (actor.roleKey === 'assassino') {
        if (target.id === actor.id) {
          setBanner('Non puoi selezionare te stesso come bersaglio.', 'error');
          return;
        }
        actor.powerPoints -= roleDef.cost;
        actor.limitedUsesThisRound += 1;

        if (target.protectedUntilNextTurn) {
          target.protectedUntilNextTurn = false;
          addLog(`Un tentativo notturno su ${target.name} è stato respinto da uno Scudo Protettivo!`);
          saveState();
          setBanner(`L’attacco su ${target.name} è stato bloccato da una protezione!`, 'info');
          return;
        }

        target.alive = false;
        addLog(`Notte oscura: ${target.name} è stato eliminato.`);
        checkVictoryCondition();
        saveState();
        setBanner(`${target.name} è stato eliminato.`, 'success');
        return;
      }

      if (actor.roleKey === 'cacciatore') {
        if (target.id === actor.id) {
          setBanner('Seleziona un altro giocatore da colpire.', 'error');
          return;
        }
        actor.powerPoints -= roleDef.cost;

        if (target.protectedUntilNextTurn) {
          target.protectedUntilNextTurn = false;
          addLog(`Il colpo di ${actor.name} su ${target.name} è stato deviato da una protezione.`);
          saveState();
          setBanner(`Bersaglio protetto: il colpo su ${target.name} non ha avuto effetto.`, 'info');
          return;
        }

        const targetRole = ROLE_DEFS[target.roleKey];
        target.alive = false;
        addLog(`${actor.name} ha scoccato un Colpo Mirato contro ${target.name}.`);

        if (targetRole.faction === 'cittadini') {
          actor.alive = false;
          addLog(`Contraccolpo! ${target.name} era dei Cittadini: anche ${actor.name} è caduto.`);
          checkVictoryCondition();
          saveState();
          setBanner(`Hai colpito un Cittadino (${target.name}): per il contraccolpo sei stato eliminato.`, 'error');
        } else {
          addLog(`${target.name} è stato eliminato dal Colpo Mirato.`);
          checkVictoryCondition();
          saveState();
          setBanner(`Colpo a segno! ${target.name} è stato eliminato.`, 'success');
        }
        return;
      }

      if (actor.roleKey === 'martire') {
        const decl = String(martyrRoleDeclaration || '').trim();
        if (!decl) {
          setBanner('Indica un ruolo da dichiarare pubblicamente prima di attivare Ultima Testimonianza.', 'error');
          return;
        }
        actor.limitedUsesThisRound += 1;
        actor.martyrDeclaration = decl;
        addLog(`ULTIMA TESTIMONIANZA di ${actor.name}: dichiara pubblicamente il ruolo "${decl}".`);
        saveState();
        setBanner(`Hai dichiarato pubblicamente il ruolo "${decl}" al tavolo.`, 'success');
      }
    }

    function togglePlayerAlive(playerId) {
      const player = getPlayerById(playerId);
      if (!player) return;
      player.alive = !player.alive;
      if (!player.alive) {
        player.protectedUntilNextTurn = false;
        addLog(`Master ha segnato ${player.name} come Eliminato.`);
      } else {
        addLog(`Master ha reintegrato ${player.name} come Vivo.`);
      }
      checkVictoryCondition();
      saveState();
      render();
    }

    function adjustPlayerPoints(playerId, delta) {
      const player = getPlayerById(playerId);
      if (!player) return;
      player.powerPoints = Math.max(0, player.powerPoints + delta);
      addLog(`Master ha modificato i punti potere di ${player.name} (${delta > 0 ? '+' + delta : delta}).`);
      saveState();
      render();
    }

    function checkVictoryCondition() {
      const alivePlayers = state.players.filter(p => p.alive);
      if (alivePlayers.length < 2) return;
      const aliveTraitors = alivePlayers.filter(p => ROLE_DEFS[p.roleKey]?.faction === 'traditori').length;
      const aliveCitizens = alivePlayers.filter(p => ROLE_DEFS[p.roleKey]?.faction === 'cittadini').length;

      if (aliveTraitors === 0 && aliveCitizens > 0) {
        state.winner = {
          faction: 'cittadini',
          title: 'Vittoria dei Cittadini',
          desc: 'Tutti i Traditori sono stati smascherati o eliminati.'
        };
      } else if (aliveTraitors >= aliveCitizens && aliveTraitors > 0) {
        state.winner = {
          faction: 'traditori',
          title: 'Vittoria dei Traditori',
          desc: 'I Traditori hanno raggiunto parità o maggioranza numerica al tavolo.'
        };
      }
    }

    function advancePhase() {
      const idx = PHASES.indexOf(state.phase);
      const nextIdx = (idx + 1) % PHASES.length;
      state.phase = PHASES[nextIdx];

      if (state.phase === 'Esplorazione') {
        state.round += 1;
        state.players.forEach(p => {
          p.protectedUntilNextTurn = false;
          p.blockedThisRound = false;
          p.limitedUsesThisRound = 0;
        });
        addLog(`Inizia il Turno ${state.round} — Fase: ${state.phase}.`);
      } else {
        addLog(`Fase aggiornata a: ${state.phase} (Turno ${state.round}).`);
      }

      checkVictoryCondition();
      saveState();
      render();
    }

    function resetGame() {
      const roomCode = normalizeRoomCode(state.roomCode);
      const fresh = createInitialState();
      fresh.roomCode = roomCode;
      fresh.screen = state.screen === 'master' ? 'master' : 'entry';
      fresh.sessionRole = state.screen === 'master' ? 'master' : null;
      fresh.currentPlayerId = null;
      fresh.inspectingPlayerId = null;
      fresh.lastUpdatedAt = Date.now();
      state = fresh;
      addLog(`Nuova partita avviata nella stanza ${roomCode}.`);
      saveState({ skipBump: false });
      render();
    }

    function openPlayerJoin() {

    function renderPlayerJoinScreen() {
      const displaySyncId = getOrCreateDisplaySyncId(state.roomCode);

            <p class="text-sm text-gray-400 mt-1">

            <div class="mt-4">${renderBanner()}</div>

            <form onsubmit="handleJoinSubmit(event)" class="mt-5 space-y-5">
              <div>
                <label for="player-name-input" class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-2">
                  Nome Giocatore *
                </label>
                <input
                  id="player-name-input"
                  type="text"
                  maxlength="24"
                  required
                  placeholder="Es. Elena, Marco, Sofia..."
                  class="w-full rounded-xl bg-bgdark border border-white/15 px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo"
                />
              </div>

              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-2">

                <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4 p-4 rounded-xl bg-bgdark/80 border border-white/10">
                  <div class="w-20 h-20 rounded-2xl bg-surface2 border border-white/10 overflow-hidden flex items-center justify-center shrink-0">

                        Apri Fotocamera
                      </button>
                      <button
                        id="btn-snap-selfie"
                        type="button"

    function handleJoinSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('player-name-input');
      const name = input ? input.value : '';
      const created = createPlayer(name, tempSelfieDataUrl);
      if (created) {
        stopCamera();
        tempSelfieDataUrl = null;
        state.currentPlayerId = created.id;
        state.sessionRole = 'player';
        state.screen = 'player_dashboard';
        state.bannerMessage = null;
        saveState();
        render();
      }
    }

    function renderPlayerDashboard() {
      const player = getCurrentPlayer();
      if (!player) {
        return renderPlayerJoinScreen();
      }

      const roleDef = ROLE_DEFS[player.roleKey] || ROLE_DEFS.investigatore;
      const aliveTargets = state.players.filter(p => p.alive && p.id !== player.id);
      const allAliveTargets = state.players.filter(p => p.alive);
      const isMartyr = player.roleKey === 'martire';
      const myMessages = state.masterMessages.filter(m => m.targetId === 'ALL' || m.targetId === player.id);
      const displaySyncId = getOrCreateDisplaySyncId(state.roomCode);

      return `
        <div class="max-w-5xl w-full mx-auto px-4 py-6 space-y-6">
          <div class="rounded-2xl bg-surface border border-white/10 p-4 sm:p-5 flex flex-wrap items-center justify-between gap-4">

              <div>
                <div class="flex flex-wrap items-center gap-2">
                  <h1 class="font-serif text-xl sm:text-2xl font-bold text-white">${escapeHtml(player.name)}</h1>
                  <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full border ${player.alive ? 'bg-emerald/15 text-emerald border-emerald/30' : 'bg-crimson/15 text-crimson border-crimson/30'}">
                    ${player.alive ? 'In Gioco' : 'Eliminato'}

                </div>
                <p class="text-xs text-gray-400 mt-0.5">
                  Stanza <strong class="text-gold">${escapeHtml(state.roomCode)}</strong> · ID Sync: <strong class="font-mono text-emerald">${escapeHtml(displaySyncId)}</strong> · Turno ${state.round} · ${escapeHtml(state.phase)}
                </p>
              </div>
            </div>

            <div class="flex items-center gap-3">
              <div class="px-4 py-2 rounded-xl bg-bgdark border border-gold/30 text-right">
                <div class="text-[11px] uppercase tracking-wider text-gray-400">Punti Potere</div>
                <div class="text-xl font-bold text-gold">${player.powerPoints}</div>
              </div>
              <button

              >
                Aggiorna
              </button>
              <button
                type="button"
                onclick="exitToEntry()"
                class="px-3.5 py-2.5 rounded-xl bg-surface2 hover:bg-white/10 border border-white/10 text-xs font-semibold text-gray-200 transition"

                Esci
              </button>
            </div>
          </div>

          ${renderBanner()}
          ${renderVictoryBanner()}

          ${player.blockedThisRound ? `
            <div class="rounded-xl bg-crimson/15 border border-crimson/40 px-4 py-3 text-sm text-crimson font-medium">
              Intralcio attivo: il tuo potere è bloccato per il turno corrente.
            </div>
          ` : ''}

          ${player.protectedUntilNextTurn ? `
            <div class="rounded-xl bg-emerald/15 border border-emerald/40 px-4 py-3 text-sm text-emerald font-medium">

          ` : ''}

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-1 space-y-6">
              <div class="rounded-2xl bg-surface border border-white/10 p-5 shadow-lg">
                <span class="text-xs font-bold uppercase tracking-wider text-gray-400">Scheda Segreta</span>
                <h2 class="font-serif text-2xl font-bold text-white mt-1">${escapeHtml(roleDef.name)}</h2>
                <div class="mt-2">
                  <span class="inline-block text-xs font-semibold px-2.5 py-1 rounded-full border ${roleDef.badgeClass}">
                    ${escapeHtml(roleDef.factionLabel)}
                  </span>
                </div>

                <div class="mt-4 pt-4 border-t border-white/10">
                  <div class="text-xs font-bold uppercase tracking-wider text-gold">${escapeHtml(roleDef.powerName)}</div>
                  <p class="text-sm text-gray-300 mt-1.5 leading-relaxed">${escapeHtml(roleDef.powerDesc)}</p>
                  <div class="mt-3 text-xs text-gray-400">
                    Costo: <strong class="text-white">${roleDef.cost} ${roleDef.cost === 1 ? 'punto potere' : 'punti potere'}</strong>
                  </div>
                </div>

                ${player.lastInvestigation ? `
                  <div class="mt-4 p-3.5 rounded-xl bg-indigo/10 border border-indigo/30">
                    <div class="text-[11px] font-bold uppercase tracking-wider text-indigo">Ultimo Riscontro Indagine</div>
                    <p class="text-sm text-white mt-1">
                      <strong>${escapeHtml(player.lastInvestigation.targetName)}</strong> → ${escapeHtml(player.lastInvestigation.roleName)} (${escapeHtml(player.lastInvestigation.factionLabel)})

                  </div>

                ${player.martyrDeclaration ? `

                <h3 class="font-serif text-lg font-bold text-white">Usa Potere</h3>
                ${!player.alive && !isMartyr ? `

                    <select id="martyr-role-select" class="w-full rounded-xl bg-bgdark border border-white/15 px-3 py-2.5 text-sm text-white">
                      ${Object.values(ROLE_DEFS).map(r => `<option value="${escapeAttr(r.name)}">${escapeHtml(r.name)}</option>`).join('')}

                    <button

                      ${player.limitedUsesThisRound >= 1 ? 'disabled' : ''}
                      class="w-full py-2.5 px-4 rounded-xl bg-gold text-bgdark font-semibold text-sm hover:brightness-110 transition disabled:opacity-40"

                      ${player.limitedUsesThisRound >= 1 ? 'Testimonianza Già Usata' : 'Dichiara Ruolo al Tavolo'}

                        `).join('')}

                      ${!player.alive || player.powerPoints < roleDef.cost || player.blockedThisRound ? 'disabled' : ''}
                      class="w-full py-2.5 px-4 rounded-xl bg-gold text-bgdark font-semibold text-sm hover:brightness-110 transition disabled:opacity-40"
                    >
                      Attiva ${escapeHtml(roleDef.powerName)} (${roleDef.cost} PT)

                  </form>
                `}
              </div>

              <div class="rounded-2xl bg-surface border border-white/10 p-5 shadow-lg">
