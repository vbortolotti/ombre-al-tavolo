<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ombre al Tavolo — Tutti i Ruoli</title>
  <style>
    :root {
      --bg: #0c0e14;
      --surface: #151924;
      --surface-2: #1d2230;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --gold: #e5b85c;
      --crimson: #e05260;
      --emerald: #3ec98c;
      --indigo: #7c8cff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    .app-wrap {
      max-width: 1020px;
      margin: 0 auto;
      padding: 28px 16px 48px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .card-gold {
      border-color: rgba(229, 184, 92, 0.35);
    }

    .header-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      display: block;
    }

    h1 {
      margin: 4px 0 0;
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
    }

    h2 {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      color: #ffffff;
    }

    .subtext {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border-radius: 10px;
      font-weight: 600;
      transition: opacity 0.15s ease, background-color 0.15s ease;
    }

    button:hover {
      opacity: 0.92;
    }

    .btn-gold {
      background: var(--gold);
      color: #0c0e14;
      border: none;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
    }

    .btn-ghost {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 14px;
      font-size: 12px;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }

    .filter-pill {
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 12px;
    }

    .filter-pill.active-gold {
      background: rgba(229, 184, 92, 0.16);
      color: var(--gold);
      border-color: rgba(229, 184, 92, 0.45);
    }

    .filter-pill.active-crimson {
      background: rgba(224, 82, 96, 0.16);
      color: var(--crimson);
      border-color: rgba(224, 82, 96, 0.45);
    }

    .filter-pill.active-emerald {
      background: rgba(62, 201, 140, 0.16);
      color: var(--emerald);
      border-color: rgba(62, 201, 140, 0.45);
    }

    .roles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
    }

    .role-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .role-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .role-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .badge-Traditori {
      background: rgba(224, 82, 96, 0.15);
      color: var(--crimson);
      border-color: rgba(224, 82, 96, 0.4);
    }

    .badge-Fedeli {
      background: rgba(62, 201, 140, 0.15);
      color: var(--emerald);
      border-color: rgba(62, 201, 140, 0.4);
    }

    .badge-Neutro {
      background: rgba(229, 184, 92, 0.15);
      color: var(--gold);
      border-color: rgba(229, 184, 92, 0.4);
    }

    .role-desc {
      margin: 0;
      font-size: 13px;
      color: #d1d5db;
    }

    .role-meta {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .rules-list {
      margin: 10px 0 0;
      padding-left: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
      color: #d1d5db;
    }
  </style>
</head>
<body>
  <div id="roles-catalog-app" class="app-wrap"></div>

  <script>
    (function () {
      var ROLES = [
        {
          key: 'assassino',
          name: 'Assassino',
          faction: 'Traditori',
          desc: 'Ogni missione completata sblocca un colpo con cui può eliminare un giocatore.',
          meta: '5 missioni · 3 ripetibili · Prevalentemente di contatto (no Traditori tranne Traditore Segreto).'
        },
        {
          key: 'sabotatore',
          name: 'Sabotatore',
          faction: 'Traditori',
          desc: 'Può bloccare l’attivazione di un altro giocatore per il turno.',
          meta: '5 missioni · 3 ripetibili · Prevalentemente di contatto (no Traditori tranne Traditore Segreto).'
        },
        {
          key: 'traditore_segreto',
          name: 'Traditore Segreto',
          faction: 'Traditori',
          desc: 'Conosce gli altri Traditori e può scegliere a chi rivolgere le abilità dei Traditori.',
          meta: 'Può fare missioni anche con gli altri Traditori.'
        },
        {
          key: 'investigatore',
          name: 'Investigatore',
          faction: 'Fedeli',
          desc: 'Può scoprire una delle missioni dei Traditori.',
          meta: '5 missioni · 3 ripetibili · Missioni prevalentemente verbali.'
        },
        {
          key: 'guardia',
          name: 'Guardia',
          faction: 'Fedeli',
          desc: 'Può assegnare uno Scudo Protettivo a se stesso o a un altro giocatore.',
          meta: '5 missioni · 3 ripetibili · Missioni prevalentemente verbali.'
        },
        {
          key: 'martire',
          name: 'Martire',
          faction: 'Fedeli',
          desc: 'Non ha missioni; se subisce una missione altrui può dichiarare un ruolo in gioco e sbloccare la Voce dell’Aldilà per proteggere con uno Scudo.',
          meta: 'Attivazione reattiva su missione altrui.'
        },
        {
          key: 'mediatore',
          name: 'Mediatore',
          faction: 'Fedeli',
          desc: 'Ha un voto extra (+1) alla Tavola Rotonda.',
          meta: '5 missioni · 3 ripetibili · Missioni prevalentemente verbali.'
        },
        {
          key: 'cacciatore',
          name: 'Cacciatore',
          faction: 'Neutro',
          desc: 'Usa i punti missione per chiedere "giocatore X è ruolo Y?"; può sempre (0 punti) indicare il ruolo di 3 giocatori (tutti esatti = vince subito, errore = eliminato).',
          meta: 'Condizione di vittoria autonoma o rischio eliminazione immediata.'
        }
      ];

      var state = {
        filter: 'tutti'
      };

      window.setRoleFilter = function (f) {
        state.filter = f || 'tutti';
        render();
      };

      window.goBackToAccess = function () {
        window.location.href = 'index.html';
      };

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function render() {
        var root = document.getElementById('roles-catalog-app');
        if (!root) return;

        var filtered = state.filter === 'tutti'
          ? ROLES
          : ROLES.filter(function (r) { return r.faction === state.filter; });

        var cardsHtml = filtered.map(function (r) {
          return (
            '<article class="role-card">' +
              '<div class="role-head">' +
                '<h3 class="role-title">' + escapeHtml(r.name) + '</h3>' +
                '<span class="badge badge-' + r.faction + '">' + escapeHtml(r.faction) + '</span>' +
              '</div>' +
              '<p class="role-desc">' + escapeHtml(r.desc) + '</p>' +
              '<p class="role-meta">' + escapeHtml(r.meta) + '</p>' +
            '</article>'
          );
        }).join('');

        root.innerHTML =
          '<header class="card header-row">' +
            '<div>' +
              '<span class="eyebrow">Compendio del Tavolo</span>' +
              '<h1>Tutti i Ruoli e Regole delle Missioni</h1>' +
              '<p class="subtext">Consulta poteri, fazioni e meccaniche principali prima o durante la partita.</p>' +
            '</div>' +
            '<div class="btn-row">' +
              '<button type="button" class="btn-gold" onclick="goBackToAccess()">Torna ad Accesso</button>' +
            '</div>' +
          '</header>' +
          '<section class="card card-gold">' +
            '<span class="eyebrow">Regolamento Sintetico</span>' +
            '<h2>Missioni, Scudi e Tavola Rotonda</h2>' +
            '<ul class="rules-list">' +
              '<li><strong>Missioni:</strong> i ruoli attivi dispongono di 5 missioni (3 ripetibili); i Traditori non svolgono missioni con altri Traditori, ad eccezione del Traditore Segreto.</li>' +
              '<li><strong>Scudi Protettivi:</strong> assegnabili dalla Guardia (o tramite Voce dell’Aldilà del Martire) per assorbire un’azione o eliminazione.</li>' +
              '<li><strong>Tavola Rotonda:</strong> confronto e voto collettivo; il Mediatore dispone di un voto extra (+1).</li>' +
            '</ul>' +
          '</section>' +
          '<section class="card">' +
            '<div class="filter-bar">' +
              '<span class="subtext">Ruoli visualizzati: <strong>' + filtered.length + '</strong></span>' +
              '<div class="btn-row">' +
                '<button type="button" class="filter-pill ' + (state.filter === 'tutti' ? 'active-gold' : '') + '" onclick="setRoleFilter(\'tutti\')">Tutti</button>' +
                '<button type="button" class="filter-pill ' + (state.filter === 'Traditori' ? 'active-crimson' : '') + '" onclick="setRoleFilter(\'Traditori\')">Traditori</button>' +
                '<button type="button" class="filter-pill ' + (state.filter === 'Fedeli' ? 'active-emerald' : '') + '" onclick="setRoleFilter(\'Fedeli\')">Fedeli</button>' +
                '<button type="button" class="filter-pill ' + (state.filter === 'Neutro' ? 'active-gold' : '') + '" onclick="setRoleFilter(\'Neutro\')">Neutro</button>' +
              '</div>' +
            '</div>' +
            '<div class="roles-grid">' + cardsHtml + '</div>' +
          '</section>';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', render);
      } else {
        render();
      }
    })();
  </script>
</body>
</html>
