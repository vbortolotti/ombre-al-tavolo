<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ombre al Tavolo — Scheda Giocatore</title>
  <style>
    :root {
      --bg: #0c0e14;
      --surface: #151924;
      --surface-2: #1d2230;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --gold: #e5b85c;
      --crimson: #e05260;
      --emerald: #3ec98c;
      --indigo: #7c8cff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    .app-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 56px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .card-gold { border-color: rgba(229, 184, 92, 0.35); }
    .card-indigo { border-color: rgba(124, 140, 255, 0.4); }

    .header-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .profile-head {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      object-fit: cover;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      color: var(--gold);
      flex-shrink: 0;
    }

    .selfie-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      display: block;
    }

    .eyebrow-indigo { color: var(--indigo); }

    h1 { margin: 2px 0 0; font-size: 25px; font-weight: 800; color: #ffffff; }
    h2 { margin: 0; font-size: 18px; font-weight: 700; color: #ffffff; }
    .subtext { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; color: var(--emerald); }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    button, select, input[type="text"] { font-family: inherit; border-radius: 10px; }
    button { cursor: pointer; font-weight: 600; transition: opacity 0.15s ease, background-color 0.15s ease; }
    button:hover:not(:disabled) { opacity: 0.92; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    select, input[type="text"] {
      width: 100%;
      background: var(--bg);
      color: #ffffff;
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 13px;
    }

    .btn-gold { background: var(--gold); color: #0c0e14; border: none; padding: 10px 14px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
    .btn-emerald { background: var(--emerald); color: #0c0e14; border: none; padding: 9px 13px; font-size: 12px; font-weight: 700; }
    .btn-indigo { background: var(--indigo); color: #ffffff; border: none; padding: 10px 14px; font-size: 12px; }
    .btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); padding: 10px 14px; font-size: 12px; }

    .shield-box {
      border-radius: 14px;
      padding: 14px 16px;
      border: 1px solid rgba(62, 201, 140, 0.45);
      background: rgba(62, 201, 140, 0.12);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .shield-box.shield-inactive { border-color: var(--border); background: var(--surface); opacity: 0.9; }
    .shield-title { font-size: 14px; font-weight: 800; color: #ffffff; display: flex; align-items: center; gap: 8px; }

    .badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
    .badge-Traditori { background: rgba(224, 82, 96, 0.15); color: var(--crimson); border-color: rgba(224, 82, 96, 0.4); }
    .badge-Fedeli { background: rgba(62, 201, 140, 0.15); color: var(--emerald); border-color: rgba(62, 201, 140, 0.4); }
    .badge-Neutro { background: rgba(229, 184, 92, 0.15); color: var(--gold); border-color: rgba(229, 184, 92, 0.4); }
    .badge-Indigo { background: rgba(124, 140, 255, 0.16); color: var(--indigo); border-color: rgba(124, 140, 255, 0.35); }

    .banner { border-radius: 12px; padding: 12px 16px; font-size: 13px; font-weight: 600; border: 1px solid transparent; }
    .banner-success { background: rgba(62, 201, 140, 0.14); border-color: rgba(62, 201, 140, 0.4); color: var(--emerald); }
    .banner-error { background: rgba(224, 82, 96, 0.14); border-color: rgba(224, 82, 96, 0.4); color: var(--crimson); }
    .banner-info { background: rgba(124, 140, 255, 0.14); border-color: rgba(124, 140, 255, 0.4); color: var(--indigo); }

    .mission-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .mission-row { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 13px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .mission-row.claimed { border-color: rgba(229, 184, 92, 0.45); background: rgba(229, 184, 92, 0.06); }
    .mission-row.approved { border-color: rgba(62, 201, 140, 0.5); background: rgba(62, 201, 140, 0.08); }
    .mission-title { font-size: 14px; font-weight: 700; color: #ffffff; }
    .mission-desc { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .mission-status { font-size: 11px; margin-top: 5px; font-weight: 700; }

    .ability-box { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
    .ability-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
    .answer-box { border-radius: 12px; padding: 12px 14px; font-weight: 700; font-size: 14px; }
    .answer-yes { background: rgba(62, 201, 140, 0.16); border: 1px solid rgba(62, 201, 140, 0.45); color: var(--emerald); }
    .answer-no { background: rgba(224, 82, 96, 0.16); border: 1px solid rgba(224, 82, 96, 0.45); color: var(--crimson); }

    .chat-box { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
    .msg-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
    .msg-head { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    .msg-body { margin: 0; font-size: 13px; color: #e5e7eb; }
    .chat-form { display: flex; gap: 8px; }
  </style>

</head>
<body>
  <div id="player-board-app" class="app-wrap"></div>

  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    var ACCESS_KEY = 'ombre_accesso_tavolo_v1';
    var ROOM_PREFIX = 'ombre_stanza_sync_';

    var GAME_PHASES = [
      { step: 1, title: 'Cerimonia dei Ruoli', tip: 'Ricevi e consulta la tua scheda privata in segreto.' },
      { step: 2, title: 'Interludio Ludico', tip: 'Gioca al tavolo, osserva i comportamenti e porta avanti le tue missioni.' },
      { step: 3, title: 'Notte (Primo Assassinio)', tip: 'Silenzio al tavolo: fase del primo colpo notturno.' },
      { step: 4, title: 'Risveglio', tip: 'Scopri cosa è accaduto durante la notte.' },
      { step: 5, title: 'Interludio Ludico', tip: 'Nuovo momento di gioco al tavolo, missioni e confronti.' },
      { step: 6, title: 'Tavolo Ovale', tip: 'Confronto collettivo: preparati alla discussione e alle decisioni del tavolo.' },
      { step: 7, title: 'Notte (Assassino)', tip: 'Nuova fase notturna: il ciclo prosegue fino alla conclusione.' }
    ];

    var ROLE_DETAILS = {
      assassino: {
        name: 'Assassino',
        faction: 'Traditori',
        powerDesc: 'Può colpire chi vuole (tranne chi è protetto da Scudo). Se in partita c’è il Traditore Segreto, l’Assassino sceglie 2 persone e il Traditore Segreto decide chi eliminare. Costa 1 punto missione e richiede un giro di Tavolo Ovale prima di poter essere riutilizzata.'
      },
      sabotatore: {
        name: 'Sabotatore',
        faction: 'Traditori',
        powerDesc: 'Può bloccare l’attivazione di un altro giocatore per il turno (5 missioni, 3 ripetibili; contatto; no Traditori tranne Traditore Segreto).'
      },
      traditore_segreto: {
        name: 'Traditore Segreto',
        faction: 'Traditori',
        powerDesc: 'Conosci gli altri Traditori e, quando l’Assassino indica 2 bersagli, decidi tu quale dei due eliminare.'
      },
      investigatore: {
        name: 'Investigatore',
        faction: 'Fedeli',
        powerDesc: 'Puoi scoprire una delle missioni dei Traditori (5 missioni, 3 ripetibili; missioni prevalentemente verbali).'
      },
      guardia: {
        name: 'Guardia',
        faction: 'Fedeli',
        powerDesc: 'Puoi assegnare uno Scudo Protettivo a te stesso o a un altro giocatore (5 missioni, 3 ripetibili; missioni prevalentemente verbali).'
      },
      martire: {
        name: 'Martire',
        faction: 'Fedeli',
        powerDesc: 'Non hai missioni; se subisci una missione altrui puoi dichiarare un ruolo in gioco e sbloccare la Voce dell’Aldilà per proteggere con uno Scudo.'
      },
      mediatore: {
        name: 'Mediatore',
        faction: 'Fedeli',
        powerDesc: 'Hai un voto extra (+1) alla Tavola Rotonda (5 missioni, 3 ripetibili; missioni prevalentemente verbali).'
      },
      cacciatore: {
        name: 'Cacciatore',
        faction: 'Neutro',
        powerDesc: 'Usa i punti missione per chiedere "giocatore X è ruolo Y?" con risposta automatica Sì/No; oppure (0 punti) indica il ruolo di 3 giocatori.'
      }
    };

    var DEFAULT_MISSIONS_BY_FACTION = {
      Traditori: [
        { slot: 1, title: 'Missione 1 · Contatto Cauto', type: 'Contatto', repeatable: true, desc: 'Avvia un contatto discreto con un giocatore non Traditore durante il turno.', playerClaimedDone: false, masterApproved: false },
        { slot: 2, title: 'Missione 2 · Sussurro al Tavolo', type: 'Verbale', repeatable: false, desc: 'Fai passare una frase ambigua senza destare sospetti immediati.', playerClaimedDone: false, masterApproved: false },
        { slot: 3, title: 'Missione 3 · Devianza del Voto', type: 'Reazione', repeatable: true, desc: 'Orienta il sospetto verso un giocatore Fedele durante il confronto.', playerClaimedDone: false, masterApproved: false },
        { slot: 4, title: 'Missione 4 · Scambio Silenzioso', type: 'Contatto', repeatable: false, desc: 'Completa un piccolo scambio o gesto concordato senza farti notare.', playerClaimedDone: false, masterApproved: false },
        { slot: 5, title: 'Missione 5 · Colpo nell’Ombra', type: 'Contatto', repeatable: true, desc: 'Porta a termine l’obiettivo del turno mantenendo coperta la tua fazione.', playerClaimedDone: false, masterApproved: false }
      ],
      Fedeli: [
        { slot: 1, title: 'Missione 1 · Raccolta Indizi', type: 'Verbale', repeatable: false, desc: 'Ascolta con attenzione e riporta un dettaglio utile emerso al tavolo.', playerClaimedDone: false, masterApproved: false },
        { slot: 2, title: 'Missione 2 · Domanda Mirata', type: 'Verbale', repeatable: true, desc: 'Poni una domanda incisiva per verificare la coerenza di un giocatore.', playerClaimedDone: false, masterApproved: false },
        { slot: 3, title: 'Missione 3 · Alleanza Verbale', type: 'Verbale', repeatable: true, desc: 'Costruisci un confronto costruttivo con un altro giocatore al tavolo.', playerClaimedDone: false, masterApproved: false },
        { slot: 4, title: 'Missione 4 · Difesa del Giusto', type: 'Verbale', repeatable: false, desc: 'Sostieni con argomenti chiari un giocatore che ritieni affidabile.', playerClaimedDone: false, masterApproved: false },
        { slot: 5, title: 'Missione 5 · Verità alla Luce', type: 'Reazione', repeatable: true, desc: 'Aiuta il tavolo a individuare un comportamento incoerente prima del voto.', playerClaimedDone: false, masterApproved: false }
      ],
      Neutro: [
        { slot: 1, title: 'Missione 1 · Osservazione Diretta', type: 'Reazione', repeatable: true, desc: 'Osserva le interazioni tra due giocatori per ricavare un indizio.', playerClaimedDone: false, masterApproved: false },
        { slot: 2, title: 'Missione 2 · Analisi dei Ruoli', type: 'Verbale', repeatable: false, desc: 'Confronta le dichiarazioni al tavolo con i ruoli possibili in gioco.', playerClaimedDone: false, masterApproved: false },
        { slot: 3, title: 'Missione 3 · Caccia Silenziosa', type: 'Reazione', repeatable: true, desc: 'Individua un bersaglio su cui concentrare la tua prossima domanda.', playerClaimedDone: false, masterApproved: false },
        { slot: 4, title: 'Missione 4 · Verifica Incrociata', type: 'Contatto', repeatable: false, desc: 'Controlla la reazione di un giocatore quando viene nominato un altro ruolo.', playerClaimedDone: false, masterApproved: false },
        { slot: 5, title: 'Missione 5 · Mira Finale', type: 'Reazione', repeatable: true, desc: 'Prepara la tua verifica conclusiva o la chiamata da 3 giocatori.', playerClaimedDone: false, masterApproved: false }
      ]
    };

    function initFirestore() {
      try {
        if (!window.OMBRE_FIREBASE_CONFIG || !window.OMBRE_FIREBASE_CONFIG.projectId) return null;
        var app = getApps().length ? getApps()[0] : initializeApp(window.OMBRE_FIREBASE_CONFIG);
        return getFirestore(app);
      } catch (_e) { return null; }
    }

    var firestoreDb = initFirestore();

    function readAccess() {
      try {
        var raw = localStorage.getItem(ACCESS_KEY);
        if (!raw) return { roomCode: 'TAVOLO1', playerName: 'Giocatore', selfieDataUrl: '' };
        var parsed = JSON.parse(raw);
        return {
          roomCode: String(parsed.roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1',
          playerName: String(parsed.playerName || 'Giocatore').trim() || 'Giocatore',
          selfieDataUrl: String(parsed.selfieDataUrl || '')
        };
      } catch (_e) {
        return { roomCode: 'TAVOLO1', playerName: 'Giocatore', selfieDataUrl: '' };
      }
    }

    function isValidAvatarSrc(val) {
      var s = String(val || '').trim();
      return /^data:image\/(png|jpeg|jpg|webp|gif);base64,/i.test(s) || /^https?:\/\//i.test(s);
    }

    var access = readAccess();
    var state = {
      roomCode: access.roomCode,
      playerName: access.playerName,
      selfieDataUrl: isValidAvatarSrc(access.selfieDataUrl) ? access.selfieDataUrl : '',
      playerSelfies: {},
      syncStatus: firestoreDb ? 'Cloud Firestore attivo' : 'Locale',
      players: [],
      assignedRoleKey: null,
      privateCardOpen: false,
      missionsVisible: false,
      missions: [],
      playerPoints: {},
      missionPoints: 0,
      phaseIndex: 0,
      cycleCount: 1,
      hunterTargetName: '',
      hunterTargetRole: 'assassino',
      hunterLastAnswer: null,
      tripleNames: ['', '', ''],
      tripleRoles: ['assassino', 'guardia', 'investigatore'],
      assassinTarget1: '',
      assassinTarget2: '',
      assassinUsedSinceOval: false,
      ovalRoundCount: 0,
      shieldedPlayers: [],
      martyrShieldedPlayers: [],
      sabotagedPlayers: [],
      pendingAssassinPair: null,
      confirmPrompt: null,
      actionResultText: null,
      masterChat: [],
      tvMode: 'idle',
      tvKillTarget: '',
      tvExileTarget: '',
      tvVideoPaused: false,
      tvRevealTick: 0,
      dismissedTvTick: 0,
      tvMuted: true,
      banner: null
    };

    var chatDraft = '';

    function getRoomRef() {
      if (!firestoreDb) return null;
      return doc(firestoreDb, 'stanze', state.roomCode);
    }

    function ensureFiveMissions(existingList, faction, cloudList) {
      var source = Array.isArray(cloudList) && cloudList.length
        ? cloudList
        : (Array.isArray(existingList) && existingList.length
            ? existingList
            : (DEFAULT_MISSIONS_BY_FACTION[faction] || DEFAULT_MISSIONS_BY_FACTION.Fedeli));

      var out = [];
      for (var i = 0; i < 5; i++) {
        var base = source[i] || (DEFAULT_MISSIONS_BY_FACTION[faction] || DEFAULT_MISSIONS_BY_FACTION.Fedeli)[i];
        var claimed = Boolean(base.playerClaimedDone !== undefined ? base.playerClaimedDone : base.done);
        var approved = Boolean(base.masterApproved);
        out.push({
          slot: i + 1,
          id: base.id || ('M' + (i + 1)),
          title: base.title || ('Missione ' + (i + 1)),
          type: base.type || 'Missione',
          repeatable: Boolean(base.repeatable),
          points: Number(base.points || 1),
          desc: base.desc || base.description || '',
          playerClaimedDone: claimed,
          masterApproved: approved,
          done: approved || claimed
        });
      }
      return out;
    }

    function syncSelfieIntoPlayersList(playersArr, nameKey, photo) {
      var list = Array.isArray(playersArr) ? playersArr.map(function (p) { return Object.assign({}, p); }) : [];
      var idx = list.findIndex(function (p) {
        return String(p.name || '').trim().toLowerCase() === nameKey;
      });
      if (idx !== -1) {
        list[idx].selfie = photo || '';
        list[idx].selfieDataUrl = photo || null;
      } else if (state.playerName) {
        list.push({
          id: 'p_' + Date.now(),
          name: state.playerName,
          selfie: photo || '',
          selfieDataUrl: photo || null,
          boardUnlocked: true,
          assignedRoleKey: state.assignedRoleKey || null,
          joinedAt: Date.now()
        });
      }
      return list;
    }

    function applyRoomSnapshot(data) {
      if (!data || typeof data !== 'object') return;
      var nameKey = String(state.playerName || '').trim().toLowerCase();

      if (typeof data.phaseIndex === 'number') state.phaseIndex = Math.max(0, Math.min(GAME_PHASES.length - 1, Number(data.phaseIndex)));
      if (typeof data.cycleCount === 'number') state.cycleCount = Math.max(1, Number(data.cycleCount));

      if (data.playerSelfies && typeof data.playerSelfies === 'object') {
        state.playerSelfies = Object.assign({}, data.playerSelfies);
      }

      if (Array.isArray(data.players)) {
        state.players = data.players;
        var me = data.players.find(function (p) {
          return String(p.name || '').trim().toLowerCase() === nameKey;
        });
        var newRole = me && me.assignedRoleKey && ROLE_DETAILS[me.assignedRoleKey] ? me.assignedRoleKey : null;
        if (newRole && !state.assignedRoleKey) {
          state.privateCardOpen = true;
          state.banner = { text: 'Il Master ti ha assegnato un ruolo: Scheda Privata sbloccata!', type: 'success' };
        } else if (!newRole) {
          state.privateCardOpen = false;
        }
        state.assignedRoleKey = newRole;

        var cloudPhoto = (state.playerSelfies && nameKey && state.playerSelfies[nameKey])
          || (me && (me.selfie || me.selfieDataUrl))
          || '';
        if (isValidAvatarSrc(cloudPhoto)) {
          state.selfieDataUrl = cloudPhoto;
          try {
            var accRaw = localStorage.getItem(ACCESS_KEY);
            var accObj = accRaw ? JSON.parse(accRaw) : {};
            accObj.selfieDataUrl = cloudPhoto;
            localStorage.setItem(ACCESS_KEY, JSON.stringify(accObj));
          } catch (_e) {}
        }
      }

      var roleObj = state.assignedRoleKey ? ROLE_DETAILS[state.assignedRoleKey] : null;
      var faction = roleObj ? roleObj.faction : 'Fedeli';
      var cloudMissions = data.missionAssignments && typeof data.missionAssignments === 'object'
        ? data.missionAssignments[nameKey]
        : null;

      state.missions = ensureFiveMissions(state.missions, faction, cloudMissions);
      if (data.playerPoints && typeof data.playerPoints === 'object') {
        state.playerPoints = Object.assign({}, data.playerPoints);
      }
      var approvedCount = state.missions.filter(function (m) { return Boolean(m.masterApproved); }).length;
      state.missionPoints = (nameKey && state.playerPoints[nameKey] !== undefined)
        ? Number(state.playerPoints[nameKey] || 0)
        : approvedCount;

      if (Array.isArray(data.masterChat)) state.masterChat = data.masterChat;
      state.shieldedPlayers = Array.isArray(data.shieldedPlayers) ? data.shieldedPlayers : [];
      state.martyrShieldedPlayers = Array.isArray(data.martyrShieldedPlayers) ? data.martyrShieldedPlayers : [];
      state.sabotagedPlayers = Array.isArray(data.sabotagedPlayers) ? data.sabotagedPlayers : [];
      state.ovalRoundCount = Number(data.ovalRoundCount || 0);
      state.pendingAssassinPair = data.pendingAssassinPair || null;
      if (typeof data.assassinUsedSinceOval === 'boolean') {
        state.assassinUsedSinceOval = data.assassinUsedSinceOval;
      }
      if (typeof data.tvMode === 'string') {
        if (data.tvMode !== state.tvMode && data.tvMode !== 'idle') {
          state.dismissedTvTick = 0;
        }
        state.tvMode = data.tvMode;
      }
      if (typeof data.tvKillTarget === 'string') state.tvKillTarget = data.tvKillTarget;
      if (typeof data.tvExileTarget === 'string') state.tvExileTarget = data.tvExileTarget;
      if (typeof data.tvVideoPaused === 'boolean') state.tvVideoPaused = data.tvVideoPaused;
      if (typeof data.tvRevealTick === 'number') {
        if (data.tvRevealTick !== state.tvRevealTick) {
          state.dismissedTvTick = 0;
        }
        state.tvRevealTick = data.tvRevealTick;
      }

      if (!state.hunterTargetName) {
        var other = state.players.find(function (p) {
          return String(p.name || '').trim().toLowerCase() !== nameKey;
        });
        if (other) state.hunterTargetName = other.name;
      }

      saveLocal();
    }

    function compressSelfieFile(file, maxSize, quality) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function (ev) {
          var img = new Image();
          img.onload = function () {
            var ratio = Math.min(1, maxSize / Math.max(img.width || 1, img.height || 1));
            var w = Math.max(1, Math.round((img.width || maxSize) * ratio));
            var h = Math.max(1, Math.round((img.height || maxSize) * ratio));
            var canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            var ctx = canvas.getContext('2d');
            if (!ctx) return resolve(String(ev.target.result || ''));
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = String(ev.target.result || '');
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function renderMissionsSection(roleObj, faction, missions) {
      var bodyHtml = '';
      if (!state.missionsVisible) {
        bodyHtml = '<div style="padding:12px;border-radius:10px;background:var(--bg);border:1px dashed rgba(229,184,92,0.35);color:var(--muted);font-size:13px;margin-top:12px;">Missioni nascoste per evitare sbirciate. Premi <strong>Mostra Missioni</strong> per aprirle.</div>';
      } else if (!roleObj) {
        bodyHtml = '<div style="padding:12px;border-radius:10px;background:var(--bg);color:var(--muted);font-size:13px;margin-top:12px;">Il Master non ha ancora assegnato il tuo ruolo e le tue 5 missioni.</div>';
      } else if (state.assignedRoleKey === 'martire') {
        bodyHtml = '<div style="padding:12px;border-radius:10px;background:var(--bg);color:var(--muted);font-size:13px;margin-top:12px;">Il Martire non ha missioni standard: guadagna punti subendo missioni altrui.</div>';
      } else {
        bodyHtml = '<div class="mission-list">' + missions.map(function (m, idx) {
          var rowClass = m.masterApproved ? 'approved' : (m.playerClaimedDone ? 'claimed' : '');
          var statusHtml = m.masterApproved
            ? '<span style="color:var(--emerald);">Confermata dal Master ✓ (+' + Number(m.points || 1) + ' pt)</span>'
            : (m.playerClaimedDone
                ? '<span style="color:var(--gold);">Segnalata al Master (in attesa di conferma)</span>'
                : '<span style="color:var(--muted);">Da completare</span>');

            '<div class="mission-row ' + rowClass + '">' +
              '<div>' +
                '<div class="mission-title">' + m.slot + '. ' + escapeHtml(m.title) + ' <span style="font-size:11px;color:var(--muted);">(' + escapeHtml(m.type) + ' · ' + (m.repeatable ? 'Ripetibile' : 'Singola') + ')</span></div>' +

            '</div>'

      return (
        '<section class="card">' +
          '<div class="header-row">' +

              '<span class="eyebrow">Obiettivi della Partita · Punti Confermati: <strong style="color:var(--emerald);">' + state.missionPoints + '</strong></span>' +
              '<h2>Le Tue 5 Missioni Segrete</h2>' +

            '</div>' +
          '</div>' +
          bodyHtml +
        '</section>'
      );

    function syncPlayerVideoPlayback() {
      var vid = document.getElementById('player-tv-broadcast-video');
      if (!vid) return;
      vid.muted = Boolean(state.tvMuted);
      if (state.tvVideoPaused) {
        try { vid.pause(); } catch (_e) {}
      } else {
        try { vid.play().catch(function () {}); } catch (_e) {}
      }
    }

      if (mode === 'exile' && state.tvExileTarget) targetName = state.tvExileTarget;

            '<div class="btn-row">' +
              '<button type="button" class="btn-gold" onclick="goToRoles()">Tutti i Ruoli</button>' +
              '<button type="button" class="btn-ghost" onclick="goToAccess()">Cambia Stanza</button>' +
            '</div>' +
          '</div>' +
          '<div class="selfie-bar">' +
            '<p class="subtext" style="margin:0;">' + (isValidAvatarSrc(state.selfieDataUrl) ? 'Selfie attivo e sincronizzato con la stanza e la TV.' : 'Nessun selfie impostato: scatta o carica la tua foto per la stanza e la TV.') + '</p>' +
            '<div class="btn-row">' +
              '<label class="btn-gold" style="cursor:pointer;">' + (isValidAvatarSrc(state.selfieDataUrl) ? 'Cambia Selfie' : 'Scatta / Carica Selfie') + '<input type="file" accept="image/*" capture="user" style="display:none;" onchange="handlePlayerSelfieChange(this)" /></label>' +
              (isValidAvatarSrc(state.selfieDataUrl) ? '<button type="button" class="btn-ghost" onclick="clearPlayerSelfie()">Rimuovi Selfie</button>' : '') +
            '</div>' +
          '</div>' +
        '</header>' +
        bannerHtml +
        renderVisibleShieldBanner() +
        actionBannerHtml +
        '<section class="card card-gold">' +
          '<div class="header-row">' +
            '<div><span class="eyebrow">Identità Segreta</span><h2>Scheda Privata e Abilità</h2></div>' +
            '<button type="button" class="btn-indigo" onclick="togglePrivateCard()">' + (roleObj ? (state.privateCardOpen ? 'Nascondi Scheda' : 'Mostra Scheda') : 'In attesa del ruolo') + '</button>' +
          '</div>' +
          privateCardHtml +
          renderRoleAbilitySection(state.assignedRoleKey) +
        '</section>' +
        renderMissionsSection(roleObj, faction, missions) +
        '<section class="card">' +
          '<span class="eyebrow">Tavolo e Master</span>' +
          '<h2>Notifiche e Chat con il Master</h2>' +
          '<div class="chat-box">' + msgsHtml + '</div>' +
          '<div class="chat-form">' +
            '<input id="player-chat-input" type="text" value="' + escapeHtml(chatDraft) + '" oninput="updateChatDraft(this.value)" onkeydown="if(event.key===&#39;Enter&#39;){event.preventDefault();sendPlayerChat();}"" placeholder="Scrivi al Master..." />' +
            '<button type="button" class="btn-gold" onclick="sendPlayerChat()">Invia</button>' +
          '</div>' +
        '</section>';
      syncPlayerVideoPlayback();
    }

    render();

    var ref = getRoomRef();
    if (ref) {
      getDoc(ref).then(function (snap) {
        if (snap.exists()) {
          applyRoomSnapshot(snap.data() || {});
          render();
        }
      }).catch(function () {});

      onSnapshot(ref, function (snap) {
        state.syncStatus = 'Cloud Firestore attivo';
        if (!snap.exists()) return;
        applyRoomSnapshot(snap.data() || {});
        render();
      });
    }
  </script>
</body>
</html>
