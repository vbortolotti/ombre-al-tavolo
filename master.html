<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ombre al Tavolo — Master: Cerimonia e Ruoli</title>
  <style>
    :root {
      --bg: #0c0e14;
      --surface: #151924;
      --surface-2: #1d2230;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --gold: #e5b85c;
      --crimson: #e05260;
      --emerald: #3ec98c;
      --indigo: #7c8cff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    .app-wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 16px 56px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .card-gold {
      border-color: rgba(229, 184, 92, 0.35);
    }

    .header-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      display: block;
    }

    h1 {
      margin: 4px 0 0;
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
    }

    h2 {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      color: #ffffff;
    }

    .subtext {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--emerald);
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border-radius: 10px;
      font-weight: 600;
      transition: opacity 0.15s ease, background-color 0.15s ease;
    }

    button:hover:not(:disabled) {
      opacity: 0.92;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-gold {
      background: var(--gold);
      color: #0c0e14;
      border: none;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
    }

    .btn-emerald {
      background: var(--emerald);
      color: #0c0e14;
      border: none;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
    }

    .btn-emerald-lg {
      background: var(--emerald);
      color: #0c0e14;
      border: none;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
    }

    .btn-indigo {
      background: var(--indigo);
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      font-size: 12px;
    }

    .btn-crimson {
      background: var(--crimson);
      color: #ffffff;
      border: none;
      padding: 8px 12px;
      font-size: 12px;
    }

    .btn-ghost {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 14px;
      font-size: 12px;
    }

    .btn-small {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 12px;
    }

    .btn-remove:hover {
      background: rgba(224, 82, 96, 0.18);
      color: var(--crimson);
      border-color: rgba(224, 82, 96, 0.45);
    }

    .banner {
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid transparent;
    }

    .banner-success {
      background: rgba(62, 201, 140, 0.14);
      border-color: rgba(62, 201, 140, 0.4);
      color: var(--emerald);
    }

    .banner-error {
      background: rgba(224, 82, 96, 0.14);
      border-color: rgba(224, 82, 96, 0.4);
      color: var(--crimson);
    }

    .banner-info {
      background: rgba(124, 140, 255, 0.14);
      border-color: rgba(124, 140, 255, 0.4);
      color: var(--indigo);
    }

    .section-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .speech-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .speech-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
    }

    .speech-item.active {
      border-color: var(--gold);
      background: #10141f;
    }

    .speech-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .pill-gold {
      background: rgba(229, 184, 92, 0.15);
      color: var(--gold);
      border: 1px solid rgba(229, 184, 92, 0.35);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .speech-text {
      margin: 0;
      font-size: 14px;
      color: #e5e7eb;
    }

    .speech-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #d1d5db;
      margin-bottom: 6px;
    }

    textarea, input[type="text"], select {
      width: 100%;
      background: var(--bg);
      color: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
    }

    textarea:focus, input[type="text"]:focus, select:focus {
      outline: none;
      border-color: var(--gold);
    }

    .custom-speech-box {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .two-col {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 20px;
    }

    .roles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }

    .role-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .role-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .role-name {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .badge-Traditori {
      background: rgba(224, 82, 96, 0.15);
      color: var(--crimson);
      border-color: rgba(224, 82, 96, 0.4);
    }

    .badge-Fedeli {
      background: rgba(62, 201, 140, 0.15);
      color: var(--emerald);
      border-color: rgba(62, 201, 140, 0.4);
    }

    .badge-Neutro {
      background: rgba(229, 184, 92, 0.15);
      color: var(--gold);
      border-color: rgba(229, 184, 92, 0.4);
    }

    .role-summary {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .role-counter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    .counter-btns {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-step {
      width: 28px;
      height: 28px;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .count-val {
      min-width: 22px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--gold);
    }

    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .player-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .player-row {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .player-name {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }

    .player-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .board-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .chat-box {
      max-height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 12px 0;
      padding-right: 4px;
    }

    .msg-card {
      border-radius: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      background: var(--bg);
    }

    .msg-card.from-master {
      background: var(--surface-2);
      border-color: rgba(229, 184, 92, 0.35);
      margin-left: 18px;
    }

    .msg-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .msg-sender {
      font-weight: 700;
      color: #ffffff;
    }

    .msg-body {
      margin: 0;
      font-size: 13px;
      color: #e5e7eb;
    }

    .chat-form {
      display: flex;
      gap: 8px;
    }

    .footer-action {
      display: flex;
      justify-content: flex-end;
    }
  </style>

<body>
  <div id="master-roles-app" class="app-wrap"></div>

  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    var ACCESS_KEY = 'ombre_accesso_tavolo_v1';
    var MASTER_KEY = 'ombre_master_assegnazione_ruoli_v1';
    var ROOM_PREFIX = 'ombre_stanza_sync_';

    var ROLE_CATALOG = {
      assassino: {
        name: 'Assassino',
        faction: 'Traditori',
        summary: 'Ogni missione completata sblocca un colpo con cui può eliminare un giocatore (5 missioni, 3 ripetibili, contatto; no Traditori tranne Traditore Segreto).'
      },
      sabotatore: {
        name: 'Sabotatore',
        faction: 'Traditori',
        summary: 'Può bloccare l’attivazione di un altro giocatore per il turno (5 missioni, 3 ripetibili, contatto; no Traditori tranne Traditore Segreto).'
      },
      traditore_segreto: {
        name: 'Traditore Segreto',
        faction: 'Traditori',
        summary: 'Conosce gli altri Traditori e può scegliere a chi rivolgere le abilità dei Traditori (può fare missioni anche con gli altri Traditori).'
      },
      investigatore: {
        name: 'Investigatore',
        faction: 'Fedeli',
        summary: 'Può scoprire una delle missioni dei Traditori (5 missioni, 3 ripetibili, prevalentemente verbali).'
      },
      guardia: {
        name: 'Guardia',
        faction: 'Fedeli',
        summary: 'Può assegnare uno Scudo Protettivo a se stesso o a un altro giocatore (5 missioni, 3 ripetibili, prevalentemente verbali).'
      },
      martire: {
        name: 'Martire',
        faction: 'Fedeli',
        summary: 'Non ha missioni; se subisce una missione altrui può dichiarare un ruolo in gioco e sbloccare la Voce dell’Aldilà per proteggere con uno Scudo.'
      },
      mediatore: {
        name: 'Mediatore',
        faction: 'Fedeli',
        summary: 'Ha un voto extra (+1) alla Tavola Rotonda (5 missioni, 3 ripetibili, prevalentemente verbali).'
      },
      cacciatore: {
        name: 'Cacciatore',
        faction: 'Neutro',
        summary: 'Punti missione per chiedere "giocatore X è ruolo Y?"; può sempre (0 punti) indicare il ruolo di 3 giocatori (tutti esatti = vince subito, errore = eliminato).'
      }
    };

    var SPEECH_TEMPLATES = {
      suspense: [
        'Le luci si abbassano intorno al tavolo della stanza {{STANZA}}. Ognuno ha davanti a sé un destino ancora non svelato.',
        'Nel silenzio della notte, le ombre iniziano a muoversi: alcuni giureranno fedeltà alla luce, altri nasconderanno un secondo fine.',
        'Ora riceverete il vostro ruolo segreto. Guardate la vostra scheda soltanto quando siete certi che nessuno sbircia, poi alzate lo sguardo sul tavolo.'
      ],
      solenne: [
        'Benvenuti nella cerimonia d’apertura del tavolo {{STANZA}}. Da questo istante il patto del gioco è sigillato.',
        'Ogni ruolo porta con sé un dovere, un limite e una scelta che peserà sull’intera serata.',
        'Prendete coscienza della vostra identità segreta con calma e preparatevi a sostenere la vostra parte.'
      ],
      rapido: [
        'Tavolo {{STANZA}}, ci siamo: i ruoli stanno per essere distribuiti.',
        'Controlla in segreto la tua scheda non appena viene assegnata, non mostrare nulla e resta pronto a giocare.'
      ]
    };

    function safeGetItem(key) {
      try {
        if (typeof window.localStorage === 'undefined') return null;
        return window.localStorage.getItem(key);
      } catch (_e) {
        return null;
      }
    }

    function safeSetItem(key, val) {
      try {
        if (typeof window.localStorage === 'undefined') return;
        window.localStorage.setItem(key, val);
      } catch (_e) {
        // Ignora
      }
    }

    function initFirestore() {
      try {
        if (!window.OMBRE_FIREBASE_CONFIG || !window.OMBRE_FIREBASE_CONFIG.projectId) {
          return null;
        }
        var app = getApps().length ? getApps()[0] : initializeApp(window.OMBRE_FIREBASE_CONFIG);
        return getFirestore(app);
      } catch (err) {
        console.error('Errore inizializzazione Firestore su master.html:', err);
        return null;
      }
    }

    var firestoreDb = initFirestore();
    var unsubscribeRoom = null;

    function getRoomDocRef(roomCode) {
      if (!firestoreDb) return null;
      var cleanRoom = String(roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1';
      return doc(firestoreDb, 'stanze', cleanRoom);
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function readAccess() {
      try {
        var raw = safeGetItem(ACCESS_KEY);
        if (!raw) return { roomCode: 'TAVOLO1', masterName: 'Master' };
        var parsed = JSON.parse(raw);
        return {
          roomCode: String(parsed && parsed.roomCode ? parsed.roomCode : 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1',
          masterName: String(parsed && parsed.playerName ? parsed.playerName : 'Master').trim() || 'Master'
        };
      } catch (_e) {
        return { roomCode: 'TAVOLO1', masterName: 'Master' };
      }
    }

    function createDefaultCounts() {
      return {
        assassino: 1,
        sabotatore: 1,
        traditore_segreto: 1,
        investigatore: 1,
        guardia: 1,
        martire: 1,
        mediatore: 1,
        cacciatore: 1
      };
    }

    function normalizePlayerList(rawPlayers) {
      if (!Array.isArray(rawPlayers)) return [];
      var seen = {};
      var out = [];
      rawPlayers.forEach(function (p, idx) {
        var name = String(p && p.name ? p.name : '').trim();
        if (!name) return;
        var key = name.toLowerCase();
        var roleKey = p && p.assignedRoleKey && ROLE_CATALOG[p.assignedRoleKey] ? p.assignedRoleKey : null;
        if (seen[key]) {
          var existing = out[seen[key] - 1];
          if (p && p.boardUnlocked) existing.boardUnlocked = true;
          if (roleKey) existing.assignedRoleKey = roleKey;
          return;
        }
        out.push({
          id: String(p && p.id ? p.id : ('p_' + idx + '_' + key)),
          name: name,
          boardUnlocked: Boolean(p && p.boardUnlocked),
          assignedRoleKey: roleKey
        });
        seen[key] = out.length;
      });
      return out;
    }

    function loadState() {
      var ctx = readAccess();
      var base = {
        roomCode: ctx.roomCode,
        masterName: ctx.masterName,
        syncStatus: firestoreDb ? 'Cloud Firestore attivo' : 'Locale',
        roleCounts: createDefaultCounts(),
        players: [],
        speechTone: 'suspense',
        customSpeechText: '',
        activeParagraphIndex: 0,
        assignmentCompleted: false,
        boardOpened: false,
        banner: null,
        chatTab: 'master',
        playerFilter: 'ALL',
        masterChat: [],
        traitorChat: []
      };

      try {
        var raw = safeGetItem(MASTER_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') {
            if (parsed.roleCounts && typeof parsed.roleCounts === 'object') {
              Object.keys(base.roleCounts).forEach(function (k) {
                var n = Number(parsed.roleCounts[k]);
                if (!isNaN(n)) base.roleCounts[k] = Math.max(0, Math.min(12, n));
              });
            }
            if (Array.isArray(parsed.players) && String(parsed.roomCode || '').toUpperCase() === base.roomCode) {
              base.players = normalizePlayerList(parsed.players);
            }
            if (parsed.speechTone && SPEECH_TEMPLATES[parsed.speechTone]) {
              base.speechTone = parsed.speechTone;
            }
            if (typeof parsed.customSpeechText === 'string') {
              base.customSpeechText = parsed.customSpeechText;
            }
            if (typeof parsed.activeParagraphIndex === 'number') {
              base.activeParagraphIndex = Math.max(0, parsed.activeParagraphIndex);
            }
            if (String(parsed.roomCode || '').toUpperCase() === base.roomCode) {
              base.assignmentCompleted = Boolean(parsed.assignmentCompleted);
              base.boardOpened = Boolean(parsed.boardOpened);
            }
          }
        }
      } catch (_e) {
        // Usa stato di base
      }

      try {
        var roomRaw = safeGetItem(ROOM_PREFIX + base.roomCode);
        if (roomRaw) {
          var roomParsed = JSON.parse(roomRaw);
          if (roomParsed && Array.isArray(roomParsed.masterChat)) {
            base.masterChat = roomParsed.masterChat;
          }
          if (roomParsed && Array.isArray(roomParsed.traitorChat)) {
            base.traitorChat = roomParsed.traitorChat;
          }
          if (roomParsed && Array.isArray(roomParsed.players) && base.players.length === 0) {
            base.players = normalizePlayerList(roomParsed.players);
          }
        }
      } catch (_e) {
        // Ignora
      }

      return base;
    }

    var state = loadState();
    var chatDraft = '';

    function persistLocal() {
      safeSetItem(MASTER_KEY, JSON.stringify({
        roomCode: state.roomCode,
        masterName: state.masterName,
        roleCounts: state.roleCounts,
        players: state.players,
        speechTone: state.speechTone,
        customSpeechText: state.customSpeechText,
        activeParagraphIndex: state.activeParagraphIndex,
        assignmentCompleted: state.assignmentCompleted,
        boardOpened: state.boardOpened
      }));

      safeSetItem(ROOM_PREFIX + state.roomCode, JSON.stringify({
        roomCode: state.roomCode,
        masterName: state.masterName,
        players: state.players,
        roleCounts: state.roleCounts,
        masterChat: state.masterChat,
        traitorChat: state.traitorChat,
        updatedAt: Date.now()
      }));
    }

    async function syncRoomToCloud(extraFields) {
      persistLocal();
      var ref = getRoomDocRef(state.roomCode);
      if (!ref) return;
      try {
        var payload = Object.assign({
          roomCode: state.roomCode,
          masterName: state.masterName || 'Master',
          players: state.players,
          roleCounts: state.roleCounts,
          masterChat: state.masterChat,
          traitorChat: state.traitorChat,
          updatedAt: Date.now()
        }, extraFields || {});
        await setDoc(ref, payload, { merge: true });
        state.syncStatus = 'Cloud Firestore attivo';
      } catch (err) {
        console.error('Errore scrittura stanza su Firestore:', err);
        state.syncStatus = 'Locale (controlla permessi Firestore)';
      }
    }

    async function subscribeToRoomCloud() {
      if (typeof unsubscribeRoom === 'function') {
        unsubscribeRoom();
        unsubscribeRoom = null;
      }

      var ref = getRoomDocRef(state.roomCode);
      if (!ref) {
        state.syncStatus = 'Solo locale';
        return;
      }

      try {
        var snap = await getDoc(ref);
        if (snap.exists()) {
          applyCloudRoomData(snap.data() || {});
        } else {
          await setDoc(ref, {
            roomCode: state.roomCode,
            masterName: state.masterName || 'Master',
            players: state.players,
            roleCounts: state.roleCounts,
            masterChat: state.masterChat,
            traitorChat: state.traitorChat,
            updatedAt: Date.now()
          }, { merge: true });
        }
      } catch (err) {
        console.error('Errore lettura iniziale stanza Firestore:', err);
      }

      unsubscribeRoom = onSnapshot(ref, function (snap) {
        state.syncStatus = 'Cloud Firestore attivo';
        if (!snap.exists()) {
          render();
          return;
        }
        applyCloudRoomData(snap.data() || {});
        render();
      }, function (err) {
        console.error('Errore listener stanza Firestore:', err);
        state.syncStatus = 'Locale (permessi Firestore)';
        render();
      });
    }

    function applyCloudRoomData(data) {
      if (!data || typeof data !== 'object') return;
      if (data.masterName && (!state.masterName || state.masterName === 'Master')) {
        state.masterName = String(data.masterName);
      }

      if (Array.isArray(data.players)) {
        var cloudPlayers = normalizePlayerList(data.players);
        // Unisce eventuali ruoli già assegnati localmente se il cloud non li ha ancora
        var prevByName = {};
        state.players.forEach(function (p) {
          prevByName[p.name.toLowerCase()] = p;
        });
        state.players = cloudPlayers.map(function (cp) {
          var prev = prevByName[cp.name.toLowerCase()];
          return {
            id: cp.id,
            name: cp.name,
            boardUnlocked: Boolean(cp.boardUnlocked || (prev && prev.boardUnlocked)),
            assignedRoleKey: cp.assignedRoleKey || (prev ? prev.assignedRoleKey : null)
          };
        });
        var anyAssigned = state.players.some(function (p) { return Boolean(p.assignedRoleKey); });
        if (anyAssigned) {
          state.assignmentCompleted = true;
        }
      }

      if (Array.isArray(data.masterChat)) {
        state.masterChat = data.masterChat;
      }
      if (Array.isArray(data.traitorChat)) {
        state.traitorChat = data.traitorChat;
      }

      persistLocal();
    }

    function setBanner(text, type) {
      state.banner = { text: text, type: type || 'info' };
      persistLocal();
      render();
    }

    function getParagraphs() {
      var room = state.roomCode || 'TAVOLO1';
      var custom = String(state.customSpeechText || '').trim();
      if (custom) {
        return custom
          .split(/\r?\n\s*\r?\n/)
          .map(function (part) { return part.replace(/\{\{STANZA\}\}/gi, room).trim(); })
          .filter(Boolean);
      }
      var list = SPEECH_TEMPLATES[state.speechTone] || SPEECH_TEMPLATES.suspense;
      return list.map(function (line) { return line.replace(/\{\{STANZA\}\}/gi, room); });
    }

    window.masterSetTone = function (tone) {
      if (!SPEECH_TEMPLATES[tone]) return;
      state.speechTone = tone;
      state.customSpeechText = '';
      state.activeParagraphIndex = 0;
      persistLocal();
      render();
    };

    window.masterSetCustomSpeech = function (val) {
      state.customSpeechText = String(val || '');
      state.activeParagraphIndex = 0;
      persistLocal();
      render();
    };

    window.masterSelectParagraph = function (idx) {
      var list = getParagraphs();
      if (!list.length) return;
      state.activeParagraphIndex = Math.max(0, Math.min(list.length - 1, Number(idx || 0)));
      persistLocal();
      render();
    };

    window.masterCopySpeech = function () {
      var text = getParagraphs().join('\n\n');
      if (!text) {
        setBanner('Nessun testo del discorso da copiare.', 'error');
        return;
      }
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        setBanner('Discorso di assegnazione ruoli copiato negli appunti.', 'success');
      } catch (_e) {
        setBanner('Impossibile copiare il testo in questo browser.', 'error');
      }
    };

    window.masterAdjustRole = async function (roleKey, delta) {
      if (!ROLE_CATALOG[roleKey]) return;
      var cur = Number(state.roleCounts[roleKey] || 0);
      state.roleCounts[roleKey] = Math.max(0, Math.min(12, cur + delta));
      state.banner = null;
      await syncRoomToCloud();
      render();
    };

    window.masterAddPlayer = async function (name) {
      var clean = String(name || '').trim();
      if (!clean) {
        setBanner('Inserisci un nome valido per aggiungere un giocatore.', 'error');
        return;
      }
      var existingIdx = state.players.findIndex(function (p) {
        return p.name.toLowerCase() === clean.toLowerCase();
      });
      if (existingIdx !== -1) {
        setBanner('Il giocatore "' + state.players[existingIdx].name + '" è già al tavolo.', 'info');
        return;
      }
      state.players.push({
        id: 'mp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        name: clean,
        boardUnlocked: false,
        assignedRoleKey: null
      });
      state.assignmentCompleted = false;
      state.banner = null;
      await syncRoomToCloud();
      render();
    };

    window.masterRemovePlayer = async function (playerId) {
      state.players = state.players.filter(function (p) { return p.id !== playerId; });
      state.banner = null;
      await syncRoomToCloud();
      render();
    };

    window.masterAssignRoles = async function () {
      if (!state.players.length) {
        setBanner('Aggiungi almeno un giocatore al tavolo prima di assegnare i ruoli.', 'error');
        return;
      }
      var pool = [];
      Object.keys(ROLE_CATALOG).forEach(function (k) {
        var cnt = Number(state.roleCounts[k] || 0);
        for (var i = 0; i < cnt; i++) {
          pool.push(k);
        }
      });
      if (pool.length < state.players.length) {
        setBanner(
          'Hai configurato ' + pool.length + ' ruoli per ' + state.players.length + ' giocatori: aumenta la quantità di uno o più ruoli.',
          'error'
        );
        return;
      }
      for (var i = pool.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = pool[i];
        pool[i] = pool[j];
        pool[j] = tmp;
      }
      var chosen = pool.slice(0, state.players.length);
      state.players = state.players.map(function (p, idx) {
        return {
          id: p.id,
          name: p.name,
          boardUnlocked: true,
          assignedRoleKey: chosen[idx]
        };
      });
      state.assignmentCompleted = true;
      state.banner = {
        text: 'Assegnati casualmente ' + chosen.length + ' ruoli e sincronizzati sulla stanza ' + state.roomCode + '.',
        type: 'success'
      };
      await syncRoomToCloud({ assignmentCompleted: true });
      render();
    };

    window.masterResetRoles = async function () {
      state.players = state.players.map(function (p) {
        return {
          id: p.id,
          name: p.name,
          boardUnlocked: false,
          assignedRoleKey: null
        };
      });
      state.assignmentCompleted = false;
      state.boardOpened = false;
      state.banner = {
        text: 'Ruoli assegnati azzerati: i giocatori restano al tavolo.',
        type: 'info'
      };
      await syncRoomToCloud({ assignmentCompleted: false });
      render();
    };

    window.masterOpenBoard = async function () {
      if (!state.assignmentCompleted) {
        setBanner('Assegna prima i ruoli ai giocatori al tavolo per aprire la Plancia Master.', 'error');
        return;
      }
      state.boardOpened = true;
      state.banner = {
        text: 'Plancia Master aperta. Puoi tornare a Cerimonia e Ruoli dal pulsante in alto.',
        type: 'success'
      };
      await syncRoomToCloud();
      render();
    };

    window.masterOpenCeremony = function () {
      state.boardOpened = false;
      state.banner = null;
      persistLocal();
      render();
    };

    window.masterGoTo = function (page) {
      window.location.href = page;
    };

    window.masterSetChatTab = function (tab) {
      state.chatTab = tab === 'traitors' ? 'traitors' : 'master';
      render();
    };

    window.masterSetPlayerFilter = function (val) {
      state.playerFilter = val || 'ALL';
      render();
    };

    window.masterUpdateChatDraft = function (val) {
      chatDraft = String(val || '');
    };

    window.masterSendChat = async function () {
      var inp = document.getElementById('master-chat-input');
      var txt = String((inp ? inp.value : chatDraft) || '').trim();
      if (!txt) return;

      var isTraitor = state.chatTab === 'traitors';
      var target = isTraitor ? null : (state.playerFilter !== 'ALL' ? state.playerFilter : null);
      var msg = {
        id: 'm_' + Date.now(),
        fromMaster: true,
        senderName: state.masterName || 'Master',
        playerName: target,
        text: txt,
        createdAt: Date.now()
      };

      if (isTraitor) {
        state.traitorChat = state.traitorChat.concat([msg]).slice(-100);
      } else {
        state.masterChat = state.masterChat.concat([msg]).slice(-150);
      }

      chatDraft = '';
      if (inp) inp.value = '';
      await syncRoomToCloud();
      render();
    };

    function formatClock(ts) {
      try {
        if (!ts) return '';
        return new Date(ts).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
      } catch (_e) {
        return '';
      }
    }

    function renderChatSection() {
      var isTraitor = state.chatTab === 'traitors';
      var list = isTraitor
        ? state.traitorChat
        : state.masterChat.filter(function (m) {
            if (state.playerFilter === 'ALL') return true;
            return String(m.playerName || '').toLowerCase() === String(state.playerFilter).toLowerCase();
          });

      var msgsHtml = list.length
        ? list.map(function (m) {
            var label = m.fromMaster
              ? (escapeHtml(m.senderName || 'Master') + (m.playerName ? ' -> ' + escapeHtml(m.playerName) : ' (Tutti)'))
              : escapeHtml(m.senderName || 'Giocatore');
            return (
              '<div class="msg-card ' + (m.fromMaster ? 'from-master' : '') + '">' +
                '<div class="msg-head">' +
                  '<span class="msg-sender">' + label + '</span>' +
                  '<span>' + escapeHtml(formatClock(m.createdAt)) + '</span>' +
                '</div>' +
                '<p class="msg-body">' + escapeHtml(m.text) + '</p>' +
              '</div>'
            );
          }).join('')
        : '<p class="subtext">Nessun messaggio in questo canale.</p>';

      var optionsHtml = state.players.map(function (p) {
        var sel = String(state.playerFilter).toLowerCase() === String(p.name).toLowerCase() ? ' selected' : '';
        return '<option value="' + escapeHtml(p.name) + '"' + sel + '>' + escapeHtml(p.name) + '</option>';
      }).join('');

      return (
        '<section class="card">' +
          '<div class="section-head">' +
            '<div>' +
              '<span class="eyebrow">Console Comunicazioni Master</span>' +
              '<h2>' + (isTraitor ? 'Osservatorio Chat Traditori' : 'Chat Diretta con i Giocatori') + '</h2>' +
            '</div>' +
            '<div class="btn-row">' +
              '<button type="button" class="' + (!isTraitor ? 'btn-gold' : 'btn-ghost') + '" onclick="masterSetChatTab(\'master\')">Chat Diretta Giocatori</button>' +
              '<button type="button" class="' + (isTraitor ? 'btn-crimson' : 'btn-ghost') + '" onclick="masterSetChatTab(\'traitors\')">Chat Traditori</button>' +
            '</div>' +
          '</div>' +
          (!isTraitor
            ? '<div style="max-width:340px;margin-bottom:10px;">' +
                '<label for="master-filter-sel">Destinatario / Filtro</label>' +
                '<select id="master-filter-sel" onchange="masterSetPlayerFilter(this.value)">' +
                  '<option value="ALL"' + (state.playerFilter === 'ALL' ? ' selected' : '') + '>Tutti i giocatori</option>' +
                  optionsHtml +
                '</select>' +
              '</div>'
            : '') +
          '<div class="chat-box">' + msgsHtml + '</div>' +
          '<div class="chat-form">' +
            '<input id="master-chat-input" type="text" value="' + escapeHtml(chatDraft) + '" oninput="masterUpdateChatDraft(this.value)" onkeydown="if(event.key===\'Enter\'){event.preventDefault();masterSendChat();}" placeholder="' + (isTraitor ? 'Scrivi nella chat dei Traditori...' : 'Scrivi ai giocatori...') + '" />' +
            '<button type="button" class="btn-gold" onclick="masterSendChat()">Invia</button>' +
          '</div>' +
        '</section>'
      );
    }

    function render() {
      var root = document.getElementById('master-roles-app');
      if (!root) return;

      var totalRoles = Object.keys(ROLE_CATALOG).reduce(function (acc, k) {
        return acc + Number(state.roleCounts[k] || 0);
      }, 0);

      var paragraphs = getParagraphs();
      var activeIdx = paragraphs.length ? Math.min(state.activeParagraphIndex, paragraphs.length - 1) : 0;
      var syncId = 'SYNC-' + state.roomCode;

      var bannerHtml = state.banner
        ? '<div class="banner banner-' + state.banner.type + '">' + escapeHtml(state.banner.text) + '</div>'
        : '';

      if (state.boardOpened) {
        var boardCards = state.players.length
          ? state.players.map(function (p) {
              var r = p.assignedRoleKey ? ROLE_CATALOG[p.assignedRoleKey] : null;
              return (
                '<div class="board-card">' +
                  '<div>' +
                    '<div class="player-name">' + escapeHtml(p.name) + '</div>' +
                    '<div class="player-sub">' + (p.boardUnlocked ? 'Plancia attiva' : 'In attesa sulla stanza') + '</div>' +
                  '</div>' +
                  (r
                    ? '<span class="badge badge-' + r.faction + '">' + escapeHtml(r.name) + ' · ' + escapeHtml(r.faction) + '</span>'
                    : '<span class="player-sub">Nessun ruolo</span>') +
                '</div>'
              );
            }).join('')
          : '<p class="subtext">Nessun giocatore collegato a questa stanza.</p>';

        root.innerHTML =
          '<header class="card header-row">' +
            '<div>' +
              '<span class="eyebrow">Plancia Master · ' + escapeHtml(state.syncStatus) + '</span>' +
              '<h1>Tavolo di ' + escapeHtml(state.roomCode) + '</h1>' +
              '<p class="subtext">Master: <strong>' + escapeHtml(state.masterName) + '</strong> · ID Sync: <strong class="mono">' + escapeHtml(syncId) + '</strong></p>' +
            '</div>' +
            '<div class="btn-row">' +
              '<button type="button" class="btn-gold" onclick="masterOpenCeremony()">Cerimonia e Ruoli</button>' +
              '<button type="button" class="btn-ghost" onclick="masterGoTo(\'ruoli.html\')">Tutti i Ruoli</button>' +
              '<button type="button" class="btn-ghost" onclick="masterGoTo(\'index.html\')">Torna ad Accesso</button>' +
            '</div>' +
          '</header>' +
          bannerHtml +
          '<section class="card">' +
            '<div class="section-head">' +
              '<h2>Riepilogo Giocatori e Ruoli al Tavolo (' + state.players.length + ')</h2>' +
              '<span class="mono">Sessione Attiva</span>' +
            '</div>' +
            '<div class="board-grid">' + boardCards + '</div>' +
          '</section>' +
          renderChatSection();
        return;
      }

      var speechItemsHtml = paragraphs.length
        ? paragraphs.map(function (line, idx) {
            var active = idx === activeIdx;
            return (
              '<div class="speech-item ' + (active ? 'active' : '') + '" onclick="masterSelectParagraph(' + idx + ')">' +
                '<div class="speech-meta">' +
                  '<span style="color:' + (active ? 'var(--gold)' : 'var(--muted)') + ';">Parte ' + (idx + 1) + ' di ' + paragraphs.length + '</span>' +
                  (active ? '<span class="pill-gold">In lettura</span>' : '') +
                '</div>' +
                '<p class="speech-text">' + escapeHtml(line) + '</p>' +
              '</div>'
            );
          }).join('')
        : '<div class="speech-item"><p class="subtext">Nessun paragrafo disponibile. Scrivi un testo qui sotto oppure scegli un tono.</p></div>';

      var roleCardsHtml = Object.keys(ROLE_CATALOG).map(function (k) {
        var role = ROLE_CATALOG[k];
        var cnt = Number(state.roleCounts[k] || 0);
        return (
          '<div class="role-box">' +
            '<div>' +
              '<div class="role-top">' +
                '<span class="role-name">' + escapeHtml(role.name) + '</span>' +
                '<span class="badge badge-' + role.faction + '">' + escapeHtml(role.faction) + '</span>' +
              '</div>' +
              '<p class="role-summary">' + escapeHtml(role.summary) + '</p>' +
            '</div>' +
            '<div class="role-counter">' +
              '<span>Copie:</span>' +
              '<div class="counter-btns">' +
                '<button type="button" class="btn-step" onclick="masterAdjustRole(\'' + k + '\', -1)">-</button>' +
                '<span class="count-val">' + cnt + '</span>' +
                '<button type="button" class="btn-step" onclick="masterAdjustRole(\'' + k + '\', 1)">+</button>' +
              '</div>' +
            '</div>' +
          '</div>'
        );
      }).join('');

      var playersHtml = state.players.length
        ? state.players.map(function (p) {
            var role = p.assignedRoleKey ? ROLE_CATALOG[p.assignedRoleKey] : null;
            return (
              '<div class="player-row">' +
                '<div>' +
                  '<div class="player-name">' + escapeHtml(p.name) + '</div>' +
                  '<div class="player-sub">' +
                    (role
                      ? '<span class="badge badge-' + role.faction + '">' + escapeHtml(role.name) + ' (' + escapeHtml(role.faction) + ')</span>'
                      : 'In attesa di assegnazione ruolo') +
                  '</div>' +
                '</div>' +
                '<button type="button" class="btn-small btn-remove" onclick="masterRemovePlayer(\'' + escapeHtml(p.id) + '\')">Rimuovi</button>' +
              '</div>'
            );
          }).join('')
        : '<p class="subtext">Nessun giocatore ancora al tavolo. I giocatori che entrano nella stanza compaiono qui in automatico oppure puoi aggiungerli a mano.</p>';

      root.innerHTML =
        '<header class="card header-row">' +
          '<div>' +
            '<span class="eyebrow">Pagina Master · ' + escapeHtml(state.syncStatus) + '</span>' +
            '<h1>Cerimonia di Assegnazione Ruoli</h1>' +
            '<p class="subtext">Master: <strong>' + escapeHtml(state.masterName) + '</strong> · Stanza: <strong>' + escapeHtml(state.roomCode) + '</strong> · ID Sync: <strong class="mono">' + escapeHtml(syncId) + '</strong></p>' +
          '</div>' +
          '<div class="btn-row">' +
            '<button type="button" class="btn-emerald" onclick="masterOpenBoard()">Vai alla Plancia Master</button>' +
            '<button type="button" class="btn-ghost" onclick="masterGoTo(\'ruoli.html\')">Tutti i Ruoli</button>' +
            '<button type="button" class="btn-ghost" onclick="masterGoTo(\'index.html\')">Torna ad Accesso</button>' +
            '<button type="button" class="btn-gold" onclick="masterAssignRoles()">Assegna Ruoli Casualmente</button>' +
            '<button type="button" class="btn-ghost" onclick="masterResetRoles()">Azzera Ruoli</button>' +
          '</div>' +
        '</header>' +
        bannerHtml +
        '<section class="card card-gold">' +
          '<div class="section-head">' +
            '<div>' +
              '<span class="eyebrow">Prompter del Master</span>' +
              '<h2>Discorso di Assegnazione Ruoli</h2>' +
            '</div>' +
            '<div class="btn-row">' +
              '<button type="button" class="' + (!state.customSpeechText && state.speechTone === 'suspense' ? 'btn-gold' : 'btn-ghost') + '" onclick="masterSetTone(\'suspense\')">Suspense</button>' +
              '<button type="button" class="' + (!state.customSpeechText && state.speechTone === 'solenne' ? 'btn-gold' : 'btn-ghost') + '" onclick="masterSetTone(\'solenne\')">Solenne</button>' +
              '<button type="button" class="' + (!state.customSpeechText && state.speechTone === 'rapido' ? 'btn-gold' : 'btn-ghost') + '" onclick="masterSetTone(\'rapido\')">Rapido</button>' +
              '<button type="button" class="btn-ghost" onclick="masterCopySpeech()">Copia Discorso</button>' +
            '</div>' +
          '</div>' +
          '<div class="speech-list">' + speechItemsHtml + '</div>' +
          '<div class="speech-controls">' +
            '<div class="btn-row">' +
              '<button type="button" class="btn-ghost" onclick="masterSelectParagraph(' + (activeIdx - 1) + ')"' + (activeIdx <= 0 ? ' disabled' : '') + '>Parte Precedente</button>' +
              '<button type="button" class="btn-indigo" onclick="masterSelectParagraph(' + (activeIdx + 1) + ')"' + (activeIdx >= paragraphs.length - 1 ? ' disabled' : '') + '>Parte Successiva</button>' +
            '</div>' +
            '<span class="subtext">Usa <code>{{STANZA}}</code> nel testo libero per inserire il codice stanza.</span>' +
          '</div>' +
          '<div class="custom-speech-box">' +
            '<label for="master-custom-speech">Discorso personalizzato del Master (separa i paragrafi con una riga vuota)</label>' +
            '<textarea id="master-custom-speech" rows="3" oninput="masterSetCustomSpeech(this.value)" placeholder="Scrivi qui il tuo discorso per la stanza {{STANZA}}...">' + escapeHtml(state.customSpeechText) + '</textarea>' +
          '</div>' +
        '</section>' +
        '<div class="two-col">' +
          '<section class="card">' +
            '<div class="section-head">' +
              '<h2>1. Configurazione Ruoli</h2>' +
              '<span class="subtext">Totale ruoli: <strong style="color:var(--gold);">' + totalRoles + '</strong></span>' +
            '</div>' +
            '<div class="roles-grid">' + roleCardsHtml + '</div>' +
          '</section>' +
          '<section class="card">' +
            '<div class="section-head">' +
              '<h2>2. Giocatori e Ruoli Assegnati (' + state.players.length + ')</h2>' +
            '</div>' +
            '<form class="add-form" onsubmit="event.preventDefault(); var inp = document.getElementById(\'master-player-input\'); masterAddPlayer(inp.value); inp.value = \'\';">' +
              '<input id="master-player-input" type="text" maxlength="24" placeholder="Nome giocatore al tavolo..." />' +
              '<button type="submit" class="btn-indigo">Aggiungi</button>' +
            '</form>' +
            '<div class="player-list">' + playersHtml + '</div>' +
          '</section>' +
        '</div>' +
        '<div class="footer-action">' +
          '<button type="button" class="btn-emerald-lg" onclick="masterOpenBoard()">Completa e Vai alla Plancia Master</button>' +
        '</div>';
    }

    render();
    subscribeToRoomCloud();
  </script>



<script>
(function () {
  var ROOM_PREFIX = 'ombre_stanza_sync_';
  var ACCESS_KEY = 'ombre_accesso_tavolo_v1';

  var ROLE_FACTION = {
    assassino: 'Traditori',
    sabotatore: 'Traditori',
    traditore_segreto: 'Traditori',
    investigatore: 'Fedeli',
    guardia: 'Fedeli',
    martire: 'Fedeli',
    mediatore: 'Fedeli',
    cacciatore: 'Neutro'
  };

  var DEFAULT_MISSIONS = [
    { id: 'TR-01', faction: 'Traditori', title: 'Sussurro Avvelenato', repeatable: true, type: 'Contatto', active: true, points: 1, desc: 'Chiedi in prestito un oggetto a un giocatore non Traditore e restituiscilo con una frase ambigua.' },

    { id: 'FD-01', faction: 'Fedeli', title: 'Testimonianza Chiara', repeatable: true, type: 'Verbale', active: true, points: 1, desc: 'Riassumi in modo accurato quanto detto da due giocatori durante il confronto.' },
    { id: 'FD-02', faction: 'Fedeli', title: 'Appello alla Luce', repeatable: true, type: 'Verbale', active: true, points: 1, desc: 'Invita apertamente un altro giocatore a esporre il proprio ragionamento.' },
    { id: 'FD-03', faction: 'Fedeli', title: 'Concordia del Tavolo', repeatable: true, type: 'Verbale', active: true, points: 1, desc: 'Fai convergere almeno due giocatori su un punto d’analisi comune.' },

    { id: 'FD-06', faction: 'Fedeli', title: 'Voto Ragionato', repeatable: false, type: 'Verbale', active: true, points: 1, desc: 'Spiega pubblicamente il motivo del tuo voto prima del conteggio.' },
    { id: 'FD-07', faction: 'Fedeli', title: 'Stretta di Fiducia', repeatable: true, type: 'Contatto', active: true, points: 1, desc: 'Stringi la mano o scambia un cenno d’intesa con un altro giocatore per avviare un confronto.' },
    { id: 'FD-08', faction: 'Fedeli', title: 'Passaggio di Carte', repeatable: false, type: 'Contatto', active: true, points: 1, desc: 'Consegna un appunto o promemoria a un alleato durante il turno.' },
    { id: 'NT-01', faction: 'Neutro', title: 'Sonda d’Identità', repeatable: true, type: 'Indagine', active: true, points: 1, desc: 'Raccogli un indizio diretto sul comportamento di un giocatore.' },
    { id: 'NT-02', faction: 'Neutro', title: 'Osservatore Silente', repeatable: true, type: 'Indagine', active: true, points: 1, desc: 'Annota a chi si rivolge più spesso un giocatore sospetto.' },
    { id: 'NT-03', faction: 'Neutro', title: 'Incrocio di Sospetti', repeatable: true, type: 'Indagine', active: true, points: 1, desc: 'Osserva la reazione di due giocatori quando viene nominato un terzo partecipante.' },
    { id: 'NT-04', faction: 'Neutro', title: 'Traccia del Cacciatore', repeatable: false, type: 'Indagine', active: true, points: 1, desc: 'Collega almeno due indizi raccolti su giocatori distinti.' },
    { id: 'NT-05', faction: 'Neutro', title: 'Prova del Fuoco', repeatable: false, type: 'Indagine', active: true, points: 1, desc: 'Metti alla prova la coerenza di un giocatore sul turno precedente.' },
    { id: 'NT-06', faction: 'Neutro', title: 'Colloquio Riservato', repeatable: true, type: 'Contatto', active: true, points: 1, desc: 'Scambia una breve osservazione a quattr’occhi con un giocatore prima della votazione.' },
    { id: 'NT-07', faction: 'Neutro', title: 'Scambio di Sguardi', repeatable: false, type: 'Contatto', active: true, points: 1, desc: 'Cogli la reazione visiva di un giocatore dopo avergli rivolto una domanda mirata.' }
  ];

  var activeCatalog = DEFAULT_MISSIONS.slice();

  function getRoomCode() {
    try {
      var raw = localStorage.getItem(ACCESS_KEY);
      if (raw) {
        var p = JSON.parse(raw);
        if (p && p.roomCode) return String(p.roomCode).trim().toUpperCase();
      }
    } catch (_e) {}
    return 'TAVOLO1';
  }

  function loadRoomData(code) {
    try {
      var raw = localStorage.getItem(ROOM_PREFIX + code);
      return raw ? JSON.parse(raw) : { roomCode: code, players: [], missionAssignments: {}, playerPoints: {} };
    } catch (_e) {
      return { roomCode: code, players: [], missionAssignments: {}, playerPoints: {} };
    }
  }

  function saveRoomData(code, data) {
    data.updatedAt = Date.now();
    try {
      localStorage.setItem(ROOM_PREFIX + code, JSON.stringify(data));
    } catch (_e) {}
  }

  function shuffleArr(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  // Estrae 5 missioni rispettando:
  // - 3 ripetibili (e 2 non ripetibili, con fallback se il catalogo è ridotto)
  // - 3 del tipo principale della fazione e 2 di altro tipo, con fallback pulito
  function drawFiveBalancedMissions(faction) {
    var pool = activeCatalog.filter(function (m) {
      return m.active !== false && String(m.faction) === faction;
    });
    if (!pool.length) {
      pool = DEFAULT_MISSIONS.filter(function (m) { return m.faction === faction; });
    }

    var repPool = shuffleArr(pool.filter(function (m) { return Boolean(m.repeatable); }));
    var nonRepPool = shuffleArr(pool.filter(function (m) { return !m.repeatable; }));

    var primaryType = faction === 'Traditori' ? 'Contatto' : (faction === 'Neutro' ? 'Indagine' : 'Verbale');
    var primPool = shuffleArr(pool.filter(function (m) { return m.type === primaryType; }));
    var secPool = shuffleArr(pool.filter(function (m) { return m.type !== primaryType; }));

    var selected = [];
    var usedIds = {};

    function addMission(m) {
      if (!m || selected.length >= 5) return;
      if (usedIds[m.id] && selected.length < pool.length) return;
      usedIds[m.id] = true;
      selected.push({
        slot: selected.length + 1,
        id: m.id,
        title: m.title,
        faction: faction,
        type: m.type,
        repeatable: Boolean(m.repeatable),
        points: Number(m.points || 1),
        desc: m.desc,
        playerClaimedDone: false,
        masterApproved: false
      });
    }

    // 1) Priorità: 3 ripetibili e 2 non ripetibili
    for (var r = 0; r < Math.min(3, repPool.length); r++) addMission(repPool[r]);
    for (var nr = 0; nr < Math.min(2, nonRepPool.length); nr++) addMission(nonRepPool[nr]);

    // 2) Bilanciamento tipo (3 principali / 2 altri) se non ancora completati i 5 slot
    for (var p = 0; p < primPool.length && selected.length < 5; p++) addMission(primPool[p]);
    for (var s = 0; s < secPool.length && selected.length < 5; s++) addMission(secPool[s]);

    // 3) Riempimento finale da tutto il pool disponibile
    var allShuffled = shuffleArr(pool);
    var idx = 0;
    while (selected.length < 5 && allShuffled.length > 0) {
      var cand = allShuffled[idx % allShuffled.length];
      selected.push({
        slot: selected.length + 1,
        id: cand.id,
        title: cand.title,
        faction: faction,
        type: cand.type,
        repeatable: Boolean(cand.repeatable),
        points: Number(cand.points || 1),
        desc: cand.desc,
        playerClaimedDone: false,
        masterApproved: false
      });
      idx++;
    }

    return selected.slice(0, 5).map(function (item, i) {
      item.slot = i + 1;
      return item;
    });
  }

  window.masterLoadCatalogJsonFile = function (inputEl) {
    var file = inputEl && inputEl.files && inputEl.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      try {
        var parsed = JSON.parse(String(ev.target.result || '[]'));
        if (Array.isArray(parsed) && parsed.length > 0) {
          activeCatalog = parsed;
          var code = getRoomCode();
          var data = loadRoomData(code);
          data.customMissionCatalog = activeCatalog;
          saveRoomData(code, data);
          renderMasterPlayerInspector();
        }
      } catch (_err) {}
    };
    reader.readAsText(file);
  };

  window.masterAssignPlayerMissions = function (playerName, roleKey) {
    var code = getRoomCode();
    var data = loadRoomData(code);
    var faction = ROLE_FACTION[roleKey] || 'Fedeli';
    var key = String(playerName || '').trim().toLowerCase();
    if (!key) return;
    data.missionAssignments = data.missionAssignments || {};
    data.missionAssignments[key] = drawFiveBalancedMissions(faction);
    saveRoomData(code, data);
    renderMasterPlayerInspector();
  };

  window.masterAssignAllPlayersMissions = function () {
    var code = getRoomCode();
    var data = loadRoomData(code);
    var players = Array.isArray(data.players) ? data.players : [];
    data.missionAssignments = data.missionAssignments || {};
    players.forEach(function (p) {
      var key = String(p.name || '').trim().toLowerCase();
      if (!key) return;
      var fac = ROLE_FACTION[p.assignedRoleKey] || 'Fedeli';
      data.missionAssignments[key] = drawFiveBalancedMissions(fac);
    });
    saveRoomData(code, data);
    renderMasterPlayerInspector();
  };

  window.masterApproveMission = function (playerName, slotIdx, roleKey) {
    var code = getRoomCode();
    var data = loadRoomData(code);
    var key = String(playerName || '').trim().toLowerCase();
    var fac = ROLE_FACTION[roleKey] || 'Fedeli';
    data.missionAssignments = data.missionAssignments || {};
    var list = Array.isArray(data.missionAssignments[key]) && data.missionAssignments[key].length
      ? data.missionAssignments[key]
      : drawFiveBalancedMissions(fac);
    if (list[slotIdx]) {
      var nextApproved = !list[slotIdx].masterApproved;
      list[slotIdx].masterApproved = nextApproved;
      var ptVal = Number(list[slotIdx].points || 1);
      data.playerPoints = data.playerPoints || {};
      var curPts = Number(data.playerPoints[key] || 0);
      data.playerPoints[key] = Math.max(0, curPts + (nextApproved ? ptVal : -ptVal));
    }
    data.missionAssignments[key] = list;
    saveRoomData(code, data);
    renderMasterPlayerInspector();
  };

  window.masterAdjustPoints = function (playerName, delta) {
    var code = getRoomCode();
    var data = loadRoomData(code);
    var key = String(playerName || '').trim().toLowerCase();
    if (!key) return;
    data.playerPoints = data.playerPoints || {};
    var cur = Number(data.playerPoints[key] || 0);
    data.playerPoints[key] = Math.max(0, cur + Number(delta || 0));
    saveRoomData(code, data);
    renderMasterPlayerInspector();
  };

  var selectedMasterPlayerKey = null;

  window.selectMasterPlayerCard = function (playerName) {
    var key = String(playerName || '').trim().toLowerCase();
    selectedMasterPlayerKey = selectedMasterPlayerKey === key ? null : key;
    renderMasterPlayerInspector();
  };

  function renderMasterPlayerInspector() {
    var host = document.getElementById('master-player-missions-inspector');
    if (!host) return;
    var code = getRoomCode();
    var data = loadRoomData(code);
    if (Array.isArray(data.customMissionCatalog) && data.customMissionCatalog.length) {
      activeCatalog = data.customMissionCatalog;
    }
    var players = Array.isArray(data.players) ? data.players : [];
    data.missionAssignments = data.missionAssignments || {};
    data.playerPoints = data.playerPoints || {};

    if (!players.length) {
      host.innerHTML = '<div style="padding:14px;border:1px solid rgba(255,255,255,0.12);border-radius:12px;background:#151924;color:#9ca3af;font-size:13px;">Nessun giocatore collegato nella stanza ' + code + '.</div>';
      return;
    }

    var cards = players.map(function (p) {
      var pKey = String(p.name || '').trim().toLowerCase();
      var rKey = p.assignedRoleKey || 'investigatore';
      var fac = ROLE_FACTION[rKey] || 'Fedeli';
      var pts = Number(data.playerPoints[pKey] || 0);
      var missions = Array.isArray(data.missionAssignments[pKey]) && data.missionAssignments[pKey].length
        ? data.missionAssignments[pKey]
        : drawFiveBalancedMissions(fac);
      var claimedCount = missions.filter(function (x) { return Boolean(x.playerClaimedDone); }).length;
      var isOpen = selectedMasterPlayerKey === pKey;

      var mHtml = missions.map(function (m, idx) {
        var claimedBadge = m.playerClaimedDone
          ? '<span style="font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(229,184,92,0.2);color:#e5b85c;font-weight:700;">Segnalata dal giocatore</span>'
          : '<span style="font-size:11px;color:#9ca3af;">In attesa</span>';
        return '<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:8px;background:#0c0e14;border:1px solid rgba(255,255,255,0.1);">' +
          '<div style="font-size:12px;color:#e5e7eb;max-width:72%;">' +
            '<strong>' + m.slot + '. ' + m.title + '</strong> <span style="color:#9ca3af;">(' + m.type + ' · ' + (m.repeatable ? 'Ripetibile' : 'Singola') + ' · +' + (m.points || 1) + ' pt)</span> ' + claimedBadge +
            '<div style="color:#9ca3af;margin-top:2px;">' + m.desc + '</div>' +
          '</div>' +
          '<button type="button" onclick="event.stopPropagation();masterApproveMission(\'' + p.name.replace(/'/g, "\\'") + '\',' + idx + ',\'' + rKey + '\')" style="padding:6px 11px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:11px;background:' + (m.masterApproved ? '#3ec98c' : '#e5b85c') + ';color:#0c0e14;">' + (m.masterApproved ? 'Assegnata ✓' : 'Conferma & +Pt') + '</button>' +
        '</div>';
      }).join('');

      return '<div style="border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:14px;background:#151924;display:flex;flex-direction:column;gap:10px;">' +
        '<div onclick="selectMasterPlayerCard(\'' + p.name.replace(/'/g, "\\'") + '\')" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;">' +
          '<div>' +
            '<div style="font-size:15px;font-weight:800;color:#fff;">' + p.name + ' <span style="font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(229,184,92,0.15);color:#e5b85c;">' + rKey + ' · ' + fac + '</span>' + (claimedCount > 0 ? ' <span style="font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(62,201,140,0.2);color:#3ec98c;">' + claimedCount + ' segnalate</span>' : '') + '</div>' +
            '<div style="font-size:12px;color:#9ca3af;margin-top:2px;">Punti totali: <strong style="color:#3ec98c;">' + pts + '</strong> · Premi sulla scheda per aprire/chiudere le 5 missioni</div>' +
          '</div>' +
          '<div style="display:flex;gap:6px;" onclick="event.stopPropagation();">' +
            '<button type="button" onclick="masterAdjustPoints(\'' + p.name.replace(/'/g, "\\'") + '\', -1)" style="padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:#1d2230;color:#fff;cursor:pointer;font-weight:700;">-1 Pt</button>' +
            '<button type="button" onclick="masterAdjustPoints(\'' + p.name.replace(/'/g, "\\'") + '\', 1)" style="padding:6px 10px;border-radius:8px;border:none;background:#3ec98c;color:#0c0e14;cursor:pointer;font-weight:700;">+1 Pt</button>' +
            '<button type="button" onclick="masterAssignPlayerMissions(\'' + p.name.replace(/'/g, "\\'") + '\',\'' + rKey + '\')" style="padding:6px 10px;border-radius:8px;border:none;background:#e5b85c;color:#0c0e14;cursor:pointer;font-weight:700;">Pesca 5 (3 Rip. / 3+2)</button>' +
          '</div>' +
        '</div>' +
        (isOpen ? '<div style="display:flex;flex-direction:column;gap:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.1);">' + mHtml + '</div>' : '') +
      '</div>';
    }).join('');

    host.innerHTML = '<div style="display:flex;flex-direction:column;gap:10px;">' + cards + '</div>';
  }

  document.addEventListener('DOMContentLoaded', function () {
    var box = document.createElement('section');
    box.style.cssText = 'max-width:1120px;margin:20px auto 48px;padding:0 16px;';
    box.innerHTML = '<div style="border:1px solid rgba(229,184,92,0.35);border-radius:16px;padding:18px;background:#10141e;">' +
      '<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;">' +
        '<div>' +
          '<div style="font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#e5b85c;">Catalogo & Distribuzione 5 Missioni</div>' +
          '<h2 style="margin:2px 0 0;font-size:18px;color:#fff;">Schede Giocatori: Missioni, Segnalazioni e Punti</h2>' +
        '</div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">' +
          '<label style="margin:0;padding:7px 11px;border-radius:9px;background:#1d2230;border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:12px;cursor:pointer;">Carica JSON Catalogo <input type="file" accept=".json,application/json" style="display:none;" onchange="masterLoadCatalogJsonFile(this)" /></label>' +
          '<button type="button" onclick="masterAssignAllPlayersMissions()" style="padding:7px 12px;border-radius:9px;border:none;background:#e5b85c;color:#0c0e14;font-weight:700;font-size:12px;cursor:pointer;">Distribuisci a Tutti</button>' +
        '</div>' +
      '</div>' +
      '<div id="master-player-missions-inspector"></div>' +
    '</div>';
    document.body.appendChild(box);
    renderMasterPlayerInspector();
    setInterval(renderMasterPlayerInspector, 2000);
  });
})();
</script>

<script>
(function () {
  var ROOM_PREFIX = 'ombre_stanza_sync_';
  var ACCESS_KEY = 'ombre_accesso_tavolo_v1';

  function getRoomCode() {
    try {
      var raw = localStorage.getItem(ACCESS_KEY);
      if (raw) {
        var p = JSON.parse(raw);
        if (p && p.roomCode) return String(p.roomCode).trim().toUpperCase();
      }
    } catch (_e) {}
    return 'TAVOLO1';
  }

  function loadRoom(code) {
    try {
      var raw = localStorage.getItem(ROOM_PREFIX + code);
      return raw ? JSON.parse(raw) : { roomCode: code, players: [], ovalRoundCount: 0, assassinUsedSinceOval: false, shieldedPlayers: [] };
    } catch (_e) {
      return { roomCode: code, players: [], ovalRoundCount: 0, assassinUsedSinceOval: false, shieldedPlayers: [] };
    }
  }

  function saveRoom(code, data) {
    data.updatedAt = Date.now();
    try {
      localStorage.setItem(ROOM_PREFIX + code, JSON.stringify(data));
    } catch (_e) {}
  }

  window.masterStartOvalRound = function () {
    var code = getRoomCode();
    var data = loadRoom(code);
    data.ovalRoundCount = Number(data.ovalRoundCount || 0) + 1;
    data.assassinUsedSinceOval = false;
    data.masterChat = Array.isArray(data.masterChat) ? data.masterChat : [];
    data.masterChat.push({
      id: 'oval_' + Date.now(),
      fromMaster: true,
      senderName: 'Master',
      playerName: null,
      text: '[TAVOLO OVALE #' + data.ovalRoundCount + '] Giro di confronto avviato: l’abilità dell’Assassino è nuovamente sbloccabile.',
      createdAt: Date.now()
    });
    saveRoom(code, data);
    renderOvalBox();
  };

  function renderOvalBox() {
    var host = document.getElementById('master-oval-table-session');
    if (!host) return;
    var code = getRoomCode();
    var data = loadRoom(code);
    var roundNum = Number(data.ovalRoundCount || 0);
    var unlocked = !data.assassinUsedSinceOval;

    host.innerHTML =
      '<div style="border:1px solid rgba(124,140,255,0.4);border-radius:16px;padding:18px;background:#151924;">' +
        '<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;">' +
          '<div>' +
            '<div style="font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#7c8cff;">Sessione di Confronto</div>' +
            '<h2 style="margin:2px 0 0;font-size:18px;color:#fff;">Tavolo Ovale (Giri completati: ' + roundNum + ')</h2>' +
            '<p style="margin:4px 0 0;font-size:13px;color:#9ca3af;">Stato abilità Assassino: <strong style="color:' + (unlocked ? '#3ec98c' : '#e5b85c') + ';">' + (unlocked ? 'Sbloccata / Riutilizzabile' : 'Bloccata fino al prossimo Tavolo Ovale') + '</strong></p>' +
          '</div>' +
          '<button type="button" onclick="masterStartOvalRound()" style="padding:10px 16px;border-radius:10px;border:none;background:#7c8cff;color:#ffffff;font-weight:700;font-size:12px;cursor:pointer;">Avvia Giro Tavolo Ovale</button>' +
        '</div>' +
      '</div>';
  }

  document.addEventListener('DOMContentLoaded', function () {
    var wrap = document.createElement('section');
    wrap.id = 'master-oval-table-session';
    wrap.style.cssText = 'max-width:1120px;margin:20px auto 0;padding:0 16px;';
    document.body.appendChild(wrap);
    renderOvalBox();
    setInterval(renderOvalBox, 2000);
  });
})();
</script>

      id: 'risveglio',
      step: 4,
      title: 'Risveglio',
      desc: 'Annuncio dell’esito notturno al tavolo (spazio predisposto per video + selfie).'
    },
    {
      id: 'interludio_ludico_2',
      step: 5,
      title: 'Interludio Ludico',
      desc: 'Nuovo giro di gioco, missioni, scambi e confronti tra i partecipanti.'
    },
    {
      id: 'tavolo_ovale',
      step: 6,
      title: 'Tavolo Ovale',
      desc: 'Confronto collettivo, sblocco del limite di utilizzo dell’Assassino per il ciclo e preparazione al voto.'
    },
    {
      id: 'notte_assassinio',
      step: 7,
      title: 'Notte (Assassino)',
      desc: 'Fase notturna del ciclo: l’Assassino può tornare ad agire (poi il ciclo si ripete fino alla conclusione).'
    }
  ];

  function getRoomCode() {
    try {
      var raw = localStorage.getItem(ACCESS_KEY);
      if (raw) {
        var p = JSON.parse(raw);
        if (p && p.roomCode) return String(p.roomCode).trim().toUpperCase();
      }
    } catch (_e) {}
    return 'TAVOLO1';
  }

  function loadRoom(code) {
    try {
      var raw = localStorage.getItem(ROOM_PREFIX + code);
      return raw ? JSON.parse(raw) : {
        roomCode: code,
        players: [],
        phaseIndex: 0,
        cycleCount: 1,
        ovalRoundCount: 0,
        assassinUsedSinceOval: false,
        masterChat: []
      };
    } catch (_e) {
      return {
        roomCode: code,
        players: [],
        phaseIndex: 0,
        cycleCount: 1,
        ovalRoundCount: 0,
        assassinUsedSinceOval: false,
        masterChat: []
      };
    }
  }

  function saveRoom(code, data) {
    data.updatedAt = Date.now();
    try {
      localStorage.setItem(ROOM_PREFIX + code, JSON.stringify(data));
    } catch (_e) {}
  }

  function applyPhaseTransition(code, data, nextIdx) {
    var total = GAME_PHASES.length;
    var prevIdx = Number(data.phaseIndex || 0);
    var cycle = Number(data.cycleCount || 1);

    if (nextIdx >= total) {
      // Dal punto 7 (Notte Assassino) o fine scaletta si ripete il ciclo dalla fase 2 (Interludio Ludico)
      nextIdx = 1;
      cycle += 1;
    } else if (nextIdx < 0) {
      nextIdx = 0;
    } else if (prevIdx === total - 1 && nextIdx === 1) {
      cycle += 1;
    }

    var phaseObj = GAME_PHASES[nextIdx] || GAME_PHASES[0];
    data.phaseIndex = nextIdx;
    data.cycleCount = cycle;
    data.currentPhase = phaseObj.id;
    data.currentPhaseTitle = phaseObj.title;

    if (phaseObj.id === 'tavolo_ovale') {
      data.ovalRoundCount = Number(data.ovalRoundCount || 0) + 1;
      data.assassinUsedSinceOval = false;
    }

    data.masterChat = Array.isArray(data.masterChat) ? data.masterChat : [];
    data.masterChat.push({
      id: 'phase_' + Date.now() + '_' + nextIdx,
      fromMaster: true,
      senderName: 'Master',
      playerName: null,
      text: '[FASE ' + phaseObj.step + ' · CICLO ' + cycle + '] ' + phaseObj.title + (phaseObj.id === 'tavolo_ovale' ? ' (abilità Assassino riattivabile)' : ''),
      createdAt: Date.now()
    });
    data.masterChat = data.masterChat.slice(-150);

    saveRoom(code, data);
  }

  window.masterSetPhase = function (idx) {
    var code = getRoomCode();
    var data = loadRoom(code);
    applyPhaseTransition(code, data, Number(idx));
    renderScheduleBox();
  };

  window.masterNextPhase = function () {
    var code = getRoomCode();
    var data = loadRoom(code);
    var cur = Number(data.phaseIndex || 0);
    applyPhaseTransition(code, data, cur + 1);
    renderScheduleBox();
  };

  window.masterPrevPhase = function () {
    var code = getRoomCode();
    var data = loadRoom(code);
    var cur = Number(data.phaseIndex || 0);
    applyPhaseTransition(code, data, cur - 1);
    renderScheduleBox();
  };

  window.masterRepeatCycle = function () {
    var code = getRoomCode();
    var data = loadRoom(code);
    data.cycleCount = Number(data.cycleCount || 1) + 1;
    applyPhaseTransition(code, data, 1);
    renderScheduleBox();
  };

  function renderScheduleBox() {
    var host = document.getElementById('master-phase-schedule-panel');
    if (!host) return;
    var code = getRoomCode();
    var data = loadRoom(code);
    var idx = Number(data.phaseIndex || 0);
    if (idx < 0 || idx >= GAME_PHASES.length) idx = 0;
    var curPhase = GAME_PHASES[idx];
    var cycle = Number(data.cycleCount || 1);

    var stepButtons = GAME_PHASES.map(function (ph, i) {
      var active = i === idx;
      return '<button type="button" onclick="masterSetPhase(' + i + ')" style="padding:7px 11px;border-radius:9px;border:1px solid ' +
        (active ? '#e5b85c' : 'rgba(255,255,255,0.14)') + ';background:' +
        (active ? '#e5b85c' : '#1d2230') + ';color:' +
        (active ? '#0c0e14' : '#f3f4f6') + ';font-weight:700;font-size:12px;cursor:pointer;">' +
        ph.step + '. ' + ph.title + '</button>';
    }).join('');

    host.innerHTML =
      '<div style="border:1px solid rgba(229,184,92,0.4);border-radius:16px;padding:18px;background:#151924;">' +
        '<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;">' +
          '<div>' +
            '<div style="font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#e5b85c;">Scaletta Fasi di Gioco · Ciclo #' + cycle + '</div>' +
            '<h2 style="margin:2px 0 0;font-size:19px;color:#fff;">Fase ' + curPhase.step + ': ' + curPhase.title + '</h2>' +
            '<p style="margin:4px 0 0;font-size:13px;color:#9ca3af;">' + curPhase.desc + '</p>' +
          '</div>' +
          '<div style="display:flex;flex-wrap:wrap;gap:8px;">' +
            '<button type="button" onclick="masterPrevPhase()" style="padding:9px 13px;border-radius:10px;border:1px solid rgba(255,255,255,0.16);background:#1d2230;color:#f3f4f6;font-weight:700;font-size:12px;cursor:pointer;">← Fase Precedente</button>' +
            '<button type="button" onclick="masterNextPhase()" style="padding:9px 14px;border-radius:10px;border:none;background:#3ec98c;color:#0c0e14;font-weight:700;font-size:12px;cursor:pointer;">Fase Successiva →</button>' +
            '<button type="button" onclick="masterRepeatCycle()" style="padding:9px 14px;border-radius:10px;border:none;background:#7c8cff;color:#ffffff;font-weight:700;font-size:12px;cursor:pointer;">Ripeti Ciclo (Interludio)</button>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:8px;">' + stepButtons + '</div>' +
      '</div>';
  }

  document.addEventListener('DOMContentLoaded', function () {
    var wrap = document.createElement('section');
    wrap.id = 'master-phase-schedule-panel';
    wrap.style.cssText = 'max-width:1120px;margin:20px auto 0;padding:0 16px;';
    var ovalHost = document.getElementById('master-oval-table-session');
    if (ovalHost && ovalHost.parentNode) {
      ovalHost.parentNode.insertBefore(wrap, ovalHost);
    } else {
      document.body.appendChild(wrap);
    }
    renderScheduleBox();
    setInterval(renderScheduleBox, 2000);
  });
})();
</script>

</body>
</html>
