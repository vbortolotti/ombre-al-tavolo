                  <p class="text-sm text-gray-400 mt-2">Nessun messaggio ricevuto dal Master.</p>
                ` : `
                  <div class="mt-3 space-y-2.5 max-h-60 overflow-y-auto pr-1">
                    ${myMessages.map(m => `
                      <div class="p-3 rounded-xl bg-bgdark border border-white/10">
                        <div class="flex items-center justify-between text-[11px] text-gray-400 mb-1">
                          <span class="font-semibold text-gold">${escapeHtml(m.targetName)}</span>
                          <span>${escapeHtml(m.time)}</span>
                        </div>
                        <p class="text-sm text-gray-200">${escapeHtml(m.text)}</p>
                      </div>
                    `).join('')}
                  </div>
                `}
              </div>
            </div>

            <div class="lg:col-span-2 space-y-6">
              <div class="rounded-2xl bg-surface border border-white/10 p-5 shadow-lg">
                <div class="flex items-center justify-between mb-4">
                  <div>
                    <h2 class="font-serif text-xl font-bold text-white">Missioni Segrete</h2>
                    <p class="text-xs text-gray-400 mt-0.5">
                      Invia il completamento al Master: se approvato, ricevi Punti Potere.
                    </p>
                  </div>
                </div>

                ${isMartyr ? `
                  <div class="p-4 rounded-xl bg-bgdark border border-white/10 text-sm text-gray-300">
                    Come <strong>Martire</strong> non hai missioni standard: il tuo potere speciale è <strong>Ultima Testimonianza</strong>.
                  </div>
                ` : `
                  <div class="space-y-3.5">
                    ${player.missions.map(m => {
                      const isDoneUnique = !m.repeatable && m.approvedCount > 0;
                      const isPending = m.status === 'pending';
                      return `
                        <div class="p-4 rounded-xl bg-bgdark border border-white/10">
                          <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                            <div class="flex items-center gap-2">
                              <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-gold/15 text-gold border border-gold/30">
                                +${m.points} ${m.points === 1 ? 'Punto Potere' : 'Punti Potere'}
                              </span>
                              <span class="text-xs font-medium px-2.5 py-0.5 rounded-full bg-surface2 text-gray-300">
                                ${m.repeatable ? 'Ripetibile' : 'Unica'}
                              </span>
                              ${m.approvedCount > 0 ? `
                                <span class="text-xs font-semibold text-emerald">
                                  Completata ${m.approvedCount} ${m.approvedCount === 1 ? 'volta' : 'volte'}
                                </span>
                              ` : ''}
                            </div>
                            <span class="text-xs font-semibold ${isPending ? 'text-gold' : isDoneUnique ? 'text-emerald' : 'text-gray-400'}">
                              ${isPending ? 'In attesa di verifica' : isDoneUnique ? 'Completata' : 'Disponibile'}
                            </span>
                          </div>

                          <p class="text-sm text-gray-100 leading-relaxed">${escapeHtml(m.text)}</p>

                          ${player.alive && !isDoneUnique && !isPending ? `
                            <div class="mt-3 flex flex-col sm:flex-row gap-2">
                              <input
                                id="note-${m.id}"
                                type="text"
                                placeholder="Nota opzionale per il Master (es. contesto o dettaglio)..."
                                class="flex-1 rounded-xl bg-surface border border-white/10 px-3 py-2 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-indigo"
                              />
                              <button
                                type="button"
                                onclick="submitMission('${player.id}', '${m.id}', document.getElementById('note-${m.id}').value)"
                                class="px-4 py-2 rounded-xl bg-indigo text-white text-xs font-semibold hover:brightness-110 transition shrink-0"
                              >
                                Invia Completamento
                              </button>
                            </div>
                          ` : ''}
                        </div>
                      `;
                    }).join('')}
                  </div>
                `}
              </div>

              <div class="rounded-2xl bg-surface border border-white/10 p-5 shadow-lg">
                <h2 class="font-serif text-xl font-bold text-white">Segnala un Giocatore al Master</h2>
                <p class="text-xs text-gray-400 mt-0.5">
                  Segnala un comportamento sospetto o un’osservazione emersa al tavolo.
                </p>

                ${!player.alive ? `
                  <p class="text-sm text-gray-400 mt-3">I giocatori eliminati non possono inviare nuove segnalazioni.</p>
                ` : `
                  <form onsubmit="handleReportSubmit(event, '${player.id}')" class="mt-4 space-y-3">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div>
                        <label for="report-target" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">
                          Giocatore
                        </label>
                        <select id="report-target" class="w-full rounded-xl bg-bgdark border border-white/15 px-3 py-2.5 text-sm text-white">
                          ${aliveTargets.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('')}
                        </select>
                      </div>
                      <div class="sm:col-span-2">
                        <label for="report-reason" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">
                          Motivo / Osservazione
                        </label>
                        <input
                          id="report-reason"
                          type="text"
                          required
                          placeholder="Descrivi brevemente cosa hai notato..."
                          class="w-full rounded-xl bg-bgdark border border-white/15 px-3.5 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-gold"
                        />
                      </div>
                    </div>
                    <button
                      type="submit"
                      ${aliveTargets.length === 0 ? 'disabled' : ''}
                      class="px-4 py-2.5 rounded-xl bg-surface2 hover:bg-white/10 border border-white/15 text-sm font-semibold text-white transition disabled:opacity-40"
                    >
                      Invia Segnalazione
                    </button>
                  </form>
                `}

                ${player.reports.length > 0 ? `
                  <div class="mt-5 pt-4 border-t border-white/10 space-y-2">
                    <div class="text-xs font-bold uppercase tracking-wider text-gray-400">Le Tue Segnalazioni</div>
                    ${player.reports.slice().reverse().map(r => `
                      <div class="flex items-center justify-between gap-3 p-3 rounded-xl bg-bgdark border border-white/10 text-xs">
                        <div>
                          <span class="font-semibold text-white">Su ${escapeHtml(r.targetName)}:</span>
                          <span class="text-gray-300 ml-1">${escapeHtml(r.reason)}</span>
                        </div>
                        <span class="font-semibold shrink-0 ${r.status === 'valid' ? 'text-emerald' : r.status === 'dismissed' ? 'text-gray-500' : 'text-gold'}">
                          ${r.status === 'valid' ? 'Convalidata' : r.status === 'dismissed' ? 'Archiviata' : 'In attesa'}
                        </span>
                      </div>
                    `).join('')}
                  </div>
                ` : ''}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function handlePowerSubmit(e, actorId) {
      e.preventDefault();
      const sel = document.getElementById('power-target-select');
      const targetId = sel ? sel.value : '';
      useRolePower(actorId, targetId);
    }

    function handleMartyrSubmit(e, actorId) {
      e.preventDefault();
      const sel = document.getElementById('martyr-role-select');
      const decl = sel ? sel.value : '';
      useRolePower(actorId, actorId, decl);
    }

    function handleReportSubmit(e, playerId) {
      e.preventDefault();
      const targetEl = document.getElementById('report-target');
      const reasonEl = document.getElementById('report-reason');
      if (!targetEl || !reasonEl) return;
      submitReport(playerId, targetEl.value, reasonEl.value);
      reasonEl.value = '';
    }

    function renderMasterDashboard() {
      const pendingSubs = [];
      const pendingReps = [];

      state.players.forEach(p => {
        (p.pendingSubmissions || []).forEach(sub => {
          pendingSubs.push({ player: p, sub });
        });
        (p.reports || []).forEach(rep => {
          if (rep.status === 'pending') {
            pendingReps.push({ player: p, rep });
          }
        });
      });

      const inspectedPlayer = state.inspectingPlayerId ? getPlayerById(state.inspectingPlayerId) : null;
      const displaySyncId = getOrCreateDisplaySyncId(state.roomCode);

      return `
        <div class="max-w-6xl w-full mx-auto px-4 py-6 space-y-6">
          <div class="rounded-2xl bg-surface border border-white/10 p-4 sm:p-5 flex flex-wrap items-center justify-between gap-4">
            <div>
              <div class="flex flex-wrap items-center gap-2">
                <span class="text-xs font-bold uppercase tracking-widest px-2.5 py-1 rounded-full bg-gold/15 text-gold border border-gold/30">
                  Modalità Master
                </span>
                <span class="text-xs font-semibold px-3 py-1 rounded-full bg-surface2 text-gray-200 border border-white/10">
                  Stanza ${escapeHtml(state.roomCode)} · Turno ${state.round} · ${escapeHtml(state.phase)}
                </span>
              </div>
              <h1 class="font-serif text-2xl sm:text-3xl font-bold text-white mt-2">Plancia del Tavolo</h1>
              <p class="text-xs text-emerald mt-1">
                ID Sync stanza: <strong class="font-mono text-white">${escapeHtml(displaySyncId)}</strong> · Condividi Codice Stanza <strong class="text-gold">${escapeHtml(state.roomCode)}</strong> con i giocatori
              </p>
            </div>

            <div class="flex flex-wrap items-center gap-2.5">
              <button
                type="button"
                onclick="pullRemoteSnapshot('manual')"
                class="px-3.5 py-2.5 rounded-xl bg-surface2 hover:bg-white/10 border border-white/15 text-xs font-semibold text-gray-200 transition"
              >
                Aggiorna
              </button>
              <button
                type="button"
                onclick="advancePhase()"
                class="px-4 py-2.5 rounded-xl bg-indigo text-white text-xs font-semibold hover:brightness-110 transition"
              >
                Avanza Fase
              </button>
              <button
                type="button"
                onclick="resetGame()"
                class="px-4 py-2.5 rounded-xl bg-crimson/20 hover:bg-crimson/30 border border-crimson/40 text-crimson text-xs font-semibold transition"
              >
                Nuova Partita
              </button>
              <button
                type="button"
                onclick="exitToEntry()"
                class="px-3.5 py-2.5 rounded-xl bg-surface2 hover:bg-white/10 border border-white/15 text-xs font-semibold text-gray-200 transition"
              >
                Esci
              </button>
            </div>
          </div>

          ${renderBanner()}
          ${renderVictoryBanner()}

          <div class="rounded-2xl bg-surface border border-white/10 p-5 shadow-lg">
            <div class="flex items-center justify-between mb-4">
              <h2 class="font-serif text-xl font-bold text-white">Giocatori al Tavolo (${state.players.length})</h2>
              <span class="text-xs text-gray-400">Clicca “Scheda Completa” per ispezionare ruolo, fazione e missioni</span>
            </div>

            ${state.players.length === 0 ? `
              <div class="p-6 rounded-xl bg-bgdark border border-white/10 text-center text-sm text-gray-400">
                Nessun giocatore ancora registrato in questa stanza.
              </div>
            ` : `
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                ${state.players.map(p => {
                  const rDef = ROLE_DEFS[p.roleKey] || ROLE_DEFS.investigatore;
                  const isInspected = state.inspectingPlayerId === p.id;
                  return `
                    <div class="rounded-xl bg-bgdark border ${isInspected ? 'border-gold' : 'border-white/10'} p-4 flex flex-col justify-between gap-4">
                      <div>
                        <div class="flex items-start justify-between gap-3">
                          <div class="flex items-center gap-3">
                            ${renderAvatar(p, 'w-11 h-11')}
                            <div>
                              <div class="font-semibold text-white text-base">${escapeHtml(p.name)}</div>
                              <div class="flex flex-wrap items-center gap-1.5 mt-1">
                                <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${p.alive ? 'bg-emerald/15 text-emerald' : 'bg-crimson/15 text-crimson'}">
                                  ${p.alive ? 'Vivo' : 'Eliminato'}
                                </span>
                                ${p.protectedUntilNextTurn ? `<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-indigo/15 text-indigo">Protetto</span>` : ''}
                                ${p.blockedThisRound ? `<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-crimson/15 text-crimson">Bloccato</span>` : ''}
                              </div>
                            </div>
                          </div>
                          <div class="text-right">
                            <div class="text-[10px] uppercase tracking-wider text-gray-500">Potere</div>
                            <div class="text-lg font-bold text-gold">${p.powerPoints}</div>
                          </div>
                        </div>

                        <div class="mt-3 pt-3 border-t border-white/10 flex items-center justify-between text-xs">
                          <span class="text-gray-400">Ruolo: <strong class="text-gray-200">${escapeHtml(rDef.name)}</strong></span>
                          <span class="px-2 py-0.5 rounded-full border ${rDef.badgeClass} text-[11px] font-semibold">
                            ${rDef.faction === 'traditori' ? 'Traditore' : 'Cittadino'}
                          </span>
                        </div>
                      </div>

                      <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-white/5">
                        <div class="flex items-center gap-1.5">
                          <button
                            type="button"
                            onclick="adjustPlayerPoints('${p.id}', -1)"
                            class="w-7 h-7 rounded-lg bg-surface2 hover:bg-white/10 text-xs font-bold text-gray-200"
                            title="Rimuovi 1 punto potere"
                          >-</button>
                          <button
                            type="button"
                            onclick="adjustPlayerPoints('${p.id}', 1)"
                            class="w-7 h-7 rounded-lg bg-surface2 hover:bg-white/10 text-xs font-bold text-gray-200"
                            title="Aggiungi 1 punto potere"
                          >+</button>
                          <button
                            type="button"
                            onclick="togglePlayerAlive('${p.id}')"
                            class="px-2.5 h-7 rounded-lg bg-surface2 hover:bg-white/10 text-[11px] font-semibold ${p.alive ? 'text-crimson' : 'text-emerald'}"
                          >
                            ${p.alive ? 'Elimina' : 'Ripristina'}
                          </button>
                        </div>

                        <button
                          type="button"
                          onclick="toggleInspectPlayer('${p.id}')"
                          class="px-3 h-7 rounded-lg ${isInspected ? 'bg-gold text-bgdark' : 'bg-indigo/20 text-indigo hover:bg-indigo/30'} text-[11px] font-semibold transition"
                        >
                          ${isInspected ? 'Chiudi Scheda' : 'Scheda Completa'}
                        </button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}

            ${inspectedPlayer ? renderMasterPlayerInspector(inspectedPlayer) : ''}
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="rounded-2xl bg-surface border border-white/10 p-5 shadow-lg space-y-5">
              <div class="flex items-center justify-between">
                <h2 class="font-serif text-xl font-bold text-white">Approvazioni e Segnalazioni</h2>
                <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-gold/15 text-gold">
                  ${pendingSubs.length + pendingReps.length} in attesa
                </span>
              </div>

              <div>
                <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2.5">
                  Missioni da Verificare (${pendingSubs.length})
                </h3>
                ${pendingSubs.length === 0 ? `
                  <p class="text-xs text-gray-500 bg-bgdark rounded-xl p-3.5 border border-white/10">Nessuna missione in attesa.</p>
                ` : `
                  <div class="space-y-2.5">
                    ${pendingSubs.map(({ player, sub }) => `
                      <div class="p-3.5 rounded-xl bg-bgdark border border-white/10 space-y-2">
                        <div class="flex items-center justify-between text-xs">
                          <span class="font-bold text-white">${escapeHtml(player.name)}</span>
                          <span class="text-gold font-semibold">+${sub.points} PT · ${escapeHtml(sub.submittedAt)}</span>
                        </div>
                        <p class="text-sm text-gray-200">${escapeHtml(sub.missionText)}</p>
                        ${sub.note ? `<p class="text-xs text-gray-400 italic">Nota: "${escapeHtml(sub.note)}"</p>` : ''}
                        <div class="flex gap-2 pt-1">
                          <button
                            type="button"
                            onclick="approveSubmission('${player.id}', '${sub.id}')"
                            class="px-3 py-1.5 rounded-lg bg-emerald text-bgdark text-xs font-semibold hover:brightness-110 transition"
                          >
                            Approva (+${sub.points} PT)
                          </button>
                          <button
                            type="button"
                            onclick="rejectSubmission('${player.id}', '${sub.id}')"
                            class="px-3 py-1.5 rounded-lg bg-crimson/20 text-crimson border border-crimson/30 text-xs font-semibold hover:bg-crimson/30 transition"
                          >
                            Respingi
                          </button>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                `}
              </div>

              <div>
                <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2.5">
                  Segnalazioni Giocatori (${pendingReps.length})
                </h3>
                ${pendingReps.length === 0 ? `
                  <p class="text-xs text-gray-500 bg-bgdark rounded-xl p-3.5 border border-white/10">Nessuna segnalazione in attesa.</p>
                ` : `
                  <div class="space-y-2.5">
                    ${pendingReps.map(({ player, rep }) => `
                      <div class="p-3.5 rounded-xl bg-bgdark border border-white/10 space-y-2">
                        <div class="flex items-center justify-between text-xs">
                          <span class="text-gray-300"><strong class="text-white">${escapeHtml(rep.reporterName)}</strong> segnala <strong class="text-gold">${escapeHtml(rep.targetName)}</strong></span>
                          <span class="text-gray-500">${escapeHtml(rep.createdAt)}</span>
                        </div>
                        <p class="text-sm text-gray-200">"${escapeHtml(rep.reason)}"</p>
                        <div class="flex gap-2 pt-1">
                          <button
                            type="button"
                            onclick="resolveReport('${player.id}', '${rep.id}', 'valid')"
                            class="px-3 py-1.5 rounded-lg bg-emerald text-bgdark text-xs font-semibold hover:brightness-110 transition"
                          >
                            Convalida (+1 PT a ${escapeHtml(rep.reporterName)})
                          </button>
                          <button
                            type="button"
                            onclick="resolveReport('${player.id}', '${rep.id}', 'dismissed')"
                            class="px-3 py-1.5 rounded-lg bg-surface2 text-gray-300 border border-white/10 text-xs font-semibold hover:bg-white/10 transition"
                          >
                            Archivia
                          </button>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                `}
              </div>
            </div>

            <div class="space-y-6">
              <div class="rounded-2xl bg-surface border border-white/10 p-5 shadow-lg">
                <h2 class="font-serif text-xl font-bold text-white">Invia Messaggio</h2>
                <p class="text-xs text-gray-400 mt-0.5">Comunica un indizio, esito o avviso a un singolo giocatore o a tutti.</p>

                <form onsubmit="handleMasterMessageSubmit(event)" class="mt-4 space-y-3">
                  <div>
                    <label for="master-msg-target" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">
                      Destinatario
                    </label>
                    <select id="master-msg-target" class="w-full rounded-xl bg-bgdark border border-white/15 px-3 py-2.5 text-sm text-white">
                      <option value="ALL">Tutti i Giocatori</option>
                      ${state.players.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label for="master-msg-text" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">
                      Messaggio
                    </label>
                    <input
                      id="master-msg-text"
                      type="text"
                      required
                      placeholder="Scrivi il messaggio per il tavolo o per un giocatore..."
                      class="w-full rounded-xl bg-bgdark border border-white/15 px-3.5 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-gold"
                    />
                  </div>
                  <button
                    type="submit"
                    class="px-4 py-2.5 rounded-xl bg-gold text-bgdark text-sm font-semibold hover:brightness-110 transition"
                  >
                    Invia Messaggio
                  </button>
                </form>
              </div>

              <div class="rounded-2xl bg-surface border border-white/10 p-5 shadow-lg">
                <h2 class="font-serif text-xl font-bold text-white mb-3">Cronaca del Tavolo</h2>
                ${state.logs.length === 0 ? `
                  <p class="text-sm text-gray-500">Nessun evento registrato.</p>
                ` : `
                  <div class="space-y-2 max-h-72 overflow-y-auto pr-1">
                    ${state.logs.map(l => `
                      <div class="flex items-start justify-between gap-3 py-2 border-b border-white/5 last:border-b-0 text-xs">
                        <span class="text-gray-300 leading-relaxed">${escapeHtml(l.text)}</span>
                        <span class="text-gray-500 shrink-0">${escapeHtml(l.time)}</span>
                      </div>
                    `).join('')}
                  </div>
                `}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function toggleInspectPlayer(playerId) {
      state.inspectingPlayerId = state.inspectingPlayerId === playerId ? null : playerId;
      render();
    }

    function renderMasterPlayerInspector(p) {
      const rDef = ROLE_DEFS[p.roleKey] || ROLE_DEFS.investigatore;
      return `
        <div class="mt-5 rounded-2xl bg-surface2/80 border border-gold/40 p-5">
          <div class="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-white/10">
            <div class="flex items-center gap-3.5">
              ${renderAvatar(p, 'w-14 h-14')}
              <div>
                <h3 class="font-serif text-xl font-bold text-white">${escapeHtml(p.name)}</h3>
                <div class="flex flex-wrap items-center gap-2 mt-1">
                  <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full border ${rDef.badgeClass}">
                    ${escapeHtml(rDef.name)} · ${escapeHtml(rDef.factionLabel)}
                  </span>
                  <span class="text-xs text-gold font-semibold">Punti Potere: ${p.powerPoints}</span>
                </div>
              </div>
            </div>
            <button
              type="button"
              onclick="toggleInspectPlayer('${p.id}')"
              class="text-xs text-gray-400 hover:text-white px-3 py-1.5 rounded-lg bg-bgdark border border-white/10"
            >
              Chiudi
            </button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
            <div>
              <div class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Potere e Stato</div>
              <div class="p-3.5 rounded-xl bg-bgdark border border-white/10 text-xs space-y-1.5">
                <div><strong class="text-gold">${escapeHtml(rDef.powerName)}:</strong> <span class="text-gray-300">${escapeHtml(rDef.powerDesc)}</span></div>
                <div><strong class="text-gray-400">Stato vitale:</strong> <span class="text-white">${p.alive ? 'Vivo' : 'Eliminato'}</span></div>
                <div><strong class="text-gray-400">Protezione attiva:</strong> <span class="text-white">${p.protectedUntilNextTurn ? 'Sì' : 'No'}</span></div>
                <div><strong class="text-gray-400">Bloccato nel turno:</strong> <span class="text-white">${p.blockedThisRound ? 'Sì' : 'No'}</span></div>
                ${p.martyrDeclaration ? `<div><strong class="text-gold">Dichiarazione Martire:</strong> <span class="text-white">"${escapeHtml(p.martyrDeclaration)}"</span></div>` : ''}
              </div>
            </div>

            <div>
              <div class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Missioni Assegnate</div>
              ${p.missions.length === 0 ? `
                <div class="p-3.5 rounded-xl bg-bgdark border border-white/10 text-xs text-gray-400">
                  Nessuna missione standard (ruolo Martire).
                </div>
              ` : `
                <div class="space-y-2 max-h-48 overflow-y-auto pr-1">
                  ${p.missions.map(m => `
                    <div class="p-3 rounded-xl bg-bgdark border border-white/10 text-xs flex items-start justify-between gap-2">
                      <span class="text-gray-200">${escapeHtml(m.text)}</span>
                      <span class="text-gold font-semibold shrink-0">+${m.points} PT (${m.approvedCount || 0} ok)</span>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function handleMasterMessageSubmit(e) {
      e.preventDefault();
      const targetEl = document.getElementById('master-msg-target');
      const textEl = document.getElementById('master-msg-text');
      if (!targetEl || !textEl) return;
      sendMasterMessage(targetEl.value, textEl.value);
      textEl.value = '';
    }

    function renderAvatar(player, sizeClass = 'w-10 h-10') {
      if (player.selfie) {
        return `<img src="${player.selfie}" alt="${escapeAttr(player.name)}" class="${sizeClass} rounded-full object-cover border border-white/15 shrink-0" />`;
      }
      const initials = (player.name || '?')
        .split(/\s+/)
        .map(part => part[0])
        .join('')
        .slice(0, 2)
        .toUpperCase();
      return `
        <div class="${sizeClass} rounded-full bg-surface2 border border-white/15 flex items-center justify-center text-xs font-bold text-gold shrink-0">
          ${escapeHtml(initials)}
        </div>
      `;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(str) {
      return escapeHtml(str);
    }

    function render() {
      const appEl = document.getElementById('app');
      if (!appEl) return;

      try {
        if (state.screen === 'master') {
          appEl.innerHTML = renderMasterDashboard();
        } else if (state.screen === 'player_join') {
          appEl.innerHTML = renderPlayerJoinScreen();
        } else if (state.screen === 'player_dashboard') {
          appEl.innerHTML = renderPlayerDashboard();
        } else {
          appEl.innerHTML = renderEntryScreen();
        }
      } catch (err) {
        console.error('Errore durante il rendering:', err);
        appEl.innerHTML = `
          <div class="max-w-xl mx-auto my-12 p-6 rounded-2xl bg-surface border border-crimson/40 text-center">
            <h2 class="font-serif text-xl font-bold text-crimson">Errore di visualizzazione</h2>
            <p class="text-sm text-gray-300 mt-2">Si è verificato un problema imprevisto nel rendering della pagina.</p>
            <button type="button" onclick="resetGame()" class="mt-4 px-4 py-2 rounded-xl bg-gold text-bgdark text-sm font-semibold">
              Ripristina Partita
            </button>
          </div>
        `;
      }
    }

    window.clearBanner = clearBanner;
    window.setRoomCodeAndReload = setRoomCodeAndReload;
    window.exitToEntry = exitToEntry;
    window.enterMasterMode = enterMasterMode;
    window.openPlayerJoin = openPlayerJoin;
    window.startCamera = startCamera;
    window.snapSelfie = snapSelfie;
    window.handleSelfieFileUpload = handleSelfieFileUpload;
    window.handleJoinSubmit = handleJoinSubmit;
    window.submitMission = submitMission;
    window.approveSubmission = approveSubmission;
    window.rejectSubmission = rejectSubmission;
    window.submitReport = submitReport;
    window.resolveReport = resolveReport;
    window.handlePowerSubmit = handlePowerSubmit;
    window.handleMartyrSubmit = handleMartyrSubmit;
    window.handleReportSubmit = handleReportSubmit;
    window.togglePlayerAlive = togglePlayerAlive;
    window.adjustPlayerPoints = adjustPlayerPoints;
    window.advancePhase = advancePhase;
    window.resetGame = resetGame;
    window.toggleInspectPlayer = toggleInspectPlayer;
    window.handleMasterMessageSubmit = handleMasterMessageSubmit;
    window.pullRemoteSnapshot = pullRemoteSnapshot;

    state = loadState();
    initSyncTransport();
    render();
    initCloudSync();
  </script>
</body>
</html>
