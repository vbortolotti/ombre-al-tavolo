<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ombre al Tavolo — Regia TV</title>
  <style>
    :root {
      --bg: #07080d;
      --surface: #121622;
      --surface-2: #1a2030;
      --border: rgba(255, 255, 255, 0.14);
      --text: #f9fafb;
      --muted: #9ca3af;
      --gold: #e5b85c;
      --crimson: #e05260;
      --emerald: #3ec98c;
      --indigo: #7c8cff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 15%, #1d1626 0%, var(--bg) 68%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }

    .tv-topbar {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(12, 14, 22, 0.85);
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--emerald);
    }

    .tv-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .idle-box {
      max-width: 720px;
      width: 100%;
      text-align: center;
      background: rgba(18, 22, 34, 0.78);
      border: 1px solid rgba(229, 184, 92, 0.35);
      border-radius: 24px;
      padding: 48px 28px;
    }

    .idle-title {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin: 10px 0 8px;
      color: #fff;
    }

    .idle-sub {
      font-size: 16px;
      color: var(--muted);
      margin: 0;
    }

    .vote-card {
      max-width: 580px;
      width: 100%;
      background: var(--surface);
      border: 2px solid rgba(229, 184, 92, 0.55);
      border-radius: 28px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.65);
      animation: fadeZoomIn 0.55s ease forwards;
    }

    @keyframes fadeZoomIn {
      0% { opacity: 0; transform: translateY(14px) scale(0.94); filter: blur(4px); }
      65% { opacity: 1; filter: blur(0); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    .selfie-frame {
      width: 230px;
      height: 230px;
      margin: 18px auto 20px;
      border-radius: 26px;
      overflow: hidden;
      border: 3px solid var(--gold);
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 74px;
      font-weight: 900;
      color: var(--gold);
      animation: slowKenBurns 7s ease-in-out infinite alternate;
    }

    @keyframes slowKenBurns {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }

    .selfie-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .voter-label {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 12px;
    }

    .voted-under-box {
      margin-top: 8px;
      padding: 16px 20px;
      border-radius: 18px;
      background: rgba(224, 82, 96, 0.16);
      border: 1px solid rgba(224, 82, 96, 0.5);
    }

    .voted-under-eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fca5a5;
    }

    .voted-under-name {
      font-size: 36px;
      font-weight: 900;
      color: #fff;
      margin-top: 4px;
    }

    .media-box {
      max-width: 920px;
      width: 100%;
      background: var(--surface);
      border: 2px solid rgba(224, 82, 96, 0.5);
      border-radius: 28px;
      padding: 28px;
      text-align: center;
      animation: fadeZoomIn 0.5s ease forwards;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.65);
    }

    .media-box.win-box {
      border-color: rgba(229, 184, 92, 0.65);
    }

    .media-box.intro-box {
      border-color: rgba(229, 184, 92, 0.55);
    }

    .video-stage-wrap {
      position: relative;
      margin-top: 16px;
      border-radius: 18px;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--border);
    }

    video {
      width: 100%;
      max-height: 460px;
      display: block;
      background: #000;
    }

    .overlay-badges {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
    }

    .face-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px 8px 8px;
      border-radius: 999px;
      background: rgba(10, 12, 20, 0.85);
      border: 2px solid var(--gold);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }

    .face-chip.crimson-border {
      border-color: var(--crimson);
    }

    .face-chip img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .face-chip-initial {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--gold);
      font-weight: 900;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .face-chip-role {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gold);
      text-align: left;
    }

    .face-chip.crimson-border .face-chip-role {
      color: #fca5a5;
    }

    .face-chip-name {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      text-align: left;
    }

    .parade-strip {
      margin-top: 18px;
      padding: 18px;
      border-radius: 20px;
      background: rgba(12, 15, 24, 0.9);
      border: 1px solid rgba(229, 184, 92, 0.35);
    }

    .parade-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 12px;
    }

    .parade-card {
      width: 118px;
      padding: 10px;
      border-radius: 16px;
      background: var(--surface-2);
      border: 2px solid rgba(229, 184, 92, 0.4);
      opacity: 0.35;
      transform: scale(0.95);
      transition: all 0.35s ease;
    }

    .parade-card.active {
      opacity: 1;
      transform: scale(1.06);
      border-color: var(--gold);
      box-shadow: 0 0 24px rgba(229, 184, 92, 0.35);
    }

    .parade-card.shown {
      opacity: 0.88;
      transform: scale(1);
    }

    .parade-avatar {
      width: 84px;
      height: 84px;
      margin: 0 auto 8px;
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      color: var(--gold);
    }

    .parade-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .parade-name {
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(229, 184, 92, 0.16);
      color: var(--gold);
      border: 1px solid rgba(229, 184, 92, 0.35);
    }
  </style>

</head>
<body>
  <header class="tv-topbar">
    <div>
      <span class="eyebrow">Ombre al Tavolo · Regia TV</span>
      <span style="margin-left:10px;font-size:13px;color:var(--muted);">Stanza: <strong class="mono" id="tv-room-code">TAVOLO1</strong></span>
    </div>
    <span class="badge" id="tv-mode-badge">Stand-by</span>
  </header>

  <main class="tv-stage" id="tv-stage"></main>

  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      doc,
      getDoc,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    var ACCESS_KEY = 'ombre_accesso_tavolo_v1';
    var ROOM_PREFIX = 'ombre_stanza_sync_';

    var VIDEO_SOURCES = {
      intro: 'video/ingresso.mp4',
      kill: 'video/eliminazione.mp4',
      exile: 'video/esilio.mp4',
      win_fedeli: 'video/vittoria-fedeli.mp4',
      win_traditori: 'video/vittoria-traditori.mp4',
      win_solitario: 'video/vittoria-solitario.mp4'
    };

    var VICTORY_LABELS = {
      win_fedeli: { title: 'Vittoria dei Fedeli', subtitle: 'La verità ha trionfato al tavolo.' },
      win_traditori: { title: 'Vittoria dei Traditori', subtitle: 'Le ombre hanno avvolto il tavolo fino alla fine.' },
      win_solitario: { title: 'Vittoria Solitaria', subtitle: 'Il destino solitario ha prevalso su tutti.' }
    };

    function readRoomCode() {
      var params = new URLSearchParams(window.location.search);
      if (params.get('stanza')) return String(params.get('stanza')).trim().toUpperCase();
      try {
        var raw = localStorage.getItem(ACCESS_KEY);
        if (raw) {
          var p = JSON.parse(raw);
          if (p && p.roomCode) return String(p.roomCode).trim().toUpperCase();
        }
      } catch (_e) {}
      return 'TAVOLO1';
    }

    function initDb() {
      try {
        if (!window.OMBRE_FIREBASE_CONFIG || !window.OMBRE_FIREBASE_CONFIG.projectId) return null;
        var app = getApps().length ? getApps()[0] : initializeApp(window.OMBRE_FIREBASE_CONFIG);
        return getFirestore(app);
      } catch (_e) {
        return null;
      }
    }

    var db = initDb();
    var roomCode = readRoomCode();
    document.getElementById('tv-room-code').textContent = roomCode;

    var tvState = {
      tvMode: 'idle',
      revealedVoteIndex: 0,
      ovalVotes: [],
      playerSelfies: {},
      players: [],
      masterName: 'Master',
      masterSelfie: '',
      tvKillTarget: '',
      tvExileTarget: '',
      tvVideoPaused: false,
      tvRevealTick: 0
    };

    var paradeTimer = null;
    var exileTimer = null;
    var lastMediaKey = '';

    function clearStageTimers() {
      if (paradeTimer) {
        clearInterval(paradeTimer);
        paradeTimer = null;
      }
      if (exileTimer) {
        clearTimeout(exileTimer);
        exileTimer = null;
      }
    }

    function escapeHtml(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function findSelfieByName(name) {
      var k = String(name || '').trim().toLowerCase();
      if (!k) return '';
      if (tvState.playerSelfies && tvState.playerSelfies[k]) return tvState.playerSelfies[k];
      var found = (tvState.players || []).find(function (p) {
        return String(p.name || '').trim().toLowerCase() === k;
      });
      return (found && (found.selfie || found.photo)) || '';
    }

    function getSelfie(vote) {
      if (vote && vote.voterSelfie) return vote.voterSelfie;
      return findSelfieByName(vote && vote.voterName);
    }

    function renderAvatarContent(selfieUrl, name) {
      var initial = escapeHtml((name || 'G').slice(0, 1).toUpperCase());
      if (selfieUrl) {
        return '<img src="' + selfieUrl + '" alt="' + escapeHtml(name) + '" />';
      }
      return initial;
    }

    function renderFaceChip(roleLabel, name, selfieUrl, isCrimson) {
      var initial = escapeHtml((name || 'M').slice(0, 1).toUpperCase());
      var avatar = selfieUrl
        ? '<img src="' + selfieUrl + '" alt="' + escapeHtml(name) + '" />'
        : '<div class="face-chip-initial">' + initial + '</div>';
      return (
        '<div class="face-chip ' + (isCrimson ? 'crimson-border' : '') + '">' +
          avatar +
          '<div>' +
            '<div class="face-chip-role">' + escapeHtml(roleLabel) + '</div>' +
            '<div class="face-chip-name">' + escapeHtml(name || '—') + '</div>' +
          '</div>' +
        '</div>'
      );
    }

    function syncTvVideoPlayback() {
      var vid = document.querySelector('#tv-stage video');
      if (!vid) return;
      if (tvState.tvVideoPaused) {
        if (!vid.paused) vid.pause();
      } else {
        var p = vid.play();
        if (p && typeof p.catch === 'function') p.catch(function () {});
      }
    }

    function applyData(data) {
      if (!data || typeof data !== 'object') return;
      tvState.tvMode = data.tvMode || 'idle';
      tvState.revealedVoteIndex = Number(data.revealedVoteIndex || 0);
      tvState.ovalVotes = Array.isArray(data.ovalVotes) ? data.ovalVotes : [];
      tvState.playerSelfies = (data.playerSelfies && typeof data.playerSelfies === 'object') ? data.playerSelfies : {};
      tvState.players = Array.isArray(data.players) ? data.players : [];
      tvState.masterName = String(data.masterName || 'Master');
      tvState.masterSelfie = String(data.masterSelfie || findSelfieByName(tvState.masterName) || '');
      tvState.tvKillTarget = String(data.tvKillTarget || '');
      tvState.tvExileTarget = String(data.tvExileTarget || data.tvKillTarget || '');
      tvState.tvVideoPaused = Boolean(data.tvVideoPaused);
      tvState.tvRevealTick = Number(data.tvRevealTick || 0);
      renderTv();
      syncTvVideoPlayback();
    }

    function startParadeLoop() {
      var cards = Array.from(document.querySelectorAll('#tv-stage .parade-card'));
      if (!cards.length) return;
      var active = 0;
      function step() {
        cards.forEach(function (c, i) {
          c.classList.remove('active', 'shown');
          if (i === active) c.classList.add('active');
          else if (i < active) c.classList.add('shown');
        });
        active = (active + 1) % cards.length;
      }
      step();
      paradeTimer = setInterval(step, 1400);
    }

    function renderExileDoorPhase(targetName, selfieUrl) {
      var stage = document.getElementById('tv-stage');
      if (!stage) return;
      var src = VIDEO_SOURCES.exile;
      stage.innerHTML =
        '<div class="media-box">' +
          '<span class="eyebrow" style="color:var(--crimson);">Esilio dal Tavolo O
