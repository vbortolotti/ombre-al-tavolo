  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const ACCESS_STORAGE_KEY = 'ombre_accesso_tavolo_v1';
    const ROOM_SYNC_PREFIX = 'ombre_stanza_sync_';

    let firestoreDb = null;

    function initFirestore() {
      try {
        if (!window.OMBRE_FIREBASE_CONFIG || !window.OMBRE_FIREBASE_CONFIG.projectId) {
          return null;
        }
        const app = getApps().length ? getApps()[0] : initializeApp(window.OMBRE_FIREBASE_CONFIG);
        return getFirestore(app);
      } catch (err) {
        console.error('Errore inizializzazione Firestore:', err);
        return null;
      }
    }

    function getRoomDocRef(roomCode) {
      if (!firestoreDb) return null;
      const cleanRoom = String(roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1';
      return doc(firestoreDb, 'stanze', cleanRoom);
    }

    function createInitialAccessState() {
      return {
        roomCode: 'TAVOLO1',
        playerName: '',
        role: 'player', // 'player' | 'master'
        syncStatus: 'Cloud Firestore attivo',
        banner: null
      };
    }

    function loadAccessState() {
      try {
        const raw = localStorage.getItem(ACCESS_STORAGE_KEY);
        if (!raw) return createInitialAccessState();
        const parsed = JSON.parse(raw);
        return {
          roomCode: String(parsed.roomCode || 'TAVOLO1').trim().toUpperCase() || 'TAVOLO1',
          playerName: String(parsed.playerName || '').trim(),
          role: parsed.role === 'master' ? 'master' : 'player',
          syncStatus: firestoreDb ? 'Cloud Firestore attivo' : 'Sincronizzazione locale',
          banner: parsed.banner || null
        };
      } catch (err) {
        console.error('Errore lettura stato accesso:', err);
        return createInitialAccessState();
      }
    }

    let accessState = loadAccessState();

    function saveAccessState() {
      try {
        localStorage.setItem(ACCESS_STORAGE_KEY, JSON.stringify({
          roomCode: accessState.roomCode,
          playerName: accessState.playerName,
          role: accessState.role,
          syncStatus: accessState.syncStatus,
          banner: accessState.banner
        }));
      } catch (err) {
        console.error('Errore salvataggio stato accesso:', err);
      }
    }

    function setAccessBanner(text, type = 'info') {
      accessState.banner = { text, type };
      saveAccessState();
      renderAccessPage();
    }

    function updateRoomCode(value, shouldRender = true) {
      accessState.roomCode = String(value || '').trim().toUpperCase() || 'TAVOLO1';
      accessState.banner = null;
      saveAccessState();
      if (shouldRender) {
        renderAccessPage();
      }
    }

    function updatePlayerName(value) {
      accessState.playerName = String(value || '');
      accessState.banner = null;
      saveAccessState();
    }

    function selectRole(role) {
      accessState.role = role === 'master' ? 'master' : 'player';
      accessState.banner = null;
      saveAccessState();
      renderAccessPage();
    }
