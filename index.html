<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ombre al Tavolo — Accesso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    // Configurazione tema scuro e colori per la pagina di accesso
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Cinzel', 'serif'],
          },
          colors: {
            bgdark: '#0c0e14',
            surface: '#151924',
            surface2: '#1d2230',
            gold: '#e5b85c',
            crimson: '#e05260',
            emerald: '#3ec98c',
            indigo: '#7c8cff',
          }
        }
      }
    };
  </script>
  <style>
    /* Stile base per leggibilità su smartphone e desktop */
    body {
      background-color: #0c0e14;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-bgdark text-gray-100 antialiased">
  <div id="access-app" class="max-w-2xl mx-auto px-4 py-8 sm:py-12 space-y-6"></div>

  <script>
    // Chiave dedicata alla pagina di accesso e alla stanza attiva
    const ACCESS_STORAGE_KEY = 'ombre_accesso_tavolo_v1';

    // Crea lo stato iniziale della schermata di accesso
    function createInitialAccessState() {
      return {
        gameName: 'Ombre al Tavolo',
        roomCode: 'TAVOLO1',
        playerName: '',
        selectedRoleType: 'player', // 'player' | 'master'
        statusBanner: null
      };
    }

    // Carica lo stato salvato in sicurezza tramite try/catch
    function loadAccessState() {
      try {
        const raw = localStorage.getItem(ACCESS_STORAGE_KEY);
        if (!raw) return createInitialAccessState();
        const parsed = JSON.parse(raw);
        const base = createInitialAccessState();
        return {
          gameName: base.gameName,
          roomCode: normalizeRoomCode(parsed.roomCode || base.roomCode),
          playerName: String(parsed.playerName || '').slice(0, 24),
          selectedRoleType: parsed.selectedRoleType === 'master' ? 'master' : 'player',
          statusBanner: parsed.statusBanner || null
        };
      } catch (err) {
        console.error('Errore lettura stato accesso:', err);
        return createInitialAccessState();
      }
    }

    let accessState = loadAccessState();

    // Normalizza il codice stanza in maiuscolo senza spazi superflui
    function normalizeRoomCode(rawCode) {
      const cleaned = String(rawCode || '')
        .trim()
        .toUpperCase()
        .replace(/[^A-Z0-9_-]/g, '');
      return (cleaned || 'TAVOLO1').slice(0, 16);
    }

    // Genera un ID Sync leggibile e coerente a partire dal codice stanza
    function getSyncId(roomCode) {
      return 'SYNC-' + normalizeRoomCode(roomCode);
    }

    // Salva lo stato della pagina di accesso
    function saveAccessState() {
      try {
        localStorage.setItem(ACCESS_STORAGE_KEY, JSON.stringify(accessState));
      } catch (err) {
        console.error('Errore salvataggio stato accesso:', err);
      }
    }

    // Imposta un messaggio di avviso o conferma
    function setBanner(text, type = 'info') {
      accessState.statusBanner = { text, type };
      saveAccessState();
      renderAccessPage();
    }

    // Aggiorna il codice stanza e il relativo ID Sync
    function handleRoomCodeChange(value) {
      accessState.roomCode = normalizeRoomCode(value);
      accessState.statusBanner = null;
      saveAccessState();
      renderAccessPage();
    }

    // Aggiorna il nome inserito dall'utente
    function handlePlayerNameChange(value) {
      accessState.playerName = String(value || '').slice(0, 24);
      accessState.statusBanner = null;
      saveAccessState();
    }

    // Seleziona se si entra come Giocatore o Master
    function chooseRoleType(roleType) {
      accessState.selectedRoleType = roleType === 'master' ? 'master' : 'player';
      accessState.statusBanner = null;
      saveAccessState();
      renderAccessPage();
    }

    // Copia l'ID Sync negli appunti usando execCommand per compatibilità iframe
    function copySyncId() {
      const syncId = getSyncId(accessState.roomCode);
      try {
        const tempInput = document.createElement('input');
        tempInput.value = syncId;
        document.body.appendChild(tempInput);
        tempInput.select();
        tempInput.setSelectionRange(0, tempInput.value.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(tempInput);

        if (ok) {
          setBanner(`ID Sync "${syncId}" copiato negli appunti.`, 'success');
        } else {
          setBanner(`ID Sync attivo: ${syncId}`, 'info');
        }
      } catch (err) {
        console.error('Errore copia ID Sync:', err);
        setBanner(`ID Sync attivo: ${syncId}`, 'info');
      }
    }

    // Conferma l'accesso e prepara il passaggio alla pagina di Giocatore o Master
    function proceedToSession() {
      const cleanName = String(accessState.playerName || '').trim();
      const roomCode = normalizeRoomCode(accessState.roomCode);
      const syncId = getSyncId(roomCode);
      accessState.roomCode = roomCode;
      accessState.playerName = cleanName;

      if (accessState.selectedRoleType === 'player' && !cleanName) {
        setBanner('Inserisci il tuo nome per entrare come Giocatore.', 'error');
        return;
      }

      const displayLabel = cleanName || (accessState.selectedRoleType === 'master' ? 'Master' : 'Giocatore');
      saveAccessState();

      if (accessState.selectedRoleType === 'player') {
        setBanner(
          `Pronto per la pagina Giocatore: "${displayLabel}" nella stanza ${roomCode} (${syncId}). Puoi aprire giocatore.html.`,
          'success'
        );
      } else {
        setBanner(
          `Pronto per la pagina Master: "${displayLabel}" nella stanza ${roomCode} (${syncId}).`,
          'success'
        );
      }
    }

    // Escape di sicurezza per il testo renderizzato in HTML
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Renderizza la pagina di accesso
    function renderAccessPage() {
      const container = document.getElementById('access-app');
      if (!container) return;

      try {
        const syncId = getSyncId(accessState.roomCode);
        const banner = accessState.statusBanner;

        const bannerHtml = banner
          ? `<div class="rounded-xl border px-4 py-3 text-sm font-medium ${
              banner.type === 'success'
                ? 'bg-emerald/15 border-emerald/40 text-emerald'
                : banner.type === 'error'
                ? 'bg-crimson/15 border-crimson/40 text-crimson'
                : 'bg-indigo/15 border-indigo/40 text-indigo'
            }">${escapeHtml(banner.text)}</div>`
          : '';

        container.innerHTML = `
          <header class="rounded-2xl bg-surface border border-white/10 p-6 sm:p-8 text-center space-y-2">
            <span class="text-xs font-bold uppercase tracking-widest text-gold">Pagina 1 · Accesso al Tavolo</span>
            <h1 class="font-serif text-3xl sm:text-4xl font-bold text-white">${escapeHtml(accessState.gameName)}</h1>
            <p class="text-sm text-gray-400 max-w-md mx-auto">
              Inserisci il codice stanza per allineare i telefoni, scrivi il tuo nome e scegli se entrare come Giocatore o Master.
            </p>
          </header>

          ${bannerHtml}

          <section class="rounded-2xl bg-surface border border-white/10 p-5 sm:p-6 space-y-5">
            <div class="space-y-2">
              <label for="room-code-field" class="block text-xs font-bold uppercase tracking-wider text-gray-300">
                1. Codice Stanza
              </label>
              <input
                id="room-code-field"
                type="text"
                maxlength="16"
                value="${escapeHtml(accessState.roomCode)}"
                onchange="handleRoomCodeChange(this.value)"
                placeholder="Es. TAVOLO1"
                class="w-full rounded-xl bg-bgdark border border-white/15 px-4 py-3 text-sm font-mono uppercase text-white focus:outline-none focus:border-gold"
              />

              <div class="rounded-xl bg-bgdark border border-emerald/30 px-4 py-3 flex flex-wrap items-center justify-between gap-3">
                <div class="text-xs text-gray-300">
                  <span class="text-gray-400">ID Sync stanza:</span>
                  <strong class="ml-1.5 font-mono text-emerald text-sm">${escapeHtml(syncId)}</strong>
                </div>
                <button
                  type="button"
                  onclick="copySyncId()"
                  class="px-3 py-1.5 rounded-lg bg-surface2 hover:bg-white/10 border border-white/15 text-xs font-semibold text-gray-200 transition cursor-pointer"
                >
                  Copia ID Sync
                </button>
              </div>
            </div>

            <div class="space-y-2 pt-2 border-t border-white/10">
              <label for="player-name-field" class="block text-xs font-bold uppercase tracking-wider text-gray-300">
                2. Il Tuo Nome
              </label>
              <input
                id="player-name-field"
                type="text"
                maxlength="24"
                value="${escapeHtml(accessState.playerName)}"
                oninput="handlePlayerNameChange(this.value)"
                placeholder="Scrivi il tuo nome..."
                class="w-full rounded-xl bg-bgdark border border-white/15 px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo"
              />
            </div>

            <div class="space-y-2.5 pt-2 border-t border-white/10">
              <span class="block text-xs font-bold uppercase tracking-wider text-gray-300">
                3. Scegli il Ruolo di Accesso
              </span>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button
                  type="button"
                  onclick="chooseRoleType('player')"
                  class="p-4 rounded-xl border text-left transition cursor-pointer ${
                    accessState.selectedRoleType === 'player'
                      ? 'bg-indigo/15 border-indigo text-white'
                      : 'bg-bgdark border-white/10 text-gray-300 hover:border-white/25'
                  }"
                >
                  <div class="text-sm font-bold">Giocatore</div>
                  <div class="text-xs text-gray-400 mt-1">
                    Apre la scheda personale del giocatore e la sezione selfie.
                  </div>
                </button>

                <button
                  type="button"
                  onclick="chooseRoleType('master')"
                  class="p-4 rounded-xl border text-left transition cursor-pointer ${
                    accessState.selectedRoleType === 'master'
                      ? 'bg-gold/15 border-gold text-white'
                      : 'bg-bgdark border-white/10 text-gray-300 hover:border-white/25'
                  }"
                >
                  <div class="text-sm font-bold">Master</div>
                  <div class="text-xs text-gray-400 mt-1">
                    Apre la gestione del tavolo, dei ruoli e della partita.
                  </div>
                </button>
              </div>
            </div>

            <div class="pt-3">
              <button
                type="button"
                onclick="proceedToSession()"
                class="w-full py-3.5 px-5 rounded-xl bg-gold text-bgdark text-sm font-bold hover:brightness-110 transition cursor-pointer"
              >
                ${
                  accessState.selectedRoleType === 'player'
                    ? 'Prosegui alla Pagina Giocatore'
                    : 'Prosegui alla Pagina Master'
                }
              </button>
            </div>
          </section>
        `;
      } catch (err) {
        console.error('Errore rendering pagina accesso:', err);
        container.innerHTML = `
          <div class="rounded-2xl bg-surface border border-crimson/40 p-6 text-sm text-crimson">
            Errore durante il caricamento della pagina di accesso. Ricarica la pagina.
          </div>
        `;
      }
    }

    // Esposizione esplicita delle funzioni usate nei controlli HTML
    window.handleRoomCodeChange = handleRoomCodeChange;
    window.handlePlayerNameChange = handlePlayerNameChange;
    window.chooseRoleType = chooseRoleType;
    window.copySyncId = copySyncId;
    window.proceedToSession = proceedToSession;

    renderAccessPage();
  </script>
</body>
</html>
